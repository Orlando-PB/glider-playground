name: Build desktop apps

# Builds the windowed desktop app for macOS, Windows and Linux on every push to
# main. Each platform publishes to its OWN rolling release (tags latest-macos /
# latest-windows / latest-linux), so the Releases page lists one clean,
# single-asset release per platform. Each run deletes and recreates its
# platform's release at the current commit, so the publish date and the
# auto-attached "Source code" archives always reflect the latest code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
            asset: GliderPlayground-macOS-arm64.zip
            tag: latest-macos
            release_name: Latest macOS release (Apple Silicon)
          - os: windows-latest
            label: Windows-x64
            asset: GliderPlayground-Windows-x64-Setup.exe
            tag: latest-windows
            release_name: Latest Windows release (x64)
          - os: ubuntu-latest
            label: Linux-x64
            asset: GliderPlayground-Linux-x64.tar.gz
            tag: latest-linux
            release_name: Latest Linux release (x64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux: pywebview uses GTK + WebKit2GTK. These libs must also be present
      # on the end user's machine at runtime (most desktop distros ship them).
      - name: Install Linux webview system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libgirepository-1.0-1 gir1.2-gtk-3.0 \
            libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev libglib2.0-dev \
            gobject-introspection pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" pyinstaller pillow
          # Linux GTK backend for pywebview. Pin to the last PyGObject that
          # builds against girepository-1.0 (the runner's GLib); 3.52+ requires
          # girepository-2.0 which Ubuntu 24.04 doesn't ship.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install pycairo "pygobject<3.52"
          fi
        shell: bash

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python packaging/make_win_icon.py

      - name: Read version
        id: version
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('glider-playground'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with PyInstaller
        env:
          GP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller packaging/glider_playground.spec --noconfirm
        shell: bash

      # --- Package the build into a single distributable archive ---------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # Ship the .app bundle. ditto preserves macOS metadata/permissions.
          ditto -c -k --sequesterRsrc --keepParent "GliderPlayground.app" "../${{ matrix.asset }}"
        shell: bash

      # Wrap the PyInstaller bundle in an Inno Setup installer instead of a raw
      # zip. Files written by the installer don't inherit the "Mark of the Web"
      # that a downloaded zip stamps onto every extracted file, so the user only
      # clears SmartScreen once (on the installer) and the app then runs cleanly.
      # Inno Setup (iscc) is preinstalled on the windows-latest runner image.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          if (-not $ver) { $ver = "0.0.0" }
          iscc "/DAppVersion=$ver" packaging\installer.iss
          Move-Item packaging\installer\${{ matrix.asset }} ${{ matrix.asset }}
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist GliderPlayground
        shell: bash

      # Publish straight to this platform's own rolling release. Delete the
      # existing release + tag first, then recreate at the current commit, so the
      # release only ever holds the latest single asset and its date/source
      # archives are current. fail-fast:false means one platform failing here
      # doesn't stop the others publishing.
      - name: Publish ${{ matrix.label }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ matrix.tag }}" --cleanup-tag --yes || true
          gh release create "${{ matrix.tag }}" "${{ matrix.asset }}" \
            --target "$GITHUB_SHA" \
            --title "${{ matrix.release_name }}" \
            --latest=false \
            --notes "Automatically built from the latest commit on \`main\` (version ${{ steps.version.outputs.version }}).

          Download: \`${{ matrix.asset }}\`

          > This build is unsigned — see the repo README for how to open it past Gatekeeper/SmartScreen."
        shell: bash
