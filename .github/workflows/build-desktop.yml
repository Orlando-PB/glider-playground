name: Build desktop apps

# Builds the windowed desktop app for macOS, Windows and Linux on every push to
# main and publishes them as assets on a single rolling "latest" release. Asset
# filenames are stable per-platform, so each run overwrites the previous build
# (no old builds are kept).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS-arm64
            asset: GliderPlayground-macOS-arm64.zip
          - os: windows-latest
            label: Windows-x64
            asset: GliderPlayground-Windows-x64.zip
          - os: ubuntu-latest
            label: Linux-x64
            asset: GliderPlayground-Linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux: pywebview uses GTK + WebKit2GTK. These libs must also be present
      # on the end user's machine at runtime (most desktop distros ship them).
      - name: Install Linux webview system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libgirepository-1.0-1 gir1.2-gtk-3.0 \
            libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" pyinstaller pillow
          # Platform-specific webview backend
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install pygobject
          fi
        shell: bash

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python packaging/make_win_icon.py

      - name: Read version
        id: version
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version(\"glider-playground\"))')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with PyInstaller
        env:
          GP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller packaging/glider_playground.spec --noconfirm
        shell: bash

      # --- Package the build into a single distributable archive ---------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # Ship the .app bundle. ditto preserves macOS metadata/permissions.
          ditto -c -k --sequesterRsrc --keepParent "GliderPlayground.app" "../${{ matrix.asset }}"
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GliderPlayground/* -DestinationPath ${{ matrix.asset }}
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist GliderPlayground
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest desktop build
          body: |
            Automatically built from the latest commit on `main`.

            - **macOS** (Apple Silicon): `GliderPlayground-macOS-arm64.zip`
            - **Windows** (x64): `GliderPlayground-Windows-x64.zip`
            - **Linux** (x64): `GliderPlayground-Linux-x64.tar.gz`

            > macOS/Windows builds are unsigned — see the repo README for how to open them past Gatekeeper/SmartScreen.
          prerelease: false
          make_latest: true
          files: artifacts/**/*
          fail_on_unmatched_files: true
