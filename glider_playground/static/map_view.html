                    ).multiplyScalar(r));
                }
            }
            return pts.map(v => ({ x: v.x, y: v.y, z: v.z, t: 1 }));
        }

        function updateRulerLine(a, b) {
            if (!myGlobe) return;
            const geom = buildRibbonGeometry([_greatCirclePoints(a, b)]);
            if (_rulerLine) {
                _rulerLine.geometry.dispose();
                _rulerLine.geometry = geom;
            } else {
                _rulerLine = new THREE.Mesh(geom, ribbonMaterial());
                const u = _rulerLine.material.uniforms;
                setRGBA(u.uColorA.value, ...RULER_COLOR, 0.9);
                setRGBA(u.uColorB.value, ...RULER_COLOR, 0.9);
                u.uWidthA.value = u.uWidthB.value = RULER_WIDTH_PX;
                _rulerLine.renderOrder = LAYER_ORDER.ruler;   // above every other surface layer
                _rulerLine.frustumCulled = false;
                myGlobe.scene().add(_rulerLine);
            }
        }

        function clearRulerLine() {
            if (_rulerLine && myGlobe) {
                myGlobe.scene().remove(_rulerLine);
                _rulerLine.geometry.dispose();
                _rulerLine.material.dispose();
            }
            _rulerLine = null;
        }

        // Format one endpoint as "12.3456°N, 1.2345°W" for the bubble's second line.
        function _fmtLatLng(lat, lng, precision = 4) {
            const la = lat, lo = _wrapLon(lng);
            return `${Math.abs(la).toFixed(precision)}°${la >= 0 ? 'N' : 'S'}, ${Math.abs(lo).toFixed(precision)}°${lo >= 0 ? 'E' : 'W'}`;
        }

        // Render text at decreasing precision until it fits; the copy button always uses the raw values.
        const _COORD_PRECISIONS = [6, 4, 3, 2, 1, 0];
        function _fitCoordText(el, buildFn) {
            let text = '';
            for (const p of _COORD_PRECISIONS) {
                text = buildFn(p);
                el.textContent = text;
                if (el.scrollWidth <= el.clientWidth + 1) return;
            }
        }

        // Re-render the bubble at its best-fit precision (called after a resize).
        function _refitCoordBubble() {
            const bubble = document.getElementById('coord-bubble');
            if (!bubble || !bubble.classList.contains('visible')) return;
            if (bubble.classList.contains('ruler-mode')) {
                if (_rulerStart && _rulerEnd) {
                    const km = _haversineKm(_rulerStart.lat, _rulerStart.lng, _rulerEnd.lat, _rulerEnd.lng);
                    showRulerBubble(_rulerStart, _rulerEnd, km);
                }
            } else if (_lastCoord) {
                showCoordBubble(_lastCoord);
            }
        }

        // Ruler readout in the same bubble: distance headline, endpoints below.
        function showRulerBubble(a, b, km) {
            document.getElementById('coord-bubble').classList.add('visible', 'ruler-mode');
            document.getElementById('coord-text').textContent = `${km.toFixed(km < 10 ? 3 : 2)} km`;
            const el = document.getElementById('coord-time');
            el.style.display = '';
            _fitCoordText(el, p => `${_fmtLatLng(a.lat, a.lng, p)}  →  ${_fmtLatLng(b.lat, b.lng, p)}`);
        }

        // Ruler released: drop the end point, keep line + bubble, restore orbiting.
        function finishRuler(clientX, clientY) {
            clearTimeout(_rulerHoldTimer);
            _rulerArmed = false;
            try { myGlobe.controls().enabled = true; } catch (_) {}
            const anchor = _rulerAnchor;
            _rulerAnchor = null;
            if (!anchor) return;
            const end = _snapPickCoords(clientX, clientY) || anchor;
            const km = _haversineKm(anchor.lat, anchor.lng, end.lat, end.lng);
            // A hold with no real drag is treated as a plain click.
            if (km < 0.01) {
                _rulerStart = null; _rulerEnd = null;
                clearRulerLine();
                showPin(anchor.lat, anchor.lng);
                setCoordAim(true);
                try { window.parent.postMessage({ type: 'coordPicked', lat: anchor.lat, lng: _wrapLon(anchor.lng), onPath: false }, '*'); } catch (_) {}
                return;
            }
            _rulerStart = anchor;
            _rulerEnd = end;
            applyDots();
            updateRulerLine(anchor, end);
            showRulerBubble(anchor, end, km);
        }

        // After a pick, use a crosshair cursor; any drag or closing the bubble reverts to the grab hand.
        function setCoordAim(on) {
            _coordAimOn = on;
            applyHoverCursor();   // a track under the cursor (pointer) still wins
        }

        function attachCoordPicker() {
            const el = document.getElementById('globe-container');
            if (!el || el._coordPickerWired) return;
            el._coordPickerWired = true;
            // Drop the ruler's start point and take over the drag from the orbit controls.
            function armRuler(x, y) {
                const geo = _snapPickCoords(x, y);
                if (!geo) return;
                // Clear any previous pin/measurement.
                clearPin();
                _rulerArmed = true;
                _rulerAnchor = geo;
                try { myGlobe.controls().enabled = false; } catch (_) {}
                clearHover();
                _rulerStart = geo;
                applyDots();
                updateRulerLine(geo, geo);
                showRulerBubble(geo, geo, 0);
            }
            el.addEventListener('pointerdown', (e) => {
                _coordDown = { x: e.clientX, y: e.clientY };
                clearTimeout(_rulerHoldTimer);
                if (e.shiftKey) {
                    armRuler(e.clientX, e.clientY);   // shift-drag: no hold needed
                    return;
                }
                _rulerHoldTimer = setTimeout(() => {
                    if (!_coordDown) return;   // already released before the hold fired
                    armRuler(_coordDown.x, _coordDown.y);
                }, _RULER_HOLD_MS);
            });
            el.addEventListener('pointermove', (e) => {
                if (_rulerArmed) {
                    const geo = _snapPickCoords(e.clientX, e.clientY);
                    if (geo && _rulerAnchor) {
                        updateRulerLine(_rulerAnchor, geo);
                        showRulerBubble(_rulerAnchor, geo, _haversineKm(_rulerAnchor.lat, _rulerAnchor.lng, geo.lat, geo.lng));
                    }
                    return;
                }
                // A press that becomes a drag is a rotate: cancel the ruler-hold and aim mode.
                if (_coordDown && Math.hypot(e.clientX - _coordDown.x, e.clientY - _coordDown.y) > _COORD_MOVE_TOL) {
                    clearTimeout(_rulerHoldTimer);
                    setCoordAim(false);
                    clearHover();
                    return;
                }
                // Otherwise highlight the nearest grey track within the hit radius.
                scheduleHover(e.clientX, e.clientY);
            });
            el.addEventListener('pointerleave', (e) => {
                clearHover();
                if (_rulerArmed) finishRuler(e.clientX, e.clientY);
            });
            el.addEventListener('pointerup', (e) => {
                clearTimeout(_rulerHoldTimer);
                if (_rulerArmed) {
                    finishRuler(e.clientX, e.clientY);
                    _coordDown = null;
                    return;
                }
                const start = _coordDown;
                _coordDown = null;
                if (!start) return;
                if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > _COORD_MOVE_TOL) return; // a drag/rotate
                // Argo float dots (when that layer is on) take priority: fixed targets.
                if (window.ShipsLayer && ShipsLayer.handleClick(e.clientX, e.clientY)) return;
                if (window.ArgoLayer && ArgoLayer.handleClick(e.clientX, e.clientY)) return;
                // A click near a waypoint snaps to its exact coordinates (highest priority).
                const wpHit = nearestWaypointAtScreen(e.clientX, e.clientY, 20);
                if (wpHit) {
                    showPin(wpHit.lat, wpHit.lng);
                    setCoordAim(true);
                    try { window.parent.postMessage({ type: 'coordPicked', lat: wpHit.lat, lng: _wrapLon(wpHit.lng), onPath: false }, '*'); } catch (_) {}
                    return;
                }
                // Same priority for a pinned marker.
                const pinnedHit = nearestPinnedAtScreen(e.clientX, e.clientY, 20);
                if (pinnedHit) {
                    showPin(pinnedHit.lat, pinnedHit.lng);
                    setCoordAim(true);
                    try { window.parent.postMessage({ type: 'coordPicked', lat: pinnedHit.lat, lng: _wrapLon(pinnedHit.lng), onPath: false }, '*'); } catch (_) {}
                    return;
                }
                // A click on/near a grey context track selects it; otherwise read coordinates.
                const pick = (hoverId && hoverId !== activeId)
                    ? hoverId
                    : nearestTrackAtScreen(e.clientX, e.clientY, 14);
                if (pick) { selectTrack(pick); return; }
                // A click near the ACTIVE path snaps to it (parent resolves its time and marks the plots);
                // an open-ocean click is position-only (onPath false).
                const snap = nearestActivePointAtScreen(e.clientX, e.clientY, 14);
                const geo = snap || pickGlobeCoords(e.clientX, e.clientY);
                if (geo) {
                    showPin(geo.lat, geo.lng);
                    setCoordAim(true);
                    // Mirror the pin onto every other open globe via the parent.
                    try { window.parent.postMessage({ type: 'coordPicked', lat: geo.lat, lng: _wrapLon(geo.lng), onPath: !!snap }, '*'); } catch (_) {}
                }
            });
        }

        // Screen pixel → {lat, lng} by raycasting onto the globe sphere; null on a miss.
        function pickGlobeCoords(clientX, clientY) {
            if (!myGlobe) return null;
            try {
                const el = document.getElementById('globe-container');
                const rect = el.getBoundingClientRect();
                const ndc = new THREE.Vector2(
                    ((clientX - rect.left) / rect.width) * 2 - 1,
                    -(((clientY - rect.top) / rect.height) * 2 - 1)
                );
                const ray = new THREE.Raycaster();
                ray.setFromCamera(ndc, myGlobe.camera());
                const sphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), myGlobe.getGlobeRadius());
                const hit = new THREE.Vector3();
                if (!ray.ray.intersectSphere(sphere, hit)) return null;
                const geo = myGlobe.toGeoCoords({ x: hit.x, y: hit.y, z: hit.z });
                return { lat: geo.lat, lng: geo.lng };
            } catch (_) { return null; }
        }

        // Snap priority shared with plain clicks: waypoint, pinned marker, active path, raw globe coords.
        function _snapPickCoords(clientX, clientY) {
            return nearestWaypointAtScreen(clientX, clientY, 20)
                || nearestPinnedAtScreen(clientX, clientY, 20)
                || nearestActivePointAtScreen(clientX, clientY, 14)
                || pickGlobeCoords(clientX, clientY);
        }

        // Nearest grey track within `tolPx`, or null. Camera-facing hemisphere only; cartesian coords cached per track.
        const _tmpV = new THREE.Vector3();
        function ensureCart(t) {
            if (t.cart) return t.cart;
            const stride = Math.max(1, Math.ceil(t.formattedPath.length / 400));
            const cart = [];
            for (let i = 0; i < t.formattedPath.length; i += stride) {
                const p = t.formattedPath[i];
                const w = myGlobe.getCoords(p.lat, p.lng, 0);
                cart.push([w.x, w.y, w.z]);
            }
            t.cart = cart;
            return cart;
        }
        // Squared distance from point (px,py) to the segment a→b, in screen px.
        function _distToSeg2(px, py, ax, ay, bx, by) {
            const vx = bx - ax, vy = by - ay;
            const len2 = vx * vx + vy * vy;
            let s = len2 > 0 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
            s = s < 0 ? 0 : s > 1 ? 1 : s;
            const dx = px - (ax + s * vx), dy = py - (ay + s * vy);
            return dx * dx + dy * dy;
        }
        function nearestTrackAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            let best = null, bestD = tolPx * tolPx;
            for (const t of allTracks) {
                if (t.id === activeId) continue;
                // Distance is to each visible SEGMENT, not vertices; prevOk breaks the polyline behind the horizon.
                let prevX = 0, prevY = 0, prevOk = false;
                for (const c of ensureCart(t)) {
                    let sx = 0, sy = 0, ok = false;
                    // Front-facing (outward normal toward camera) and in front of it?
                    if (c[0] * (ex - c[0]) + c[1] * (ey - c[1]) + c[2] * (ez - c[2]) > 0) {
                        _tmpV.set(c[0], c[1], c[2]).project(cam);
                        if (_tmpV.z <= 1) {
                            sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                            sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                            ok = true;
                        }
                    }
                    if (ok) {
                        if (prevOk) {
                            const d = _distToSeg2(px, py, prevX, prevY, sx, sy);
                            if (d < bestD) { bestD = d; best = t.id; }
                        } else {
                            // Lone visible endpoint — fall back to vertex distance.
                            const dx = sx - px, dy = sy - py, d = dx * dx + dy * dy;
                            if (d < bestD) { bestD = d; best = t.id; }
                        }
                        prevX = sx; prevY = sy; prevOk = true;
                    } else {
                        prevOk = false;
                    }
                }
            }
            return best;
        }

        // Nearest waypoint within `tolPx` as exact {lat, lng}, or null.
        function nearestWaypointAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const wps = waypointsForActiveTrack();
            if (!wps.length) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            let best = null, bestD = tolPx * tolPx;
            for (const w of wps) {
                const p = myGlobe.getCoords(w.lat, w.lon, 0);
                if (p.x * (ex - p.x) + p.y * (ey - p.y) + p.z * (ez - p.z) <= 0) continue;
                _tmpV.set(p.x, p.y, p.z).project(cam);
                if (_tmpV.z > 1) continue;
                const sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                const sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                const dx = sx - px, dy = sy - py;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = { lat: w.lat, lng: w.lon }; }
            }
            return best;
        }

        // Nearest pinned marker (point pin or ruler endpoint) within `tolPx` as {lat, lng}, or null.
        function nearestPinnedAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe || !_pinnedItems.length) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            let best = null, bestD = tolPx * tolPx;
            const test = (lat, lng) => {
                const p = myGlobe.getCoords(lat, lng, 0);
                if (p.x * (ex - p.x) + p.y * (ey - p.y) + p.z * (ez - p.z) <= 0) return;
                _tmpV.set(p.x, p.y, p.z).project(cam);
                if (_tmpV.z > 1) return;
                const sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                const sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                const dx = sx - px, dy = sy - py;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = { lat, lng }; }
            };
            for (const item of _pinnedItems) {
                if (item.type === 'point') test(item.lat, item.lng);
                else { test(item.a.lat, item.a.lng); test(item.b.lat, item.b.lng); }
            }
            return best;
        }

        // Nearest marker within `tolPx` as tooltip content {title, subtitle, detail}, or null; reuses buildPositionDots().
        function nearestMarkerAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            let best = null, bestD = tolPx * tolPx;
            for (const d of buildPositionDots()) {
                if (d.pin || d.ruler || d.ship) continue;   // own click/ruler markers; ships via ShipsLayer.hoverInfo
                const p = myGlobe.getCoords(d.lat, d.lng, 0);
                if (p.x * (ex - p.x) + p.y * (ey - p.y) + p.z * (ez - p.z) <= 0) continue;
                _tmpV.set(p.x, p.y, p.z).project(cam);
                if (_tmpV.z > 1) continue;
                const sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                const sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                const dx = sx - px, dy = sy - py;
                const dist2 = dx * dx + dy * dy;
                if (dist2 >= bestD) continue;
                bestD = dist2;
                best = d.waypoint
                    ? { title: d.tag, subtitle: d.glider, detail: d.notes || null }
                    : { title: d.name || 'Unnamed glider', subtitle: d.live ? (relTimeAgo(d.lastTime) || 'Live') : null, detail: ({ slocum: 'Slocum glider', seaglider: 'Seaglider', alr: 'Autosub Long Range' })[d.kind] || null };
            }
            return best;
        }

        // "3 mins ago" / "2 hours ago" style readout for a live glider's last fix.
        function relTimeAgo(iso) {
            const t = iso ? Date.parse(iso) : NaN;
            if (isNaN(t)) return '';
            const diff = Math.max(0, Date.now() - t);
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return `${mins} min${mins === 1 ? '' : 's'} ago`;
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return `${hrs} hour${hrs === 1 ? '' : 's'} ago`;
            const days = Math.floor(hrs / 24);
            return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        // Nearest point ON THE ACTIVE track within `tolPx` as snapped {lat, lng}, or null.
        function nearestActivePointAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const at = activeTrack();
            if (!at || !at.formattedPath.length) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            const stride = Math.max(1, Math.ceil(at.formattedPath.length / 1500));
            let best = null, bestD = tolPx * tolPx;
            for (let i = 0; i < at.formattedPath.length; i += stride) {
                const p = at.formattedPath[i];
                const w = myGlobe.getCoords(p.lat, p.lng, 0);
                // Skip back-facing points so the far side can't be picked through the globe.
                if (w.x * (ex - w.x) + w.y * (ey - w.y) + w.z * (ez - w.z) <= 0) continue;
                _tmpV.set(w.x, w.y, w.z).project(cam);
                if (_tmpV.z > 1) continue;   // behind the camera
                const sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                const sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                const dx = sx - px, dy = sy - py;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = { lat: p.lat, lng: p.lng }; }
            }
            return best;
        }

        function showCoordBubble({ lat, lng }) {
            if (typeof lat !== 'number' || typeof lng !== 'number') return;
            const la = lat, lo = _wrapLon(lng);
            _lastCoord = { lat: la, lng: lo };
            const hemiLat = la >= 0 ? 'N' : 'S';
            const hemiLon = lo >= 0 ? 'E' : 'W';
            // Show BEFORE measuring for best-fit precision: a display:none element measures 0.
            document.getElementById('coord-bubble').classList.remove('ruler-mode');
            document.getElementById('coord-bubble').classList.add('visible');
            _fitCoordText(document.getElementById('coord-text'),
                p => `${Math.abs(la).toFixed(p)}° ${hemiLat}, ${Math.abs(lo).toFixed(p)}° ${hemiLon}`);
            setCoordTime(null);   // fresh pin starts time-less; filled in async if on-path
            const copyBtn = document.getElementById('coord-copy');
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
        }

        // Show (or clear, when ms is null) the TIME line under the coords.
        function setCoordTime(ms) {
            const el = document.getElementById('coord-time');
            if (!el) return;
            if (typeof ms !== 'number' || !isFinite(ms)) { el.textContent = ''; el.style.display = 'none'; return; }
            const d = new Date(ms);
            if (isNaN(d.getTime())) { el.textContent = ''; el.style.display = 'none'; return; }
            const p = n => String(n).padStart(2, '0');
            el.textContent = `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} `
                + `${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
            el.style.display = '';
        }

        // Drop (or move) the blue pin; overrides any leftover ruler measurement.
        function showPin(lat, lng) {
            if (typeof lat !== 'number' || typeof lng !== 'number') return;
            _pinDot = { lat, lng, pin: true };
            _rulerStart = null;
            _rulerEnd = null;
            clearRulerLine();
            applyDots();
            showCoordBubble({ lat, lng });
        }

        // Remove the pin, readout and any ruler from THIS globe only (the parent fans the clear out).
        function clearPin() {
            _pinDot = null;
            _rulerStart = null;
            _rulerEnd = null;
            clearRulerLine();
            applyDots();
            const bubble = document.getElementById('coord-bubble');
            if (bubble) bubble.classList.remove('visible', 'ruler-mode');
            setCoordTime(null);
            _lastCoord = null;
            setCoordAim(false);
        }

        // Move the live pick/ruler into the pinned stack; the ruler's line mesh is handed off intact.
        function pinCurrent() {
            if (_rulerStart && _rulerEnd) {
                const id = _pinIdSeq++;
                const km = _haversineKm(_rulerStart.lat, _rulerStart.lng, _rulerEnd.lat, _rulerEnd.lng);
                _pinnedItems.push({ id, type: 'ruler', a: _rulerStart, b: _rulerEnd, km });
                _pinnedRulerLines[id] = _rulerLine;
                _rulerLine = null;   // ownership transferred — clearPin() below must not dispose it
            } else if (_pinDot) {
                _pinnedItems.push({ id: _pinIdSeq++, type: 'point', lat: _pinDot.lat, lng: _pinDot.lng });
            } else {
                return;
            }
            clearPin();
            renderPinnedStack();
        }

        // Drop one pinned item (its dot(s), its ruler line if any, and its row).
        function unpinItem(id) {
            const idx = _pinnedItems.findIndex(p => p.id === id);
            if (idx === -1) return;
            _pinnedItems.splice(idx, 1);
            const line = _pinnedRulerLines[id];
            if (line && myGlobe) {
                myGlobe.scene().remove(line);
                line.geometry.dispose();
                line.material.dispose();
            }
            delete _pinnedRulerLines[id];
            applyDots();
            renderPinnedStack();
        }

        // Rebuild the compact stack of pinned rows under the live coord bubble.
        function renderPinnedStack() {
            const wrap = document.getElementById('coord-pinned-stack');
            if (!wrap) return;
            wrap.innerHTML = '';
            for (const item of _pinnedItems) {
                const row = document.createElement('div');
                row.className = 'coord-pinned-row';
                const icon = document.createElement('span');
                icon.className = 'material-symbols-outlined row-icon ' + (item.type === 'ruler' ? 'ruler' : 'point');
                icon.textContent = item.type === 'ruler' ? 'straighten' : 'location_on';
                const text = document.createElement('span');
                text.className = 'row-text';
                text.textContent = item.type === 'ruler'
                    ? `${item.km.toFixed(item.km < 10 ? 3 : 2)} km  ·  ${_fmtLatLng(item.a.lat, item.a.lng)} → ${_fmtLatLng(item.b.lat, item.b.lng)}`
                    : _fmtLatLng(item.lat, item.lng);
                const closeBtn = document.createElement('button');
                closeBtn.type = 'button';
                closeBtn.title = 'Remove';
                closeBtn.innerHTML = '<span class="material-symbols-outlined">close</span>';
                closeBtn.addEventListener('click', (e) => { e.stopPropagation(); unpinItem(item.id); });
                row.title = item.type === 'ruler' ? 'Fly to this measurement' : 'Fly to this point';
                row.addEventListener('click', () => flyToPinned(item));
                row.append(icon, text, closeBtn);
                wrap.appendChild(row);
            }
            wrap.classList.toggle('visible', _pinnedItems.length > 0);
        }

        // Fly to a pinned item: a point zooms to at most PIN_FLY_ALT; a ruler is framed on its midpoint.
        const PIN_FLY_ALT = 0.15;
        function flyToPinned(item) {
            if (!myGlobe) return;
            const cur = myGlobe.pointOfView().altitude;
            if (item.type === 'point') {
                myGlobe.pointOfView({ lat: item.lat, lng: item.lng, altitude: Math.min(cur, PIN_FLY_ALT) }, 700);
                return;
            }
            const pa = myGlobe.getCoords(item.a.lat, item.a.lng, 0);
            const pb = myGlobe.getCoords(item.b.lat, item.b.lng, 0);
            const mid = new THREE.Vector3(pa.x + pb.x, pa.y + pb.y, pa.z + pb.z);
            if (mid.lengthSq() < 1e-9) mid.set(pa.x, pa.y, pa.z);   // antipodal: fall back to one end
            const geo = myGlobe.toGeoCoords(mid.normalize().multiplyScalar(myGlobe.getGlobeRadius()));
            const spanDeg = item.km / 111.2;   // arc length as degrees of great circle
            const alt = Math.max(0.05, spanDeg * 1.6 / CONFIG.zoomScaleFactor);
            myGlobe.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: alt }, 700);
        }

        // Clipboard string: plain signed decimal "lat, lon".
        function _coordCopyText() {
            if (_rulerStart && _rulerEnd) {
                const km = _haversineKm(_rulerStart.lat, _rulerStart.lng, _rulerEnd.lat, _rulerEnd.lng);
                return `${_rulerStart.lat.toFixed(6)}, ${_rulerStart.lng.toFixed(6)} -> `
                    + `${_rulerEnd.lat.toFixed(6)}, ${_rulerEnd.lng.toFixed(6)} (${km.toFixed(2)} km)`;
            }
            if (!_lastCoord) return '';
            return `${_lastCoord.lat.toFixed(6)}, ${_lastCoord.lng.toFixed(6)}`;
        }

        // 'x' clears the pin locally and tells the parent to clear it everywhere.
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'x' || e.key === 'X') && !e.metaKey && !e.ctrlKey && !e.altKey
                && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) {
                clearPin();
                try { window.parent.postMessage({ type: 'clearAllPicks' }, '*'); } catch (_) {}
            }
        });

        (function wireCoordBubble() {
            const bubble = document.getElementById('coord-bubble');
            if (!bubble) return;
            document.getElementById('coord-close').addEventListener('click', () => {
                clearPin();
                // Tell the parent so the pin clears on every other globe and the plot popup.
                try { window.parent.postMessage({ type: 'coordCleared' }, '*'); } catch (_) {}
            });
            document.getElementById('coord-pin-toggle').addEventListener('click', () => {
                pinCurrent();
            });
            const copyBtn = document.getElementById('coord-copy');
            copyBtn.addEventListener('click', async () => {
                const text = _coordCopyText();
                if (!text) return;
                let ok = false;
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text); ok = true;
                    }
                } catch (_) {}
                if (!ok) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.focus(); ta.select();
                        ok = document.execCommand('copy'); ta.remove();
                    } catch (_) {}
                }
                copyBtn.classList.toggle('copied', ok);
                copyBtn.innerHTML = `<span class="material-symbols-outlined">${ok ? 'check' : 'error'}</span>`;
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
                }, 1500);
            });
        })();

        // Build the overlay rows in the sidebar (mutually exclusive).
        function buildOverlayButtons() {

        // Reveal the whole Layers sidebar once the map is ready.
        function revealOverlayButtons() {
            document.getElementById('layer-panel').classList.add('ready');
        }

        function updateOverlayButtons() {
            for (const ov of OVERLAYS) {
                const btn = document.getElementById('ovBtn-' + ov.key);
                if (!btn) continue;
                const loading = overlayLoading === ov.key;
                const active = activeOverlay === ov.key;

                btn.classList.toggle('loading', loading);

        // ── Data-source attribution: setAttrib(key, html|null); exposed on window for layer scripts ──
        const _attribLines = {};
        function setAttrib(key, html) {
            if (html) _attribLines[key] = html; else delete _attribLines[key];
            const el = document.getElementById('attrib');
            el.innerHTML = Object.values(_attribLines).map(h => `<span>${h}</span>`).join('');      // styled by info_note.css
        }
        window.setAttrib = setAttrib;
        // Copernicus Marine licence (§2.4): credit text must be followed by the DOI of every product used
        // (NRT → MY fallback means both products are cited for chla/ssh).
        const COPERNICUS_DOI = {
            'moi-00016': 'Global Ocean Physics Analysis and Forecast',
            'moi-00015': 'Global Ocean Biogeochemistry Analysis and Forecast',
            'moi-00279': 'Global Ocean Colour L4 NRT',
            'moi-00281': 'Global Ocean Colour L4 Multi-Year',
            'moi-00149': 'Global Ocean Sea Level L4 NRT',
            'moi-00148': 'Global Ocean Sea Level L4 Multi-Year',
        };
        const COPERNICUS_PRODUCTS = {
            chla: ['moi-00279', 'moi-00281'],
            temp: ['moi-00016'], salinity: ['moi-00016'], currents: ['moi-00016'],
            o2: ['moi-00015'], ph: ['moi-00015'], biomass: ['moi-00015'],
            ssh: ['moi-00149', 'moi-00148'],
        };
        function updateCopernicusAttrib() {
            const keys = [];
            if (activeOverlay && overlayCache[activeOverlay]) keys.push(activeOverlay);
            if (currentsActive && currentsData) keys.push('currents');
            if (!keys.length) { setAttrib('copernicus', null); return; }
            const dois = [...new Set(keys.flatMap(k => COPERNICUS_PRODUCTS[k] || []))];
            const links = dois.map(d =>
                `<a href="https://doi.org/10.48670/${d}" target="_blank" rel="noopener" title="${COPERNICUS_DOI[d] || ''}">10.48670/${d}</a>`
            ).join(', ');
            setAttrib('copernicus',
                'Generated using <a href="https://marine.copernicus.eu/" target="_blank" rel="noopener">E.U. Copernicus Marine Service Information</a>'
                + (links ? '; ' + links : ''));
        }

        // Draw whatever activeOverlay points at; returns the mesh-build time in ms.
        function applyOverlay() {
            let drawMs = 0;
            if (myGlobe && activeOverlay && overlayCache[activeOverlay]) {
                try {
                    if (typeof THREE === 'undefined') throw new Error('3D library (THREE) failed to load');
                    disposeOverlayMesh();
                    const ov = overlayByKey[activeOverlay];
                    const d = overlayCache[activeOverlay];
                    const _tDraw = performance.now();
                    overlayMesh = buildOverlayMesh(d, ov);
                    myGlobe.scene().add(overlayMesh);
                    drawMs = performance.now() - _tDraw;
                    setOverlayBar(ov, d.p10, d.p90, d.date);
                } catch (err) {
                    console.error('[overlay] render failed:', err);
                    activeOverlay = null;
                    disposeOverlayMesh();
                    showOverlayError('Could not draw the overlay', err.message);
                }
            } else if (myGlobe) {
                disposeOverlayMesh();
            }
            document.getElementById('chla-bar').classList.toggle('visible', !!activeOverlay && !!overlayCache[activeOverlay]);
            fitColourBar();
            updateOverlayButtons();
            updateCopernicusAttrib();
            return drawMs;
        }

        // One expandable log per overlay load. T = perf.now() marks + server _timing; drawMs from applyOverlay.
        function logOverlayTiming(key, T, drawMs) {
            const toMs = (s) => (typeof s === 'number' ? s * 1000 : 0);
            const sp = T.serverPhases || {};
            const total = T.drawn - T.start;
            const serverMs = T.serverTime || 0;                 // X-Process-Time header
            const network = Math.max(0, (T.fetched - T.start) - serverMs);
            const parse = Math.max(0, T.parsed - T.fetched);

            // Server-side phases nest under one "server" bar (= X-Process-Time).
            const children = [];
            if (sp.locate != null) children.push({ name: 'locate region', ms: toMs(sp.locate), color: '#c4a8f5' });
            if (sp.prep != null)   children.push({ name: 'prepare bbox · date', ms: toMs(sp.prep), color: '#c4a8f5' });
            if (!sp.cache_hit) {
                children.push({ name: 'download field', ms: toMs(sp.download), color: '#f7b955' });
                children.push({ name: 'extract · maths', ms: toMs(sp.extract), color: '#7ec8f7' });
            }

            // >1 server-side open attempt means a dataset/date fallback, folded into "download".
            const dl = children.find((c) => c.name === 'download field');
            if (dl && sp.attempts > 1) dl.name = `download field (${sp.attempts} attempts)`;

            const phases = [
                { name: sp.cache_hit ? 'server (cached)' : 'server', ms: serverMs, color: '#c4a8f5', children },
                { name: 'network transfer', ms: network, color: '#7ec8f7' },
                { name: 'parse JSON', ms: parse, color: '#7ec8f7' },
                { name: 'build mesh · draw', ms: drawMs, color: '#86efac' },
            ];
            const note = T.note || `${T.cells.toLocaleString()} cells · ${T.date}`;
            window.logPlotTiming('Overlay · ' + key, phases, total, note, null,
                { badge: 'OVERLAY', badgeBg: '#3b1f6e', badgeColor: '#c4a8f5' });
        }

        // Decode the packed payload (copernicus_fetch.pack_overlay_response):
        // uint32 LE header length, JSON header, then lat/lon/val as raw LE float32.
        function decodeOverlayBinary(buf) {
            const dv = new DataView(buf);
            const headerLen = dv.getUint32(0, true);
            const meta = JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(buf, 4, headerLen)));
            const layout = meta.arrays || {};
            delete meta.arrays;
            let off = 4 + headerLen;
            for (const name of Object.keys(layout)) {
                const { dtype, len } = layout[name];
                // slice() copies into a fresh aligned buffer, so the typed view is always valid.
                if (dtype === 'f32') { meta[name] = new Float32Array(buf.slice(off, off + len * 4)); off += len * 4; }
                else if (dtype === 'f64') { meta[name] = new Float64Array(buf.slice(off, off + len * 8)); off += len * 8; }
            }
            return meta;
        }

        async function loadOverlay(key) {
            const fileId = activeId;   // overlays always target the active glider
            if (!fileId) return;

            // Request ticket: several loadOverlay calls can be in flight; only the newest may touch state.
            const seq = ++overlayReqSeq;
            overlayLoading = key;
            updateOverlayButtons();
            // Marks for the unified OVERLAY timing log (see logOverlayTiming).
            const T = { start: performance.now(), cells: 0 };
            try {
                // Skip the generic API one-liner; the full breakdown is logged below.
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const res = await fetch(`/api/overlay?id=${encodeURIComponent(fileId)}&var=${key}${latestParam()}`);
                T.fetched = performance.now();
                const hdr = res.headers && res.headers.get('X-Process-Time');
                T.serverTime = hdr ? parseFloat(hdr) * 1000 : 0;   // server wall time (ms)
                // Success is a binary octet-stream; an error falls back to JSON.
                const ct = (res.headers.get('Content-Type') || '');
                const data = ct.indexOf('application/json') !== -1
                    ? await res.json()
                    : decodeOverlayBinary(await res.arrayBuffer());
                T.parsed = performance.now();
                // Superseded by a newer request: drop this response.
                if (seq !== overlayReqSeq) return;
                if (!res.ok || data.error) {
                    showOverlayError(data.error || `Request failed (${res.status})`, data.hint, data.setup);
                    return;
                }
                if (!data.val || !data.n) {
                    showOverlayError('No ' + overlayByKey[key].label + ' data for this region/date');
                    return;
                }
                overlayCache[key] = data;
                activeOverlay = key;   // newly fetched field becomes the active one
                T.serverPhases = data._timing || null;
                T.cells = data.n;
                T.date = data.date;
            } catch (err) {
                if (seq === overlayReqSeq) showOverlayError(err.message || 'Failed to load overlay');
            } finally {
                if (seq === overlayReqSeq) {
                    overlayLoading = null;
                    // The server may have fetched this on demand: re-sync button state now.
                    if (layerPending(key)) pollOverlayStatus();
                    const drawMs = applyOverlay();
                    if (T.cells) {
                        T.drawn = performance.now();
                        logOverlayTiming(key, T, drawMs);
                    }
                }
            }
        }

        // Click handler: toggle off if already active, else switch to this field.
        function selectOverlay(key) {
            if (overlayLoading) return;        // ignore clicks mid-fetch
            if (layerPending(key)) return;     // not on the server yet — greyed
            if (activeOverlay === key) {
                activeOverlay = null;
                applyOverlay();
            } else if (overlayCache[key]) {
                deactivateCurrents();          // scalar + currents share the legend
                activeOverlay = key;           // already fetched — switch instantly
                applyOverlay();
            } else {
                deactivateCurrents();
                loadOverlay(key);
            }
        }

        // Explicit setter: show `key` (no toggling), or 'none'/unknown to hide.
        function setOverlayByKey(key) {
            if (overlayLoading) return;
            if (!key || key === 'none' || !overlayByKey[key]) {
                if (activeOverlay !== null) { activeOverlay = null; applyOverlay(); }
                return;
            }
            if (activeOverlay === key) return;
            deactivateCurrents();
            if (overlayCache[key]) { activeOverlay = key; applyOverlay(); }
            else loadOverlay(key);
        }

        // ── Copernicus surface currents: speed mesh + animated particle flow ──
        // Streaklets are advected through the bilinearly-interpolated (uo, vo) grid each frame.
        const CURRENTS_DEF = { key: 'currents', label: 'Currents', units: 'm/s', log: false, stops: [
            [0,[255,253,205]],[0.12,[235,219,143]],[0.25,[214,195,91]],[0.38,[187,179,50]],
            [0.50,[150,165,16]],[0.62,[104,149,9]],[0.74,[57,131,28]],[0.85,[24,115,40]],
            [0.93,[18,84,44]],[1,[23,35,19]] ] };
        const CUR_MESH_OPACITY = 0.65;     // speed backdrop under the flow (only a little ocean shows through)
        const CUR_PARTICLES = 4000;        // particles advected each frame
        const CUR_TRAIL = 44;              // points kept per particle's fading trail (longer = longer streaks)
        const CUR_LINE_COLOR = [0, 0, 0];  // streak colour, 0–1 per channel ([1,1,1] = white). Black so the lines stand out against the speed backdrop instead of blending into it.
        const CUR_LIFE_MIN = 90, CUR_LIFE_MAX = 220;   // particle lifespan (frames)
        const CUR_BASE_OPACITY = 1.0;
        const CUR_DEG_PER_SEC = 0.32;      // arc/sec a p90-strength current sweeps
        const CUR_ALPHA_FLOOR = 0.45;      // tail opacity floor → head stays bold, tail fades off slightly
        const CUR_SPAWN_BIAS = 0.7;        // chance a new particle picks the fastest candidate

        let currentsData = null;     // fetched {lat0,lon0,dlat,dlon,nlat,nlon,u,v,...}
        let currentsActive = false;
        let currentsLoading = false;
        let currentsReqSeq = 0;      // ticket counter — only the latest loadCurrents() call may apply
        let currentsMesh = null;     // THREE mesh of the speed backdrop
        let flowLines = null;        // THREE.LineSegments of the fading trails
        let flowState = null;        // per-particle sim arrays
        let flowRAF = 0, flowLastT = 0;

        // Bilinear flow sample at (lat, lng) → [u, v] m/s, or null off-grid; land corners are filled from valid ones.
        function sampleFlow(d, lat, lng) {
            const fx = (lng - d.lon0) / d.dlon;
            const fy = (lat - d.lat0) / d.dlat;
            if (fx < 0 || fy < 0 || fx > d.nlon - 1 || fy > d.nlat - 1) return null;
            const x0 = Math.floor(fx), y0 = Math.floor(fy);
            const x1 = Math.min(x0 + 1, d.nlon - 1), y1 = Math.min(y0 + 1, d.nlat - 1);
            const tx = fx - x0, ty = fy - y0;
            let u00 = d.u[y0][x0], u10 = d.u[y0][x1], u01 = d.u[y1][x0], u11 = d.u[y1][x1];
            let v00 = d.v[y0][x0], v10 = d.v[y0][x1], v01 = d.v[y1][x0], v11 = d.v[y1][x1];
            if (u00 == null || u10 == null || u01 == null || u11 == null) {
                let su = 0, sv = 0, n = 0;
                if (u00 != null) { su += u00; sv += v00; n++; }
                if (u10 != null) { su += u10; sv += v10; n++; }
                if (u01 != null) { su += u01; sv += v01; n++; }
                if (u11 != null) { su += u11; sv += v11; n++; }
                if (n === 0) return null;
                const au = su / n, av = sv / n;
                if (u00 == null) { u00 = au; v00 = av; }
                if (u10 == null) { u10 = au; v10 = av; }
                if (u01 == null) { u01 = au; v01 = av; }
                if (u11 == null) { u11 = au; v11 = av; }
            }
            const u = (u00 * (1 - tx) + u10 * tx) * (1 - ty) + (u01 * (1 - tx) + u11 * tx) * ty;
            const v = (v00 * (1 - tx) + v10 * tx) * (1 - ty) + (v01 * (1 - tx) + v11 * tx) * ty;
            return [u, v];
        }

        // Build the [lat, lng, speed] point grid the speed mesh is drawn from.
        function currentsSpeedData(d) {
            const points = [];
            for (let y = 0; y < d.nlat; y++) {
                for (let x = 0; x < d.nlon; x++) {
                    const u = d.u[y][x], v = d.v[y][x];
                    if (u == null || v == null) continue;
                    points.push([d.lat0 + y * d.dlat, d.lon0 + x * d.dlon, Math.hypot(u, v)]);
                }
            }
            return { points, half_deg: d.half_deg, p10: 0,
                     p90: Math.max(d.speed_p90, 0.05), date: d.date, units: d.units };
        }

        // Random spawn on flowing water, biased toward faster currents.
        function spawnFlow(d) {
            let best = null, bestSpeed = -1, anyValid = null;
            for (let i = 0; i < 6; i++) {
                const lat = d.lat0 + Math.random() * (d.nlat - 1) * d.dlat;
                const lng = d.lon0 + Math.random() * (d.nlon - 1) * d.dlon;
                const f = sampleFlow(d, lat, lng);
                if (!f) continue;
                anyValid = [lat, lng];
                const sp = Math.hypot(f[0], f[1]);
                if (sp > bestSpeed) { bestSpeed = sp; best = [lat, lng]; }
            }
            if (best && Math.random() < CUR_SPAWN_BIAS) return best;   // usually the fastest pick
            if (anyValid) return anyValid;                            // else seed slower water
            return [d.lat0 + Math.random() * (d.nlat - 1) * d.dlat,
                    d.lon0 + Math.random() * (d.nlon - 1) * d.dlon];
        }

        // Minimal shader so each streaklet vertex carries its own fade alpha (no depth test, horizon-culled).
        function flowMaterial() {
            return new THREE.ShaderMaterial({
                transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
                uniforms: { uOpacity: { value: CUR_BASE_OPACITY } },
                vertexShader: `
                    attribute float alpha; attribute vec3 vcolor;
                    varying float vAlpha; varying vec3 vCol; ${SURFACE_VARYING}
                    void main() {
                        vAlpha = alpha; vCol = vcolor;
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorld = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }`,
                fragmentShader: `
                    uniform float uOpacity; varying float vAlpha; varying vec3 vCol; ${SURFACE_VARYING}
                    void main() { ${SURFACE_CULL} gl_FragColor = vec4(vCol, vAlpha * uOpacity); }`,
            });
        }

        // Collapse particle i's whole trail to one point (used on spawn).
        function fillTrail(s, i, x, y, z) {
            const base = i * CUR_TRAIL * 3;
            for (let k = 0; k < CUR_TRAIL; k++) {
                s.trail[base + k * 3] = x;
                s.trail[base + k * 3 + 1] = y;
                s.trail[base + k * 3 + 2] = z;
            }
        }

        function initFlowParticles(d) {
            const n = CUR_PARTICLES, L = CUR_TRAIL;
            const lat = new Float32Array(n), lng = new Float32Array(n);
            const age = new Float32Array(n), life = new Float32Array(n);
            const trail = new Float32Array(n * L * 3);   // cartesian history per particle
            // Scale flow so a p90-strength current sweeps CUR_DEG_PER_SEC of arc per second; dtFrames is in 60fps units.
            const degPerStep = (CUR_DEG_PER_SEC / Math.max(d.speed_p90, 0.05)) / 60;
            flowState = { d, n, L, lat, lng, age, life, degPerStep, trail };

            for (let i = 0; i < n; i++) {
                const [la, lo] = spawnFlow(d);
                lat[i] = la; lng[i] = lo;
                life[i] = CUR_LIFE_MIN + Math.random() * (CUR_LIFE_MAX - CUR_LIFE_MIN);
                age[i] = Math.random() * life[i];   // stagger so respawns are spread
                const p = myGlobe.getCoords(la, lo, 0);
                fillTrail(flowState, i, p.x, p.y, p.z);
            }

            // (L-1) line segments per particle → 2 vertices each.
            const segVerts = n * (L - 1) * 2;
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(segVerts * 3), 3));
            geom.setAttribute('vcolor', new THREE.BufferAttribute(new Float32Array(segVerts * 3), 3));
            geom.setAttribute('alpha', new THREE.BufferAttribute(new Float32Array(segVerts), 1));
            flowLines = new THREE.LineSegments(geom, flowMaterial());
            flowLines.renderOrder = LAYER_ORDER.flow;   // over the speed backdrop, under the track
            flowLines.frustumCulled = false;
            myGlobe.scene().add(flowLines);
        }

        function stepFlow(dtFrames) {
            const s = flowState;
            if (!s || !flowLines) return;
            const d = s.d, L = s.L;
            const pos = flowLines.geometry.attributes.position.array;
            const col = flowLines.geometry.attributes.vcolor.array;
            const alp = flowLines.geometry.attributes.alpha.array;
            const hi = Math.max(d.speed_p90, 0.05);

            for (let i = 0; i < s.n; i++) {
                s.age[i] += dtFrames;
                let flow = sampleFlow(d, s.lat[i], s.lng[i]);
                let respawned = false;
                if (!flow || s.age[i] >= s.life[i]) {
                    const [la, lo] = spawnFlow(d);
                    s.lat[i] = la; s.lng[i] = lo; s.age[i] = 0;
                    s.life[i] = CUR_LIFE_MIN + Math.random() * (CUR_LIFE_MAX - CUR_LIFE_MIN);
                    flow = sampleFlow(d, la, lo) || [0, 0];
                    respawned = true;
                }
                const u = flow[0], v = flow[1];
                const speed = Math.hypot(u, v);
                const cosLat = Math.cos(s.lat[i] * Math.PI / 180) || 1e-6;
                // Advance one step (dtFrames folds in elapsed frame time).
                s.lng[i] += u * s.degPerStep * dtFrames / cosLat;
                s.lat[i] += v * s.degPerStep * dtFrames;
                const p = myGlobe.getCoords(s.lat[i], s.lng[i], 0);

                const tb = i * L * 3;
                if (respawned) {
                    fillTrail(s, i, p.x, p.y, p.z);
                } else {
                    // Shift the trail back one slot and append the new head.
                    s.trail.copyWithin(tb, tb + 3, tb + L * 3);
                    s.trail[tb + (L - 1) * 3] = p.x;
                    s.trail[tb + (L - 1) * 3 + 1] = p.y;
                    s.trail[tb + (L - 1) * 3 + 2] = p.z;
                }

                const c = CUR_LINE_COLOR;   // constant (black) — speed is shown by the backdrop, not the line colour
                // Whole-life fade: in over the first 12%, out over the last 30%.
                const lt = s.age[i] / s.life[i];
                const lifeFade = lt < 0.12 ? lt / 0.12 : (lt > 0.7 ? (1 - lt) / 0.3 : 1);

                // Emit (L-1) line segments; alpha ramps tail→head above a floor.
                const segs = L - 1;
                const sb = i * segs * 2;
                for (let j = 0; j < segs; j++) {
                    const vb = (sb + j * 2) * 3, ab = sb + j * 2;
                    const t0 = tb + j * 3, t1 = tb + (j + 1) * 3;
                    pos[vb] = s.trail[t0]; pos[vb + 1] = s.trail[t0 + 1]; pos[vb + 2] = s.trail[t0 + 2];
                    pos[vb + 3] = s.trail[t1]; pos[vb + 4] = s.trail[t1 + 1]; pos[vb + 5] = s.trail[t1 + 2];
                    col[vb] = c[0]; col[vb + 1] = c[1]; col[vb + 2] = c[2];
                    col[vb + 3] = c[0]; col[vb + 4] = c[1]; col[vb + 5] = c[2];
                    const fA = CUR_ALPHA_FLOOR + (1 - CUR_ALPHA_FLOOR) * (j / segs);
                    const fB = CUR_ALPHA_FLOOR + (1 - CUR_ALPHA_FLOOR) * ((j + 1) / segs);
                    alp[ab] = fA * lifeFade;
                    alp[ab + 1] = fB * lifeFade;
                }
            }
            flowLines.geometry.attributes.position.needsUpdate = true;
            flowLines.geometry.attributes.vcolor.needsUpdate = true;
            flowLines.geometry.attributes.alpha.needsUpdate = true;
        }

        function flowTick(now) {
            if (!currentsActive || !flowState) { flowRAF = 0; return; }
            const dtMs = flowLastT ? Math.min(now - flowLastT, 60) : 16.7;
            flowLastT = now;
            stepFlow(dtMs / 16.7);   // normalise to ~60fps frames
            flowRAF = requestAnimationFrame(flowTick);
        }

        function startFlow() {
            if (flowRAF) return;
            flowLastT = 0;
            flowRAF = requestAnimationFrame(flowTick);
        }

        function disposeCurrents() {
            if (flowRAF) { cancelAnimationFrame(flowRAF); flowRAF = 0; }
            if (flowLines && myGlobe) myGlobe.scene().remove(flowLines);
            if (flowLines) { flowLines.geometry.dispose(); flowLines.material.dispose(); }
            flowLines = null; flowState = null;
            if (currentsMesh && myGlobe) myGlobe.scene().remove(currentsMesh);
            if (currentsMesh) { currentsMesh.geometry.dispose(); currentsMesh.material.dispose(); }
            currentsMesh = null;
        }

        // Returns the build time in ms (speed mesh + particle setup).
        function applyCurrents() {
            let drawMs = 0;
            disposeCurrents();
            if (!(currentsActive && currentsData && myGlobe)) {
                if (!activeOverlay) document.getElementById('chla-bar').classList.remove('visible');
                updateCurrentsButton();
                updateCopernicusAttrib();
                return drawMs;
            }
            try {
                const _tDraw = performance.now();
                const speedData = currentsSpeedData(currentsData);
                currentsMesh = buildOverlayMesh(speedData, CURRENTS_DEF, CUR_MESH_OPACITY);
                myGlobe.scene().add(currentsMesh);
                initFlowParticles(currentsData);
                drawMs = performance.now() - _tDraw;
                startFlow();
                setOverlayBar(CURRENTS_DEF, 0, Math.max(currentsData.speed_p90, 0.05), currentsData.date);
                document.getElementById('chla-bar').classList.add('visible');
                fitColourBar();
            } catch (err) {
                console.error('[currents] render failed:', err);
                currentsActive = false;
                disposeCurrents();
                showOverlayError('Could not draw currents', err.message);
            }
            updateCurrentsButton();
            updateCopernicusAttrib();
            return drawMs;
        }

        function deactivateCurrents() {
            if (!currentsActive) return;
            currentsActive = false;
            applyCurrents();
        }

        async function loadCurrents() {
            const fileId = activeId;   // currents always target the active glider
            if (!fileId) return;
            // Same stale-response ticket as loadOverlay.
            const seq = ++currentsReqSeq;
            currentsLoading = true;
            updateCurrentsButton();
            const T = { start: performance.now(), cells: 0 };
            try {
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const res = await fetch(`/api/currents?id=${encodeURIComponent(fileId)}${latestParam()}`);
                T.fetched = performance.now();
                const hdr = res.headers && res.headers.get('X-Process-Time');
                T.serverTime = hdr ? parseFloat(hdr) * 1000 : 0;
                const data = await res.json();
                T.parsed = performance.now();
                if (seq !== currentsReqSeq) return;   // superseded — drop it
                if (!res.ok || data.error) {
                    showOverlayError(data.error || `Request failed (${res.status})`, data.hint, data.setup);
                    return;
                }
                if (!data.u || !data.nlat) {
                    showOverlayError('No current data for this region/date');
                    return;
                }
                currentsData = data;
                currentsActive = true;
                T.serverPhases = data._timing || null;
                T.cells = data.nlat * data.nlon;
                T.date = data.date;
                T.note = `${data.nlat}×${data.nlon} grid · ${data.date}`;
            } catch (err) {
                if (seq === currentsReqSeq) showOverlayError(err.message || 'Failed to load currents');
            } finally {
                if (seq === currentsReqSeq) {
                    currentsLoading = false;
                    if (layerPending('currents')) pollOverlayStatus();
                    const drawMs = applyCurrents();
                    if (T.cells) {
                        T.drawn = performance.now();
                        logOverlayTiming('currents', T, drawMs);
                    }
                }
            }
        }

        // Toggle the currents layer; mutually exclusive with scalar overlays.
        function selectCurrents() {
            if (currentsLoading) return;
            if (layerPending('currents')) return;
            if (currentsActive) { deactivateCurrents(); return; }
            if (activeOverlay) { activeOverlay = null; applyOverlay(); }  // free the legend
            if (currentsData) { currentsActive = true; applyCurrents(); }
            else loadCurrents();
        }

        function updateCurrentsButton() {
            const btn = document.getElementById('curBtn');
            if (!btn) return;
            const sw = btn.querySelector('.ovSwatch');
            const lbl = btn.querySelector('.ovLabel');
            const pending = layerPending('currents') && !currentsLoading;
            btn.classList.toggle('on', currentsActive && !currentsLoading);
            btn.classList.toggle('loading', currentsLoading);
            btn.classList.toggle('pending', pending);
            if (currentsLoading) {
                sw.innerHTML = '<span class="material-symbols-outlined spin" style="font-size:13px;line-height:13px;">progress_activity</span>';
                sw.style.background = 'transparent';
                lbl.textContent = 'Fetching…';
                btn.title = 'Fetching ocean currents …';
            } else {
                sw.innerHTML = '';
                sw.style.background = rampGradient(CURRENTS_DEF);
                lbl.textContent = CURRENTS_DEF.label;
                btn.title = pending ? 'Currents — preparing…'
                    : (currentsActive ? 'Hide ' : 'Show ') + 'Copernicus surface currents';
            }
        }

        // Build the Currents row (above the Glider DAC toggle).
        function buildCurrentsButton() {
            const dac = document.getElementById('dacToggle');
            const btn = document.createElement('button');
            btn.id = 'curBtn';
            btn.className = 'ovBtn';
            const sw = document.createElement('span');
            sw.className = 'ovSwatch';
            sw.style.cssText = 'display:inline-block; width:13px; height:13px; border-radius:3px; background:' + rampGradient(CURRENTS_DEF) + ';';
            const lbl = document.createElement('span');
            lbl.className = 'ovLabel';
            lbl.textContent = CURRENTS_DEF.label;
            btn.append(sw, lbl);
            btn.addEventListener('click', selectCurrents);
            dac.parentNode.insertBefore(btn, dac);   // sits just above Glider DAC
        }

        // Pause the animation when the tab/panel is hidden; resume on return.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (flowRAF) { cancelAnimationFrame(flowRAF); flowRAF = 0; }
            } else if (currentsActive && flowState) {
                startFlow();
            }
        });

        // Collapse / expand the Layers sidebar (default open).
        document.getElementById('layer-header').addEventListener('click', () => {
            const panel = document.getElementById('layer-panel');
            const collapsed = panel.classList.toggle('collapsed');
            document.getElementById('layer-header').title = collapsed ? 'Show layers' : 'Collapse layers';
            fitColourBar();   // the cap depends on whether the panel is open
        });

        buildOverlayButtons();
        buildCurrentsButton();
        initMap();

        // Coalesce resize events to one update per animation frame.
        let _mapResizeRaf = null;
        window.addEventListener('resize', () => {
            if (_mapResizeRaf !== null) return;
            _mapResizeRaf = requestAnimationFrame(() => {
                _mapResizeRaf = null;
                if (myGlobe) {
                    myGlobe.width(window.innerWidth).height(window.innerHeight);
                }
                updateSurfaceResolution();
                fitColourBar();
                _refitCoordBubble();
            });
        });

        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'setTheme') {
                const t = event.data.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (myGlobe) {
                    const tc = readThemeColors();
                    myGlobe.backgroundColor(tc.bg).atmosphereColor(tc.atmosphere);
                    restyleTracks();   // grey level / accent are theme-dependent
                }
            } else if (event.data.type === 'pinCoord') {
                // Another globe or a plot point was picked: mirror the pin here.
                if (typeof event.data.lat === 'number' && typeof event.data.lng === 'number') {
                    showPin(event.data.lat, event.data.lng);
                }
            } else if (event.data.type === 'pinTime') {
                // Parent resolved the TIME for an on-path pin — show it in the bubble.
                setCoordTime(typeof event.data.timeMs === 'number' ? event.data.timeMs : null);
            } else if (event.data.type === 'clearPin') {
                clearPin();
            } else if (event.data.type === 'setDac') {
                // Parent (e.g. Jelly) toggling the current arrows.
                const want = event.data.show;
                showDac = (typeof want === 'boolean') ? want : !showDac;
                updateDacToggle();
                syncDacMesh();
            } else if (event.data.type === 'queryDac') {
                reportDacStatus();
            } else if (event.data.type === 'setActive') {
                // Parent switched the active dataset: recolour/recentre in place.
                if (event.data.id) setActiveTrack(event.data.id);
            } else if (event.data.type === 'refreshTracks') {
                // The set of processed files changed: rebuild tracks, keep the active glider.
                fetchAllTracks().then(() => {
                    if (!activeTrack() && allTracks.length) activeId = allTracks[0].id;
                    dacArrows = activeTrack() ? activeTrack().dacArrows : [];
                    updateDacToggle();
                    rebuildTrackMeshes();
                    applyDots();
                });
            } else if (event.data.type === 'fitView') {
                fitView(event.data);
            } else if (event.data.type === 'setOverlay') {
                // Parent (e.g. Jelly) choosing a surface overlay, or 'none' to hide.
                const key = event.data.overlay;
                if (key === 'currents') {
                    if (!currentsActive) selectCurrents();
                } else {
                    if (currentsActive) deactivateCurrents();
                    setOverlayByKey(key);
                }
            } else if (event.data.type === 'collapseLayers') {
                // Parent tucking the Layers panel away after setting an overlay.
                const panel = document.getElementById('layer-panel');
                if (panel && !panel.classList.contains('collapsed')) {
                    panel.classList.add('collapsed');
                    const hdr = document.getElementById('layer-header');
                    if (hdr) hdr.title = 'Show layers';
                    fitColourBar();
                }
            }
        });
    </script>
</body>
