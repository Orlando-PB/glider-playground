<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glider Map View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #a1cae6; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        .leaflet-container { background: #a1cae6; }
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; background: #f8f9fa; }
    </style>
</head>
<body>
    <div id="overlay" class="flex flex-col items-center gap-2 text-gray-500">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Loading map data...</span>
    </div>
    
    <div id="map"></div>

    <script>
        // --- Shared Console Logging ---
        const consoleStyles = {
            badge: "background: #005f73; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-weight: bold;",
            renderBadge: "background: #780000; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-weight: bold;",
            path: "color: #0a9396; font-weight: bold; margin-right: 8px;",
            time: "background: #ee9b00; color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold;"
        };

        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch.apply(this, args);
            const processTime = response.headers.get('X-Process-Time');
            if (processTime) {
                const timeInSeconds = parseFloat(processTime).toFixed(4);
                const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : 'Unknown');
                const path = new URL(url, window.location.origin).pathname;
                console.log(`%cAPI%c${path}%c${timeInSeconds}s`, consoleStyles.badge, consoleStyles.path, consoleStyles.time);
            }
            return response;
        };
        // ------------------------------

        let map = null;
        let pathLine = null;

        async function initMap() {
            const startTime = performance.now();
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('filename');
            
            if (!filename) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = 'No dataset provided';
                return;
            }

            try {
                const response = await fetch(`/api/map?filename=${encodeURIComponent(filename)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                document.getElementById('overlay').style.display = 'none';

                if (!map) {
                    map = L.map('map', { zoomControl: false, attributionControl: false });
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 13
                    }).addTo(map);
                }

                if (pathLine) map.removeLayer(pathLine);

                L.polyline(data.path, {
                    color: '#333333', weight: 5, opacity: 0.8, lineJoin: 'round'
                }).addTo(map);

                pathLine = L.polyline(data.path, {
                    color: '#ffeb3b', weight: 2, opacity: 1, lineJoin: 'round'
                }).addTo(map);

                map.fitBounds(pathLine.getBounds(), { 
                    padding: [30, 30],
                    maxZoom: 6 
                });

                const endTime = performance.now();
                console.log(`%cRENDER%c2D Map Frontend%c${((endTime - startTime) / 1000).toFixed(4)}s`, consoleStyles.renderBadge, consoleStyles.path, consoleStyles.time);

            } catch (err) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = err.message || 'Failed to load map';
            }
        }

        initMap();
    </script>
</body>
</html>
