<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glider Globe View</title>
    <script src="/static/js/console_log.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/vendor/tailwind.css">
    <link rel="stylesheet" href="/static/info_note.css">
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    </noscript>
    <!-- globe.gl + three in one vendored bundle (window.Globe, window.THREE), so the globe and the surface layers share one three; source in /three_bundle. -->
    <script src="/static/vendor/globe-three.min.js"></script>
    <!-- Argo float layer (experimental, self-contained; see argo_layer.js) -->
    <script src="/static/map_view/argo_layer.js"></script>
    <!-- Research-ship layer (experimental, self-contained; see ships_layer.js) -->
    <script src="/static/map_view/ships_layer.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-globe: #121420;
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #8b93a3;
            --accent: #FFD700;
            --atmosphere: #ffffff;
        }
        :root[data-theme="light"] {
            --bg-globe: #ffffff;
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #5f6673;
            --accent: #FFD700;
            --atmosphere: #5b9cff;
        }
        body { margin: 0; padding: 0; font-family: 'Inter','Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-globe); overflow: hidden; color: var(--text-primary); }
        #globe-container { width: 100vw; height: 100vh; z-index: 1; cursor: grab; visibility: hidden; }
        #globe-container:active { cursor: grabbing; }
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; background: var(--bg-panel); color: var(--text-muted); }
        /* ── Layers sidebar (collapsible, top-right) ─────────────────── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            /* Cap height to the viewport; #layer-body scrolls instead. */
            max-height: calc(100vh - 20px); box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        /* Collapsed: same 32px height as #chla-bar so the two sit level. */
        #layer-panel.collapsed { max-width: none; height: 32px; justify-content: center; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; min-height: 0; flex-shrink: 1;
        }

        /* Toggle rows inside the sidebar */
        #dacToggle, #smoothToggle, #latestToggle, .ovBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
        }
        #dacToggle:hover, #smoothToggle:hover, #latestToggle:hover, .ovBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        #dacToggle.on, #smoothToggle.on, #latestToggle.on, .ovBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovBtn.loading { cursor: progress; }
        /* Layer not yet prefetched for this glider: greyed until it lands. */
        .ovBtn.pending { opacity: 0.4; cursor: default; }
        .ovBtn.pending:hover { background: transparent; }
        #layer-header .lyrIcon.spin { animation: chlaspin 0.9s linear infinite; opacity: 0.7; }
        .ovBtn .spin { animation: chlaspin 0.9s linear infinite; }
        @keyframes chlaspin { to { transform: rotate(360deg); } }
        .ovSwatch { flex: 0 0 auto; }

        /* CHL-a colourbar — bottom-left, only while a layer is on. */
        #chla-bar {
            display: none; position: absolute; bottom: 10px; left: 10px; z-index: 60;
            align-items: center; gap: 6px; padding: 0 10px; height: 32px; border-radius: 10px;
            font-size: 10px; font-weight: 500; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 80%, transparent);
            box-shadow: 0 1px 6px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
            /* Width cap is set in JS (fitColourBar); overflow:hidden is only a safety net. */
            max-width: calc(100vw - 140px); overflow: hidden; box-sizing: border-box;
        }
        #chla-bar.visible { display: flex; }

        #chla-bar-title {
            font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; margin-right: 2px;
        }
        #chla-bar-grad {
            height: 8px; width: 90px; border-radius: 4px; flex: 0 0 auto;
            background: linear-gradient(to right,
                #edfeed 0%, #8ae08a 30%, #1a9a1a 55%, #004d00 78%, #000d00 100%);
        }
        #chla-bar-hi, #chla-bar-lo { font-size: 9px; white-space: nowrap; }
        #chla-bar-date { font-size: 9px; opacity: 0.55; margin-left: 4px; white-space: nowrap; }
        /* Narrow panels are handled in JS (fitColourBar). */

        /* CHL-a error toast */
        #chla-err {
            display: none; position: absolute; bottom: 54px; left: 50%;
            transform: translateX(-50%); z-index: 70; max-width: 80%;
            padding: 8px 12px; border-radius: 8px; font-size: 11px;
            color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            text-align: center;
        }
        #chla-err.visible { display: block; }
        #chla-err .hint { color: var(--text-muted); margin-top: 4px; font-size: 10px; }
        /* Copyable command row inside the error toast (e.g. pip install copernicus). */
        #chla-err-cmd {
            display: none; align-items: stretch; gap: 6px; margin-top: 6px;
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            border: 1px solid var(--border, rgba(127,127,127,0.3));
            border-radius: 6px; overflow: hidden; text-align: left;
        }
        #chla-err-cmd.show { display: flex; }
        #chla-err-cmd code {
            flex: 1 1 auto; padding: 5px 8px; overflow-x: auto; white-space: pre;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px; color: var(--text-primary);
        }
        #chla-err-cmd button {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            width: 28px; border: none; border-left: 1px solid var(--border, rgba(127,127,127,0.3));
            cursor: pointer; background: transparent; color: var(--text-muted);
        }
        #chla-err-cmd button:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); color: var(--text-primary); }
        #chla-err-cmd button.copied { color: #34d399; }
        #chla-err-cmd .material-symbols-outlined { font-size: 14px; }

        /* Clicked-coordinate bubble — top-centre, for piloting hand-off. */
        /* Top-centre readout stack: live coord-bubble, then pinned measurements. */
        #coord-overlay-stack {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 70; display: flex; flex-direction: column; align-items: center;
            gap: 6px; max-width: calc(100vw - 20px);
        }
        #coord-bubble {
            display: none; align-items: center; gap: 8px; padding: 5px 6px 5px 10px;
            border-radius: 8px; font-size: 11px; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 90%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            max-width: 100%; box-sizing: border-box;
        }
        #coord-bubble.visible { display: flex; }
        #coord-bubble .coord-pin { font-size: 15px; color: #3b82f6; flex: 0 0 auto; }
        #coord-textwrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
        /* _fitCoordText() drops decimals until the text fits; ellipsis is the last resort. */
        #coord-text {
            display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px; white-space: nowrap; user-select: text;
            overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        #coord-time {
            display: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px; white-space: nowrap; user-select: text; color: var(--text-muted);
            overflow: hidden; text-overflow: ellipsis; max-width: 100%;
        }
        #coord-bubble-actions { display: flex; flex: 0 0 auto; }
        #coord-bubble button {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border: none; border-radius: 5px;
            cursor: pointer; background: transparent; color: var(--text-muted);
        }
        #coord-bubble button:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); color: var(--text-primary); }
        #coord-bubble button.copied { color: #34d399; }
        #coord-bubble .material-symbols-outlined { font-size: 15px; }
        /* Ruler mode: orange accent, distance on the primary line. */
        #coord-bubble.ruler-mode .coord-pin { color: #f97316; }
        #coord-bubble.ruler-mode #coord-text { font-weight: 600; }

        /* Narrow screens: smaller type, action buttons on a second row. */
        @media (max-width: 420px) {
            #coord-overlay-stack { max-width: calc(100vw - 12px); }
            #coord-bubble { flex-wrap: wrap; row-gap: 4px; padding: 6px 8px; }
            #coord-textwrap { flex-basis: calc(100% - 23px); }
            #coord-text, #coord-time { font-size: 10px; }
            #coord-bubble-actions { flex-basis: 100%; justify-content: flex-end; }
        }

        /* Pinned measurements: compact rows under the live bubble. */
        #coord-pinned-stack {
            display: none; flex-direction: column; align-items: center; gap: 4px;
            max-width: 100%;
        }
        #coord-pinned-stack.visible { display: flex; }
        .coord-pinned-row {
            display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px;
            border-radius: 7px; font-size: 10px; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 6px rgba(0,0,0,0.3); backdrop-filter: blur(4px);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            white-space: nowrap; max-width: 100%; box-sizing: border-box;
            cursor: pointer;
        }
        .coord-pinned-row:hover { background: color-mix(in srgb, var(--bg-panel) 96%, var(--text-primary)); }
        .coord-pinned-row .row-icon { font-size: 13px; flex: 0 0 auto; }
        .coord-pinned-row .row-icon.point { color: #3b82f6; }
        .coord-pinned-row .row-icon.ruler { color: #f97316; }
        .coord-pinned-row .row-text { overflow: hidden; text-overflow: ellipsis; }
        .coord-pinned-row button {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; border: none; border-radius: 4px;
            cursor: pointer; background: transparent; color: var(--text-muted);
        }
        .coord-pinned-row button:hover { background: color-mix(in srgb, var(--text-primary) 14%, transparent); color: var(--text-primary); }
        .coord-pinned-row .material-symbols-outlined { font-size: 13px; }

        /* Hover tooltip for waypoint/glider markers — follows the cursor. */
        #marker-tooltip {
            display: none; position: absolute; z-index: 71; pointer-events: none;
            padding: 5px 8px; border-radius: 7px; font-size: 11px; line-height: 1.4;
            color: var(--text-primary); white-space: nowrap;
            background: color-mix(in srgb, var(--bg-panel) 90%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            max-width: calc(100vw - 12px); box-sizing: border-box;
            overflow: hidden; text-overflow: ellipsis;
        }
        #marker-tooltip.visible { display: block; }
        #marker-tooltip b { font-weight: 700; }
        #marker-tooltip .sub { color: var(--text-muted); }
        @media (max-width: 420px) {
            #marker-tooltip { font-size: 10px; padding: 4px 6px; }
        }
    </style>
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const t = p.get('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay" class="flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon" style="color:#5b9cff;">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Loading globe…</span>
    </div>
    
    <div id="globe-container"></div>

    <!-- Layers sidebar (collapsible); overlay rows are generated by JS into #layer-body. -->
    <div id="layer-panel" class="collapsed">
        <button id="layer-header" title="Show layers">
            <span class="material-symbols-outlined lyrIcon">layers</span>
            <span id="layer-title">Layers</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body">
            <!-- Overlay-mesh smoothing toggle (default on). -->
            <button id="smoothToggle" class="on" title="Toggle overlay smoothing">
                <span class="material-symbols-outlined ovSwatch" style="font-size:14px;">blur_on</span>
                Smooth
            </button>
            <!-- Off: Copernicus layers dated at the glider's last fix. On: current conditions. -->
            <button id="latestToggle" title="Show the latest Copernicus data instead of the deployment's own date">
                <span class="material-symbols-outlined ovSwatch" style="font-size:14px;">update</span>
                Latest
            </button>
            <!-- Depth-averaged current (DAC) toggle. Hidden until a file with DAC loads. -->
            <button id="dacToggle" title="Toggle depth-averaged currents">
                <span class="material-symbols-outlined ovSwatch" style="font-size:14px;">near_me</span>
                Glider DAC
            </button>
        </div>
    </div>

    <!-- CHL-a colourbar legend (shown only while the layer is on). -->
    <div id="chla-bar">
        <span id="chla-bar-title">Chl-a</span>
        <span id="chla-bar-lo">–</span>
        <div id="chla-bar-grad"></div>
        <span id="chla-bar-hi">–</span>
        <span id="chla-bar-date"></span>
    </div>

    <!-- Data-source attribution lines (managed by setAttrib). -->
    <div id="attrib" class="info-note"></div>

    <!-- Hover tooltip for waypoint/glider markers, follows the cursor. -->
    <div id="marker-tooltip" role="status" aria-live="polite"></div>

    <!-- Clicked-coordinate readout (top-centre) plus pinned measurements. -->
    <div id="coord-overlay-stack">
        <div id="coord-bubble">
            <span class="material-symbols-outlined coord-pin">location_on</span>
            <span id="coord-textwrap">
                <span id="coord-text">–</span>
                <span id="coord-time"></span>
            </span>
            <span id="coord-bubble-actions">
                <button id="coord-copy" type="button" title="Copy lat, lon"><span class="material-symbols-outlined">content_copy</span></button>
                <button id="coord-pin-toggle" type="button" title="Pin (keep when a new point/line is made)"><span class="material-symbols-outlined">push_pin</span></button>
                <button id="coord-close" type="button" title="Close"><span class="material-symbols-outlined">close</span></button>
            </span>
        </div>
        <div id="coord-pinned-stack"></div>
    </div>

    <!-- CHL-a error toast -->
    <div id="chla-err">
        <div id="chla-err-msg"></div>
        <div class="hint" id="chla-err-hint"></div>
        <div id="chla-err-cmd"><code id="chla-err-cmd-text"></code><button id="chla-err-cmd-copy" type="button" title="Copy to clipboard"><span class="material-symbols-outlined">content_copy</span></button></div>
    </div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            return {
                bg: (s.getPropertyValue('--bg-globe').trim() || '#0b0d13'),
                path: (s.getPropertyValue('--accent').trim() || '#5b9cff'),
                atmosphere: (s.getPropertyValue('--atmosphere').trim() || '#ffffff')
            };
        }

        const CONFIG = {
            // Line widths are screen pixels; the active track thickens/brightens oldest -> newest.
            pathThicknessMin: 1.1,
            pathThicknessMax: 3.6,
            pathBrightnessMin: 0.22,
            pathBrightnessMax: 1.0,
            contextThicknessMin: 2.0,
            contextThicknessMax: 2.6,
            maxPoints: 20000,         // per-track vertex cap for the drawn line
            zoomScaleFactor: 30,
            minAltitude: 0.01,
            maxAltitude: 2.5,
        };

        // Depth-averaged current (DAC) arrows: one per dive, drawn at the surfacing point.
        const DAC_CONFIG = {
            // Arrows fade with age; greyOld is the grey level (0-255) of the oldest arrow.
            greyOld: 150,
            alphaOld: 0.45,
            strokeMin: 1.2,       // oldest arrow (px)
            strokeMax: 2.2,       // newest arrow (px)
            scaleKmPerMs: 18,     // arrow length: 1 m/s -> 18 km
            minLenKm: 0.5,
            maxLenKm: 18,
            maxLenSpanFrac: 0.08, // also cap length to a fraction of the track span
            headFrac: 0.3,        // arrowhead length as a fraction of the shaft
            headAngleDeg: 25,
        };

        // Build arrow polylines (shaft + barbs) from DAC vectors; spanKm scales arrows to the track extent.
        function buildDacArrows(vectors, spanKm, trackId) {
            const out = [];
            if (!Array.isArray(vectors)) return out;
            const kmToLat = (km) => km / 110.574;
            const maxLen = spanKm > 0
                ? Math.min(DAC_CONFIG.maxLenKm, spanKm * DAC_CONFIG.maxLenSpanFrac)
                : DAC_CONFIG.maxLenKm;
            for (const d of vectors) {
                const lat = Number(d.lat), lon = Number(d.lon);
                const u = Number(d.u), v = Number(d.v);
                const speed = Math.hypot(u, v);
                if (!isFinite(lat) || !isFinite(lon) || !(speed > 0)) continue;

                const lenKm = Math.min(maxLen,
                    Math.max(DAC_CONFIG.minLenKm, speed * DAC_CONFIG.scaleKmPerMs));
                const cosLat = Math.cos(lat * Math.PI / 180) || 1e-6;
                const kmToLon = (km) => km / (111.320 * cosLat);

                const ue = u / speed, vn = v / speed;          // unit east/north
                const tipLat = lat + kmToLat(vn * lenKm);
                const tipLon = lon + kmToLon(ue * lenKm);

                // Arrowhead barbs: rotate the reversed direction by ±headAngle.
                const headKm = lenKm * DAC_CONFIG.headFrac;
                const a = DAC_CONFIG.headAngleDeg * Math.PI / 180;
                const rxE = -ue, ryN = -vn;
                const rot = (ex, ny, ang) => [
                    ex * Math.cos(ang) - ny * Math.sin(ang),
                    ex * Math.sin(ang) + ny * Math.cos(ang),
                ];
                const [b1e, b1n] = rot(rxE, ryN, a);
                const [b2e, b2n] = rot(rxE, ryN, -a);
                const barb1 = { lat: tipLat + kmToLat(b1n * headKm), lng: tipLon + kmToLon(b1e * headKm) };
                const barb2 = { lat: tipLat + kmToLat(b2n * headKm), lng: tipLon + kmToLon(b2e * headKm) };

                out.push({
                    trackId,
                    speed,
                    t: 1, // filled in below once the count is known
                    lines: [
                        [{ lat, lng: lon }, { lat: tipLat, lng: tipLon }],
                        [barb1, { lat: tipLat, lng: tipLon }, barb2],
                    ],
                });
            }
            // t = 0 oldest, 1 newest — matches the track's time fade.
            const last = out.length - 1;
            for (let i = 0; i <= last; i++) out[i].t = last > 0 ? i / last : 1;
            return out;
        }

        function hexToRgb(hex) {
            const h = (hex || '').trim().replace('#', '');
            const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(v, 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function rgbaString({ r, g, b }, a) {
            return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a.toFixed(3)})`;
        }

        // Thin a track to at most CONFIG.maxPoints (keeping the last fix); stamp age t: 0 oldest, 1 newest.
        function thinPath(points) {
            const stride = Math.max(1, Math.ceil((points.length - 1) / CONFIG.maxPoints));
            const sampled = [];
            for (let i = 0; i < points.length; i += stride) sampled.push(points[i]);
            if (sampled[sampled.length - 1] !== points[points.length - 1]) {
                sampled.push(points[points.length - 1]);
            }
            const n = sampled.length;
            return sampled.map((p, i) => ({ lat: p.lat, lng: p.lng, t: n > 1 ? i / (n - 1) : 1 }));
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
            }
        });

        let myGlobe = null;
        // All processed gliders are drawn at once; allTracks holds prebuilt geometry so switching is a recolour + recentre.
        let allTracks = [];      // [{id, name, formattedPath, view, isNrt, lastLat, lastLon, dacArrows}]
        let activeId = null;     // id of the active (accent-coloured) track
        let hoverId = null;      // id of the grey track under the cursor, or null
        let dacArrows = [];      // the ACTIVE track's DAC arrows (others never show DAC)
        let showDac = false;   // DAC arrows default to off, even when available; user toggles them on
        let _trackView = null;   // active track's {centreLat, centreLng, maxSpan} for re-fitting the camera

        // The single blue pinned point, kept in sync across every open globe by the parent.
        let _pinDot = null;   // null or {lat, lng, pin:true}

        // Ruler measurement: endpoints plus the great-circle ribbon mesh (rebuilt every drag frame).
        let _rulerStart = null;
        let _rulerEnd = null;
        let _rulerLine = null;

        // Pinned measurements: {id, type:'point', lat, lng} or {id, type:'ruler', a, b, km}; each ruler has its own mesh keyed by id.
        let _pinnedItems = [];
        let _pinIdSeq = 1;
        const _pinnedRulerLines = {};

        // Curated waypoints (see waypoint_logic.py), filtered to the active track by substring match of `glider` against the filename.
        let allWaypoints = [];   // [{id, glider, tag, lat, lon, notes}]

        function activeTrack() { return allTracks.find(t => t.id === activeId) || null; }

        function waypointsForActiveTrack() {
            const at = activeTrack();
            if (!at || !allWaypoints.length) return [];
            const name = (at.name || '').toLowerCase();
            return allWaypoints.filter(w => name.includes((w.glider || '').toLowerCase()));
        }

        async function fetchWaypoints() {
            try {
                const res = await fetch('/api/waypoints');
                const data = await res.json();
                allWaypoints = data.waypoints || [];
            } catch (_) {
                allWaypoints = [];
            }
        }

        // ── Surface overlay state: one surface field at a time; currents/DAC coexist ──
        const OVERLAY_HALF_DEG_DEFAULT = 0.054; // ~12 km cell fallback if server omits it
        const overlayCache = {};   // key -> fetched {points, p10, p90, date, half_deg, units}

        // Server prefetch state per layer (copernicus_prefetch.py): key -> {state: 'pending'|'ready'|'error', date}.
        let layerState = {};
        let layerStatusTimer = 0;
        let layerStatusSeq = 0;

        function layerPending(key) {
            if (overlayLatest) return false;   // Latest is fetched on demand, never prefetched
            const st = layerState[key];
            return !!st && st.state === 'pending';
        }

        function updateLayerHeaderIcon() {
            const icon = document.querySelector('#layer-header .lyrIcon');
            if (!icon) return;
            const anyPending = Object.values(layerState).some(l => l.state === 'pending');
            icon.textContent = anyPending ? 'progress_activity' : 'layers';
            icon.classList.toggle('spin', anyPending);
        }

        // Poll /api/overlay_status while the file's snapshot layers are still being prefetched.
        async function pollOverlayStatus() {
            clearTimeout(layerStatusTimer);
            const fileId = activeId;
            if (!fileId) return;
            const seq = ++layerStatusSeq;
            let next = 1500;
            try {
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const res = await fetch(`/api/overlay_status?id=${encodeURIComponent(fileId)}`);
                const st = await res.json();
                if (seq !== layerStatusSeq || fileId !== activeId) return;
                const prev = layerState;
                layerState = st.layers || {};
                // Server refreshed this layer to a newer day: drop our copy so it reloads.
                for (const k in layerState) {
                    const was = prev[k] && prev[k].date;
                    const now = layerState[k].date;
                    if (!overlayLatest && was && now && was !== now) {
                        if (k === 'currents') {
                            currentsData = null;
                            if (currentsActive) loadCurrents();
                        } else {
                            delete overlayCache[k];
                            if (activeOverlay === k) loadOverlay(k);
                        }
                    }
                }
                next = st.done ? 0 : 1500;
            } catch (_) {
                next = 5000;
            }
            updateOverlayButtons();
            updateCurrentsButton();
            updateLayerHeaderIcon();
            if (next) layerStatusTimer = setTimeout(pollOverlayStatus, next);
        }
        let activeOverlay = null;  // key of the overlay currently drawn, or null
        let overlayMesh = null;    // single merged THREE mesh of the active overlay
        let overlayLoading = null; // key currently being fetched, or null
        let overlayReqSeq = 0;     // ticket counter — only the latest loadOverlay() call may apply
        let overlaySmooth = true;  // Smooth toggle in the layer panel; rebuilds the active mesh
        let overlayLatest = false; // Latest toggle: current Copernicus conditions, not the file's snapshot
        const LATEST_CHECK_MS = 5 * 60 * 1000;
        const latestParam = () => overlayLatest ? '&latest=1' : '';

        // Each overlay: ramp colour stops (0–1 → [r,g,b]), log/linear scaling, legend label and units.
        const OVERLAYS = [
            { key: 'chla', label: 'Chl-a', units: 'mg/m³', log: true, stops: [
                [0,[237,254,237]],[0.2,[178,228,158]],[0.45,[78,178,68]],[0.7,[18,98,18]],[0.9,[4,48,8]],[1,[0,13,0]] ] },
            { key: 'temp', label: 'Temp', units: '°C', log: false, stops: [
                [0,[12,28,120]],[0.25,[30,110,200]],[0.5,[90,200,180]],[0.7,[240,220,90]],[0.85,[235,120,40]],[1,[150,20,20]] ] },
            { key: 'salinity', label: 'Salinity', units: 'PSU', log: false, stops: [
                [0,[16,32,80]],[0.3,[24,96,140]],[0.55,[34,158,148]],[0.8,[130,206,96]],[1,[250,242,128]] ] },
            { key: 'o2', label: 'O₂', units: 'mmol/m³', log: false, stops: [
                [0,[140,20,20]],[0.3,[220,120,40]],[0.6,[240,222,120]],[1,[40,120,200]] ] },
            { key: 'ph', label: 'pH', units: '', log: false, stops: [
                [0,[180,40,40]],[0.5,[238,238,238]],[1,[40,80,180]] ] },
            { key: 'biomass', label: 'Biomass', units: 'mmol/m³', log: false, stops: [
                [0,[68,1,84]],[0.25,[59,82,139]],[0.5,[33,145,140]],[0.75,[94,201,98]],[1,[253,231,37]] ] },
            { key: 'ssh', label: 'SLA', units: 'm', log: false, stops: [
                [0,[33,68,140]],[0.3,[80,150,210]],[0.5,[238,238,238]],[0.7,[230,140,70]],[1,[150,20,20]] ] },
        ];
        const overlayByKey = Object.fromEntries(OVERLAYS.map(o => [o.key, o]));

        // Position of a value within an overlay's [lo, hi] range, 0–1.
        function overlayT(ov, val, lo, hi) {
            if (ov.log) {
                const l = Math.log10(Math.max(lo, 1e-3)), h = Math.log10(Math.max(hi, 2e-3));
                return Math.max(0, Math.min(1, (Math.log10(Math.max(val, 1e-3)) - l) / (h - l || 1)));
            }
            return Math.max(0, Math.min(1, (val - lo) / (hi - lo || 1)));
        }

        // Interpolate an overlay's colour stops at fraction t → [r,g,b] (0–255).
        function rampRGB(stops, t) {
            let S0 = stops[0], S1 = stops[stops.length - 1];
            for (let i = 0; i < stops.length - 1; i++) {
                if (t >= stops[i][0] && t <= stops[i + 1][0]) { S0 = stops[i]; S1 = stops[i + 1]; break; }
            }
            const f = S0[0] === S1[0] ? 0 : (t - S0[0]) / (S1[0] - S0[0]);
            return [
                S0[1][0] + f * (S1[1][0] - S0[1][0]),
                S0[1][1] + f * (S1[1][1] - S0[1][1]),
                S0[1][2] + f * (S1[1][2] - S0[1][2]),
            ];
        }

        // [r,g,b] in 0–1 for THREE vertex colours.
        function overlayColor01(ov, val, lo, hi) {
            const c = rampRGB(ov.stops, overlayT(ov, val, lo, hi));
            return [c[0] / 255, c[1] / 255, c[2] / 255];
        }

        // CSS `linear-gradient(...)` string spanning an overlay's ramp.
        function rampGradient(ov) {
            const parts = ov.stops.map(([t, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round(t * 100)}%`);
            return `linear-gradient(to right, ${parts.join(', ')})`;
        }

        // ── Surface layers ─────────────────────────────────────────────
        // Everything sits exactly on the sphere with depth testing OFF: stacking is by renderOrder only,
        // and the far hemisphere is culled in the fragment shader.
        const LAYER_ORDER = { overlay: 10, flow: 11, track: 12, hoverTrack: 12.5, activeTrack: 13, dac: 14, ruler: 20 };

        // GLSL shared by every surface shader: `vWorld` is world position, SURFACE_CULL the horizon test.
        const SURFACE_VARYING = 'varying vec3 vWorld;';
        const SURFACE_CULL = 'if (dot(vWorld, cameraPosition - vWorld) < 0.0) discard;';

        // Viewport size in CSS px, shared by every ribbon material; refreshed on resize.
        const _uRes = { value: null };
        function updateSurfaceResolution() {
            if (!_uRes.value) _uRes.value = new THREE.Vector2(1, 1);
            _uRes.value.set(window.innerWidth || 1, window.innerHeight || 1);
        }

        // Screen-space ribbon material: constant pixel width at any zoom; colour and width
        // interpolate linearly from A (age 0, oldest) to B (age 1, newest), so restyling is a uniform write.
        function ribbonMaterial() {
            return new THREE.ShaderMaterial({
                transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
                uniforms: {
                    uRes: _uRes,
                    uColorA: { value: new THREE.Vector4(1, 1, 1, 1) },
                    uColorB: { value: new THREE.Vector4(1, 1, 1, 1) },
                    uWidthA: { value: 2 },
                    uWidthB: { value: 2 },
                },
                vertexShader: `
                    attribute vec3 tdir; attribute float side; attribute float age;
                    uniform vec2 uRes; uniform float uWidthA, uWidthB;
                    varying float vAge; varying float vEdge; varying float vHalfW; ${SURFACE_VARYING}
                    void main() {
                        vAge = age; vEdge = side;
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorld = wp.xyz;
                        vec4 clip = projectionMatrix * viewMatrix * wp;
                        vec4 clip2 = projectionMatrix * viewMatrix * (wp + vec4(tdir, 0.0));
                        vec2 dir = (clip2.xy / clip2.w - clip.xy / clip.w) * uRes;
                        float len = length(dir);
                        vec2 n = len > 1e-6 ? vec2(-dir.y, dir.x) / len : vec2(0.0);
                        vHalfW = mix(uWidthA, uWidthB, age) * 0.5 + 0.5;
                        clip.xy += n * side * vHalfW * 2.0 / uRes * clip.w;
                        gl_Position = clip;
                    }`,
                fragmentShader: `
                    uniform vec4 uColorA, uColorB;
                    varying float vAge; varying float vEdge; varying float vHalfW; ${SURFACE_VARYING}
                    void main() {
                        ${SURFACE_CULL}
                        vec4 c = mix(uColorA, uColorB, vAge);
                        c.a *= clamp((1.0 - abs(vEdge)) * vHalfW, 0.0, 1.0);
                        if (c.a <= 0.002) discard;
                        gl_FragColor = c;
                    }`,
            });
        }

        function setRGBA(v, r, g, b, a) { v.set(r / 255, g / 255, b / 255, a); }

        // One BufferGeometry for a set of polylines ([{lat, lng, t}] or [{x, y, z, t}] in globe space),
        // built as mitred quad strips; per-vertex `age` drives colour and width.
        function buildRibbonGeometry(polylines) {
            let nPts = 0, nQuads = 0;
            for (const pl of polylines) if (pl.length >= 2) { nPts += pl.length; nQuads += pl.length - 1; }
            const positions = new Float32Array(nPts * 6);
            const tdirs = new Float32Array(nPts * 6);
            const sides = new Float32Array(nPts * 2);
            const ages = new Float32Array(nPts * 2);
            const index = new Uint32Array(nQuads * 6);
            let v = 0, ii = 0;
            const xyz = [];
            for (const pl of polylines) {
                if (pl.length < 2) continue;
                xyz.length = 0;
                for (const p of pl) {
                    if (p.x != null) { xyz.push(p.x, p.y, p.z); continue; }
                    const w = myGlobe.getCoords(p.lat, p.lng, 0);
                    xyz.push(w.x, w.y, w.z);
                }
                const n = pl.length;
                let px = 0, py = 0, pz = 1;   // last usable tangent, for degenerate steps
                for (let i = 0; i < n; i++) {
                    // Tangent = chord from previous to next point (the mitre direction).
                    const i0 = Math.max(0, i - 1) * 3, i1 = Math.min(n - 1, i + 1) * 3;
                    let tx = xyz[i1] - xyz[i0], ty = xyz[i1 + 1] - xyz[i0 + 1], tz = xyz[i1 + 2] - xyz[i0 + 2];
                    const len = Math.hypot(tx, ty, tz);
                    if (len > 1e-9) { tx /= len; ty /= len; tz /= len; px = tx; py = ty; pz = tz; }
                    else { tx = px; ty = py; tz = pz; }
                    const x = xyz[i * 3], y = xyz[i * 3 + 1], z = xyz[i * 3 + 2];
                    const age = pl[i].t == null ? 1 : pl[i].t;
                    for (let side = -1; side <= 1; side += 2) {
                        positions[v * 3] = x; positions[v * 3 + 1] = y; positions[v * 3 + 2] = z;
                        tdirs[v * 3] = tx; tdirs[v * 3 + 1] = ty; tdirs[v * 3 + 2] = tz;
                        sides[v] = side; ages[v] = age;
                        v++;
                    }
                    if (i > 0) {
                        const a = v - 4, b = v - 3, c = v - 2, d = v - 1;   // prev(-,+), this(-,+)
                        index[ii++] = a; index[ii++] = b; index[ii++] = c;
                        index[ii++] = b; index[ii++] = d; index[ii++] = c;
                    }
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('tdir', new THREE.BufferAttribute(tdirs, 3));
            geom.setAttribute('side', new THREE.BufferAttribute(sides, 1));
            geom.setAttribute('age', new THREE.BufferAttribute(ages, 1));
            geom.setIndex(new THREE.BufferAttribute(index, 1));
            return geom;
        }

        function ribbonMesh(polylines, renderOrder) {
            const mesh = new THREE.Mesh(buildRibbonGeometry(polylines), ribbonMaterial());
            mesh.renderOrder = renderOrder;
            mesh.frustumCulled = false;   // vertices are displaced in the shader
            return mesh;
        }

        function disposeMesh(m) {
            if (!m) return;
            if (myGlobe) myGlobe.scene().remove(m);
            m.geometry.dispose();
            m.material.dispose();
        }

        // ── Tracks: one ribbon mesh per glider; role changes only rewrite uniforms (restyleTracks) ──
        const _trackMeshes = {};   // track id -> ribbon mesh
        let _dacMesh = null;       // the active track's DAC arrows, only while showDac

        // (Re)build every track's ribbon from allTracks.
        function rebuildTrackMeshes() {
            if (!myGlobe) return;
            for (const id in _trackMeshes) { disposeMesh(_trackMeshes[id]); delete _trackMeshes[id]; }
            for (const t of allTracks) {
                const mesh = ribbonMesh([thinPath(t.formattedPath)], LAYER_ORDER.track);
                myGlobe.scene().add(mesh);
                _trackMeshes[t.id] = mesh;
            }
            restyleTracks();
            syncDacMesh();
        }

        // Push each track's role (active / grey / hovered) into its material; greys depend on theme.
        function restyleTracks() {
            if (!myGlobe) return;
            const dark = document.documentElement.getAttribute('data-theme') !== 'light';
            const accent = hexToRgb(readThemeColors().path);
            for (const t of allTracks) {
                const mesh = _trackMeshes[t.id];
                if (!mesh) continue;
                const u = mesh.material.uniforms;
                if (t.id === activeId) {
                    setRGBA(u.uColorA.value, accent.r * 0.4, accent.g * 0.4, accent.b * 0.4, CONFIG.pathBrightnessMin);
                    setRGBA(u.uColorB.value, accent.r, accent.g, accent.b, CONFIG.pathBrightnessMax);
                    u.uWidthA.value = CONFIG.pathThicknessMin;
                    u.uWidthB.value = CONFIG.pathThicknessMax;
                    mesh.renderOrder = LAYER_ORDER.activeTrack;
                } else {
                    const hovered = t.id === hoverId;
                    const g = dark ? (hovered ? 235 : 145) : (hovered ? 35 : 110);
                    const aBase = hovered ? 0.95 : 0.42;
                    setRGBA(u.uColorA.value, g, g, g, aBase * 0.55);
                    setRGBA(u.uColorB.value, g, g, g, aBase);
                    u.uWidthA.value = hovered ? CONFIG.pathThicknessMax : CONFIG.contextThicknessMin;
                    u.uWidthB.value = hovered ? CONFIG.pathThicknessMax : CONFIG.contextThicknessMax;
                    mesh.renderOrder = hovered ? LAYER_ORDER.hoverTrack : LAYER_ORDER.track;
                }
            }
        }

        // The active track's DAC arrows as one ribbon mesh, fading with age.
        function syncDacMesh() {
            disposeMesh(_dacMesh);
            _dacMesh = null;
            const at = activeTrack();
            if (!(myGlobe && showDac && at && at.dacArrows.length)) return;
            const lines = [];
            for (const a of at.dacArrows) {
                for (const l of a.lines) lines.push(l.map(p => ({ lat: p.lat, lng: p.lng, t: a.t })));
            }
            _dacMesh = ribbonMesh(lines, LAYER_ORDER.dac);
            const u = _dacMesh.material.uniforms;
            const g = DAC_CONFIG.greyOld;
            setRGBA(u.uColorA.value, g, g, g, DAC_CONFIG.alphaOld);
            setRGBA(u.uColorB.value, 0, 0, 0, 1);
            u.uWidthA.value = DAC_CONFIG.strokeMin;
            u.uWidthB.value = DAC_CONFIG.strokeMax;
            myGlobe.scene().add(_dacMesh);
        }

        // Was the glider heading west over its last stretch? true / false, or null when there's no
        // usable movement. Compares against a point a few fixes back to ignore a noisy surfacing.
        function headingWest(t, lat, lng) {
            const path = t.formattedPath;
            if (!path || path.length < 2) return null;
            const back = path[Math.max(0, path.length - 1 - 5)];
            let dLng = lng - back.lng;
            if (dLng > 180) dLng -= 360; else if (dLng < -180) dLng += 360;
            const cLat = Math.cos(lat * Math.PI / 180) || 1e-6;
            const dx = dLng * cLat, dy = lat - back.lat;
            if (Math.hypot(dx, dy) < 0.002) return null;   // < ~200 m: no real movement
            if (Math.abs(dx) < 1e-6) return null;
            return dx < 0;
        }

        function buildPositionDots() {
            const pts = [];
            for (const t of allTracks) {
                const end = t.formattedPath[t.formattedPath.length - 1];
                if (t.isNrt) {
                    const lat = t.lastLat != null ? Number(t.lastLat) : end.lat;
                    const lng = t.lastLon != null ? Number(t.lastLon) : end.lng;
                    pts.push({ lat, lng, trackId: t.id, name: t.name, live: true, active: t.id === activeId, lastTime: t.lastTime, kind: t.platformKind, west: headingWest(t, lat, lng) });
                } else {
                    // Recovered tracks: end-of-data marker (selected one included).
                    pts.push({ lat: end.lat, lng: end.lng, trackId: t.id, name: t.name, live: false, active: t.id === activeId, kind: t.platformKind, west: headingWest(t, end.lat, end.lng) });
                }
            }
            // Research ships share this marker layer.
            if (window.ShipsLayer) pts.push(...ShipsLayer.dots());
            // The blue pinned point rides in the same html layer.
            if (_pinDot) pts.push(_pinDot);
            if (_rulerStart) pts.push({ lat: _rulerStart.lat, lng: _rulerStart.lng, ruler: true });
            if (_rulerEnd) pts.push({ lat: _rulerEnd.lat, lng: _rulerEnd.lng, ruler: true });
            for (const item of _pinnedItems) {
                if (item.type === 'point') {
                    pts.push({ lat: item.lat, lng: item.lng, pin: true });
                } else {
                    pts.push({ lat: item.a.lat, lng: item.a.lng, ruler: true });
                    pts.push({ lat: item.b.lat, lng: item.b.lng, ruler: true });
                }
            }
            for (const w of waypointsForActiveTrack()) {
                pts.push({ lat: w.lat, lng: w.lon, waypoint: true, tag: w.tag, glider: w.glider, notes: w.notes });
            }
            return pts;
        }

        // Push the dots to the globe, every dot as an HTML marker.
        function applyDots() {
            if (!myGlobe) return;
            myGlobe.htmlElementsData(buildPositionDots());
        }

        // Tell the parent app whether DAC arrows exist and are shown.
        function reportDacStatus() {
            try {
                window.parent && window.parent.postMessage({
                    type: 'dacStatus',
                    available: dacArrows.length > 0,
                    shown: showDac && dacArrows.length > 0,
                }, '*');
            } catch (_) {}
        }

        function updateDacToggle() {
            reportDacStatus();
            const btn = document.getElementById('dacToggle');
            if (!btn) return;
            if (dacArrows.length === 0) {
                btn.style.display = 'none';
                return;
            }
            btn.style.display = 'flex';
            btn.classList.toggle('on', showDac);
            btn.title = (showDac ? 'Hide' : 'Show') +
                ` depth-averaged currents (${dacArrows.length} dives)`;
        }

        // Turn one raw /api/map_all track into the shape this file works from (clean path, DAC arrows, bounds).
        function buildTrack(raw) {
            const formattedPath = (raw.path || [])
                .filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]))
                .map(c => ({ lat: Number(c[0]), lng: Number(c[1]) }));
            if (formattedPath.length === 0) return null;

            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            for (const p of formattedPath) {
                if (p.lat < minLat) minLat = p.lat;
                if (p.lat > maxLat) maxLat = p.lat;
                if (p.lng < minLng) minLng = p.lng;
                if (p.lng > maxLng) maxLng = p.lng;
            }
            const cLat = Math.cos((minLat + maxLat) / 2 * Math.PI / 180) || 1e-6;
            const spanKm = Math.hypot((maxLat - minLat) * 110.574, (maxLng - minLng) * 111.320 * cLat);

            return {
                id: raw.id,
                name: raw.name || '',
                formattedPath,
                dacArrows: buildDacArrows(raw.dac, spanKm, raw.id),
                isNrt: !!raw.is_nrt,
                lastLat: raw.last_lat,
                lastLon: raw.last_lon,
                lastTime: raw.last_time,
                platformKind: raw.platform_kind || '',
                view: {
                    centreLat: (minLat + maxLat) / 2,
                    centreLng: (minLng + maxLng) / 2,
                    maxSpan: Math.max(maxLat - minLat, maxLng - minLng),
                },
            };
        }

        // Point the camera at the active track; instant=true skips the ease.
        function recentreOnActive(instant) {
            const at = activeTrack();
            if (!myGlobe || !at) return;
            _trackView = at.view;
            const alt = Math.max(0.05, at.view.maxSpan / CONFIG.zoomScaleFactor);
            myGlobe.pointOfView({ lat: at.view.centreLat, lng: at.view.centreLng, altitude: alt }, instant ? 0 : 700);
        }

        async function fetchAllTracks() {
            const res = await fetch('/api/map_all');
            const data = await res.json();
            const tracks = [];
            for (const raw of (data.tracks || [])) {
                const t = buildTrack(raw);
                if (t) tracks.push(t);
            }
            allTracks = tracks;
            return tracks;
        }

        async function initMap() {
            const startTime = performance.now();
            const params = new URLSearchParams(window.location.search);
            activeId = params.get('id') || params.get('filename') || null;

            try {
                await Promise.all([fetchAllTracks(), fetchWaypoints()]);

                if (allTracks.length === 0) {
                    document.getElementById('loadingIcon').textContent = 'error';
                    document.getElementById('loadingIcon').classList.remove('animate-spin');
                    document.getElementById('statusText').textContent = 'No mappable files';
                    return;
                }

                // Fall back to the first track if the requested id isn't mappable.
                if (!activeTrack()) activeId = allTracks[0].id;

                dacArrows = activeTrack().dacArrows;
                updateDacToggle();
                revealOverlayButtons();
                pollOverlayStatus();

                const tc = readThemeColors();
                myGlobe = Globe({ animateIn: false })
                    (document.getElementById('globe-container'))
                    .globeTileEngineUrl((x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/${l}/${y}/${x}`)
                    .backgroundColor(tc.bg)
                    .showAtmosphere(true)
                    .atmosphereColor(tc.atmosphere)
                    // Picking is done in screen space here, so globe.gl's own raycast is off.
                    .enablePointerInteraction(false)
                    .htmlElementsData(buildPositionDots())
                    .htmlLat('lat')
                    .htmlLng('lng')
                    .htmlAltitude(0)
                    .htmlElement(dotEl);

                // Ocean-coloured base sphere, so the globe isn't black while basemap tiles stream in.
                try { myGlobe.globeMaterial().color.set('#a8c8dc'); } catch (_) {}

                updateSurfaceResolution();
                rebuildTrackMeshes();

                // Clamp camera distance.
                try {
                    const radius = myGlobe.getGlobeRadius();
                    const controls = myGlobe.controls();
                    controls.minDistance = radius * (1 + CONFIG.minAltitude);
                    controls.maxDistance = radius * (1 + CONFIG.maxAltitude);
                    // Platform icons shrink as the camera pulls back (full size below altitude 0.5).
                    const iconScale = () => {
                        const alt = myGlobe.pointOfView().altitude;
                        const k = Math.max(0.5, Math.min(1, 1 - (alt - 0.5) * 0.35));
                        document.documentElement.style.setProperty('--iconScale', k.toFixed(2));
                    };
                    controls.addEventListener('change', iconScale);
                    iconScale();
                } catch (_) {}

                attachCoordPicker();
                if (window.ArgoLayer) ArgoLayer.attach(() => myGlobe, document.getElementById('layer-body'), ribbonMesh);
                if (window.ShipsLayer) ShipsLayer.attach(() => myGlobe, document.getElementById('layer-body'), applyDots);

                myGlobe.onGlobeReady(() => {
                    document.getElementById('globe-container').style.visibility = 'visible';
                    document.getElementById('overlay').style.display = 'none';
                    window.logRender('3D Globe Frontend', performance.now() - startTime);
                });

                recentreOnActive(true);

                // Let the dashboard know the globe is ready (e.g. for the Map preset).
                try { window.parent.postMessage({ type: 'mapReady' }, '*'); } catch (_) {}

            } catch (err) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = err.message || 'Failed to load map';
            }
        }

        // Hover uses the same forgiving radius as click selection (nearestTrackAtScreen).
        let _coordAimOn = false;   // crosshair pick mode (after picking a coord)
        let _hoverRAF = 0, _hoverXY = null;

        function applyHoverCursor() {
            const el = document.getElementById('globe-container');
            if (el) el.style.cursor = hoverId ? 'pointer' : (_coordAimOn ? 'crosshair' : '');
        }

        function setHover(id) {
            if (id === hoverId) return;
            hoverId = id;
            applyHoverCursor();
            restyleTracks();
        }

        function _escHtml(s) {
            return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // Cursor-following tooltip for waypoint/glider markers.
        function showMarkerTooltip(info, cx, cy) {
            const el = document.getElementById('marker-tooltip');
            if (!el) return;
            const lines = [`<b>${_escHtml(info.title)}</b>`];
            if (info.subtitle) lines.push(`<span class="sub">${_escHtml(info.subtitle)}</span>`);
            if (info.detail) lines.push(_escHtml(info.detail));
            el.innerHTML = lines.join('<br>');
            el.classList.add('visible');
            // Default offset is down-right of the cursor; flip to stay inside this iframe.
            const margin = 6;
            const w = el.offsetWidth, h = el.offsetHeight;
            const vw = window.innerWidth, vh = window.innerHeight;
            let left = cx + 14, top = cy + 14;
            if (left + w + margin > vw) left = cx - 14 - w;
            if (top + h + margin > vh) top = cy - 14 - h;
            left = Math.max(margin, Math.min(left, vw - w - margin));
            top = Math.max(margin, Math.min(top, vh - h - margin));
            el.style.left = left + 'px';
            el.style.top = top + 'px';
        }

        function hideMarkerTooltip() {
            const el = document.getElementById('marker-tooltip');
            if (el) el.classList.remove('visible');
        }

        // Throttle hover hit-testing to one check per animation frame.
        function scheduleHover(cx, cy) {
            _hoverXY = [cx, cy];
            if (_hoverRAF) return;
            _hoverRAF = requestAnimationFrame(() => {
                _hoverRAF = 0;
                if (!_hoverXY) return;
                const marker = (window.ShipsLayer && ShipsLayer.hoverInfo(_hoverXY[0], _hoverXY[1], 10))
                    || (window.ArgoLayer && ArgoLayer.hoverInfo(_hoverXY[0], _hoverXY[1], 10))
                    || nearestMarkerAtScreen(_hoverXY[0], _hoverXY[1], 12);
                if (marker) {
                    setHover(null);
                    showMarkerTooltip(marker, _hoverXY[0], _hoverXY[1]);
                } else {
                    hideMarkerTooltip();
                    setHover(nearestTrackAtScreen(_hoverXY[0], _hoverXY[1], 14));
                }
            });
        }

        function clearHover() {
            if (_hoverRAF) { cancelAnimationFrame(_hoverRAF); _hoverRAF = 0; }
            _hoverXY = null;
            hideMarkerTooltip();
            setHover(null);
        }

        // Position dot: red for a live deployment, grey for a historical one.
        function dotEl(d) {
            const el = document.createElement('div');
            el.className = 'gp-dot';
            // Blue pinned point: same look as the live dot, blue and a touch smaller.
            if (d.pin) {
                el.style.cssText = 'width:11px;height:11px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 12px rgba(59,130,246,0.85);pointer-events:none;transform:translate(-50%,-50%);';
                return el;
            }
            // Ruler endpoint: small orange dot, same treatment as the pin.
            if (d.ruler) {
                el.style.cssText = 'width:9px;height:9px;border-radius:50%;background:#f97316;border:2px solid #fff;box-shadow:0 0 10px rgba(249,115,22,0.85);pointer-events:none;transform:translate(-50%,-50%);';
                return el;
            }
            // Waypoint marker: small green dot (tag renders via the labels layer).
            if (d.waypoint) {
                el.style.cssText = 'width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #fff;box-shadow:0 0 8px rgba(34,197,94,0.85);pointer-events:none;transform:translate(-50%,-50%);';
                return el;
            }
            // Ships: orange (gold when selected), same icon treatment as gliders.
            const c = d.ship ? (d.active ? '#FFD700' : '#fb923c') : d.live ? '#ef4444' : (d.active ? '#FFD700' : '#9ca3af');
            const glowRgb = d.ship ? (d.active ? '255,215,0' : '251,146,60') : d.live ? '239,68,68' : (d.active ? '255,215,0' : '156,163,175');
            // Known platform: icon from static/icons/; falls back to the plain dot.
            if (d.kind) {
                const strong = d.live || d.active || d.ship;
                const w = strong ? 36 : 28;
                // Live / ships / selected: icon as-is. Everything else: faded and greyed.
                const look = strong
                    ? 'filter:drop-shadow(0 0 1.5px #fff);opacity:1;'
                    : 'filter:drop-shadow(0 0 1px #fff) grayscale(1);opacity:0.7;';
                el.style.cssText = `width:${w}px;height:${Math.round(w * 24 / 56)}px;pointer-events:none;transform:translate(-50%,-50%);`;
                const img = document.createElement('img');
                img.src = `/static/icons/${d.kind}-mapicon.svg`;
                img.alt = '';
                // Icons face east by default; mirror when the last leg heads west.
                const flip = `transform:scale(var(--iconScale,1))${d.west === true ? ' scaleX(-1)' : ''};`;
                img.style.cssText = `width:100%;height:100%;object-fit:contain;display:block;${look}${flip}`;
                img.onerror = () => {
                    const glow2 = strong ? `0 0 12px rgba(${glowRgb},0.8)` : `0 0 8px rgba(${glowRgb},0.7)`;
                    const sz2 = strong ? 14 : 10;
                    el.style.cssText = `width:${sz2}px;height:${sz2}px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:${glow2};pointer-events:none;transform:translate(-50%,-50%);`;
                    img.remove();
                };
                el.appendChild(img);
                return el;
            }
            const glow = (d.live || d.active || d.ship) ? `0 0 12px rgba(${glowRgb},0.8)` : `0 0 8px rgba(${glowRgb},0.7)`;
            const sz = (d.live || d.active || d.ship) ? 14 : 10;
            el.style.cssText = `width:${sz}px;height:${sz}px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:${glow};pointer-events:none;transform:translate(-50%,-50%);`;
            return el;
        }

        // Switch the active track without refetching: clear active-only layers, repoint DAC, recolour, recentre.
        function setActiveTrack(id) {
            if (!allTracks.some(t => t.id === id)) {
                // Unknown id: refetch the track set, then apply.
                fetchAllTracks().then(() => {
                    if (allTracks.some(t => t.id === id)) setActiveTrack(id);
                });
                return;
            }
            if (id === activeId) { recentreOnActive(false); return; }

            // Remember the open layer so it can be re-fetched for the new glider.
            const prevOverlayKey = activeOverlay;
            const prevCurrents = currentsActive;

            activeId = id;
            hoverId = null;
            applyHoverCursor();

            // Caches are keyed only by variable, so drop meshes AND cached payloads.
            if (activeOverlay) { activeOverlay = null; applyOverlay(); }
            if (currentsActive) deactivateCurrents();
            for (const k in overlayCache) delete overlayCache[k];
            currentsData = null;
            layerState = {};
            pollOverlayStatus();

            dacArrows = activeTrack().dacArrows;
            updateDacToggle();
            restyleTracks();
            syncDacMesh();
            applyDots();   // active non-live track drops its grey dot; others update
            recentreOnActive(false);
            reportDacStatus();

            // Re-open the same layer for the new glider.
            if (prevOverlayKey) loadOverlay(prevOverlayKey);
            else if (prevCurrents) loadCurrents();
        }

        // Ask the parent to make `id` active; it echoes back setActive, which runs setActiveTrack.
        function selectTrack(id) {
            try { window.parent.postMessage({ type: 'requestActivate', id }, '*'); } catch (_) {}
        }

        document.getElementById('dacToggle').addEventListener('click', () => {
            showDac = !showDac;
            updateDacToggle();
            syncDacMesh();
        });

        document.getElementById('smoothToggle').addEventListener('click', () => {
            overlaySmooth = !overlaySmooth;
            document.getElementById('smoothToggle').classList.toggle('on', overlaySmooth);
            applyOverlay();   // rebuilds the active scalar overlay mesh, if any
            applyCurrents();  // rebuilds the currents mesh, if active
        });

        // Latest toggle: the two modes share overlayCache/currentsData, so drop them and reload what's showing.
        document.getElementById('latestToggle').addEventListener('click', () => {
            if (overlayLoading || currentsLoading) return;
            overlayLatest = !overlayLatest;
            document.getElementById('latestToggle').classList.toggle('on', overlayLatest);
            const key = activeOverlay, cur = currentsActive;
            for (const k in overlayCache) delete overlayCache[k];
            currentsData = null;
            if (key) { activeOverlay = null; applyOverlay(); loadOverlay(key); }
            else if (cur) { deactivateCurrents(); loadCurrents(); }
            updateOverlayButtons();
            updateCurrentsButton();
        });

        // While Latest is on, ask (metadata only) whether Copernicus has a newer day than the layer on screen.
        setInterval(async () => {
            if (!overlayLatest || overlayLoading || currentsLoading) return;
            const key = currentsActive ? 'currents' : activeOverlay;
            const shown = currentsActive ? currentsData : overlayCache[activeOverlay];
            if (!key || !shown || !shown.date) return;
            try {
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const res = await fetch(`/api/overlay_latest_date?var=${key}`);
                const { date } = await res.json();
                if (!date || date <= shown.date || !overlayLatest) return;
                if (key === 'currents') { if (currentsActive) loadCurrents(); }
                else if (activeOverlay === key) loadOverlay(key);
            } catch (_) {}
        }, LATEST_CHECK_MS);

        // Re-centre on the track: opts.whole frames the whole globe, else a tight fit plus opts.padding.
        function fitView(opts) {
            if (!myGlobe || !_trackView) return;
            opts = opts || {};
            const tight = Math.max(0.05, _trackView.maxSpan / CONFIG.zoomScaleFactor);
            let alt;
            if (opts.whole) {
                alt = 2.4;   // whole globe with a little edge space
            } else {
                const pad = (typeof opts.padding === 'number' && opts.padding >= 0) ? opts.padding : 0.4;
                alt = tight * (1 + pad);
            }
            myGlobe.pointOfView({ lat: _trackView.centreLat, lng: _trackView.centreLng, altitude: alt }, opts.instant ? 0 : 700);
        }

        // ── Surface overlays: buttons, fetch, render ───────────────────

        // ONE mesh for all cells (a per-cell polygon layer froze the tab at ~2500 cells).
        const OVERLAY_OPACITY = 0.72;

        // Flat vertex-coloured surface material (depth-test off, horizon-culled like the ribbons).
        function overlayMaterial(opacity) {
            return new THREE.ShaderMaterial({
                transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide,
                uniforms: { uOpacity: { value: opacity } },
                vertexShader: `
                    attribute vec3 vcolor; varying vec3 vCol; ${SURFACE_VARYING}
                    void main() {
                        vCol = vcolor;
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorld = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }`,
                fragmentShader: `
                    uniform float uOpacity; varying vec3 vCol; ${SURFACE_VARYING}
                    void main() { ${SURFACE_CULL} gl_FragColor = vec4(vCol, uOpacity); }`,
            });
        }

        function buildOverlayMesh(data, ov, opacity = OVERLAY_OPACITY) {
            const H = (typeof data.half_deg === 'number' && data.half_deg > 0)
                ? data.half_deg : OVERLAY_HALF_DEG_DEFAULT;
            // Two input shapes: parallel Float32Arrays (lat/lon/val) or an array of [lat,lng,val] triples.
            const flat = !!data.val;
            const latA = data.lat, lonA = data.lon, valA = data.val;
            const pts = data.points;
            const n = flat ? valA.length : pts.length;
            const spacing = H * 2;

            let latMin = Infinity, lonMin = Infinity;
            const lats = new Float64Array(n), lons = new Float64Array(n), vals = new Float64Array(n);
            for (let k = 0; k < n; k++) {
                const lat = flat ? latA[k] : pts[k][0];
                const lng = flat ? lonA[k] : pts[k][1];
                lats[k] = lat; lons[k] = lng; vals[k] = flat ? valA[k] : pts[k][2];
                if (lat < latMin) latMin = lat;
                if (lng < lonMin) lonMin = lng;
            }

            // Snap cells onto the regular source grid so neighbours can share corner vertices.
            const rowOf = new Int32Array(n), colOf = new Int32Array(n);
            let nRows = 0, nCols = 0;
            for (let k = 0; k < n; k++) {
                const r = Math.round((lats[k] - latMin) / spacing);
                const c = Math.round((lons[k] - lonMin) / spacing);
                rowOf[k] = r; colOf[k] = c;
                if (r + 1 > nRows) nRows = r + 1;
                if (c + 1 > nCols) nCols = c + 1;
            }
            const cellVal = new Float64Array(nRows * nCols).fill(NaN);
            for (let k = 0; k < n; k++) cellVal[rowOf[k] * nCols + colOf[k]] = vals[k];

            const nVX = nCols + 1;
            const vertexIndex = new Int32Array((nRows + 1) * nVX).fill(-1);
            // Smooth: shared corner vertices. Blocky: a private quad per cell.
            const maxVerts = overlaySmooth ? (nRows + 1) * nVX : n * 4;
            const positions = new Float32Array(maxVerts * 3);
            const colors = new Float32Array(maxVerts * 3);
            let vi = 0;

            function hasCell(r, c) {
                return r >= 0 && r < nRows && c >= 0 && c < nCols && !Number.isNaN(cellVal[r * nCols + c]);
            }
            function addVertex(i, j, col) {
                const lat = latMin + i * spacing - H;
                const lng = lonMin + j * spacing - H;
                const p = myGlobe.getCoords(lat, lng, 0);
                const idx = vi++;
                positions[idx * 3] = p.x; positions[idx * 3 + 1] = p.y; positions[idx * 3 + 2] = p.z;
                colors[idx * 3] = col[0]; colors[idx * 3 + 1] = col[1]; colors[idx * 3 + 2] = col[2];
                return idx;
            }

            // Shared corner averaged over the touching cells that have data; missing cells never emit a quad.
            function sharedVertex(i, j) {
                const key = i * nVX + j;
                let idx = vertexIndex[key];
                if (idx !== -1) return idx;
                let sum = 0, count = 0;
                for (const [dr, dc] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) {
                    const r = i + dr, c = j + dc;
                    if (hasCell(r, c)) { sum += cellVal[r * nCols + c]; count++; }
                }
                const col = overlayColor01(ov, sum / count, data.p10, data.p90);
                idx = addVertex(i, j, col);
                vertexIndex[key] = idx;
                return idx;
            }

            const index = new Uint32Array(n * 6);
            let ii = 0;
            for (let k = 0; k < n; k++) {
                const r = rowOf[k], c = colOf[k];
                let v00, v01, v11, v10;
                if (overlaySmooth) {
                    v00 = sharedVertex(r, c); v01 = sharedVertex(r, c + 1);
                    v11 = sharedVertex(r + 1, c + 1); v10 = sharedVertex(r + 1, c);
                } else {
                    // Blocky mode — each cell its own flat, hard-edged quad.
                    const col = overlayColor01(ov, cellVal[r * nCols + c], data.p10, data.p90);
                    v00 = addVertex(r, c, col); v01 = addVertex(r, c + 1, col);
                    v11 = addVertex(r + 1, c + 1, col); v10 = addVertex(r + 1, c, col);
                }
                index[ii++] = v00; index[ii++] = v01; index[ii++] = v11;
                index[ii++] = v00; index[ii++] = v11; index[ii++] = v10;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions.subarray(0, vi * 3), 3));
            geom.setAttribute('vcolor', new THREE.BufferAttribute(colors.subarray(0, vi * 3), 3));
            geom.setIndex(new THREE.BufferAttribute(index, 1));
            const mesh = new THREE.Mesh(geom, overlayMaterial(opacity));
            mesh.renderOrder = LAYER_ORDER.overlay;   // backdrop: under tracks, arrows and streaks
            mesh.frustumCulled = false;
            return mesh;
        }

        function disposeOverlayMesh() {
            if (!overlayMesh) return;
            if (myGlobe) myGlobe.scene().remove(overlayMesh);
            overlayMesh.geometry.dispose();
            overlayMesh.material.dispose();
            overlayMesh = null;
        }

        function setOverlayBar(ov, lo, hi, date) {
            const fmt = v => Math.abs(v) < 1 ? v.toFixed(2) : v.toFixed(1);
            const u = ov.units ? ' ' + ov.units : '';
            document.getElementById('chla-bar-title').textContent = ov.label;
            document.getElementById('chla-bar-grad').style.background = rampGradient(ov);
            document.getElementById('chla-bar-lo').textContent = fmt(lo) + u;
            document.getElementById('chla-bar-hi').textContent = fmt(hi) + u;
            document.getElementById('chla-bar-date').textContent = date || '';
        }

        // When the legend doesn't fit: drop the title, then the date, then hide the bar.
        function fitColourBar() {
            const bar = document.getElementById('chla-bar');
            if (!bar.classList.contains('visible')) return;
            const panel = document.getElementById('layer-panel');
            const collapsed = !panel.classList.contains('ready') || panel.classList.contains('collapsed');
            // Reserve room on the right for the layers panel (less when collapsed).
            bar.style.maxWidth = `calc(100vw - ${collapsed ? 66 : 140}px)`;

            const title = document.getElementById('chla-bar-title');
            const date = document.getElementById('chla-bar-date');
            // Start fully shown, then hide in priority order until it fits.
            title.style.display = '';
            date.style.display = '';
            bar.style.visibility = '';
            const fits = () => bar.scrollWidth <= bar.clientWidth + 1;
            if (fits()) return;
            title.style.display = 'none';
            if (fits()) return;
            date.style.display = 'none';
            if (fits()) return;
            // No room left: hide the bar (kept laid out so it reappears).
            bar.style.visibility = 'hidden';
        }

        // Pull a runnable command out of a hint string, e.g. "Run: pip install x" -> "pip install x".
        function extractCommand(hint) {
            if (!hint) return '';
            const quoted = hint.match(/['"`]([^'"`]+)['"`]/);
            if (quoted) return quoted[1].trim();
            const run = hint.match(/[Rr]un:\s*(.+?)\s*$/);
            if (run) return run[1].trim();
            return '';
        }

        function showOverlayError(msg, hint, setup) {
            const box = document.getElementById('chla-err');
            document.getElementById('chla-err-msg').textContent = msg || 'Could not load overlay';
            document.getElementById('chla-err-hint').textContent = hint || '';

            // Surface a named command as a copyable row.
            const cmd = extractCommand(hint);
            const cmdRow = document.getElementById('chla-err-cmd');
            const copyBtn = document.getElementById('chla-err-cmd-copy');
            cmdRow.classList.toggle('show', !!cmd);
            if (cmd) {
                document.getElementById('chla-err-cmd-text').textContent = cmd;
                copyBtn.onclick = async () => {
                    let ok = false;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(cmd); ok = true;
                        }
                    } catch (_) {}
                    if (!ok) {
                        try {
                            const ta = document.createElement('textarea');
                            ta.value = cmd; ta.style.position = 'fixed'; ta.style.opacity = '0';
                            document.body.appendChild(ta); ta.focus(); ta.select();
                            ok = document.execCommand('copy'); ta.remove();
                        } catch (_) {}
                    }
                    copyBtn.classList.toggle('copied', ok);
                    copyBtn.innerHTML = `<span class="material-symbols-outlined">${ok ? 'check' : 'error'}</span>`;
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
                    }, 1500);
                };
            }

            // A command or login-required signal means one-time Copernicus setup, not a transient failure.
            const setupAction = cmd || setup === 'login';
            clearTimeout(showOverlayError._t);

            if (setupAction) {
                // Setup help is surfaced through Jelly, so skip the in-globe toast.
                box.classList.remove('visible');
                try {
                    window.parent && window.parent.postMessage({
                        type: 'overlaySetup',
                        message: msg || 'Could not load Copernicus overlay',
                        hint: hint || '',
                        command: cmd,
                        setup: setup || (cmd ? 'install' : '')
                    }, '*');
                } catch (_) {}
            } else {
                // A transient/one-off failure: show it in-globe and auto-dismiss.
                box.classList.add('visible');
                showOverlayError._t = setTimeout(() => box.classList.remove('visible'), 7000);
            }
        }

        // ── Click-to-pick coordinates (6 dp, usable as a piloting waypoint) ──
        let _lastCoord = null;

        // Normalise longitude into (-180, 180] for a canonical readout.
        function _wrapLon(lon) {
            let x = ((lon + 180) % 360 + 360) % 360 - 180;
            if (x === -180) x = 180;
            return x;
        }

        // Own pointer down/up tracking with a forgiving move threshold; globe.gl's onGlobeClick is too strict.
        let _coordDown = null;   // {x, y} at pointerdown, screen px
        const _COORD_MOVE_TOL = 6;   // px; a release within this of the press = a click

        // ── Ruler: hold still for _RULER_HOLD_MS (or shift-press) to arm; orbit controls are disabled while dragging ──
        let _rulerHoldTimer = null;
        let _rulerArmed = false;
        let _rulerAnchor = null;   // {lat, lng} — where the hold landed
        const _RULER_HOLD_MS = 380;

        // Great-circle distance in km (mean Earth radius), independent of render radius.
        function _haversineKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(Math.min(1, a)));
        }

        const RULER_COLOR = [249, 115, 22];   // orange, matches the endpoint dots
        const RULER_WIDTH_PX = 2;

        // Great-circle arc as globe-space points (slerp between unit vectors).
        function _greatCirclePoints(a, b) {
            const r = myGlobe.getGlobeRadius();
            const pa = myGlobe.getCoords(a.lat, a.lng, 0);
            const pb = myGlobe.getCoords(b.lat, b.lng, 0);
            const va = new THREE.Vector3(pa.x, pa.y, pa.z).normalize();
            const vb = new THREE.Vector3(pb.x, pb.y, pb.z).normalize();
            const omega = Math.acos(Math.min(1, Math.max(-1, va.dot(vb))));
            const pts = [];
            if (omega < 1e-6) {
                pts.push(va.clone().multiplyScalar(r), vb.clone().multiplyScalar(r));
            } else {
                const sinOmega = Math.sin(omega);
                const segments = 64;
                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const f1 = Math.sin((1 - t) * omega) / sinOmega;
                    const f2 = Math.sin(t * omega) / sinOmega;
                    pts.push(new THREE.Vector3(
                        va.x * f1 + vb.x * f2,
                        va.y * f1 + vb.y * f2,
                        va.z * f1 + vb.z * f2
