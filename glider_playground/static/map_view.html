<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glider Globe View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #a1cae6; overflow: hidden; }
        #globe-container { width: 100vw; height: 100vh; z-index: 1; cursor: grab; visibility: hidden; }
        #globe-container:active { cursor: grabbing; }
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; background: #f8f9fa; }
    </style>
</head>
<body>
    <div id="overlay" class="flex flex-col items-center gap-2 text-gray-500">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Loading map data...</span>
    </div>
    
    <div id="globe-container"></div>

    <script>
        const CONFIG = {
            backgroundColour: '#a1cae6',
            pathColour: '#ffeb3b',
            pathThickness: 2.5, 
            zoomScaleFactor: 30
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                console.log('Escape pressed');
            }
        });

        const consoleStyles = {
            badge: "background: #005f73; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-weight: bold;",
            renderBadge: "background: #780000; color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-weight: bold;",
            path: "color: #0a9396; font-weight: bold; margin-right: 8px;",
            time: "background: #ee9b00; color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold;"
        };

        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch.apply(this, args);
            const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : 'Unknown');
            
            // Only log if the URL points to your local API, ignoring external tiles and Tailwind scripts
            if (url.includes('/api/')) {
                const processTime = response.headers.get('X-Process-Time');
                if (processTime) {
                    const timeInSeconds = parseFloat(processTime).toFixed(4);
                    const path = new URL(url, window.location.origin).pathname;
                    console.log(`%cAPI%c${path}%c${timeInSeconds}s`, consoleStyles.badge, consoleStyles.path, consoleStyles.time);
                }
            }
            return response;
        };

        let myGlobe = null;

        async function initMap() {
            const startTime = performance.now();
            const params = new URLSearchParams(window.location.search);
            const filename = params.get('filename');
            
            if (!filename) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = 'No dataset provided';
                return;
            }

            try {
                const response = await fetch(`/api/map?filename=${encodeURIComponent(filename)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const formattedPath = data.path
                    .filter(coords => Array.isArray(coords) && coords.length >= 2 && !isNaN(coords[0]) && !isNaN(coords[1]))
                    .map(coords => ({ lat: Number(coords[0]), lng: Number(coords[1]) }));

                if (formattedPath.length === 0) {
                    document.getElementById('loadingIcon').textContent = 'error';
                    document.getElementById('loadingIcon').classList.remove('animate-spin');
                    document.getElementById('statusText').textContent = 'No valid coordinate data';
                    return;
                }

                const pathFeature = { coordinates: formattedPath };

                if (!myGlobe) {
                    document.getElementById('statusText').textContent = 'Rendering 3D globe...';
                    
                    myGlobe = Globe()
                        (document.getElementById('globe-container'))
                        .globeTileEngineUrl((x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/${l}/${y}/${x}`)
                        .backgroundColor(CONFIG.backgroundColour)
                        .showAtmosphere(true)
                        .atmosphereColor('#ffffff')
                        .pathsData([pathFeature])
                        .pathPoints('coordinates')
                        .pathPointLat('lat')
                        .pathPointLng('lng')
                        .pathColor(() => CONFIG.pathColour)
                        .pathStroke(() => CONFIG.pathThickness);

                    myGlobe.onGlobeReady(() => {
                        document.getElementById('globe-container').style.visibility = 'visible';
                        document.getElementById('overlay').style.display = 'none';
                        
                        const endTime = performance.now();
                        console.log(`%cRENDER%c3D Globe Frontend%c${((endTime - startTime) / 1000).toFixed(4)}s`, consoleStyles.renderBadge, consoleStyles.path, consoleStyles.time);
                    });

                } else {
                    myGlobe.pathsData([pathFeature]);
                    document.getElementById('overlay').style.display = 'none';
                }

                let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
                formattedPath.forEach(p => {
                    if (p.lat < minLat) minLat = p.lat;
                    if (p.lat > maxLat) maxLat = p.lat;
                    if (p.lng < minLng) minLng = p.lng;
                    if (p.lng > maxLng) maxLng = p.lng;
                });

                const centreLat = (minLat + maxLat) / 2;
                const centreLng = (minLng + maxLng) / 2;
                const maxSpan = Math.max(maxLat - minLat, maxLng - minLng);
                const dynamicAltitude = Math.max(0.05, maxSpan / CONFIG.zoomScaleFactor);

                myGlobe.pointOfView({ lat: centreLat, lng: centreLng, altitude: dynamicAltitude }, 0);

            } catch (err) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = err.message || 'Failed to load map';
            }
        }

        initMap();

        window.addEventListener('resize', () => {
            if (myGlobe) {
                myGlobe.width(window.innerWidth).height(window.innerHeight);
            }
        });
    </script>
</body>
</html>
