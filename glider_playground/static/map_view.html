<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glider Globe View</title>
    <script src="/static/console_log.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/tailwind.css">
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    </noscript>
    <script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
    <!-- Standalone THREE (matches globe.gl 2.46.1's bundled three ≥0.154) for the
         CHL-a overlay mesh. Loaded AFTER globe.gl so globe.gl initialises untouched. -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-globe: #121420;
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #6b7280;
            --accent: #FFD700;
            --atmosphere: #ffffff;
        }
        :root[data-theme="light"] {
            --bg-globe: #ffffff;
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #7d8492;
            --accent: #FFD700;
            --atmosphere: #5b9cff;
        }
        body { margin: 0; padding: 0; font-family: 'Inter','Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-globe); overflow: hidden; color: var(--text-primary); }
        #globe-container { width: 100vw; height: 100vh; z-index: 1; cursor: grab; visibility: hidden; }
        #globe-container:active { cursor: grabbing; }
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; background: var(--bg-panel); color: var(--text-muted); }
        /* ── Layers sidebar (collapsible, top-right) ─────────────────── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        #layer-panel.collapsed { max-width: none; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body { display: flex; flex-direction: column; gap: 4px; }

        /* Toggle rows inside the sidebar */
        #dacToggle, .ovBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
        }
        #dacToggle:hover, .ovBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        #dacToggle.on, .ovBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovBtn.loading { cursor: progress; }
        .ovBtn .spin { animation: chlaspin 0.9s linear infinite; }
        @keyframes chlaspin { to { transform: rotate(360deg); } }
        .ovSwatch { flex: 0 0 auto; }

        /* CHL-a colourbar — bottom-left, only while a layer is on. */
        #chla-bar {
            display: none; position: absolute; bottom: 10px; left: 10px; z-index: 60;
            align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
            font-size: 10px; font-weight: 500; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 80%, transparent);
            box-shadow: 0 1px 6px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
            /* The width cap is set in JS (fitColourBar) since it depends on whether
               the bottom-right layers panel is open. overflow:hidden is only a
               safety net — fitColourBar drops the title, then the date, then hides
               the whole bar rather than ever clipping text mid-character. */
            max-width: calc(100vw - 140px); overflow: hidden; box-sizing: border-box;
        }
        #chla-bar.visible { display: flex; }
        #chla-bar-title {
            font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; margin-right: 2px;
        }
        #chla-bar-grad {
            height: 8px; width: 90px; border-radius: 4px; flex: 0 0 auto;
            background: linear-gradient(to right,
                #edfeed 0%, #8ae08a 30%, #1a9a1a 55%, #004d00 78%, #000d00 100%);
        }
        #chla-bar-hi, #chla-bar-lo { font-size: 9px; white-space: nowrap; }
        #chla-bar-date { font-size: 9px; opacity: 0.55; margin-left: 4px; white-space: nowrap; }
        /* Narrow panels are handled in JS (fitColourBar): drop the title, then the
           date, then hide the bar — see the script below. */

        /* CHL-a error toast */
        #chla-err {
            display: none; position: absolute; bottom: 54px; left: 50%;
            transform: translateX(-50%); z-index: 70; max-width: 80%;
            padding: 8px 12px; border-radius: 8px; font-size: 11px;
            color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            text-align: center;
        }
        #chla-err.visible { display: block; }
        #chla-err .hint { color: var(--text-muted); margin-top: 4px; font-size: 10px; }
        /* Copyable command row inside the error toast (e.g. pip install copernicus). */
        #chla-err-cmd {
            display: none; align-items: stretch; gap: 6px; margin-top: 6px;
            background: color-mix(in srgb, var(--text-primary) 8%, transparent);
            border: 1px solid var(--border, rgba(127,127,127,0.3));
            border-radius: 6px; overflow: hidden; text-align: left;
        }
        #chla-err-cmd.show { display: flex; }
        #chla-err-cmd code {
            flex: 1 1 auto; padding: 5px 8px; overflow-x: auto; white-space: pre;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px; color: var(--text-primary);
        }
        #chla-err-cmd button {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            width: 28px; border: none; border-left: 1px solid var(--border, rgba(127,127,127,0.3));
            cursor: pointer; background: transparent; color: var(--text-muted);
        }
        #chla-err-cmd button:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); color: var(--text-primary); }
        #chla-err-cmd button.copied { color: #34d399; }
        #chla-err-cmd .material-symbols-outlined { font-size: 14px; }

        /* Clicked-coordinate bubble — top-centre, for piloting hand-off. */
        #coord-bubble {
            display: none; position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%); z-index: 70;
            align-items: center; gap: 8px; padding: 5px 6px 5px 10px;
            border-radius: 8px; font-size: 11px; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 90%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            max-width: calc(100vw - 20px); box-sizing: border-box;
        }
        #coord-bubble.visible { display: flex; }
        #coord-bubble .coord-pin { font-size: 15px; color: #3b82f6; }
        #coord-textwrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        #coord-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px; white-space: nowrap; user-select: text;
        }
        #coord-time {
            display: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px; white-space: nowrap; user-select: text; color: var(--text-muted);
        }
        #coord-bubble button {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; border: none; border-radius: 5px;
            cursor: pointer; background: transparent; color: var(--text-muted);
        }
        #coord-bubble button:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); color: var(--text-primary); }
        #coord-bubble button.copied { color: #34d399; }
        #coord-bubble .material-symbols-outlined { font-size: 15px; }
    </style>
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const t = p.get('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay" class="flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon" style="color:#5b9cff;">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Loading map data...</span>
    </div>
    
    <div id="globe-container"></div>

    <!-- Layers sidebar (collapsible). Surface-overlay rows are generated by JS
         into #layer-body, above Currents. Whole panel hidden until map loads. -->
    <div id="layer-panel">
        <button id="layer-header" title="Collapse layers">
            <span class="material-symbols-outlined">layers</span>
            <span id="layer-title">Layers</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body">
            <!-- Depth-averaged current (DAC) toggle. Hidden until a file with DAC loads. -->
            <button id="dacToggle" title="Toggle depth-averaged currents">
                <span class="material-symbols-outlined ovSwatch" style="font-size:14px;">near_me</span>
                Glider DAC
            </button>
        </div>
    </div>

    <!-- CHL-a colourbar legend (shown only while the layer is on). -->
    <div id="chla-bar">
        <span id="chla-bar-title">Chl-a</span>
        <span id="chla-bar-lo">–</span>
        <div id="chla-bar-grad"></div>
        <span id="chla-bar-hi">–</span>
        <span id="chla-bar-date"></span>
    </div>

    <!-- Clicked-coordinate readout (top-centre). Populated on globe click. -->
    <div id="coord-bubble">
        <span class="material-symbols-outlined coord-pin">location_on</span>
        <span id="coord-textwrap">
            <span id="coord-text">–</span>
            <span id="coord-time"></span>
        </span>
        <button id="coord-copy" type="button" title="Copy lat, lon"><span class="material-symbols-outlined">content_copy</span></button>
        <button id="coord-close" type="button" title="Close"><span class="material-symbols-outlined">close</span></button>
    </div>

    <!-- CHL-a error toast -->
    <div id="chla-err">
        <div id="chla-err-msg"></div>
        <div class="hint" id="chla-err-hint"></div>
        <div id="chla-err-cmd"><code id="chla-err-cmd-text"></code><button id="chla-err-cmd-copy" type="button" title="Copy to clipboard"><span class="material-symbols-outlined">content_copy</span></button></div>
    </div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            return {
                bg: (s.getPropertyValue('--bg-globe').trim() || '#0b0d13'),
                path: (s.getPropertyValue('--accent').trim() || '#5b9cff'),
                atmosphere: (s.getPropertyValue('--atmosphere').trim() || '#ffffff')
            };
        }

        const CONFIG = {
            pathThicknessMin: 1.1,
            pathThicknessMax: 3.6,
            pathBrightnessMin: 0.22,
            pathBrightnessMax: 1.0,
            maxSegments: 1000,        // grey (context) tracks
            activeMaxSegments: 5000,  // the active track gets the finest line
            zoomScaleFactor: 30,
            minAltitude: 0.01,
            maxAltitude: 2.5,
            // Tiny altitude offsets fix the draw order so it's always, bottom
            // to top: ocean tiles (surface) -> track line -> arrows -> point
            // (the point is a DOM overlay, already on top). Kept small enough
            // that the lift causes no visible parallax when rotating.
            lineAltitude: 0.00015
        };

        // Depth-averaged current (DAC) arrows. Each glider dive yields one
        // current vector; we draw it as a short arrow at the surfacing point so
        // pilots can see where the flow is strong (NRT piloting).
        const DAC_CONFIG = {
            // Arrows fade with age like the track: oldest are faint/thin grey,
            // newest are solid black and a touch thicker. greyOld is the grey
            // level (0-255) of the oldest arrow; the newest is pure black.
            greyOld: 150,
            alphaOld: 0.45,
            strokeMin: 0.6,       // oldest arrow
            strokeMax: 1.4,       // newest arrow
            scaleKmPerMs: 18,     // arrow length: 1 m/s -> 18 km
            minLenKm: 0.5,
            maxLenKm: 18,
            maxLenSpanFrac: 0.08, // also cap length to a fraction of the track span
            headFrac: 0.3,        // arrowhead length as a fraction of the shaft
            headAngleDeg: 25,
            altitude: 0.0004,     // just above the track line so arrows always
                                  // draw on top of it; small enough to avoid
                                  // visible parallax (see CONFIG.lineAltitude)
        };

        // Build arrow polylines from DAC vectors. Each arrow is a single path
        // (shaft + two barbs) so it renders as one stroked line on the globe.
        // spanKm is the track's extent, used to keep arrows proportionate to
        // the view so they don't dominate a small deployment.
        function buildDacArrows(vectors, spanKm, trackId) {
            const out = [];
            if (!Array.isArray(vectors)) return out;
            const kmToLat = (km) => km / 110.574;
            const maxLen = spanKm > 0
                ? Math.min(DAC_CONFIG.maxLenKm, spanKm * DAC_CONFIG.maxLenSpanFrac)
                : DAC_CONFIG.maxLenKm;
            for (const d of vectors) {
                const lat = Number(d.lat), lon = Number(d.lon);
                const u = Number(d.u), v = Number(d.v);
                const speed = Math.hypot(u, v);
                if (!isFinite(lat) || !isFinite(lon) || !(speed > 0)) continue;

                const lenKm = Math.min(maxLen,
                    Math.max(DAC_CONFIG.minLenKm, speed * DAC_CONFIG.scaleKmPerMs));
                const cosLat = Math.cos(lat * Math.PI / 180) || 1e-6;
                const kmToLon = (km) => km / (111.320 * cosLat);

                const ue = u / speed, vn = v / speed;          // unit east/north
                const tipLat = lat + kmToLat(vn * lenKm);
                const tipLon = lon + kmToLon(ue * lenKm);

                // Arrowhead barbs: rotate the reversed direction by ±headAngle.
                const headKm = lenKm * DAC_CONFIG.headFrac;
                const a = DAC_CONFIG.headAngleDeg * Math.PI / 180;
                const rxE = -ue, ryN = -vn;
                const rot = (ex, ny, ang) => [
                    ex * Math.cos(ang) - ny * Math.sin(ang),
                    ex * Math.sin(ang) + ny * Math.cos(ang),
                ];
                const [b1e, b1n] = rot(rxE, ryN, a);
                const [b2e, b2n] = rot(rxE, ryN, -a);
                const barb1 = { lat: tipLat + kmToLat(b1n * headKm), lng: tipLon + kmToLon(b1e * headKm) };
                const barb2 = { lat: tipLat + kmToLat(b2n * headKm), lng: tipLon + kmToLon(b2e * headKm) };

                const alt = DAC_CONFIG.altitude;
                out.push({
                    kind: 'dac',
                    trackId,
                    speed,
                    t: 1, // filled in below once the count is known
                    coordinates: [
                        { lat, lng: lon, alt },
                        { lat: tipLat, lng: tipLon, alt },
                        { ...barb1, alt },
                        { lat: tipLat, lng: tipLon, alt },
                        { ...barb2, alt },
                    ],
                });
            }
            // t = 0 oldest, 1 newest — matches the track's time fade.
            const last = out.length - 1;
            for (let i = 0; i <= last; i++) out[i].t = last > 0 ? i / last : 1;
            return out;
        }

        function hexToRgb(hex) {
            const h = (hex || '').trim().replace('#', '');
            const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(v, 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function rgbaString({ r, g, b }, a) {
            return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a.toFixed(3)})`;
        }

        function buildSegments(points, trackId, maxSeg = CONFIG.maxSegments) {
            if (points.length < 2) return [];
            // Downsample if needed so we keep render cost bounded. Each segment is a
            // separate globe.gl path object (needed for the old→new fade), so this
            // cap is really a cap on path-object count, not vertices.
            const stride = Math.max(1, Math.ceil((points.length - 1) / maxSeg));
            const sampled = [];
            for (let i = 0; i < points.length; i += stride) sampled.push(points[i]);
            if (sampled[sampled.length - 1] !== points[points.length - 1]) {
                sampled.push(points[points.length - 1]);
            }
            const segs = [];
            const n = sampled.length - 1;
            for (let i = 0; i < n; i++) {
                // t=0 oldest (back of trail), t=1 newest (head).
                const t = n === 0 ? 1 : i / (n - 1 || 1);
                segs.push({
                    coordinates: [sampled[i], sampled[i + 1]],
                    t, trackId
                });
            }
            return segs;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
            }
        });

        let myGlobe = null;
        // Every processed glider is drawn at once: the active one in the accent
        // colour, the rest as grey context lines. allTracks holds the prebuilt
        // geometry for each so switching the active one is a pure recolour +
        // recentre (no refetch, no iframe reload) — see setActiveTrack.
        let allTracks = [];      // [{id, name, segments, formattedPath, view, isNrt, lastLat, lastLon, dacArrows}]
        let activeId = null;     // id of the active (accent-coloured) track
        let hoverId = null;      // id of the grey track under the cursor, or null
        let dacArrows = [];      // the ACTIVE track's DAC arrows (others never show DAC)
        let showDac = false;   // DAC arrows default to off, even when available; user toggles them on
        let _trackView = null;   // active track's {centreLat, centreLng, maxSpan} for re-fitting the camera

        // The single blue "pinned point" — a clicked location on this globe, or one
        // pushed in from another globe / a clicked plot point (see showPin/clearPin).
        // Drawn as an HTML marker (like the live-glider dot, but blue and a touch
        // smaller) in the same html layer as the position dots, plus the coord-bubble
        // readout. Kept in sync across every open globe by the parent.
        let _pinDot = null;   // null or {lat, lng, pin:true}

        function activeTrack() { return allTracks.find(t => t.id === activeId) || null; }

        // ── Surface overlay state (chla / temp / salinity / o2 / ph / biomass / ssh) ──
        // Only one surface field is shown at a time; turning one on replaces the
        // other. Currents (DAC arrows) are separate and coexist.
        const OVERLAY_HALF_DEG_DEFAULT = 0.054; // ~12 km cell fallback if server omits it
        const overlayCache = {};   // key -> fetched {points, p10, p90, date, half_deg, units}
        let activeOverlay = null;  // key of the overlay currently drawn, or null
        let overlayMesh = null;    // single merged THREE mesh of the active overlay
        let overlayLoading = null; // key currently being fetched, or null

        // Each overlay: ramp colour stops (0–1 → [r,g,b]), log/linear scaling,
        // label and units for the legend. `log` suits values spanning orders of
        // magnitude (chlorophyll, biomass); the rest read better linearly.
        const OVERLAYS = [
            { key: 'chla', label: 'Chl-a', units: 'mg/m³', log: true, stops: [
                [0,[237,254,237]],[0.2,[178,228,158]],[0.45,[78,178,68]],[0.7,[18,98,18]],[0.9,[4,48,8]],[1,[0,13,0]] ] },
            { key: 'temp', label: 'Temp', units: '°C', log: false, stops: [
                [0,[12,28,120]],[0.25,[30,110,200]],[0.5,[90,200,180]],[0.7,[240,220,90]],[0.85,[235,120,40]],[1,[150,20,20]] ] },
            { key: 'salinity', label: 'Salinity', units: 'PSU', log: false, stops: [
                [0,[16,32,80]],[0.3,[24,96,140]],[0.55,[34,158,148]],[0.8,[130,206,96]],[1,[250,242,128]] ] },
            { key: 'o2', label: 'O₂', units: 'mmol/m³', log: false, stops: [
                [0,[140,20,20]],[0.3,[220,120,40]],[0.6,[240,222,120]],[1,[40,120,200]] ] },
            { key: 'ph', label: 'pH', units: '', log: false, stops: [
                [0,[180,40,40]],[0.5,[238,238,238]],[1,[40,80,180]] ] },
            { key: 'biomass', label: 'Biomass', units: 'mmol/m³', log: false, stops: [
                [0,[68,1,84]],[0.25,[59,82,139]],[0.5,[33,145,140]],[0.75,[94,201,98]],[1,[253,231,37]] ] },
            { key: 'ssh', label: 'SLA', units: 'm', log: false, stops: [
                [0,[33,68,140]],[0.3,[80,150,210]],[0.5,[238,238,238]],[0.7,[230,140,70]],[1,[150,20,20]] ] },
        ];
        const overlayByKey = Object.fromEntries(OVERLAYS.map(o => [o.key, o]));

        // Position of a value within an overlay's [lo, hi] range, 0–1.
        function overlayT(ov, val, lo, hi) {
            if (ov.log) {
                const l = Math.log10(Math.max(lo, 1e-3)), h = Math.log10(Math.max(hi, 2e-3));
                return Math.max(0, Math.min(1, (Math.log10(Math.max(val, 1e-3)) - l) / (h - l || 1)));
            }
            return Math.max(0, Math.min(1, (val - lo) / (hi - lo || 1)));
        }

        // Interpolate an overlay's colour stops at fraction t → [r,g,b] (0–255).
        function rampRGB(stops, t) {
            let S0 = stops[0], S1 = stops[stops.length - 1];
            for (let i = 0; i < stops.length - 1; i++) {
                if (t >= stops[i][0] && t <= stops[i + 1][0]) { S0 = stops[i]; S1 = stops[i + 1]; break; }
            }
            const f = S0[0] === S1[0] ? 0 : (t - S0[0]) / (S1[0] - S0[0]);
            return [
                S0[1][0] + f * (S1[1][0] - S0[1][0]),
                S0[1][1] + f * (S1[1][1] - S0[1][1]),
                S0[1][2] + f * (S1[1][2] - S0[1][2]),
            ];
        }

        // [r,g,b] in 0–1 for THREE vertex colours.
        function overlayColor01(ov, val, lo, hi) {
            const c = rampRGB(ov.stops, overlayT(ov, val, lo, hi));
            return [c[0] / 255, c[1] / 255, c[2] / 255];
        }

        // CSS `linear-gradient(...)` string spanning an overlay's ramp.
        function rampGradient(ov) {
            const parts = ov.stops.map(([t, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round(t * 100)}%`);
            return `linear-gradient(to right, ${parts.join(', ')})`;
        }

        // What goes into pathsData: every track's segments (grey ones first so
        // the active track paints on top), plus the active track's DAC arrows
        // when shown. Order only changes when the active track changes, so hover
        // restyling never has to re-tessellate the path layer.
        function visiblePaths() {
            const out = [];
            for (const t of allTracks) if (t.id !== activeId) out.push(...t.segments);
            const at = activeTrack();
            if (at) out.push(...activeSegments(at));
            if (showDac && at) out.push(...at.dacArrows);
            return out;
        }

        // The active track draws its line at the finer activeMaxSegments. Built once
        // per track and cached — switching back to a previously-active glider reuses
        // it. Grey context tracks keep their light 400-segment version (t.segments).
        function activeSegments(t) {
            if (!t.segmentsHi) {
                t.segmentsHi = buildSegments(t.formattedPath, t.id, CONFIG.activeMaxSegments);
            }
            return t.segmentsHi;
        }

        // Position dots, one per glider so it's obvious where each one is:
        //  • live (NRT) gliders → a red dot + pulse at the last fix, always shown;
        //  • everyone else → a grey dot at its end position, shown only while NOT
        //    selected (the active track is already obvious in the accent colour).
        function buildPositionDots() {
            const pts = [];
            for (const t of allTracks) {
                const end = t.formattedPath[t.formattedPath.length - 1];
                if (t.isNrt) {
                    const lat = t.lastLat != null ? Number(t.lastLat) : end.lat;
                    const lng = t.lastLon != null ? Number(t.lastLon) : end.lng;
                    pts.push({ lat, lng, trackId: t.id, live: true, active: t.id === activeId });
                } else if (t.id !== activeId) {
                    pts.push({ lat: end.lat, lng: end.lng, trackId: t.id, live: false, active: false });
                }
            }
            // The blue pinned point rides in the same html layer so it re-applies
            // automatically whenever the dots are refreshed (track switch, etc.).
            if (_pinDot) pts.push(_pinDot);
            return pts;
        }

        // Push the dots to the globe: every dot as an HTML marker, but only the
        // live ones also get a pulsing ring.
        function applyDots() {
            if (!myGlobe) return;
            const dots = buildPositionDots();
            myGlobe.htmlElementsData(dots).ringsData(dots.filter(d => d.live));
        }

        // Re-apply the path colour/stroke accessors so the layer recolours
        // without rebuilding geometry (used on hover and active-track changes).
        function refreshPathStyle() {
            if (myGlobe) myGlobe.pathColor(myGlobe.pathColor()).pathStroke(myGlobe.pathStroke());
        }

        // Tell the parent app whether DAC arrows exist for this file and whether
        // they're currently shown, so Jelly can answer/act on "show currents".
        function reportDacStatus() {
            try {
                window.parent && window.parent.postMessage({
                    type: 'dacStatus',
                    available: dacArrows.length > 0,
                    shown: showDac && dacArrows.length > 0,
                }, '*');
            } catch (_) {}
        }

        function updateDacToggle() {
            reportDacStatus();
            const btn = document.getElementById('dacToggle');
            if (!btn) return;
            if (dacArrows.length === 0) {
                btn.style.display = 'none';
                return;
            }
            btn.style.display = 'flex';
            btn.classList.toggle('on', showDac);
            btn.title = (showDac ? 'Hide' : 'Show') +
                ` depth-averaged currents (${dacArrows.length} dives)`;
        }

        // Theme-aware colour for a track segment. The active track keeps the
        // accent (yellow) age-fade; the rest are grey, brighter + bolder while
        // hovered. DAC arrows (active-only) keep their own grey->black fade.
        function segColor(seg) {
            if (seg.kind === 'dac') {
                const t = seg.t == null ? 1 : seg.t;
                const g = Math.round(DAC_CONFIG.greyOld * (1 - t)); // grey -> black
                const a = DAC_CONFIG.alphaOld + (1 - DAC_CONFIG.alphaOld) * t;
                return rgbaString({ r: g, g, b: g }, a);
            }
            if (seg.trackId === activeId) {
                const rgb = hexToRgb(readThemeColors().path);
                const a = CONFIG.pathBrightnessMin + (CONFIG.pathBrightnessMax - CONFIG.pathBrightnessMin) * seg.t;
                // Darken the rgb itself for older segments so they fade even on
                // light backgrounds where alpha alone isn't enough.
                const k = 0.4 + 0.6 * seg.t;
                return rgbaString({ r: rgb.r * k, g: rgb.g * k, b: rgb.b * k }, a);
            }
            // Grey context track. A light theme needs a darker grey to read
            // against the white globe; a dark theme a lighter one. Hover lifts
            // both brightness and opacity.
            const dark = document.documentElement.getAttribute('data-theme') !== 'light';
            const hovered = seg.trackId === hoverId;
            const g = dark ? (hovered ? 235 : 145) : (hovered ? 35 : 110);
            const aBase = hovered ? 0.95 : 0.42;
            const a = aBase * (0.55 + 0.45 * seg.t);   // faint age fade
            return rgbaString({ r: g, g, b: g }, a);
        }

        function segStroke(seg) {
            if (seg.kind === 'dac') {
                return DAC_CONFIG.strokeMin + (DAC_CONFIG.strokeMax - DAC_CONFIG.strokeMin) * (seg.t == null ? 1 : seg.t);
            }
            if (seg.trackId === activeId) {
                return CONFIG.pathThicknessMin + (CONFIG.pathThicknessMax - CONFIG.pathThicknessMin) * seg.t;
            }
            // Grey context tracks stay clearly visible (and easier to hit) rather
            // than tapering to a hairline; hovering bumps them to full thickness.
            if (seg.trackId === hoverId) return CONFIG.pathThicknessMax;
            return 2.0 + 0.6 * seg.t;
        }

        // Turn one raw track ({id,name,path,dac,last_lat,last_lon,is_nrt}) from
        // /api/map_all into prebuilt geometry the globe can draw directly. The
        // heavy work (segment + DAC arrow building, bounds) happens here, once.
        function buildTrack(raw) {
            const formattedPath = (raw.path || [])
                .filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]))
                .map(c => ({ lat: Number(c[0]), lng: Number(c[1]), alt: CONFIG.lineAltitude }));
            if (formattedPath.length === 0) return null;

            let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
            for (const p of formattedPath) {
                if (p.lat < minLat) minLat = p.lat;
                if (p.lat > maxLat) maxLat = p.lat;
                if (p.lng < minLng) minLng = p.lng;
                if (p.lng > maxLng) maxLng = p.lng;
            }
            const cLat = Math.cos((minLat + maxLat) / 2 * Math.PI / 180) || 1e-6;
            const spanKm = Math.hypot((maxLat - minLat) * 110.574, (maxLng - minLng) * 111.320 * cLat);

            return {
                id: raw.id,
                name: raw.name || '',
                formattedPath,
                segments: buildSegments(formattedPath, raw.id),
                dacArrows: buildDacArrows(raw.dac, spanKm, raw.id),
                isNrt: !!raw.is_nrt,
                lastLat: raw.last_lat,
                lastLon: raw.last_lon,
                view: {
                    centreLat: (minLat + maxLat) / 2,
                    centreLng: (minLng + maxLng) / 2,
                    maxSpan: Math.max(maxLat - minLat, maxLng - minLng),
                },
            };
        }

        // Point the camera at the active track. instant=true for the first
        // frame; otherwise a short ease so switching gliders glides over.
        function recentreOnActive(instant) {
            const at = activeTrack();
            if (!myGlobe || !at) return;
            _trackView = at.view;
            const alt = Math.max(0.05, at.view.maxSpan / CONFIG.zoomScaleFactor);
            myGlobe.pointOfView({ lat: at.view.centreLat, lng: at.view.centreLng, altitude: alt }, instant ? 0 : 700);
        }

        async function fetchAllTracks() {
            const res = await fetch('/api/map_all');
            const data = await res.json();
            const tracks = [];
            for (const raw of (data.tracks || [])) {
                const t = buildTrack(raw);
                if (t) tracks.push(t);
            }
            allTracks = tracks;
            return tracks;
        }

        async function initMap() {
            const startTime = performance.now();
            const params = new URLSearchParams(window.location.search);
            activeId = params.get('id') || params.get('filename') || null;

            try {
                await fetchAllTracks();

                if (allTracks.length === 0) {
                    document.getElementById('loadingIcon').textContent = 'error';
                    document.getElementById('loadingIcon').classList.remove('animate-spin');
                    document.getElementById('statusText').textContent = 'No mappable files';
                    return;
                }

                // Fall back to the first track if the requested id isn't mappable.
                if (!activeTrack()) activeId = allTracks[0].id;

                dacArrows = activeTrack().dacArrows;
                updateDacToggle();
                revealOverlayButtons();

                const dots = buildPositionDots();
                const liveDots = dots.filter(d => d.live);

                document.getElementById('statusText').textContent = 'Rendering 3D globe...';
                const tc = readThemeColors();
                myGlobe = Globe()
                    (document.getElementById('globe-container'))
                    .globeTileEngineUrl((x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/${l}/${y}/${x}`)
                    .backgroundColor(tc.bg)
                    .showAtmosphere(true)
                    .atmosphereColor(tc.atmosphere)
                    .pathsData(visiblePaths())
                    .pathPoints('coordinates')
                    .pathPointLat('lat')
                    .pathPointLng('lng')
                    .pathPointAlt(pt => pt.alt || 0)
                    .pathColor(segColor)
                    .pathStroke(segStroke)
                    .ringsData(liveDots)
                    .ringLat('lat')
                    .ringLng('lng')
                    .ringColor(() => (t => `rgba(239,68,68,${(1 - t) * 0.7})`))
                    .ringMaxRadius(2.6)
                    .ringPropagationSpeed(0.6)
                    .ringRepeatPeriod(3500)
                    .htmlElementsData(dots)
                    .htmlLat('lat')
                    .htmlLng('lng')
                    .htmlAltitude(0)
                    .htmlElement(dotEl);

                // Clamp camera distance: prevents zooming out so far the globe
                // shrinks, and zooming in past the tile resolution.
                try {
                    const radius = myGlobe.getGlobeRadius();
                    const controls = myGlobe.controls();
                    controls.minDistance = radius * (1 + CONFIG.minAltitude);
                    controls.maxDistance = radius * (1 + CONFIG.maxAltitude);
                } catch (_) {}

                attachCoordPicker();

                myGlobe.onGlobeReady(() => {
                    document.getElementById('globe-container').style.visibility = 'visible';
                    document.getElementById('overlay').style.display = 'none';
                    window.logRender('3D Globe Frontend', performance.now() - startTime);
                });

                recentreOnActive(true);

                // Let the dashboard know the globe is ready (e.g. for the Map preset).
                try { window.parent.postMessage({ type: 'mapReady' }, '*'); } catch (_) {}

            } catch (err) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = err.message || 'Failed to load map';
            }
        }

        // Hover highlighting uses the same forgiving radius as click selection
        // (nearestTrackAtScreen) rather than globe.gl's exact on-line pick, so a
        // grey track lights up as soon as the cursor is close to it — and the
        // cursor becomes a pointer to signal it's clickable.
        let _coordAimOn = false;   // crosshair pick mode (after picking a coord)
        let _hoverRAF = 0, _hoverXY = null;

        function applyHoverCursor() {
            const el = document.getElementById('globe-container');
            if (el) el.style.cursor = hoverId ? 'pointer' : (_coordAimOn ? 'crosshair' : '');
        }

        function setHover(id) {
            if (id === hoverId) return;
            hoverId = id;
            applyHoverCursor();
            refreshPathStyle();
        }

        // Throttle hover hit-testing to one check per animation frame.
        function scheduleHover(cx, cy) {
            _hoverXY = [cx, cy];
            if (_hoverRAF) return;
            _hoverRAF = requestAnimationFrame(() => {
                _hoverRAF = 0;
                if (_hoverXY) setHover(nearestTrackAtScreen(_hoverXY[0], _hoverXY[1], 14));
            });
        }

        function clearHover() {
            if (_hoverRAF) { cancelAnimationFrame(_hoverRAF); _hoverRAF = 0; }
            _hoverXY = null;
            setHover(null);
        }

        // The dot marking a glider's position — red (with a stronger glow) for a
        // live deployment, grey for a historical one.
        function dotEl(d) {
            const el = document.createElement('div');
            // Blue pinned point: same look as the live dot, blue and a touch smaller.
            if (d.pin) {
                el.style.cssText = 'width:11px;height:11px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 12px rgba(59,130,246,0.85);pointer-events:none;transform:translate(-50%,-50%);';
                return el;
            }
            const c = d.live ? '#ef4444' : '#9ca3af';
            const glow = d.live ? '0 0 12px rgba(239,68,68,0.8)' : '0 0 8px rgba(156,163,175,0.7)';
            const sz = d.live ? 14 : 10;
            el.style.cssText = `width:${sz}px;height:${sz}px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:${glow};pointer-events:none;transform:translate(-50%,-50%);`;
            return el;
        }

        // Switch the active (accent) track without refetching or reloading: clear
        // the active-only overlays/currents (they belong to the old glider's
        // region), repoint DAC at the new track, recolour, refresh the live
        // markers, and recentre. This is what makes selection feel instant.
        function setActiveTrack(id) {
            if (!allTracks.some(t => t.id === id)) {
                // Unknown id (e.g. a file that just finished processing) — refetch
                // the track set, then apply once it's present.
                fetchAllTracks().then(() => {
                    if (allTracks.some(t => t.id === id)) setActiveTrack(id);
                });
                return;
            }
            if (id === activeId) { recentreOnActive(false); return; }

            // Remember whichever layer was open so we can re-fetch it for the new
            // glider's time/location (overlays/currents are mutually exclusive).
            const prevOverlayKey = activeOverlay;
            const prevCurrents = currentsActive;

            activeId = id;
            hoverId = null;
            applyHoverCursor();

            // Tear down the old glider's overlay/currents: their data is for a
            // different region/date, and the caches are keyed only by variable —
            // so drop the meshes AND the cached payloads before refetching.
            if (activeOverlay) { activeOverlay = null; applyOverlay(); }
            if (currentsActive) deactivateCurrents();
            for (const k in overlayCache) delete overlayCache[k];
            currentsData = null;

            dacArrows = activeTrack().dacArrows;
            updateDacToggle();
            if (myGlobe) {
                myGlobe.pathsData(visiblePaths());   // reorder + recolour in one pass
                applyDots();   // active non-live track drops its grey dot; others update
            }
            recentreOnActive(false);
            reportDacStatus();

            // Re-open the same layer for the new glider — fetches its own
            // time/location, showing the loading state meanwhile.
            if (prevOverlayKey) loadOverlay(prevOverlayKey);
            else if (prevCurrents) loadCurrents();
        }

        // Ask the parent app to make `id` the active dataset (drives the top
        // menu); it echoes back a setActive message which runs setActiveTrack.
        function selectTrack(id) {
            try { window.parent.postMessage({ type: 'requestActivate', id }, '*'); } catch (_) {}
        }

        document.getElementById('dacToggle').addEventListener('click', () => {
            showDac = !showDac;
            updateDacToggle();
            if (myGlobe) myGlobe.pathsData(visiblePaths());
        });

        // Re-centre the camera on the track. With opts.whole the camera frames the
        // whole globe (with edge space); otherwise it fits the track tightly plus
        // opts.padding extra altitude.
        function fitView(opts) {
            if (!myGlobe || !_trackView) return;
            opts = opts || {};
            const tight = Math.max(0.05, _trackView.maxSpan / CONFIG.zoomScaleFactor);
            let alt;
            if (opts.whole) {
                alt = 2.4;   // whole globe with a little edge space
            } else {
                const pad = (typeof opts.padding === 'number' && opts.padding >= 0) ? opts.padding : 0.4;
                alt = tight * (1 + pad);
            }
            myGlobe.pointOfView({ lat: _trackView.centreLat, lng: _trackView.centreLng, altitude: alt }, 700);
        }

        // ── Surface overlays: buttons, fetch, render ───────────────────

        // Build ONE mesh holding every cell as a coloured quad. A single
        // geometry (a few thousand triangles) keeps this fast — a per-cell
        // globe.gl polygon layer froze the tab at ~2500 cells.
        const OVERLAY_ALT = 0.00005;  // just above surface, below track (0.00015) and arrows (0.0004)
        const OVERLAY_OPACITY = 0.72;

        function buildOverlayMesh(data, ov, opacity = OVERLAY_OPACITY) {
            const H = (typeof data.half_deg === 'number' && data.half_deg > 0)
                ? data.half_deg : OVERLAY_HALF_DEG_DEFAULT;
            // Two input shapes: scalar overlays arrive as parallel Float32Arrays
            // (lat/lon/val) from the binary payload; currents still pass an array
            // of [lat,lng,val] triples via currentsSpeedData. Read cell k from
            // whichever is present.
            const flat = !!data.val;
            const latA = data.lat, lonA = data.lon, valA = data.val;
            const pts = data.points;
            const n = flat ? valA.length : pts.length;
            const positions = new Float32Array(n * 4 * 3);
            const colors = new Float32Array(n * 4 * 3);
            const index = new Uint32Array(n * 6);
            let vi = 0, ci = 0, ii = 0, base = 0;

            for (let k = 0; k < n; k++) {
                let lat, lng, val;
                if (flat) { lat = latA[k]; lng = lonA[k]; val = valA[k]; }
                else { const t = pts[k]; lat = t[0]; lng = t[1]; val = t[2]; }
                const c = overlayColor01(ov, val, data.p10, data.p90);
                // 4 corners, placed on the globe via getCoords so the patch
                // follows the curvature exactly.
                const corners = [
                    [lat - H, lng - H], [lat - H, lng + H],
                    [lat + H, lng + H], [lat + H, lng - H],
                ];
                for (const [la, lo] of corners) {
                    const p = myGlobe.getCoords(la, lo, OVERLAY_ALT);
                    positions[vi++] = p.x; positions[vi++] = p.y; positions[vi++] = p.z;
                    colors[ci++] = c[0]; colors[ci++] = c[1]; colors[ci++] = c[2];
                }
                index[ii++] = base; index[ii++] = base + 1; index[ii++] = base + 2;
                index[ii++] = base; index[ii++] = base + 2; index[ii++] = base + 3;
                base += 4;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setIndex(new THREE.BufferAttribute(index, 1));
            const mat = new THREE.MeshBasicMaterial({
                vertexColors: true, transparent: true, opacity,
                side: THREE.DoubleSide, depthWrite: false,
            });
            const mesh = new THREE.Mesh(geom, mat);
            // Draw the overlay backdrop before the transparent track/DAC arrows/flow
            // particles so those always paint on top of it. Without this the mesh
            // can sort in front and visually bury the arrows (depthWrite is off, so
            // altitude alone doesn't decide the order for transparent layers).
            mesh.renderOrder = -10;
            return mesh;
        }

        function disposeOverlayMesh() {
            if (!overlayMesh) return;
            if (myGlobe) myGlobe.scene().remove(overlayMesh);
            overlayMesh.geometry.dispose();
            overlayMesh.material.dispose();
            overlayMesh = null;
        }

        function setOverlayBar(ov, lo, hi, date) {
            const fmt = v => Math.abs(v) < 1 ? v.toFixed(2) : v.toFixed(1);
            const u = ov.units ? ' ' + ov.units : '';
            document.getElementById('chla-bar-title').textContent = ov.label;
            document.getElementById('chla-bar-grad').style.background = rampGradient(ov);
            document.getElementById('chla-bar-lo').textContent = fmt(lo) + u;
            document.getElementById('chla-bar-hi').textContent = fmt(hi) + u;
            document.getElementById('chla-bar-date').textContent = date || '';
        }

        // The legend shares the bottom row with the bottom-right layers panel. When
        // the contents don't fit the available width we drop pieces in priority
        // order — first the leading title ("Currents"/"Chl-a"/…), then the date,
        // then hide the bar entirely — rather than truncating text mid-character.
        function fitColourBar() {
            const bar = document.getElementById('chla-bar');
            if (!bar.classList.contains('visible')) return;
            const panel = document.getElementById('layer-panel');
            const collapsed = !panel.classList.contains('ready') || panel.classList.contains('collapsed');
            // Reserve room on the right for the layers panel (less when collapsed).
            bar.style.maxWidth = `calc(100vw - ${collapsed ? 66 : 140}px)`;

            const title = document.getElementById('chla-bar-title');
            const date = document.getElementById('chla-bar-date');
            // Start fully shown, then hide in priority order until it fits.
            title.style.display = '';
            date.style.display = '';
            bar.style.visibility = '';
            const fits = () => bar.scrollWidth <= bar.clientWidth + 1;
            if (fits()) return;
            title.style.display = 'none';
            if (fits()) return;
            date.style.display = 'none';
            if (fits()) return;
            // Genuinely no room left → hide the whole bar (kept laid out so it
            // reappears automatically once there's space again).
            bar.style.visibility = 'hidden';
        }

        // Pull a runnable command out of a hint string, e.g.
        //   "Run: pip install copernicusmarine"            -> "pip install copernicusmarine"
        //   "Run 'copernicusmarine login' in your terminal" -> "copernicusmarine login"
        function extractCommand(hint) {
            if (!hint) return '';
            const quoted = hint.match(/['"`]([^'"`]+)['"`]/);
            if (quoted) return quoted[1].trim();
            const run = hint.match(/[Rr]un:\s*(.+?)\s*$/);
            if (run) return run[1].trim();
            return '';
        }

        function showOverlayError(msg, hint, setup) {
            const box = document.getElementById('chla-err');
            document.getElementById('chla-err-msg').textContent = msg || 'Could not load overlay';
            document.getElementById('chla-err-hint').textContent = hint || '';

            // If the hint names a command (pip install / copernicusmarine login),
            // surface it as a copyable row so the user doesn't have to retype it.
            const cmd = extractCommand(hint);
            const cmdRow = document.getElementById('chla-err-cmd');
            const copyBtn = document.getElementById('chla-err-cmd-copy');
            cmdRow.classList.toggle('show', !!cmd);
            if (cmd) {
                document.getElementById('chla-err-cmd-text').textContent = cmd;
                copyBtn.onclick = async () => {
                    let ok = false;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(cmd); ok = true;
                        }
                    } catch (_) {}
                    if (!ok) {
                        try {
                            const ta = document.createElement('textarea');
                            ta.value = cmd; ta.style.position = 'fixed'; ta.style.opacity = '0';
                            document.body.appendChild(ta); ta.focus(); ta.select();
                            ok = document.execCommand('copy'); ta.remove();
                        } catch (_) {}
                    }
                    copyBtn.classList.toggle('copied', ok);
                    copyBtn.innerHTML = `<span class="material-symbols-outlined">${ok ? 'check' : 'error'}</span>`;
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
                    }, 1500);
                };
            }

            // A command in the hint (install) or a login-required signal means this
            // is a one-time Copernicus setup issue rather than a transient failure.
            const setupAction = cmd || setup === 'login';
            clearTimeout(showOverlayError._t);

            if (setupAction) {
                // Setup help is surfaced through Jelly (with an in-app sign-in form)
                // so it's noticeable and actionable even with the globe closed —
                // don't also show the in-globe toast, which only doubles up on it.
                box.classList.remove('visible');
                try {
                    window.parent && window.parent.postMessage({
                        type: 'overlaySetup',
                        message: msg || 'Could not load Copernicus overlay',
                        hint: hint || '',
                        command: cmd,
                        setup: setup || (cmd ? 'install' : '')
                    }, '*');
                } catch (_) {}
            } else {
                // A transient/one-off failure: show it in-globe and auto-dismiss.
                box.classList.add('visible');
                showOverlayError._t = setTimeout(() => box.classList.remove('visible'), 7000);
            }
        }

        // ── Click-to-pick coordinates (for piloting hand-off) ──────────
        // globe.gl gives {lat, lng} for the clicked point on the globe. Show it
        // top-centre with copy + close. High precision (6 dp ≈ 0.1 m) so the
        // value is usable as a waypoint in piloting software.
        let _lastCoord = null;

        // Normalise longitude into (-180, 180] for a canonical readout.
        function _wrapLon(lon) {
            let x = ((lon + 180) % 360 + 360) % 360 - 180;
            if (x === -180) x = 180;
            return x;
        }

        // globe.gl's built-in onGlobeClick uses a very tight move tolerance, so a
        // click with the faintest drift — common right after rotating, before the
        // hand fully settles — gets treated as a drag and swallowed. We track
        // pointer down/up ourselves with a forgiving threshold and raycast the
        // pointer onto the globe sphere, which is far more reliable.
        let _coordDown = null;   // {x, y} at pointerdown, screen px
        const _COORD_MOVE_TOL = 6;   // px; a release within this of the press = a click

        // Once the user has picked a point, switch the globe to a crosshair so the
        // next point is easier to aim. Any drag (rotate) or closing the bubble
        // drops back to the grab hand (clearing the inline cursor lets the CSS
        // grab/grabbing rules take over again).
        function setCoordAim(on) {
            _coordAimOn = on;
            applyHoverCursor();   // a track under the cursor (pointer) still wins
        }

        function attachCoordPicker() {
            const el = document.getElementById('globe-container');
            if (!el || el._coordPickerWired) return;
            el._coordPickerWired = true;
            el.addEventListener('pointerdown', (e) => {
                _coordDown = { x: e.clientX, y: e.clientY };
            });
            el.addEventListener('pointermove', (e) => {
                // A press that turns into a drag means the user is rotating —
                // leave aim mode right away and stop highlighting so the cursor
                // reads as a grab.
                if (_coordDown && Math.hypot(e.clientX - _coordDown.x, e.clientY - _coordDown.y) > _COORD_MOVE_TOL) {
                    setCoordAim(false);
                    clearHover();
                    return;
                }
                // Otherwise highlight the nearest grey track within the hit radius.
                scheduleHover(e.clientX, e.clientY);
            });
            el.addEventListener('pointerleave', clearHover);
            el.addEventListener('pointerup', (e) => {
                const start = _coordDown;
                _coordDown = null;
                if (!start) return;
                if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > _COORD_MOVE_TOL) return; // a drag/rotate
                // A click on (or near) a grey context track selects it as the
                // active glider, driven from the top menu. The nearest-track
                // fallback adds a forgiving hit radius so a slightly-off click
                // still lands. Clicking the active track or open ocean reads
                // coordinates, as before.
                const pick = (hoverId && hoverId !== activeId)
                    ? hoverId
                    : nearestTrackAtScreen(e.clientX, e.clientY, 14);
                if (pick) { selectTrack(pick); return; }
                // A click on (or very near) the ACTIVE glider's path snaps to that
                // point: the parent then resolves its TIME (shown in the bubble) and
                // marks the matching point on every open plot. An open-ocean click is
                // position-only (onPath false) and leaves the plots alone.
                const snap = nearestActivePointAtScreen(e.clientX, e.clientY, 14);
                const geo = snap || pickGlobeCoords(e.clientX, e.clientY);
                if (geo) {
                    showPin(geo.lat, geo.lng);
                    setCoordAim(true);
                    // Mirror the pin onto every other open globe (and clear any plot
                    // point popup, since this is a new selection) via the parent.
                    try { window.parent.postMessage({ type: 'coordPicked', lat: geo.lat, lng: _wrapLon(geo.lng), onPath: !!snap }, '*'); } catch (_) {}
                }
            });
        }

        // Screen pixel → {lat, lng} by raycasting the pointer onto the globe
        // sphere (centred at the scene origin, radius = globe radius). Returns
        // null when the click misses the globe (i.e. lands on empty space).
        function pickGlobeCoords(clientX, clientY) {
            if (!myGlobe) return null;
            try {
                const el = document.getElementById('globe-container');
                const rect = el.getBoundingClientRect();
                const ndc = new THREE.Vector2(
                    ((clientX - rect.left) / rect.width) * 2 - 1,
                    -(((clientY - rect.top) / rect.height) * 2 - 1)
                );
                const ray = new THREE.Raycaster();
                ray.setFromCamera(ndc, myGlobe.camera());
                const sphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), myGlobe.getGlobeRadius());
                const hit = new THREE.Vector3();
                if (!ray.ray.intersectSphere(sphere, hit)) return null;
                const geo = myGlobe.toGeoCoords({ x: hit.x, y: hit.y, z: hit.z });
                return { lat: geo.lat, lng: geo.lng };
            } catch (_) { return null; }
        }

        // Nearest grey (non-active) track whose line passes within `tolPx` of the
        // point, or null. Gives hover/click a forgiving hit area so you don't have
        // to land dead-on a thin line. Only points on the camera-facing hemisphere
        // count, so a track on the far side of the globe can't be picked through it.
        // Cartesian coords are cached per track (globe radius is fixed) and thinned
        // to a bounded sample, so this is cheap enough to run every hover frame.
        const _tmpV = new THREE.Vector3();
        function ensureCart(t) {
            if (t.cart) return t.cart;
            const stride = Math.max(1, Math.ceil(t.formattedPath.length / 400));
            const cart = [];
            for (let i = 0; i < t.formattedPath.length; i += stride) {
                const p = t.formattedPath[i];
                const w = myGlobe.getCoords(p.lat, p.lng, p.alt || 0);
                cart.push([w.x, w.y, w.z]);
            }
            t.cart = cart;
            return cart;
        }
        // Squared distance from point (px,py) to the segment a→b, in screen px.
        function _distToSeg2(px, py, ax, ay, bx, by) {
            const vx = bx - ax, vy = by - ay;
            const len2 = vx * vx + vy * vy;
            let s = len2 > 0 ? ((px - ax) * vx + (py - ay) * vy) / len2 : 0;
            s = s < 0 ? 0 : s > 1 ? 1 : s;
            const dx = px - (ax + s * vx), dy = py - (ay + s * vy);
            return dx * dx + dy * dy;
        }
        function nearestTrackAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            let best = null, bestD = tolPx * tolPx;
            for (const t of allTracks) {
                if (t.id === activeId) continue;
                // Measure distance to the LINE (each visible segment), not just to the
                // sampled vertices, so the hit area is the continuous track — no gaps
                // between samples, and two close tracks are judged by which line is
                // actually nearer. prevOk breaks the polyline where it dips behind the
                // globe/camera so no false chord is drawn across the horizon.
                let prevX = 0, prevY = 0, prevOk = false;
                for (const c of ensureCart(t)) {
                    let sx = 0, sy = 0, ok = false;
                    // Front-facing (outward normal toward camera) and in front of it?
                    if (c[0] * (ex - c[0]) + c[1] * (ey - c[1]) + c[2] * (ez - c[2]) > 0) {
                        _tmpV.set(c[0], c[1], c[2]).project(cam);
                        if (_tmpV.z <= 1) {
                            sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                            sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                            ok = true;
                        }
                    }
                    if (ok) {
                        if (prevOk) {
                            const d = _distToSeg2(px, py, prevX, prevY, sx, sy);
                            if (d < bestD) { bestD = d; best = t.id; }
                        } else {
                            // Lone visible endpoint — fall back to vertex distance.
                            const dx = sx - px, dy = sy - py, d = dx * dx + dy * dy;
                            if (d < bestD) { bestD = d; best = t.id; }
                        }
                        prevX = sx; prevY = sy; prevOk = true;
                    } else {
                        prevOk = false;
                    }
                }
            }
            return best;
        }

        // Nearest point ON THE ACTIVE track to a screen click, returned as snapped
        // {lat, lng}, or null when the click is further than `tolPx` from the path.
        // Same camera-facing / projection maths as nearestTrackAtScreen, but it
        // walks the active track at full-ish resolution (this runs once per click,
        // not per hover frame) so the snap lands on a real fix.
        function nearestActivePointAtScreen(clientX, clientY, tolPx) {
            if (!myGlobe) return null;
            const at = activeTrack();
            if (!at || !at.formattedPath.length) return null;
            const rect = document.getElementById('globe-container').getBoundingClientRect();
            const px = clientX - rect.left, py = clientY - rect.top;
            const cam = myGlobe.camera();
            const ex = cam.position.x, ey = cam.position.y, ez = cam.position.z;
            const stride = Math.max(1, Math.ceil(at.formattedPath.length / 1500));
            let best = null, bestD = tolPx * tolPx;
            for (let i = 0; i < at.formattedPath.length; i += stride) {
                const p = at.formattedPath[i];
                const w = myGlobe.getCoords(p.lat, p.lng, p.alt || 0);
                // Skip back-facing points so the far side can't be picked through the globe.
                if (w.x * (ex - w.x) + w.y * (ey - w.y) + w.z * (ez - w.z) <= 0) continue;
                _tmpV.set(w.x, w.y, w.z).project(cam);
                if (_tmpV.z > 1) continue;   // behind the camera
                const sx = (_tmpV.x * 0.5 + 0.5) * rect.width;
                const sy = (-_tmpV.y * 0.5 + 0.5) * rect.height;
                const dx = sx - px, dy = sy - py;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = { lat: p.lat, lng: p.lng }; }
            }
            return best;
        }

        function showCoordBubble({ lat, lng }) {
            if (typeof lat !== 'number' || typeof lng !== 'number') return;
            const la = lat, lo = _wrapLon(lng);
            _lastCoord = { lat: la, lng: lo };
            const hemiLat = la >= 0 ? 'N' : 'S';
            const hemiLon = lo >= 0 ? 'E' : 'W';
            document.getElementById('coord-text').textContent =
                `${Math.abs(la).toFixed(6)}° ${hemiLat}, ${Math.abs(lo).toFixed(6)}° ${hemiLon}`;
            setCoordTime(null);   // fresh pin starts time-less; filled in async if on-path
            const copyBtn = document.getElementById('coord-copy');
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
            document.getElementById('coord-bubble').classList.add('visible');
        }

        // Show (or clear, when ms is null) the TIME line under the coords. Set when
        // the click landed on the active glider's path and the parent has resolved
        // the moment the glider was at that spot.
        function setCoordTime(ms) {
            const el = document.getElementById('coord-time');
            if (!el) return;
            if (typeof ms !== 'number' || !isFinite(ms)) { el.textContent = ''; el.style.display = 'none'; return; }
            const d = new Date(ms);
            if (isNaN(d.getTime())) { el.textContent = ''; el.style.display = 'none'; return; }
            const p = n => String(n).padStart(2, '0');
            el.textContent = `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} `
                + `${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
            el.style.display = '';
        }

        // Drop (or move) the blue pin: draw the dot + show the coord readout.
        function showPin(lat, lng) {
            if (typeof lat !== 'number' || typeof lng !== 'number') return;
            _pinDot = { lat, lng, pin: true };
            applyDots();
            showCoordBubble({ lat, lng });
        }

        // Remove the blue pin and its readout from THIS globe (local only — the
        // parent fans the clear out to the other globes / the plot popup).
        function clearPin() {
            _pinDot = null;
            applyDots();
            const bubble = document.getElementById('coord-bubble');
            if (bubble) bubble.classList.remove('visible');
            setCoordTime(null);
            _lastCoord = null;
            setCoordAim(false);
        }

        // The string handed to the clipboard — plain signed decimal "lat, lon",
        // a format most piloting/GIS tools accept. Tweak once we know the target.
        function _coordCopyText() {
            if (!_lastCoord) return '';
            return `${_lastCoord.lat.toFixed(6)}, ${_lastCoord.lng.toFixed(6)}`;
        }

        // Pressing 'x' anywhere clears the pin/marker everywhere — clear locally and
        // tell the parent to fan the clear out to the other globes and the plots.
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'x' || e.key === 'X') && !e.metaKey && !e.ctrlKey && !e.altKey
                && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) {
                clearPin();
                try { window.parent.postMessage({ type: 'clearAllPicks' }, '*'); } catch (_) {}
            }
        });

        (function wireCoordBubble() {
            const bubble = document.getElementById('coord-bubble');
            if (!bubble) return;
            document.getElementById('coord-close').addEventListener('click', () => {
                clearPin();
                // Tell the parent so the pin clears on every other globe and on the
                // plot point popup too.
                try { window.parent.postMessage({ type: 'coordCleared' }, '*'); } catch (_) {}
            });
            const copyBtn = document.getElementById('coord-copy');
            copyBtn.addEventListener('click', async () => {
                const text = _coordCopyText();
                if (!text) return;
                let ok = false;
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text); ok = true;
                    }
                } catch (_) {}
                if (!ok) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.focus(); ta.select();
                        ok = document.execCommand('copy'); ta.remove();
                    } catch (_) {}
                }
                copyBtn.classList.toggle('copied', ok);
                copyBtn.innerHTML = `<span class="material-symbols-outlined">${ok ? 'check' : 'error'}</span>`;
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span>';
                }, 1500);
            });
        })();

        // Build the overlay rows in the sidebar (above Currents). Mutually
        // exclusive: clicking one replaces the active field. Styling is in CSS.
        function buildOverlayButtons() {
            const dac = document.getElementById('dacToggle');
            const body = document.getElementById('layer-body');
            for (const ov of OVERLAYS) {
                const btn = document.createElement('button');
                btn.id = 'ovBtn-' + ov.key;
                btn.className = 'ovBtn';
                const sw = document.createElement('span');
                sw.className = 'ovSwatch';
                sw.style.cssText = 'display:inline-block; width:13px; height:13px; border-radius:3px; background:' + rampGradient(ov) + ';';
                const lbl = document.createElement('span');
                lbl.className = 'ovLabel';
                lbl.textContent = ov.label;
                btn.append(sw, lbl);
                btn.addEventListener('click', () => selectOverlay(ov.key));
                body.insertBefore(btn, dac);   // overlays sit above Currents
            }
        }

        // Reveal the whole Layers sidebar once the map is ready.
        function revealOverlayButtons() {
            document.getElementById('layer-panel').classList.add('ready');
        }

        function updateOverlayButtons() {
            for (const ov of OVERLAYS) {
                const btn = document.getElementById('ovBtn-' + ov.key);
                if (!btn) continue;
                const loading = overlayLoading === ov.key;
                const active = activeOverlay === ov.key;
                btn.classList.toggle('on', active && !loading);
                btn.classList.toggle('loading', loading);
                const sw = btn.querySelector('.ovSwatch');
                const lbl = btn.querySelector('.ovLabel');
                if (loading) {
                    sw.innerHTML = '<span class="material-symbols-outlined spin" style="font-size:13px;line-height:13px;">progress_activity</span>';
                    sw.style.background = 'transparent';
                    lbl.textContent = 'Fetching…';
                    btn.title = 'Fetching ' + ov.label + ' …';
                } else {
                    sw.innerHTML = '';
                    sw.style.background = rampGradient(ov);
                    lbl.textContent = ov.label;
                    btn.title = (active ? 'Hide ' : 'Show ') + ov.label + ' overlay';
                }
            }
        }

        // Draw whatever activeOverlay points at (rebuilding the mesh), or nothing.
        // Returns the mesh-build time in ms (0 if nothing was drawn) so callers
        // can fold the draw cost into the unified overlay timing log.
        function applyOverlay() {
            let drawMs = 0;
            if (myGlobe && activeOverlay && overlayCache[activeOverlay]) {
                try {
                    if (typeof THREE === 'undefined') throw new Error('3D library (THREE) failed to load');
                    disposeOverlayMesh();
                    const ov = overlayByKey[activeOverlay];
                    const d = overlayCache[activeOverlay];
                    const _tDraw = performance.now();
                    overlayMesh = buildOverlayMesh(d, ov);
                    myGlobe.scene().add(overlayMesh);
                    drawMs = performance.now() - _tDraw;
                    setOverlayBar(ov, d.p10, d.p90, d.date);
                } catch (err) {
                    console.error('[overlay] render failed:', err);
                    activeOverlay = null;
                    disposeOverlayMesh();
                    showOverlayError('Could not draw the overlay', err.message);
                }
            } else if (myGlobe) {
                disposeOverlayMesh();
            }
            document.getElementById('chla-bar').classList.toggle('visible', !!activeOverlay && !!overlayCache[activeOverlay]);
            fitColourBar();
            updateOverlayButtons();
            return drawMs;
        }

        // One collapsed, expandable log for a full overlay load: header shows the
        // total click→drawn time; expand for the phase breakdown (locate region,
        // download, maths, transfer, parse, draw). Reuses the plot-timing renderer.
        //   T       — marks gathered in loadOverlay (perf.now() timestamps + server _timing)
        //   drawMs  — mesh-build time from applyOverlay
        function logOverlayTiming(key, T, drawMs) {
            const toMs = (s) => (typeof s === 'number' ? s * 1000 : 0);
            const sp = T.serverPhases || {};
            const total = T.drawn - T.start;
            const serverMs = T.serverTime || 0;                 // X-Process-Time header
            const network = Math.max(0, (T.fetched - T.start) - serverMs);
            const parse = Math.max(0, T.parsed - T.fetched);

            // Server-side phases nest under one "server" bar (= X-Process-Time);
            // logPlotTiming adds an "·other" child for the gzip/serialise remainder.
            const children = [];
            if (sp.locate != null) children.push({ name: 'locate region', ms: toMs(sp.locate), color: '#c4a8f5' });
            if (sp.prep != null)   children.push({ name: 'prepare bbox · date', ms: toMs(sp.prep), color: '#c4a8f5' });
            if (!sp.cache_hit) {
                children.push({ name: 'download field', ms: toMs(sp.download), color: '#f7b955' });
                children.push({ name: 'extract · maths', ms: toMs(sp.extract), color: '#7ec8f7' });
            }

            // >1 server-side open attempt means a dataset/date miss fell back —
            // its cost is folded into "download"; flag it so a fat bar reads right.
            const dl = children.find((c) => c.name === 'download field');
            if (dl && sp.attempts > 1) dl.name = `download field (${sp.attempts} attempts)`;

            const phases = [
                { name: sp.cache_hit ? 'server (cached)' : 'server', ms: serverMs, color: '#c4a8f5', children },
                { name: 'network transfer', ms: network, color: '#7ec8f7' },
                { name: 'parse JSON', ms: parse, color: '#7ec8f7' },
                { name: 'build mesh · draw', ms: drawMs, color: '#86efac' },
            ];
            const note = T.note || `${T.cells.toLocaleString()} cells · ${T.date}`;
            window.logPlotTiming('Overlay · ' + key, phases, total, note, null,
                { badge: 'OVERLAY', badgeBg: '#3b1f6e', badgeColor: '#c4a8f5' });
        }

        // Decode the packed overlay payload (see overlay_logic.pack_overlay_response):
        // uint32 LE header length, JSON header, then lat/lon/val as raw LE float32.
        // Mirrors parsePlotBinary in main_plot.html.
        function decodeOverlayBinary(buf) {
            const dv = new DataView(buf);
            const headerLen = dv.getUint32(0, true);
            const meta = JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(buf, 4, headerLen)));
            const layout = meta.arrays || {};
            delete meta.arrays;
            let off = 4 + headerLen;
            for (const name of Object.keys(layout)) {
                const { dtype, len } = layout[name];
                // slice() copies into a fresh aligned buffer, so the typed view is
                // valid regardless of the header's byte length (still a memcpy, not a parse).
                if (dtype === 'f32') { meta[name] = new Float32Array(buf.slice(off, off + len * 4)); off += len * 4; }
                else if (dtype === 'f64') { meta[name] = new Float64Array(buf.slice(off, off + len * 8)); off += len * 8; }
            }
            return meta;
        }

        async function loadOverlay(key) {
            const fileId = activeId;   // overlays always target the active glider
            if (!fileId) return;

            overlayLoading = key;
            updateOverlayButtons();
            // Marks for the unified OVERLAY timing log (see logOverlayTiming).
            const T = { start: performance.now(), cells: 0 };
            try {
                // The full breakdown is logged below, so skip the generic
                // "API /api/overlay" one-liner to keep it to a single log.
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const res = await fetch(`/api/overlay?id=${encodeURIComponent(fileId)}&var=${key}`);
                T.fetched = performance.now();
                const hdr = res.headers && res.headers.get('X-Process-Time');
                T.serverTime = hdr ? parseFloat(hdr) * 1000 : 0;   // server wall time (ms)
                // Success is a binary octet-stream; an error falls back to JSON.
                const ct = (res.headers.get('Content-Type') || '');
                const data = ct.indexOf('application/json') !== -1
                    ? await res.json()
                    : decodeOverlayBinary(await res.arrayBuffer());
                T.parsed = performance.now();
                if (!res.ok || data.error) {
                    showOverlayError(data.error || `Request failed (${res.status})`, data.hint, data.setup);
                    return;
                }
                if (!data.val || !data.n) {
                    showOverlayError('No ' + overlayByKey[key].label + ' data for this region/date');
                    return;
                }
                overlayCache[key] = data;
                activeOverlay = key;   // newly fetched field becomes the active one
