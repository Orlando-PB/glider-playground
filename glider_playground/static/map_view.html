<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glider Globe View</title>
    <script src="/static/console_log.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />
    <script src="https://unpkg.com/globe.gl@2.46.1/dist/globe.gl.min.js"></script>
    <!-- Standalone THREE (matches globe.gl 2.46.1's bundled three ≥0.154) for the
         CHL-a overlay mesh. Loaded AFTER globe.gl so globe.gl initialises untouched. -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-globe: #121420;
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #6b7280;
            --accent: #FFD700;
            --atmosphere: #ffffff;
        }
        :root[data-theme="light"] {
            --bg-globe: #ffffff;
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #7d8492;
            --accent: #FFD700;
            --atmosphere: #5b9cff;
        }
        body { margin: 0; padding: 0; font-family: 'Inter','Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-globe); overflow: hidden; color: var(--text-primary); }
        #globe-container { width: 100vw; height: 100vh; z-index: 1; cursor: grab; visibility: hidden; }
        #globe-container:active { cursor: grabbing; }
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 50; background: var(--bg-panel); color: var(--text-muted); }
        /* ── Layers sidebar (collapsible, top-right) ─────────────────── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        #layer-panel.collapsed { max-width: none; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body { display: flex; flex-direction: column; gap: 4px; }

        /* Toggle rows inside the sidebar */
        #dacToggle, .ovBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
        }
        #dacToggle:hover, .ovBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        #dacToggle.on, .ovBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovBtn.loading { cursor: progress; }
        .ovBtn .spin { animation: chlaspin 0.9s linear infinite; }
        @keyframes chlaspin { to { transform: rotate(360deg); } }
        .ovSwatch { flex: 0 0 auto; }

        /* CHL-a colourbar — bottom-left, only while a layer is on. */
        #chla-bar {
            display: none; position: absolute; bottom: 10px; left: 10px; z-index: 60;
            align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px;
            font-size: 10px; font-weight: 500; color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 80%, transparent);
            box-shadow: 0 1px 6px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
            max-width: calc(100vw - 20px); box-sizing: border-box;
        }
        #chla-bar.visible { display: flex; }
        #chla-bar-title {
            font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; margin-right: 2px;
        }
        #chla-bar-grad {
            height: 8px; width: 90px; border-radius: 4px; flex: 0 0 auto;
            background: linear-gradient(to right,
                #edfeed 0%, #8ae08a 30%, #1a9a1a 55%, #004d00 78%, #000d00 100%);
        }
        #chla-bar-hi, #chla-bar-lo { font-size: 9px; white-space: nowrap; }
        #chla-bar-date { font-size: 9px; opacity: 0.55; margin-left: 4px; white-space: nowrap; }
        /* Narrow panels: drop the redundant title, then the date, then hide the
           whole bar when there's simply no room. */
        @media (max-width: 340px) { #chla-bar-title { display: none; } }
        @media (max-width: 280px) { #chla-bar-date { display: none; } #chla-bar-grad { width: 70px; } }
        @media (max-width: 230px) { #chla-bar.visible { display: none; } }

        /* CHL-a error toast */
        #chla-err {
            display: none; position: absolute; bottom: 54px; left: 50%;
            transform: translateX(-50%); z-index: 70; max-width: 80%;
            padding: 8px 12px; border-radius: 8px; font-size: 11px;
            color: var(--text-primary);
            background: color-mix(in srgb, var(--bg-panel) 92%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            text-align: center;
        }
        #chla-err.visible { display: block; }
        #chla-err .hint { color: var(--text-muted); margin-top: 4px; font-size: 10px; }
    </style>
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const t = p.get('theme') === 'dark' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay" class="flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon" style="color:#5b9cff;">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Loading map data...</span>
    </div>
    
    <div id="globe-container"></div>

    <!-- Layers sidebar (collapsible). Surface-overlay rows are generated by JS
         into #layer-body, above Currents. Whole panel hidden until map loads. -->
    <div id="layer-panel">
        <button id="layer-header" title="Collapse layers">
            <span class="material-symbols-outlined">layers</span>
            <span id="layer-title">Layers</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body">
            <!-- Depth-averaged current (DAC) toggle. Hidden until a file with DAC loads. -->
            <button id="dacToggle" title="Toggle depth-averaged currents">
                <span class="material-symbols-outlined ovSwatch" style="font-size:14px;">near_me</span>
                Currents
            </button>
        </div>
    </div>

    <!-- CHL-a colourbar legend (shown only while the layer is on). -->
    <div id="chla-bar">
        <span id="chla-bar-title">Chl-a</span>
        <span id="chla-bar-lo">–</span>
        <div id="chla-bar-grad"></div>
        <span id="chla-bar-hi">–</span>
        <span id="chla-bar-date"></span>
    </div>

    <!-- CHL-a error toast -->
    <div id="chla-err"><div id="chla-err-msg"></div><div class="hint" id="chla-err-hint"></div></div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            return {
                bg: (s.getPropertyValue('--bg-globe').trim() || '#0b0d13'),
                path: (s.getPropertyValue('--accent').trim() || '#5b9cff'),
                atmosphere: (s.getPropertyValue('--atmosphere').trim() || '#ffffff')
            };
        }

        const CONFIG = {
            pathThicknessMin: 1.1,
            pathThicknessMax: 3.6,
            pathBrightnessMin: 0.22,
            pathBrightnessMax: 1.0,
            maxSegments: 400,
            zoomScaleFactor: 30,
            minAltitude: 0.01,
            maxAltitude: 2.5,
            // Tiny altitude offsets fix the draw order so it's always, bottom
            // to top: ocean tiles (surface) -> track line -> arrows -> point
            // (the point is a DOM overlay, already on top). Kept small enough
            // that the lift causes no visible parallax when rotating.
            lineAltitude: 0.00015
        };

        // Depth-averaged current (DAC) arrows. Each glider dive yields one
        // current vector; we draw it as a short arrow at the surfacing point so
        // pilots can see where the flow is strong (NRT piloting).
        const DAC_CONFIG = {
            // Arrows fade with age like the track: oldest are faint/thin grey,
            // newest are solid black and a touch thicker. greyOld is the grey
            // level (0-255) of the oldest arrow; the newest is pure black.
            greyOld: 150,
            alphaOld: 0.45,
            strokeMin: 0.6,       // oldest arrow
            strokeMax: 1.4,       // newest arrow
            scaleKmPerMs: 18,     // arrow length: 1 m/s -> 18 km
            minLenKm: 0.5,
            maxLenKm: 18,
            maxLenSpanFrac: 0.08, // also cap length to a fraction of the track span
            headFrac: 0.3,        // arrowhead length as a fraction of the shaft
            headAngleDeg: 25,
            altitude: 0.0004,     // just above the track line so arrows always
                                  // draw on top of it; small enough to avoid
                                  // visible parallax (see CONFIG.lineAltitude)
        };

        // Build arrow polylines from DAC vectors. Each arrow is a single path
        // (shaft + two barbs) so it renders as one stroked line on the globe.
        // spanKm is the track's extent, used to keep arrows proportionate to
        // the view so they don't dominate a small deployment.
        function buildDacArrows(vectors, spanKm) {
            const out = [];
            if (!Array.isArray(vectors)) return out;
            const kmToLat = (km) => km / 110.574;
            const maxLen = spanKm > 0
                ? Math.min(DAC_CONFIG.maxLenKm, spanKm * DAC_CONFIG.maxLenSpanFrac)
                : DAC_CONFIG.maxLenKm;
            for (const d of vectors) {
                const lat = Number(d.lat), lon = Number(d.lon);
                const u = Number(d.u), v = Number(d.v);
                const speed = Math.hypot(u, v);
                if (!isFinite(lat) || !isFinite(lon) || !(speed > 0)) continue;

                const lenKm = Math.min(maxLen,
                    Math.max(DAC_CONFIG.minLenKm, speed * DAC_CONFIG.scaleKmPerMs));
                const cosLat = Math.cos(lat * Math.PI / 180) || 1e-6;
                const kmToLon = (km) => km / (111.320 * cosLat);

                const ue = u / speed, vn = v / speed;          // unit east/north
                const tipLat = lat + kmToLat(vn * lenKm);
                const tipLon = lon + kmToLon(ue * lenKm);

                // Arrowhead barbs: rotate the reversed direction by ±headAngle.
                const headKm = lenKm * DAC_CONFIG.headFrac;
                const a = DAC_CONFIG.headAngleDeg * Math.PI / 180;
                const rxE = -ue, ryN = -vn;
                const rot = (ex, ny, ang) => [
                    ex * Math.cos(ang) - ny * Math.sin(ang),
                    ex * Math.sin(ang) + ny * Math.cos(ang),
                ];
                const [b1e, b1n] = rot(rxE, ryN, a);
                const [b2e, b2n] = rot(rxE, ryN, -a);
                const barb1 = { lat: tipLat + kmToLat(b1n * headKm), lng: tipLon + kmToLon(b1e * headKm) };
                const barb2 = { lat: tipLat + kmToLat(b2n * headKm), lng: tipLon + kmToLon(b2e * headKm) };

                const alt = DAC_CONFIG.altitude;
                out.push({
                    kind: 'dac',
                    speed,
                    t: 1, // filled in below once the count is known
                    coordinates: [
                        { lat, lng: lon, alt },
                        { lat: tipLat, lng: tipLon, alt },
                        { ...barb1, alt },
                        { lat: tipLat, lng: tipLon, alt },
                        { ...barb2, alt },
                    ],
                });
            }
            // t = 0 oldest, 1 newest — matches the track's time fade.
            const last = out.length - 1;
            for (let i = 0; i <= last; i++) out[i].t = last > 0 ? i / last : 1;
            return out;
        }

        function hexToRgb(hex) {
            const h = (hex || '').trim().replace('#', '');
            const v = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
            const n = parseInt(v, 16);
            return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }

        function rgbaString({ r, g, b }, a) {
            return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${a.toFixed(3)})`;
        }

        function buildSegments(points) {
            if (points.length < 2) return [];
            // Downsample if needed so we keep render cost bounded.
            const stride = Math.max(1, Math.ceil((points.length - 1) / CONFIG.maxSegments));
            const sampled = [];
            for (let i = 0; i < points.length; i += stride) sampled.push(points[i]);
            if (sampled[sampled.length - 1] !== points[points.length - 1]) {
                sampled.push(points[points.length - 1]);
            }
            const segs = [];
            const n = sampled.length - 1;
            for (let i = 0; i < n; i++) {
                // t=0 oldest (back of trail), t=1 newest (head).
                const t = n === 0 ? 1 : i / (n - 1 || 1);
                segs.push({
                    coordinates: [sampled[i], sampled[i + 1]],
                    t
                });
            }
            return segs;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
            }
        });

        let myGlobe = null;
        let trackSegments = [];
        let dacArrows = [];
        let showDac = true;

        // ── Surface overlay state (chla / temp / salinity / o2 / ph / biomass) ──
        // Only one surface field is shown at a time; turning one on replaces the
        // other. Currents (DAC arrows) are separate and coexist.
        const OVERLAY_HALF_DEG_DEFAULT = 0.054; // ~12 km cell fallback if server omits it
        const overlayCache = {};   // key -> fetched {points, p10, p90, date, half_deg, units}
        let activeOverlay = null;  // key of the overlay currently drawn, or null
        let overlayMesh = null;    // single merged THREE mesh of the active overlay
        let overlayLoading = null; // key currently being fetched, or null

        // Each overlay: ramp colour stops (0–1 → [r,g,b]), log/linear scaling,
        // label and units for the legend. `log` suits values spanning orders of
        // magnitude (chlorophyll, biomass); the rest read better linearly.
        const OVERLAYS = [
            { key: 'chla', label: 'Chl-a', units: 'mg/m³', log: true, stops: [
                [0,[237,254,237]],[0.2,[178,228,158]],[0.45,[78,178,68]],[0.7,[18,98,18]],[0.9,[4,48,8]],[1,[0,13,0]] ] },
            { key: 'temp', label: 'Temp', units: '°C', log: false, stops: [
                [0,[12,28,120]],[0.25,[30,110,200]],[0.5,[90,200,180]],[0.7,[240,220,90]],[0.85,[235,120,40]],[1,[150,20,20]] ] },
            { key: 'salinity', label: 'Salinity', units: 'PSU', log: false, stops: [
                [0,[16,32,80]],[0.3,[24,96,140]],[0.55,[34,158,148]],[0.8,[130,206,96]],[1,[250,242,128]] ] },
            { key: 'o2', label: 'O₂', units: 'mmol/m³', log: false, stops: [
                [0,[140,20,20]],[0.3,[220,120,40]],[0.6,[240,222,120]],[1,[40,120,200]] ] },
            { key: 'ph', label: 'pH', units: '', log: false, stops: [
                [0,[180,40,40]],[0.5,[238,238,238]],[1,[40,80,180]] ] },
            { key: 'biomass', label: 'Biomass', units: 'mmol/m³', log: false, stops: [
                [0,[68,1,84]],[0.25,[59,82,139]],[0.5,[33,145,140]],[0.75,[94,201,98]],[1,[253,231,37]] ] },
        ];
        const overlayByKey = Object.fromEntries(OVERLAYS.map(o => [o.key, o]));

        // Position of a value within an overlay's [lo, hi] range, 0–1.
        function overlayT(ov, val, lo, hi) {
            if (ov.log) {
                const l = Math.log10(Math.max(lo, 1e-3)), h = Math.log10(Math.max(hi, 2e-3));
                return Math.max(0, Math.min(1, (Math.log10(Math.max(val, 1e-3)) - l) / (h - l || 1)));
            }
            return Math.max(0, Math.min(1, (val - lo) / (hi - lo || 1)));
        }

        // Interpolate an overlay's colour stops at fraction t → [r,g,b] (0–255).
        function rampRGB(stops, t) {
            let S0 = stops[0], S1 = stops[stops.length - 1];
            for (let i = 0; i < stops.length - 1; i++) {
                if (t >= stops[i][0] && t <= stops[i + 1][0]) { S0 = stops[i]; S1 = stops[i + 1]; break; }
            }
            const f = S0[0] === S1[0] ? 0 : (t - S0[0]) / (S1[0] - S0[0]);
            return [
                S0[1][0] + f * (S1[1][0] - S0[1][0]),
                S0[1][1] + f * (S1[1][1] - S0[1][1]),
                S0[1][2] + f * (S1[1][2] - S0[1][2]),
            ];
        }

        // [r,g,b] in 0–1 for THREE vertex colours.
        function overlayColor01(ov, val, lo, hi) {
            const c = rampRGB(ov.stops, overlayT(ov, val, lo, hi));
            return [c[0] / 255, c[1] / 255, c[2] / 255];
        }

        // CSS `linear-gradient(...)` string spanning an overlay's ramp.
        function rampGradient(ov) {
            const parts = ov.stops.map(([t, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${Math.round(t * 100)}%`);
            return `linear-gradient(to right, ${parts.join(', ')})`;
        }

        // What goes into pathsData: always the track, plus DAC arrows when shown.
        function visiblePaths() {
            return showDac ? trackSegments.concat(dacArrows) : trackSegments;
        }

        // Tell the parent app whether DAC arrows exist for this file and whether
        // they're currently shown, so Jelly can answer/act on "show currents".
        function reportDacStatus() {
            try {
                window.parent && window.parent.postMessage({
                    type: 'dacStatus',
                    available: dacArrows.length > 0,
                    shown: showDac && dacArrows.length > 0,
                }, '*');
            } catch (_) {}
        }

        function updateDacToggle() {
            reportDacStatus();
            const btn = document.getElementById('dacToggle');
            if (!btn) return;
            if (dacArrows.length === 0) {
                btn.style.display = 'none';
                return;
            }
            btn.style.display = 'flex';
            btn.classList.toggle('on', showDac);
            btn.title = (showDac ? 'Hide' : 'Show') +
                ` depth-averaged currents (${dacArrows.length} dives)`;
        }

        async function initMap() {
            const startTime = performance.now();
            const params = new URLSearchParams(window.location.search);
            const fileId = params.get('id') || params.get('filename');

            if (!fileId) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = 'No dataset provided';
                return;
            }

            try {
                const response = await fetch(`/api/map?id=${encodeURIComponent(fileId)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const formattedPath = data.path
                    .filter(coords => Array.isArray(coords) && coords.length >= 2 && !isNaN(coords[0]) && !isNaN(coords[1]))
                    .map(coords => ({ lat: Number(coords[0]), lng: Number(coords[1]), alt: CONFIG.lineAltitude }));

                if (formattedPath.length === 0) {
                    document.getElementById('loadingIcon').textContent = 'error';
                    document.getElementById('loadingIcon').classList.remove('animate-spin');
                    document.getElementById('statusText').textContent = 'No LATITUDE/LONGITUDE in this file';
                    return;
                }

                const segments = buildSegments(formattedPath);
                trackSegments = segments;

                // Track extent in km — keeps current arrows scaled to the view.
                let trackSpanKm = 0;
                if (formattedPath.length > 1) {
                    let aLat = Infinity, bLat = -Infinity, aLng = Infinity, bLng = -Infinity;
                    for (const p of formattedPath) {
                        if (p.lat < aLat) aLat = p.lat;
                        if (p.lat > bLat) bLat = p.lat;
                        if (p.lng < aLng) aLng = p.lng;
                        if (p.lng > bLng) bLng = p.lng;
                    }
                    const cLat = Math.cos((aLat + bLat) / 2 * Math.PI / 180) || 1e-6;
                    trackSpanKm = Math.hypot((bLat - aLat) * 110.574, (bLng - aLng) * 111.320 * cLat);
                }
                dacArrows = buildDacArrows(data.dac, trackSpanKm);
                updateDacToggle();

                // Overlays are available for any mappable file.
                revealOverlayButtons();

                // Live-position blob for NRT (Near Real-Time) deployments —
                // the glider is presumed still in the water at this last fix.
                const nrtPoints = [];
                if (data.is_nrt && data.last_lat != null && data.last_lon != null) {
                    nrtPoints.push({
                        lat: Number(data.last_lat),
                        lng: Number(data.last_lon),
                        size: 0.55,
                        color: '#ef4444',
                    });
                }

                const segColor = (seg) => {
                    if (seg.kind === 'dac') {
                        const t = seg.t == null ? 1 : seg.t;
                        const g = Math.round(DAC_CONFIG.greyOld * (1 - t)); // grey -> black
                        const a = DAC_CONFIG.alphaOld + (1 - DAC_CONFIG.alphaOld) * t;
                        return rgbaString({ r: g, g, b: g }, a);
                    }
                    const rgb = hexToRgb(readThemeColors().path);
                    const a = CONFIG.pathBrightnessMin + (CONFIG.pathBrightnessMax - CONFIG.pathBrightnessMin) * seg.t;
                    // Darken the rgb itself for the older segments so they fade
                    // even on light backgrounds where alpha alone isn't enough.
                    const k = 0.4 + 0.6 * seg.t;
                    return rgbaString({ r: rgb.r * k, g: rgb.g * k, b: rgb.b * k }, a);
                };
                const segStroke = (seg) => seg.kind === 'dac'
                    ? DAC_CONFIG.strokeMin + (DAC_CONFIG.strokeMax - DAC_CONFIG.strokeMin) * (seg.t == null ? 1 : seg.t)
                    : CONFIG.pathThicknessMin + (CONFIG.pathThicknessMax - CONFIG.pathThicknessMin) * seg.t;

                if (!myGlobe) {
                    document.getElementById('statusText').textContent = 'Rendering 3D globe...';

                    const tc = readThemeColors();
                    myGlobe = Globe()
                        (document.getElementById('globe-container'))
                        .globeTileEngineUrl((x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/${l}/${y}/${x}`)
                        .backgroundColor(tc.bg)
                        .showAtmosphere(true)
                        .atmosphereColor(tc.atmosphere)
                        .pathsData(visiblePaths())
                        .pathPoints('coordinates')
                        .pathPointLat('lat')
                        .pathPointLng('lng')
                        .pathPointAlt(pt => pt.alt || 0)
                        .pathColor(segColor)
                        .pathStroke(segStroke)
                        .ringsData(nrtPoints)
                        .ringLat('lat')
                        .ringLng('lng')
                        .ringColor(() => (t => `rgba(239,68,68,${(1 - t) * 0.7})`))
                        .ringMaxRadius(2.6)
                        .ringPropagationSpeed(0.6)
                        .ringRepeatPeriod(3500)
                        .htmlElementsData(nrtPoints)
                        .htmlLat('lat')
                        .htmlLng('lng')
                        .htmlAltitude(0)
                        .htmlElement(() => {
                            const el = document.createElement('div');
                            el.style.cssText = 'width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 0 12px rgba(239,68,68,0.8);pointer-events:none;transform:translate(-50%,-50%);';
                            return el;
                        });

                    // Clamp camera distance: prevents zooming out so far the
                    // globe shrinks, and zooming in past the tile resolution.
                    try {
                        const radius = myGlobe.getGlobeRadius();
                        const controls = myGlobe.controls();
                        controls.minDistance = radius * (1 + CONFIG.minAltitude);
                        controls.maxDistance = radius * (1 + CONFIG.maxAltitude);
                    } catch (_) {}

                    myGlobe.onGlobeReady(() => {
                        document.getElementById('globe-container').style.visibility = 'visible';
                        document.getElementById('overlay').style.display = 'none';

                        window.logRender('3D Globe Frontend', performance.now() - startTime);
                    });

                } else {
                    myGlobe.pathsData(visiblePaths())
                           .ringsData(nrtPoints)
                           .htmlElementsData(nrtPoints);
                    document.getElementById('overlay').style.display = 'none';
                }

                let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
                formattedPath.forEach(p => {
                    if (p.lat < minLat) minLat = p.lat;
                    if (p.lat > maxLat) maxLat = p.lat;
                    if (p.lng < minLng) minLng = p.lng;
                    if (p.lng > maxLng) maxLng = p.lng;
                });

                const centreLat = (minLat + maxLat) / 2;
                const centreLng = (minLng + maxLng) / 2;
                const maxSpan = Math.max(maxLat - minLat, maxLng - minLng);
                const dynamicAltitude = Math.max(0.05, maxSpan / CONFIG.zoomScaleFactor);

                myGlobe.pointOfView({ lat: centreLat, lng: centreLng, altitude: dynamicAltitude }, 0);

            } catch (err) {
                document.getElementById('loadingIcon').textContent = 'error';
                document.getElementById('loadingIcon').classList.remove('animate-spin');
                document.getElementById('statusText').textContent = err.message || 'Failed to load map';
            }
        }

        document.getElementById('dacToggle').addEventListener('click', () => {
            showDac = !showDac;
            updateDacToggle();
            if (myGlobe) myGlobe.pathsData(visiblePaths());
        });

        // ── Surface overlays: buttons, fetch, render ───────────────────

        // Build ONE mesh holding every cell as a coloured quad. A single
        // geometry (a few thousand triangles) keeps this fast — a per-cell
        // globe.gl polygon layer froze the tab at ~2500 cells.
        const OVERLAY_ALT = 0.00005;  // just above surface, below track (0.00015) and arrows (0.0004)
        const OVERLAY_OPACITY = 0.72;

        function buildOverlayMesh(data, ov) {
            const H = (typeof data.half_deg === 'number' && data.half_deg > 0)
                ? data.half_deg : OVERLAY_HALF_DEG_DEFAULT;
            const pts = data.points;
            const positions = new Float32Array(pts.length * 4 * 3);
            const colors = new Float32Array(pts.length * 4 * 3);
            const index = new Uint32Array(pts.length * 6);
            let vi = 0, ci = 0, ii = 0, base = 0;

            for (const [lat, lng, val] of pts) {
                const c = overlayColor01(ov, val, data.p10, data.p90);
                // 4 corners, placed on the globe via getCoords so the patch
                // follows the curvature exactly.
                const corners = [
                    [lat - H, lng - H], [lat - H, lng + H],
                    [lat + H, lng + H], [lat + H, lng - H],
                ];
                for (const [la, lo] of corners) {
                    const p = myGlobe.getCoords(la, lo, OVERLAY_ALT);
                    positions[vi++] = p.x; positions[vi++] = p.y; positions[vi++] = p.z;
                    colors[ci++] = c[0]; colors[ci++] = c[1]; colors[ci++] = c[2];
                }
                index[ii++] = base; index[ii++] = base + 1; index[ii++] = base + 2;
                index[ii++] = base; index[ii++] = base + 2; index[ii++] = base + 3;
                base += 4;
            }

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geom.setIndex(new THREE.BufferAttribute(index, 1));
            const mat = new THREE.MeshBasicMaterial({
                vertexColors: true, transparent: true, opacity: OVERLAY_OPACITY,
                side: THREE.DoubleSide, depthWrite: false,
            });
            return new THREE.Mesh(geom, mat);
        }

        function disposeOverlayMesh() {
            if (!overlayMesh) return;
            if (myGlobe) myGlobe.scene().remove(overlayMesh);
            overlayMesh.geometry.dispose();
            overlayMesh.material.dispose();
            overlayMesh = null;
        }

        function setOverlayBar(ov, lo, hi, date) {
            const fmt = v => Math.abs(v) < 1 ? v.toFixed(2) : v.toFixed(1);
            const u = ov.units ? ' ' + ov.units : '';
            document.getElementById('chla-bar-title').textContent = ov.label;
            document.getElementById('chla-bar-grad').style.background = rampGradient(ov);
            document.getElementById('chla-bar-lo').textContent = fmt(lo) + u;
            document.getElementById('chla-bar-hi').textContent = fmt(hi) + u;
            document.getElementById('chla-bar-date').textContent = date || '';
        }

        function showOverlayError(msg, hint) {
            const box = document.getElementById('chla-err');
            document.getElementById('chla-err-msg').textContent = msg || 'Could not load overlay';
            document.getElementById('chla-err-hint').textContent = hint || '';
            box.classList.add('visible');
            clearTimeout(showOverlayError._t);
            showOverlayError._t = setTimeout(() => box.classList.remove('visible'), 7000);
        }

        // Build the overlay rows in the sidebar (above Currents). Mutually
        // exclusive: clicking one replaces the active field. Styling is in CSS.
        function buildOverlayButtons() {
            const dac = document.getElementById('dacToggle');
            const body = document.getElementById('layer-body');
            for (const ov of OVERLAYS) {
                const btn = document.createElement('button');
                btn.id = 'ovBtn-' + ov.key;
                btn.className = 'ovBtn';
                const sw = document.createElement('span');
                sw.className = 'ovSwatch';
                sw.style.cssText = 'display:inline-block; width:13px; height:13px; border-radius:3px; background:' + rampGradient(ov) + ';';
                const lbl = document.createElement('span');
                lbl.className = 'ovLabel';
                lbl.textContent = ov.label;
                btn.append(sw, lbl);
                btn.addEventListener('click', () => selectOverlay(ov.key));
                body.insertBefore(btn, dac);   // overlays sit above Currents
            }
        }

        // Reveal the whole Layers sidebar once the map is ready.
        function revealOverlayButtons() {
            document.getElementById('layer-panel').classList.add('ready');
        }

        function updateOverlayButtons() {
            for (const ov of OVERLAYS) {
                const btn = document.getElementById('ovBtn-' + ov.key);
                if (!btn) continue;
                const loading = overlayLoading === ov.key;
                const active = activeOverlay === ov.key;
                btn.classList.toggle('on', active && !loading);
                btn.classList.toggle('loading', loading);
                const sw = btn.querySelector('.ovSwatch');
                const lbl = btn.querySelector('.ovLabel');
                if (loading) {
                    sw.innerHTML = '<span class="material-symbols-outlined spin" style="font-size:13px;line-height:13px;">progress_activity</span>';
                    sw.style.background = 'transparent';
                    lbl.textContent = 'Fetching…';
                    btn.title = 'Fetching ' + ov.label + ' …';
                } else {
                    sw.innerHTML = '';
                    sw.style.background = rampGradient(ov);
                    lbl.textContent = ov.label;
                    btn.title = (active ? 'Hide ' : 'Show ') + ov.label + ' overlay';
                }
            }
        }

        // Draw whatever activeOverlay points at (rebuilding the mesh), or nothing.
        function applyOverlay() {
            if (myGlobe && activeOverlay && overlayCache[activeOverlay]) {
                try {
                    if (typeof THREE === 'undefined') throw new Error('3D library (THREE) failed to load');
                    disposeOverlayMesh();
                    const ov = overlayByKey[activeOverlay];
                    const d = overlayCache[activeOverlay];
                    overlayMesh = buildOverlayMesh(d, ov);
                    myGlobe.scene().add(overlayMesh);
                    setOverlayBar(ov, d.p10, d.p90, d.date);
                } catch (err) {
                    console.error('[overlay] render failed:', err);
                    activeOverlay = null;
                    disposeOverlayMesh();
                    showOverlayError('Could not draw the overlay', err.message);
                }
            } else if (myGlobe) {
                disposeOverlayMesh();
            }
            document.getElementById('chla-bar').classList.toggle('visible', !!activeOverlay && !!overlayCache[activeOverlay]);
            updateOverlayButtons();
        }

        async function loadOverlay(key) {
            const params = new URLSearchParams(window.location.search);
            const fileId = params.get('id') || params.get('filename');
            if (!fileId) return;

            overlayLoading = key;
            updateOverlayButtons();
            try {
                const t0 = performance.now();
                const res = await fetch(`/api/overlay?id=${encodeURIComponent(fileId)}&var=${key}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    showOverlayError(data.error || `Request failed (${res.status})`, data.hint);
                    return;
                }
                if (!Array.isArray(data.points) || data.points.length === 0) {
                    showOverlayError('No ' + overlayByKey[key].label + ' data for this region/date');
                    return;
                }
                overlayCache[key] = data;
                activeOverlay = key;   // newly fetched field becomes the active one
                console.log(`[${key}] ${data.points.length} cells in ${(performance.now() - t0).toFixed(0)}ms (${data.date})`);
            } catch (err) {
                showOverlayError(err.message || 'Failed to load overlay');
            } finally {
                if (overlayLoading === key) overlayLoading = null;
                applyOverlay();
            }
        }

        // Click handler: toggle off if already active, else switch to this field.
        function selectOverlay(key) {
            if (overlayLoading) return;        // ignore clicks mid-fetch
            if (activeOverlay === key) {
                activeOverlay = null;
                applyOverlay();
            } else if (overlayCache[key]) {
                activeOverlay = key;           // already fetched — switch instantly
                applyOverlay();
            } else {
                loadOverlay(key);
            }
        }

        // Explicit setter for Jelly: show `key` (no toggling), or 'none'/unknown
        // to hide. Unlike selectOverlay, asking for the already-active field is
        // a no-op rather than turning it off.
        function setOverlayByKey(key) {
            if (overlayLoading) return;
            if (!key || key === 'none' || !overlayByKey[key]) {
                if (activeOverlay !== null) { activeOverlay = null; applyOverlay(); }
                return;
            }
            if (activeOverlay === key) return;
            if (overlayCache[key]) { activeOverlay = key; applyOverlay(); }
            else loadOverlay(key);
        }

        // Collapse / expand the Layers sidebar (default open).
        document.getElementById('layer-header').addEventListener('click', () => {
            const panel = document.getElementById('layer-panel');
            const collapsed = panel.classList.toggle('collapsed');
            document.getElementById('layer-header').title = collapsed ? 'Show layers' : 'Collapse layers';
        });

        buildOverlayButtons();
        initMap();

        window.addEventListener('resize', () => {
            if (myGlobe) {
                myGlobe.width(window.innerWidth).height(window.innerHeight);
            }
        });

        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'setTheme') {
                const t = event.data.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (myGlobe) {
                    const tc = readThemeColors();
                    myGlobe.backgroundColor(tc.bg).atmosphereColor(tc.atmosphere);
                    // trigger a re-colour of the existing path (segColor reads theme on each call)
                    myGlobe.pathColor(myGlobe.pathColor());
                }
            } else if (event.data.type === 'setDac') {
                // Parent (e.g. Jelly) toggling the current arrows.
                const want = event.data.show;
                showDac = (typeof want === 'boolean') ? want : !showDac;
                updateDacToggle();
                if (myGlobe) myGlobe.pathsData(visiblePaths());
            } else if (event.data.type === 'queryDac') {
                reportDacStatus();
            } else if (event.data.type === 'setOverlay') {
                // Parent (e.g. Jelly) choosing a surface overlay, or 'none' to hide.
                setOverlayByKey(event.data.overlay);
            }
        });
    </script>
</body>
</html>
