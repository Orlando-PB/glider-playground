<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Glider Plot</title>
    <script src="/static/console_log.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-secondary: #a1a9b8;
            --text-muted: #6b7280;
            --accent: #41658a;
            --border: #262b38;
            --spinner-track: #1f2432;
            --grid: rgba(255,255,255,0.05);
            --title: #e4e7ef;
            --mld-line: #ffffff;
            --anno-bg: rgba(18,20,32,0.85);
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-secondary: #4b525f;
            --text-muted: #7d8492;
            --accent: #41658a;
            --border: #e2e5ec;
            --spinner-track: #e2e5ec;
            --grid: rgba(0,0,0,0.06);
            --title: #171a22;
            --mld-line: #111827;
            --anno-bg: rgba(255,255,255,0.9);
        }
        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; color: var(--text-primary); }
        #plotDiv { width: 100vw; height: 100vh; }
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.3s ease-in-out;
            color: var(--text-muted); font-size: 12px;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--spinner-track); border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #bgSpinner {
            position: absolute; top: 12px; left: 12px;
            width: 16px; height: 16px;
            border: 2px solid var(--spinner-track); border-top: 2px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0; transition: opacity 0.2s ease-in-out;
            pointer-events: none; z-index: 40;
        }
        #bgSpinner.active { opacity: 1; }

        .js-plotly-plot .plotly text { fill: var(--text-secondary) !important; }
    </style>
    <script>
        (function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const theme = params.get('theme') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Fetching data...</span>
    </div>
    <div id="bgSpinner"></div>

    <div id="plotDiv"></div>

    <script>
        const bgSpinner = document.getElementById('bgSpinner');

        // Notify the dashboard parent when this panel is interacted with (click,
        // zoom-drag, touch) so it becomes the active panel. Capture phase so it
        // fires even though Plotly stops propagation on the plot surface.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        let _bgFetchController = null;
        let _pendingBounds = null;
        let _originalPlotData = null;
        let _currentZoom = null;
        let _globalExtent = null;  // full data extent for fallback when autorange hides layout.xaxis.range
        let _suppressRelayout = false;  // true while we are driving relayout programmatically
        let _jellyOverrides = { title: null, colorMode: null, colors: [], lines: [], runningMean: null };

        function computeRunningMean(xs, ys, window, isXDate) {
            const pairs = [];
            for (let i = 0; i < xs.length; i++) {
                const yv = ys[i];
                if (yv === null || yv === undefined || isNaN(yv)) continue;
                const raw = xs[i];
                if (raw === null || raw === undefined) continue;
                const xv = isXDate ? new Date(raw).getTime() : Number(raw);
                if (isNaN(xv)) continue;
                pairs.push([xv, Number(yv)]);
            }
            pairs.sort((a, b) => a[0] - b[0]);
            const n = pairs.length;
            if (!n) return { x: [], y: [] };
            const w = Math.max(2, Math.min(n, Math.floor(window)));
            const half = Math.floor(w / 2);
            const out_x = new Array(n), out_y = new Array(n);
            let sum = 0, count = 0, lo = 0, hi = 0;
            for (let i = 0; i < n; i++) {
                const wantLo = Math.max(0, i - half);
                const wantHi = Math.min(n, i + half + 1);
                while (hi < wantHi) { sum += pairs[hi][1]; count++; hi++; }
                while (lo < wantLo) { sum -= pairs[lo][1]; count--; lo++; }
                out_x[i] = isXDate ? new Date(pairs[i][0]).toISOString() : pairs[i][0];
                out_y[i] = sum / count;
            }
            return { x: out_x, y: out_y };
        }

        const plotConfig = {
            defaultMarkerSize: 8,
            defaultColour: '#41658a'
        };

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            const g = (n, fb) => (s.getPropertyValue(n).trim() || fb);
            return {
                axis:  g('--text-secondary', '#a1a9b8'),
                label: g('--text-primary',   '#cdd3de'),
                grid:  g('--grid',           'rgba(255,255,255,0.05)'),
                line:  g('--border',         '#262b38'),
                title: g('--title',          '#e4e7ef'),
                mld:   g('--mld-line',       '#ffffff'),
                anno:  g('--anno-bg',        'rgba(18,20,32,0.85)')
            };
        }

        const cmoceanPalettes = {
            thermal: ['#042333','#1d1147','#45155e','#781f5e','#a13058','#bd4a38','#cc6c1a','#d5901c','#ddb33a','#e6d274','#e9f6ae'],
            haline:  ['#2a186c','#2a348a','#1d4ca7','#0e65a4','#0d7a95','#1a8e83','#3ea06d','#72ae4a','#b2ba38','#e8c75a','#fdef9a'],
            solar:   ['#331901','#512208','#702912','#8a311b','#a13e20','#b35120','#c06717','#ca8115','#cf9d24','#d6ba4c','#dfd77f'],
            ice:     ['#03051e','#101448','#1c2b69','#27396d','#34517e','#496d97','#6587b0','#87a2c3','#abbdd4','#cfd7e2','#ecedf1'],
            gray:    ['#000000','#1a1a1a','#333333','#4d4d4d','#666666','#808080','#999999','#b3b3b3','#cccccc','#e6e6e6','#ffffff'],
            oxy:     ['#400000','#5c0000','#780000','#808080','#8c8c8c','#979797','#a3a3a3','#aeaeae','#baba10','#dbdb0a','#fdfd00'],
            deep:    ['#fdfecc','#c9e3a9','#93c4a9','#61a1b5','#4883b5','#3d65a8','#3a4c93','#383779','#322263','#2c1050','#190628'],
            dense:   ['#e6f1f7','#c4d8e8','#a6bed9','#8ba4c9','#7489b8','#636c9f','#595388','#55406e','#4e3055','#3f2040','#2e1226'],
            algae:   ['#d6f5d6','#b5e4a9','#87cd80','#59b561','#319a4c','#0c7f3d','#006630','#00521e','#003d10','#002b08','#001b04'],
            matter:  ['#fff7cc','#f9d0a3','#f3a781','#ea8161','#de594e','#c7353f','#a91b3c','#812139','#5a2130','#331821','#160e12'],
            turbid:  ['#e8f6b1','#d3dba0','#bdc091','#a6a682','#928c74','#807364','#6e5a55','#5c4344','#4a2e32','#361a1f','#200910'],
            speed:   ['#fffdcc','#d9e7a5','#add28a','#7fbb7d','#56a377','#37886c','#26695b','#1c4848','#1b2838','#1b1024','#0c0412'],
            amp:     ['#fff5f0','#fcd1b3','#f7a788','#ef7963','#e24c3b','#c53126','#9c2121','#741313','#4d0707','#270303','#0a0000'],
            tempo:   ['#fff6cc','#d3e4bd','#a9d0b3','#80bca9','#5aa69e','#3b8d8f','#27707d','#1a5267','#133749','#0d2130','#050c17'],
            rain:    ['#eefcff','#cbe8f0','#a9d1df','#85b9cc','#68a0c0','#5f85b5','#5a67a3','#504c8c','#3a3a73','#232958','#11133d'],
            phase:   ['#a9795e','#c2656a','#c85080','#ad4ba6','#7652c5','#3f63c6','#1778a2','#0e8765','#3c933e','#7c9136','#a87d40'],
            topo:    ['#2d1451','#36276b','#3e3d7d','#3e5298','#3671a9','#5cb5ae','#cfe5a8','#b3a060','#8c6b35','#5f3d1b','#3b1e0a'],
            balance: ['#181c44','#3952a1','#5f89ca','#99b3d8','#cad4df','#f5f5f5','#e7c6a5','#d09168','#b35d40','#802b24','#400000'],
            delta:   ['#112f46','#164872','#275a8f','#3d7ea0','#5aa294','#97c07d','#e0d18a','#dba04b','#bd4e40','#7d2f38','#3b152f'],
            curl:    ['#150b2e','#2a245d','#3a3f85','#56659f','#8596b5','#c9c9c3','#d4c58b','#bfa05a','#a76b3e','#6d2e3e','#371032'],
            diff:    ['#241c2f','#2c3d6a','#38689e','#6098b8','#a3bfc5','#e2e2e2','#d0b6a9','#b37773','#874441','#51252b','#241414'],
            tarn:    ['#3a1e0b','#7a4622','#b17838','#d3a369','#e2c999','#e2e2d8','#a4c0a5','#6c9c86','#387367','#14494a','#0e2d35']
        };

        const customColorscales = (() => {
            const out = {};
            const stopsToScale = stops => stops.map((c, i) => [i / (stops.length - 1), c]);
            for (const [name, stops] of Object.entries(cmoceanPalettes)) {
                out[name] = stopsToScale(stops);
                out[name + '_r'] = stopsToScale(stops.slice().reverse());
            }
            return out;
        })();

        // Fixed 10-colour palette for integer values 0-9 (phases, QC flags, etc.)
        const DISCRETE_09_COLORS = [
            '#9ca3af',  // 0 – unknown / no QC (grey)
            '#22c55e',  // 1 – ascent / good (green)
            '#3b82f6',  // 2 – descent / probably good (blue)
            '#f97316',  // 3 – surfacing / correctable (orange)
            '#a855f7',  // 4 – parking / bad (purple)
            '#06b6d4',  // 5 – inflection / changed (cyan)
            '#ef4444',  // 6 – propelled (red)
            '#eab308',  // 7 – transition (yellow)
            '#ec4899',  // 8 – (pink)
            '#84cc16',  // 9 – (lime)
        ];

        const SCI_PHASE_NAMES = {
            0: 'Unknown', 1: 'Ascent', 2: 'Descent', 3: 'Surfacing',
            4: 'Parking', 5: 'Inflection', 6: 'Propelled', 7: 'Transition',
            8: 'Phase 8', 9: 'Phase 9',
        };

        const urlParams = new URLSearchParams(window.location.search);
        let plotData = null;

        function getSafeMin(arr) {
            let min = Infinity;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] < min) min = arr[i];
            }
            return min;
        }

        function getSafeMax(arr) {
            let max = -Infinity;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] > max) max = arr[i];
            }
            return max;
        }

        async function initPlot() {
            if (!window.location.search) return;
            
            const startTime = performance.now();
            try {
                const response = await fetch(`/api/plot_data${window.location.search}`);
                plotData = await response.json();

                if (plotData.error) throw new Error(plotData.error);

                renderPlot();

                window.logRender('WebGL Plot', performance.now() - startTime);
                
                const overlay = document.getElementById('overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

            } catch (err) {
                document.getElementById('loadingIcon').style.display = 'none';
                document.getElementById('statusText').style.color = '#ef4444';
                document.getElementById('statusText').textContent = err.message || "Failed to load plot data.";
                console.error(err);
                window.parent.postMessage({ type: 'plotError', message: err.message }, '*');
            }
        }

        function buildJellyShapesAndAnnotations(TC) {
            TC = TC || readThemeColors();
            const shapes = [], annotations = [];
            (_jellyOverrides.lines || []).forEach(ln => {
                const numVal = typeof ln.value === 'number' ? ln.value : parseFloat(ln.value);
                if (isNaN(numVal)) return;
                const color = ln.color || '#ea4335';
                if (ln.axis === 'y') {
                    shapes.push({ type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: numVal, y1: numVal, line: { color, width: 2, dash: 'dash' } });
                    if (ln.label) annotations.push({ xref: 'paper', x: 0.99, xanchor: 'right', yref: 'y', y: numVal, yanchor: 'bottom', text: ln.label, font: { size: 10, color }, bgcolor: TC.anno, bordercolor: color, borderwidth: 1, borderpad: 2, showarrow: false });
                } else {
                    shapes.push({ type: 'line', yref: 'paper', y0: 0, y1: 1, xref: 'x', x0: numVal, x1: numVal, line: { color, width: 2, dash: 'dash' } });
                    if (ln.label) annotations.push({ yref: 'paper', y: 0.99, yanchor: 'top', xref: 'x', x: numVal, xanchor: 'left', text: ln.label, font: { size: 10, color }, bgcolor: TC.anno, bordercolor: color, borderwidth: 1, borderpad: 2, showarrow: false });
                }
            });
            return { shapes, annotations };
        }

        function applyJellyOverrides() {
            const plotDiv = document.getElementById('plotDiv');
            if (!plotDiv || !plotDiv.data) return;

            const TC = readThemeColors();
            const layoutUpdate = {};
            if (_jellyOverrides.title) {
                layoutUpdate.title = { text: _jellyOverrides.title, font: { size: 16, color: TC.title }, x: 0.5, xanchor: 'center', y: 0.98, yanchor: 'top' };
                layoutUpdate['margin.t'] = 40;
                layoutUpdate['margin.l'] = 50;
            } else {
                layoutUpdate.title = null;
                layoutUpdate['margin.t'] = 20;
                layoutUpdate['margin.l'] = 60;
            }
            const { shapes, annotations } = buildJellyShapesAndAnnotations(TC);
            layoutUpdate.shapes = shapes;
            layoutUpdate.annotations = annotations;

            _suppressRelayout = true;
            Plotly.relayout('plotDiv', layoutUpdate).then(() => { _suppressRelayout = false; });

            // Discrete 0-9 mode uses per-value traces with fixed colours; skip restyle.
            if ((urlParams.get('cmap') || 'thermal') === 'discrete_09') {
                applyRunningMeanTrace();
                return;
            }

            // Marker color: restyle the main scatter trace in place so we don't
            // rebuild traces (which would risk dropping the high-res data).
            let cmapName = urlParams.get('cmap') || 'thermal';
            let effectiveColorscale = customColorscales[cmapName] || cmapName;
            let forceSolidColor = null;
            if (_jellyOverrides.colorMode === 'solid' && _jellyOverrides.colors.length >= 1) {
                forceSolidColor = _jellyOverrides.colors[0];
            } else if (_jellyOverrides.colorMode === 'gradient' && _jellyOverrides.colors.length >= 2) {
                effectiveColorscale = [[0, _jellyOverrides.colors[0]], [1, _jellyOverrides.colors[1]]];
            }
            const isQc = plotData.qc_applied && urlParams.get('highlight_qc') === 'true';
            const passIdx = isQc ? 1 : 0;
            let newColor, newScale;
            if (forceSolidColor) {
                newColor = forceSolidColor;
                newScale = null;
            } else if (plotData.c && plotData.c.length) {
                const trace = plotDiv.data[passIdx];
                newColor = (trace && trace.customdata && trace.customdata.length) ? trace.customdata : plotData.c;
                newScale = effectiveColorscale;
            } else {
                newColor = (cmapName === 'black' ? 'black' : plotConfig.defaultColour);
                newScale = null;
            }
            Plotly.restyle('plotDiv', { 'marker.color': [newColor], 'marker.colorscale': [newScale] }, [passIdx]);

            applyRunningMeanTrace();
        }

        function applyRunningMeanTrace() {
            const plotDiv = document.getElementById('plotDiv');
            const traces = plotDiv.data || [];
            let existingIdx = -1;
            for (let i = 0; i < traces.length; i++) {
                if (traces[i] && traces[i]._isRunningMean) { existingIdx = i; break; }
            }

            if (!_jellyOverrides.runningMean) {
                if (existingIdx >= 0) Plotly.deleteTraces('plotDiv', [existingIdx]);
                return;
            }
            if (!plotData.x || !plotData.x.length) return;

            const rm = _jellyOverrides.runningMean;
            const axis = rm.axis || 'y';
            const defaultWin = Math.max(10, Math.floor(plotData.x.length / 100));
            const win = rm.window ? Math.max(3, Math.floor(rm.window)) : defaultWin;
            let traceX, traceY;
            if (axis === 'x') {
                const sm = computeRunningMean(plotData.y, plotData.x.map(v => plotData.is_x_dt ? new Date(v).getTime() : v), win, false);
                traceX = sm.y; traceY = sm.x;
            } else {
                const sm = computeRunningMean(plotData.x, plotData.y, win, !!plotData.is_x_dt);
                traceX = sm.x; traceY = sm.y;
            }

            const newTrace = {
                x: traceX, y: traceY, mode: 'lines', type: 'scattergl',
                line: { color: rm.color || '#ea4335', width: 2.5 },
                name: rm.label || `Running mean (${win})`, showlegend: false, hoverinfo: 'x+y',
                _isRunningMean: true
            };

            if (existingIdx >= 0) {
                Plotly.deleteTraces('plotDiv', [existingIdx]).then(() => Plotly.addTraces('plotDiv', newTrace));
            } else {
                Plotly.addTraces('plotDiv', newTrace);
            }
        }

        function buildLayout(xRange, yRange) {
            const isXDate = plotData.is_x_dt;
            const isInverted = urlParams.get('invert_y') === 'true';
            const axisLabel = (name, units) => {
                if (!name) return '';
                const u = (units || '').trim();
                return (u && u !== 'No units') ? `${name} (${u})` : name;
            };
            const xLabel = isXDate ? '' : axisLabel(plotData.x_var, plotData.x_units);
            const yLabel = axisLabel(plotData.y_var, plotData.y_units);
            const TC = readThemeColors();
            const AXIS_COLOR = TC.axis;
            const AXIS_LABEL_COLOR = TC.label;
            const GRID_COLOR = TC.grid;
            const LINE_COLOR = TC.line;
            const layout = {
                margin: { l: 60, r: 20, t: 20, b: xLabel ? 55 : 50 },
                font: { color: AXIS_COLOR, family: "'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
                xaxis: {
                    type: isXDate ? 'date' : 'linear', showgrid: true, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: xLabel ? { text: xLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined
                },
                yaxis: {
                    showgrid: true, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: yLabel ? { text: yLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined
                },
                hovermode: false,
                plot_bgcolor: 'transparent',
                paper_bgcolor: 'transparent',
                dragmode: 'zoom',
                showlegend: (urlParams.get('cmap') || 'thermal') === 'discrete_09',
                legend: { font: { size: 10, color: AXIS_COLOR }, bgcolor: 'rgba(0,0,0,0)', borderwidth: 0, x: 1.01, xanchor: 'left', y: 1, yanchor: 'top' },
            };

            if (_jellyOverrides.title) {
                layout.title = { text: _jellyOverrides.title, font: { size: 16, color: TC.title }, x: 0.5, xanchor: 'center', y: 0.98, yanchor: 'top' };
                layout.margin = { l: 50, r: 20, t: 40, b: 50 };
            }

            const { shapes: jellyShapes, annotations: jellyAnnotations } = buildJellyShapesAndAnnotations(TC);
            if (jellyShapes.length) layout.shapes = jellyShapes;
            if (jellyAnnotations.length) layout.annotations = jellyAnnotations;

            if (xRange) {
                layout.xaxis.range = xRange;
                layout.xaxis.autorange = false;
            } else if (urlParams.has('zXmin') && urlParams.has('zXmax')) {
                layout.xaxis.range = [urlParams.get('zXmin'), urlParams.get('zXmax')];
                layout.xaxis.autorange = false;
            }

            if (yRange) {
                layout.yaxis.range = isInverted ? [yRange[1], yRange[0]] : yRange;
                layout.yaxis.autorange = false;
            } else if (urlParams.has('zYmin') && urlParams.has('zYmax')) {
                const zYmin = urlParams.get('zYmin');
                const zYmax = urlParams.get('zYmax');
                layout.yaxis.range = isInverted ? [zYmax, zYmin] : [zYmin, zYmax];
                layout.yaxis.autorange = false;
            } else {
                layout.yaxis.autorange = isInverted ? 'reversed' : true;
            }

            return layout;
        }

        function createTraces(data) {
            let cmapName = urlParams.get('cmap') || 'thermal';
            const isDiscrete09 = cmapName === 'discrete_09';

            // --- Discrete 0-9 mode: one trace per integer value, legend instead of colorbar ---
            if (isDiscrete09 && data.c && data.c.length) {
                const isPhaseMode = (urlParams.get('c_var') || '') === 'SCI_PHASE';
                const byVal = new Map();
                for (let i = 0; i < data.x.length; i++) {
                    const raw = data.c[i];
                    if (raw === null || raw === undefined) continue;
                    const v = Math.round(raw);
                    if (v < 0 || v > 9) continue;
                    if (!byVal.has(v)) byVal.set(v, { x: [], y: [] });
                    byVal.get(v).x.push(data.x[i]);
                    byVal.get(v).y.push(data.y[i]);
                }
                const traces = [];
                for (const v of [...byVal.keys()].sort((a, b) => a - b)) {
                    const pts = byVal.get(v);
                    const label = isPhaseMode ? `${v}: ${SCI_PHASE_NAMES[v] || v}` : String(v);
                    traces.push({
                        x: pts.x, y: pts.y, mode: 'markers', type: 'scattergl',
                        name: label,
                        marker: { size: plotConfig.defaultMarkerSize, color: DISCRETE_09_COLORS[v], opacity: 0.85 },
                        showlegend: true, hoverinfo: 'none',
                    });
                }
                return traces;
            }

            let effectiveColorscale = customColorscales[cmapName] || cmapName;
            let forceSolidColor = null;

            if (_jellyOverrides.colorMode === 'solid' && _jellyOverrides.colors.length >= 1) {
                forceSolidColor = _jellyOverrides.colors[0];
            } else if (_jellyOverrides.colorMode === 'gradient' && _jellyOverrides.colors.length >= 2) {
                effectiveColorscale = [[0, _jellyOverrides.colors[0]], [1, _jellyOverrides.colors[1]]];
            }

            let traces = [];

            if (data.qc_applied && urlParams.get('highlight_qc') === 'true') {
                const gx=[], gy=[], gc=[], bx=[], by=[], bc=[];
                for(let i=0; i<data.x.length; i++) {
                    if(data.qc_pass[i]) {
                        gx.push(data.x[i]); gy.push(data.y[i]); 
                        gc.push(data.c ? data.c[i] : null);
                    } else {
                        bx.push(data.x[i]); by.push(data.y[i]);
                        bc.push(data.c ? data.c[i] : null);
                    }
                }
                
                traces.push({
                    x: bx, y: by, mode: 'markers', type: 'scattergl',
                    marker: { size: plotConfig.defaultMarkerSize, color: '#9ca3af', opacity: 0.6 },
                    hoverinfo: 'none', customdata: bc, name: 'Failed QC'
                });
                
                traces.push({
                    x: gx, y: gy, mode: 'markers', type: 'scattergl',
                    marker: {
                        size: plotConfig.defaultMarkerSize,
                        color: forceSolidColor ? forceSolidColor : (gc.length && data.c ? gc : plotConfig.defaultColour), opacity: 0.8,
                        colorscale: forceSolidColor ? undefined : (gc.length && data.c ? effectiveColorscale : undefined),
                        cmin: data.c_min, cmax: data.c_max, showscale: false, cauto: false
                    },
                    hoverinfo: 'none', customdata: gc, name: 'Passed QC'
                });
            } else {
                traces.push({
                    x: data.x, y: data.y, mode: 'markers', type: 'scattergl',
                    marker: {
                        size: plotConfig.defaultMarkerSize,
                        color: forceSolidColor ? forceSolidColor : (data.c && data.c.length ? data.c : (cmapName === 'black' ? 'black' : plotConfig.defaultColour)),
                        opacity: 0.8,
                        colorscale: forceSolidColor ? undefined : (data.c && data.c.length ? effectiveColorscale : undefined),
                        cmin: data.c_min, cmax: data.c_max, showscale: false, cauto: false
                    },
                    hoverinfo: 'none', customdata: data.c || []
                });
            }
            
            if (_jellyOverrides.runningMean && data.x && data.x.length) {
                const rm = _jellyOverrides.runningMean;
                const axis = rm.axis || 'y';
                const defaultWin = Math.max(10, Math.floor(data.x.length / 100));
                const win = rm.window ? Math.max(3, Math.floor(rm.window)) : defaultWin;
                let smoothed;
                if (axis === 'x') {
                    smoothed = computeRunningMean(data.y, data.x.map(v => data.is_x_dt ? new Date(v).getTime() : v), win, false);
                    traces.push({
                        x: smoothed.y, y: smoothed.x, mode: 'lines', type: 'scattergl',
                        line: { color: rm.color || '#ea4335', width: 2.5 },
                        name: rm.label || `Running mean (${win})`, showlegend: false, hoverinfo: 'x+y',
                        _isRunningMean: true
                    });
                } else {
                    smoothed = computeRunningMean(data.x, data.y, win, !!data.is_x_dt);
                    traces.push({
                        x: smoothed.x, y: smoothed.y, mode: 'lines', type: 'scattergl',
                        line: { color: rm.color || '#ea4335', width: 2.5 },
                        name: rm.label || `Running mean (${win})`, showlegend: false, hoverinfo: 'x+y',
                        _isRunningMean: true
                    });
                }
            }

            if (data.mld_x && data.mld_x.length > 0 && data.mld_y && data.mld_y.length > 0) {
                traces.push({
                    x: data.mld_x, y: data.mld_y,
                    mode: 'lines', type: 'scattergl',
                    line: { color: readThemeColors().mld, width: 2.5 },
                    name: 'Mixed Layer Depth',
                    showlegend: false,
                    hoverinfo: 'x+y'
                });
            }

            return traces;
        }

        function renderPlot() {
            _originalPlotData = plotData;

            Plotly.newPlot('plotDiv', createTraces(plotData), buildLayout(null, null), { displayModeBar: false, responsive: true, showAxisDragHandles: false, showAxisRangeEntryBoxes: false, editable: false }).then(function(plotDiv) {
                let xMin, xMax;
                let yMin = getSafeMin(plotData.y);
                let yMax = getSafeMax(plotData.y);

                if (plotData.is_x_dt) {
                    let minTime = Infinity, maxTime = -Infinity;
                    for (let i = 0; i < plotData.x.length; i++) {
                        if (plotData.x[i] !== null) {
                            let t = new Date(plotData.x[i]).getTime();
                            if (t < minTime) minTime = t;
                            if (t > maxTime) maxTime = t;
                        }
                    }
                    xMin = minTime; xMax = maxTime;
                } else {
                    xMin = getSafeMin(plotData.x);
                    xMax = getSafeMax(plotData.x);
                }

                _globalExtent = { xMin, xMax, yMin, yMax };

                window.parent.postMessage({
                    type: 'plotLoaded',
                    globalLimits: { xMin, xMax, yMin, yMax, cMin: plotData.c_min, cMax: plotData.c_max },
                    hasC: plotData.c && plotData.c.length > 0,
                    qc_applied: plotData.qc_applied,
                    stats: plotData.stats
                }, '*');

                plotDiv.on('plotly_hover', function(data){
                    if (data.points.length > 0) {
                        const pt = data.points[0];
                        window.parent.postMessage({
                            type: 'plotHover',
                            point: { x: pt.x, y: pt.y, c: pt.customdata !== undefined ? pt.customdata : null }
                        }, '*');
                    }
                });
            });
            
            const plotDiv = document.getElementById('plotDiv');

            // Explicit double-click reset — Plotly's autorange relayout event isn't always
            // reliably emitted after multiple Plotly.react calls (e.g. after Jelly overlays
            // re-render the plot), so we handle the dbl-click directly to guarantee zoom-out.
            plotDiv.on('plotly_doubleclick', function() {
                _suppressRelayout = false;
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);
                _currentZoom = null;
                if (_originalPlotData) {
                    plotData = _originalPlotData;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                }
                window.parent.postMessage({ type: 'plotZoomed', limits: {} }, '*');
                return false;
            });

            plotDiv.on('plotly_relayout', function(eventData) {
                if (_suppressRelayout) return;
                const hasXRange = 'xaxis.range[0]' in eventData && 'xaxis.range[1]' in eventData;
                const hasYRange = 'yaxis.range[0]' in eventData && 'yaxis.range[1]' in eventData;
                // Plotly fires `'xaxis.autorange': true` for a normal axis and
                // `'yaxis.autorange': 'reversed'` for an inverted axis after
                // a dbl-click — treat any truthy value as "autoranged".
                const xAuto = !!eventData['xaxis.autorange'];
                const yAuto = !!eventData['yaxis.autorange'];

                if (!hasXRange && !hasYRange && !xAuto && !yAuto) return;

                if (_bgFetchController) {
                    _bgFetchController.abort();
                    _bgFetchController = null;
                }

                if (xAuto && yAuto) {
                    clearTimeout(_pendingBounds);
                    _currentZoom = null;
                    if (_originalPlotData) {
                        plotData = _originalPlotData;
                        Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                        window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                    }
                    window.parent.postMessage({ type: 'plotZoomed', limits: {} }, '*');
                    return;
                }

                const layout = plotDiv.layout || {};
                let xMin, xMax, yMin, yMax;

                if (hasXRange) {
                    xMin = eventData['xaxis.range[0]']; xMax = eventData['xaxis.range[1]'];
                } else if (layout.xaxis && Array.isArray(layout.xaxis.range)) {
                    xMin = layout.xaxis.range[0]; xMax = layout.xaxis.range[1];
                }

                if (hasYRange) {
                    yMin = eventData['yaxis.range[0]']; yMax = eventData['yaxis.range[1]'];
                } else if (layout.yaxis && Array.isArray(layout.yaxis.range)) {
                    yMin = layout.yaxis.range[0]; yMax = layout.yaxis.range[1];
                }

                // Fall back to global extent so a y-only or x-only zoom still triggers bgFetch
                if ((xMin === undefined || xMax === undefined) && _globalExtent) {
                    xMin = _globalExtent.xMin; xMax = _globalExtent.xMax;
                }
                if ((yMin === undefined || yMax === undefined) && _globalExtent) {
                    yMin = _globalExtent.yMin; yMax = _globalExtent.yMax;
                }
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                if (typeof yMin === 'number' && typeof yMax === 'number' && yMin > yMax) {
                    const t = yMin; yMin = yMax; yMax = t;
                }

                _currentZoom = { xMin, xMax, yMin, yMax };
                window.parent.postMessage({ type: 'plotZoomed', limits: { xMin, xMax, yMin, yMax } }, '*');

                clearTimeout(_pendingBounds);
                _pendingBounds = setTimeout(() => triggerBgFetch(xMin, xMax, yMin, yMax), 400);
            });
        }

        async function triggerBgFetch(xMin, xMax, yMin, yMax) {
            bgSpinner.classList.add('active'); 
            const params = new URLSearchParams(urlParams);
            
            // Prevent MLD recalculation on zoomed chunks to keep the line static
            params.delete('calc_mld');
            let cVarStr = params.get('c_var') || '';
            if (cVarStr.includes('|mld')) {
                params.set('c_var', cVarStr.replace('|mld', ''));
            }
            
            // Plotly emits datetime axis values as naive strings like
            // '2026-04-25 10:08:25.6638'. The server's data is naive UTC, so
            // we MUST parse these as UTC. `new Date(naiveString).getTime()`
            // interprets them as *local* time, which silently shifts the
            // bounds by the user's UTC offset and makes the bounds query
            // match an offset window of data — visible as "missing points".
            const parseAxisDateAsUTC = (s) => {
                if (typeof s === 'number') return s;
                // Convert "YYYY-MM-DD HH:MM:SS[.fff]" to ISO-8601 UTC.
                const iso = String(s).replace(' ', 'T') + 'Z';
                const t = Date.parse(iso);
                return isNaN(t) ? Date.parse(s) : t;
            };
            const isXDate = plotData.is_x_dt;
            let xMinVal = isXDate ? parseAxisDateAsUTC(xMin) : Number(xMin);
            let xMaxVal = isXDate ? parseAxisDateAsUTC(xMax) : Number(xMax);
            let yMinVal = Number(yMin);
            let yMaxVal = Number(yMax);

            // Canonicalise: server expects min < max. Reversed bounds (e.g. inverted
            // axis or right-to-left drag) would otherwise make the padding tighten
            // the range and the >= / <= filter return zero points.
            if (xMinVal > xMaxVal) { const t = xMinVal; xMinVal = xMaxVal; xMaxVal = t; }
            if (yMinVal > yMaxVal) { const t = yMinVal; yMinVal = yMaxVal; yMaxVal = t; }

            // Expand the requested range generously before fetching the high-res
            // chunk. Reasons points at/near the visible edge can otherwise vanish:
            //   - datetime millisecond truncation in `new Date(str).getTime()`
            //   - float drift between Plotly's reported range and raw data values
            //   - Plotly's axis tick padding shows slightly past the box bounds,
            //     so points appearing "on the axis" can lie just outside it
            //   - server's strict >= / <= filter has no tolerance
            // Plotly still clips visually to the exact zoom range, so over-fetching
            // costs nothing visually — extra points are simply outside the viewport.
            const PAD = 0.15;
            const xPad = Math.abs(xMaxVal - xMinVal) * PAD;
            const yPad = Math.abs(yMaxVal - yMinVal) * PAD;

            params.set('x_min', xMinVal - xPad);
            params.set('x_max', xMaxVal + xPad);
            params.set('y_min', yMinVal - yPad);
            params.set('y_max', yMaxVal + yPad);

            // Exact (unpadded) view bounds so the server can report an honest
            // "Points in view" count that excludes the over-fetched margin.
            params.set('view_x_min', xMinVal);
            params.set('view_x_max', xMaxVal);
            params.set('view_y_min', yMinVal);
            params.set('view_y_max', yMaxVal);

            _bgFetchController = new AbortController();

            try {
                const res = await fetch(`/api/plot_data_bounds?${params.toString()}`, {
                    signal: _bgFetchController.signal
                });
                const newData = await res.json();
                if (newData.error) return;

                // Carry over the static MLD line and var/unit metadata from the full-dataset load
                if (_originalPlotData) {
                    if (_originalPlotData.mld_x && _originalPlotData.mld_x.length > 0) {
                        newData.mld_x = _originalPlotData.mld_x;
                        newData.mld_y = _originalPlotData.mld_y;
                    }
                    if (!newData.x_var) newData.x_var = _originalPlotData.x_var;
                    if (!newData.y_var) newData.y_var = _originalPlotData.y_var;
                    if (!newData.x_units) newData.x_units = _originalPlotData.x_units;
                    if (!newData.y_units) newData.y_units = _originalPlotData.y_units;
                }

                plotData = newData;
                plotData._zoomFetchedFor = { xMin, xMax, yMin, yMax };

                const zoom = _currentZoom;
                const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                const yRange = zoom ? [zoom.yMin, zoom.yMax] : null;

                _suppressRelayout = true;
                Plotly.react('plotDiv', createTraces(newData), buildLayout(xRange, yRange))
                    .then(() => { _suppressRelayout = false; });

                window.parent.postMessage({ type: 'bgFetchComplete', cMin: newData.c_min, cMax: newData.c_max, plotted: newData.plotted }, '*');

            } catch (err) {
                if (err.name !== 'AbortError') console.error('Background fetch failed:', err);
            } finally {
                bgSpinner.classList.remove('active');
            }
        }

        window.addEventListener('message', function(event) {
            if (!event.data) return;
            const msg = event.data;

            if (msg.type === 'setTheme') {
                const t = msg.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (plotData) {
                    const zoom = _currentZoom;
                    const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                    const yRange = zoom ? [zoom.yMin, zoom.yMax] : null;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(xRange, yRange));
                }
                return;
            }

            if (!plotData) return;

            if (msg.type === 'updateLimits') {
                const update = {};
                const hasX = msg.limits.xMin !== undefined && !isNaN(msg.limits.xMin);
                const hasY = msg.limits.yMin !== undefined && !isNaN(msg.limits.yMin);
                const invY = urlParams.get('invert_y') === 'true';
                if (hasX) update['xaxis.range'] = [msg.limits.xMin, msg.limits.xMax];
                if (hasY) update['yaxis.range'] = invY ? [msg.limits.yMax, msg.limits.yMin] : [msg.limits.yMin, msg.limits.yMax];
                if (Object.keys(update).length === 0) return;

                _suppressRelayout = true;
                Plotly.relayout('plotDiv', update).then(() => { _suppressRelayout = false; });

                // Programmatic relayout doesn't always fire plotly_relayout with the flat-indexed
                // keys (xaxis.range[0], xaxis.range[1]) that the drag handler expects, so we
                // directly drive the same zoom flow here: record the new zoom bounds, notify
                // the parent, and schedule a bgFetch for high-res data.
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }

                const gl = _globalExtent || {};
                const xMin = hasX ? msg.limits.xMin : gl.xMin;
                const xMax = hasX ? msg.limits.xMax : gl.xMax;
                const yMin = hasY ? msg.limits.yMin : gl.yMin;
                const yMax = hasY ? msg.limits.yMax : gl.yMax;
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                _currentZoom = { xMin, xMax, yMin, yMax };
                window.parent.postMessage({ type: 'plotZoomed', limits: { xMin, xMax, yMin, yMax } }, '*');

                clearTimeout(_pendingBounds);
                _pendingBounds = setTimeout(() => triggerBgFetch(xMin, xMax, yMin, yMax), 400);
            }
            
            if (msg.type === 'updateColour' && !isNaN(msg.limits.cMin)) {
                // If dual trace, update the second trace (Passed QC)
                const traceIdx = (plotData.qc_applied && urlParams.get('highlight_qc') === 'true') ? 1 : 0;
                // Ack once the restyle has actually been applied and painted, so the
                // parent paces the next slider value to this plot's real redraw cost
                // (keeps the slider smooth instead of flooding it with restyles).
                const ackColour = () => requestAnimationFrame(() => {
                    try { window.parent.postMessage({ type: 'colourUpdated' }, '*'); } catch (_) {}
                });
                const p = Plotly.restyle('plotDiv', { 'marker.cmin': [msg.limits.cMin], 'marker.cmax': [msg.limits.cMax] }, [traceIdx]);
                if (p && p.then) p.then(ackColour); else ackColour();
            }
            
            if (msg.type === 'downloadPlot') {
                Plotly.downloadImage('plotDiv', {
                    format: 'png',
                    width: 1200,
                    height: 800,
                    filename: `glider_plot_${urlParams.get('x')}_vs_${urlParams.get('y')}`
                });
            }

            if (msg.type === 'jellyOverrides') {
                const ov = msg.overrides || {};
                if ('title' in ov) _jellyOverrides.title = ov.title || null;
                if ('colorMode' in ov) {
                    _jellyOverrides.colorMode = ov.colorMode;
                    _jellyOverrides.colors = Array.isArray(ov.colors) ? ov.colors : [];
                }
                if (Array.isArray(ov.lines)) {
                    const resolved = [];
                    ov.lines.forEach(ln => {
                        if (ln && (ln.stat === 'mean' || ln.stat === 'median')) {
                            const axis = ln.axis || 'y';
                            const arr = axis === 'y' ? plotData.y : plotData.x;
                            const nums = [];
                            for (let i = 0; i < arr.length; i++) {
                                const v = axis === 'x' && plotData.is_x_dt ? (arr[i] !== null ? new Date(arr[i]).getTime() : null) : arr[i];
                                if (v !== null && !isNaN(v)) nums.push(v);
                            }
                            if (!nums.length) return;
                            let val;
                            if (ln.stat === 'mean') val = nums.reduce((a,b)=>a+b,0)/nums.length;
                            else { nums.sort((a,b)=>a-b); val = nums.length % 2 ? nums[(nums.length-1)/2] : 0.5*(nums[nums.length/2 -1]+nums[nums.length/2]); }
                            resolved.push({ axis, value: val, label: ln.label || (ln.stat === 'mean' ? 'Mean' : 'Median'), color: ln.color || '#34a853' });
                        } else if (ln && typeof ln.value !== 'undefined') {
                            resolved.push({ axis: ln.axis || 'y', value: ln.value, label: ln.label || '', color: ln.color || '#ea4335' });
                        }
                    });
                    if (ov.replaceLines) _jellyOverrides.lines = resolved;
                    else _jellyOverrides.lines = (_jellyOverrides.lines || []).concat(resolved);
                }
                if ('runningMean' in ov) _jellyOverrides.runningMean = ov.runningMean;
                if (ov.clear) _jellyOverrides = { title: null, colorMode: null, colors: [], lines: [], runningMean: null };

                applyJellyOverrides();
            }

            if (msg.type === 'autoColour') {
                if (!plotData || !plotData.c || !plotData.c.length) return;

                const isXDate = plotData.is_x_dt;
                const parseDate = (d) => typeof d === 'string' ? new Date(d.replace(' ', 'T')).getTime() : new Date(d).getTime();

                let calcCMin = Infinity, calcCMax = -Infinity;

                if (msg.bounds) {
                    const xMinNum = isXDate ? parseDate(msg.bounds.xMin) : parseFloat(msg.bounds.xMin);
                    const xMaxNum = isXDate ? parseDate(msg.bounds.xMax) : parseFloat(msg.bounds.xMax);
                    const yMinNum = parseFloat(msg.bounds.yMin);
                    const yMaxNum = parseFloat(msg.bounds.yMax);

                    const SAMPLE_STEP = Math.max(1, Math.floor(plotData.x.length / 5000));
                    for (let i = 0; i < plotData.x.length; i += SAMPLE_STEP) {
                        if (plotData.x[i] === null || plotData.y[i] === null || plotData.c[i] === null) continue;
                        const px = isXDate ? parseDate(plotData.x[i]) : plotData.x[i];
                        const py = plotData.y[i];
                        if (px >= xMinNum && px <= xMaxNum && py >= yMinNum && py <= yMaxNum) {
                            const pc = plotData.c[i];
                            if (pc < calcCMin) calcCMin = pc;
                            if (pc > calcCMax) calcCMax = pc;
                        }
                    }
                }

                const newCMin = calcCMin !== Infinity ? calcCMin : plotData.c_min;
                const newCMax = calcCMax !== -Infinity ? calcCMax : plotData.c_max;

                const traceIdx = (plotData.qc_applied && urlParams.get('highlight_qc') === 'true') ? 1 : 0;
                Plotly.restyle('plotDiv', { 'marker.cmin': [newCMin], 'marker.cmax': [newCMax] }, [traceIdx]);
                window.parent.postMessage({ type: 'autoColourResult', cMin: newCMin, cMax: newCMax }, '*');
            }
        });

        initPlot();
    </script>
</body>
</html>
