            window.parent.postMessage({ type: 'bgFetchComplete',
                cMin: r.cMin, cMax: r.cMax, plotted: r.plotted }, '*');
            renderProfileSidebar();
            return true;
        }

        async function triggerBgFetch(xMin, xMax, yMin, yMax) {
            bgSpinner.classList.add('active'); 
            const params = new URLSearchParams(urlParams);
            
            const isXDate = plotData.is_x_dt;
            let xMinVal, xMaxVal;
            // For a datetime x-axis, read the visible window straight from the axis
            // pixel scale (p2c) instead of parsing Plotly's emitted range strings.
            // With numeric epoch-ms data, Plotly formats those range strings in the
            // BROWSER'S LOCAL timezone, but the server's data is UTC — parsing them
            // (as UTC or via r2l) shifted the fetched window by the local offset
            // (e.g. BST = +1h), so a sub-hour zoom fetched an empty, hour-off window.
            // p2c is pure linear math (pixels → data ms): no Date, no timezone, so it
            // always matches the ms space the points were plotted in.
            const _gd = document.getElementById('plotDiv');
            const _xa = isXDate && _gd && _gd._fullLayout ? _gd._fullLayout.xaxis : null;
            if (_xa && typeof _xa.p2c === 'function' && _xa._length) {
                const a = Number(_xa.p2c(0)), b = Number(_xa.p2c(_xa._length));
                xMinVal = Math.min(a, b); xMaxVal = Math.max(a, b);
            } else {
                xMinVal = isXDate ? axisXToMs(xMin) : Number(xMin);
                xMaxVal = isXDate ? axisXToMs(xMax) : Number(xMax);
            }

            let yMinVal = Number(yMin);
            let yMaxVal = Number(yMax);

            // Canonicalise: server expects min < max. Reversed bounds (e.g. inverted
            // axis or right-to-left drag) would otherwise make the padding tighten
            // the range and the >= / <= filter return zero points.
            if (xMinVal > xMaxVal) { const t = xMinVal; xMinVal = xMaxVal; xMaxVal = t; }
            if (yMinVal > yMaxVal) { const t = yMinVal; yMinVal = yMaxVal; yMaxVal = t; }

            // Expand the requested range generously before fetching the high-res
            // chunk. Reasons points at/near the visible edge can otherwise vanish:
            //   - datetime millisecond truncation in `new Date(str).getTime()`
            //   - float drift between Plotly's reported range and raw data values
            //   - Plotly's axis tick padding shows slightly past the box bounds,
            //     so points appearing "on the axis" can lie just outside it
            //   - server's strict >= / <= filter has no tolerance
            // Plotly still clips visually to the exact zoom range, so over-fetching
            // costs nothing visually — extra points are simply outside the viewport.
            const PAD = 0.15;
            const xPad = Math.abs(xMaxVal - xMinVal) * PAD;
            const yPad = Math.abs(yMaxVal - yMinVal) * PAD;

            params.set('x_min', xMinVal - xPad);
            params.set('x_max', xMaxVal + xPad);
            params.set('y_min', yMinVal - yPad);
            params.set('y_max', yMaxVal + yPad);

            // Exact (unpadded) view bounds so the server can report an honest
            // "Points in view" count that excludes the over-fetched margin.
            params.set('view_x_min', xMinVal);
            params.set('view_x_max', xMaxVal);
            params.set('view_y_min', yMinVal);
            params.set('view_y_max', yMaxVal);

            _bgFetchController = new AbortController();

            try {
                const res = await fetch(`/api/plot_data_bounds?${params.toString()}`, {
                    signal: _bgFetchController.signal
                });
                const newData = await res.json();
                if (newData.error) return;

                // Carry over var/unit metadata from the full-dataset load
                if (_originalPlotData) {
                    if (!newData.x_var) newData.x_var = _originalPlotData.x_var;
                    if (!newData.y_var) newData.y_var = _originalPlotData.y_var;
                    if (!newData.x_units) newData.x_units = _originalPlotData.x_units;
                    if (!newData.y_units) newData.y_units = _originalPlotData.y_units;
                }

                plotData = newData;
                plotData._zoomFetchedFor = { xMin, xMax, yMin, yMax };
                // Remember whether this chunk is the full raw set for its (padded)
                // fetched box, and the box itself in numeric ms/value space. A later
                // zoom-IN that lands inside this box, on a complete chunk, needs no
                // refetch — see _chunkCovers / the relayout + updateLimits fast paths.
                plotData._complete = !!newData.complete;
                plotData._fetchBox = { xMin: xMinVal - xPad, xMax: xMaxVal + xPad,
                                       yMin: yMinVal - yPad, yMax: yMaxVal + yPad };

                const zoom = _currentZoom;
                const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                // yAuto marks an x-only zoom (e.g. a synced time-axis update): keep
                // the y axis autoranged rather than pinning it to the full extent.
                const yRange = (zoom && !zoom.yAuto) ? [zoom.yMin, zoom.yMax] : null;

                _suppressRelayout = true;
                Plotly.react('plotDiv', createTraces(newData), buildLayout(xRange, yRange))
                    .then(() => { _suppressRelayout = false; });
                if (window.logRedraw) window.logRedraw('zoom (hi-res)', (newData.x && newData.x.length) || 0);

                window.parent.postMessage({ type: 'bgFetchComplete', cMin: newData.c_min, cMax: newData.c_max, plotted: newData.plotted }, '*');

            } catch (err) {
                if (err.name !== 'AbortError') console.error('Background fetch failed:', err);
            } finally {
                bgSpinner.classList.remove('active');
            }
        }

        window.addEventListener('message', function(event) {
            if (!event.data) return;
            const msg = event.data;

            if (msg.type === 'replot') {
                // Re-drive this already-loaded iframe with a fresh param set instead of
                // a full src navigation. renderPlot's Plotly.react reuses the WebGL
                // context, so we skip the HTML refetch + Plotly re-eval + context/shader
                // rebuild a navigation pays (~190ms/plot). Reset all per-plot state so
                // the new plot starts clean (no stale zoom / base record / in-flight fetch).
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);
                hidePointBubble();   // the old pin's point won't survive the new data
                urlParams = new URLSearchParams(msg.params || '');
                _multiview = urlParams.get('multiview') === '1';
                _profileSidebar = urlParams.get('profile_sidebar') === 'true';
                _currentZoom = null; _originalPlotData = null; _suppressRelayout = false;
                _cbarMin = null; _cbarMax = null;
                _profileFetchSeq++;   // supersede any in-flight profile render
                _reused = true;
                if (typeof msg.gpt0 === 'number') _gpClick = msg.gpt0;
                if (typeof msg.gpt1 === 'number') _gpSrcSet = msg.gpt1;
                _gpScriptStart = performance.timeOrigin + performance.now();   // no nav → load+parse ~0
                // Re-show the loading overlay for the brief fetch+draw (matches a reload).
                const ov = document.getElementById('overlay');
                if (ov) { ov.style.display = 'flex'; ov.style.opacity = '1'; }
                document.getElementById('statusText').style.color = '';
                document.getElementById('loadingIcon').style.display = '';
                initPlot();
                return;
            }

            if (msg.type === 'setTheme') {
                const t = msg.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (plotData) {
                    const zoom = _currentZoom;
                    const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                    const yRange = zoom ? [zoom.yMin, zoom.yMax] : null;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(xRange, yRange));
                }
                return;
            }

            // Parent clearing the point popup (X pressed on a globe bubble, or a new
            // selection made elsewhere). Independent of plotData, so handle it here.
            if (msg.type === 'clearPointPopup') { hidePointBubble(); return; }

            // A sibling plot picked a point — mirror it here by matching time.
            if (msg.type === 'selectPointByTime') { selectPointByTime(msg.timeMs); return; }

            if (!plotData) return;

            if (msg.type === 'updateLimits') {
                // A datetime x-axis reports its range as date strings (e.g.
                // '2026-04-25 10:08:25.6638'), which Plotly accepts directly — so
                // only number-type bounds are validated with isNaN. (This path is
                // used by the parent's "align time axes" feature, where x bounds
                // arrive as date strings copied from another plot's zoom.)
                const isValidBound = (v) => v !== undefined && v !== null && (typeof v === 'number' ? !isNaN(v) : true);
                const hasX = isValidBound(msg.limits.xMin) && isValidBound(msg.limits.xMax);
                const hasY = isValidBound(msg.limits.yMin) && isValidBound(msg.limits.yMax);
                const invY = urlParams.get('invert_y') === 'true';
                if (!hasX && !hasY) return;

                // Parse an axis bound to a comparable number (ms for date axes), via
                // Plotly's own conversion so it matches the plotted data's ms space.
                const toNumX = axisXToMs;
                const gl = _globalExtent || {};

                // Numeric incoming x-range, for "is this a zoom-out?" comparisons.
                let reqXMin, reqXMax;
                if (hasX) {
                    reqXMin = plotData.is_x_dt ? toNumX(msg.limits.xMin) : Number(msg.limits.xMin);
                    reqXMax = plotData.is_x_dt ? toNumX(msg.limits.xMax) : Number(msg.limits.xMax);
                    if (reqXMin > reqXMax) { const t = reqXMin; reqXMin = reqXMax; reqXMax = t; }
                }

                // Decide whether the full downsampled record (_originalPlotData,
                // already in memory) should be shown right now instead of the
                // currently-displayed high-res chunk:
                //   coversFull — the incoming x-range spans our whole data extent
                //     (a synced double-click reset / "show all"). The base record
                //     IS the zoomed-out data, so no server fetch is needed at all.
                //   needBase   — we're showing a narrower zoom chunk that doesn't
                //     cover the new (wider) range, so relayouting it alone would
                //     leave a stale partial slice stretched across the axis until
                //     a fetch trickles in. Drop back to the full record instantly
                //     as a stopgap; the high-res fetch below still upgrades it.
                let coversFull = false, needBase = false;
                if (hasX && _originalPlotData && gl.xMin !== undefined && gl.xMax !== undefined) {
                    const span = Math.abs(gl.xMax - gl.xMin) || 1;
                    const tol = span * 0.01;
                    if (!hasY && reqXMin <= gl.xMin + tol && reqXMax >= gl.xMax - tol) coversFull = true;
                    const c = plotData._zoomFetchedFor;
                    if (c) {
                        const cMin = plotData.is_x_dt ? toNumX(c.xMin) : Number(c.xMin);
                        const cMax = plotData.is_x_dt ? toNumX(c.xMax) : Number(c.xMax);
                        if (reqXMin < cMin || reqXMax > cMax) needBase = true;
                    }
                }

                // If the driven x-range already matches what's on screen (within an
                // imperceptible 0.1% of the span) and nothing else needs to change,
                // skip the relayout entirely. This is the common on-load case: a
                // freshly-drawn plot already padded to the union range (see buildLayout)
                // gets driven to that same range — so there's no point paying for a
                // WebGL redraw or risking the faint shift it would cause. We bail before
                // aborting any in-flight fetch, since that fetch is for the same range.
                if (hasX && !hasY && !needBase) {
                    const pd = document.getElementById('plotDiv');
                    const curR = pd && pd._fullLayout && pd._fullLayout.xaxis && pd._fullLayout.xaxis.range;
                    if (curR) {
                        const c0 = toNumX(curR[0]), c1 = toNumX(curR[1]);
                        const lo = Math.min(c0, c1), hi = Math.max(c0, c1);
                        const span = Math.abs(hi - lo) || 1;
                        if (Math.abs(reqXMin - lo) < span * 0.001 && Math.abs(reqXMax - hi) < span * 0.001) return;
                    }
                }

                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);

                const showBase = coversFull || needBase;
                // Was this panel already displaying the full base record (vs a zoomed
                // high-res chunk)? If so, showing the base at a new range is just an axis
                // move — no trace data changes — so we can relayout instead of rebuilding.
                const wasBase = plotData === _originalPlotData;
                if (showBase && !wasBase) plotData = _originalPlotData;

                _suppressRelayout = true;
                if (showBase && !wasBase) {
                    // We swapped a high-res chunk back to the base record: the traces
                    // genuinely changed, so rebuild them, clipped to the requested axis
                    // range (y left autoranged when no y bounds were supplied).
                    Plotly.react('plotDiv', createTraces(plotData),
                        buildLayout(hasX ? [msg.limits.xMin, msg.limits.xMax] : null,
                                    hasY ? [msg.limits.yMin, msg.limits.yMax] : null))
                        .then(() => { _suppressRelayout = false; });
                } else {
                    // Already showing the right data (base record on a zoom-out, or the
                    // current chunk on a zoom-in) — only the axes need to move. A relayout
                    // skips the up-to-200k-point WebGL rebuild a react would do, which is
                    // what made synced panels lag a beat behind the one being driven.
                    const update = {};
                    if (hasX) update['xaxis.range'] = [msg.limits.xMin, msg.limits.xMax];
                    else if (showBase) update['xaxis.autorange'] = true;
                    if (hasY) update['yaxis.range'] = invY ? [msg.limits.yMax, msg.limits.yMin] : [msg.limits.yMin, msg.limits.yMax];
                    else if (showBase) update['yaxis.autorange'] = invY ? 'reversed' : true;
                    Plotly.relayout('plotDiv', update).then(() => { _suppressRelayout = false; });
                }

                const xMin = hasX ? msg.limits.xMin : gl.xMin;
                const xMax = hasX ? msg.limits.xMax : gl.xMax;
                const yMin = hasY ? msg.limits.yMin : gl.yMin;
                const yMax = hasY ? msg.limits.yMax : gl.yMax;
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                // Programmatic relayout doesn't always fire plotly_relayout with the flat-indexed
                // keys (xaxis.range[0], xaxis.range[1]) that the drag handler expects, so we
                // directly drive the same zoom flow here: record the new zoom bounds and notify
                // the parent. An x-only update (no y bounds — e.g. a synced time axis) leaves the
                // y axis autoranged on re-render. `driven` marks this as an alignment-driven echo
                // (not a fresh user zoom) so the parent doesn't re-propagate it into a feedback loop.
                _currentZoom = { xMin, xMax, yMin, yMax, yAuto: !hasY };
                window.parent.postMessage({ type: 'plotZoomed', driven: true, limits: { xMin, xMax, yMin, yMax } }, '*');

                if (showBase) {
                    // We're already showing the base record clipped to this range — either a
                    // full-extent reset (coversFull) or a zoom-OUT past our last-fetched window
                    // (needBase). The base record covers it at full downsample density, so skip
                    // the high-res fetch: re-fetching buys nothing, and across N synced panels it
                    // serializes on the server NETCDF lock and makes multiview zoom-out crawl in
                    // one panel at a time. The render above is the final state — report it done.
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                    renderProfileSidebar();   // match the marginal greying to the synced view
                } else if (!_skipFetchIfCovered(xMin, xMax, yMin, yMax)) {
                    // A true zoom-IN whose detail we don't already hold: the global
                    // downsample is too sparse for this narrower window, so fetch
                    // high-res data for it (triggerBgFetch reports completion). If the
                    // current chunk already covers it at full detail, _skipFetchIfCovered
                    // handled the stat/marginal and we fetch nothing.
                    _pendingBounds = setTimeout(() => { triggerBgFetch(xMin, xMax, yMin, yMax); renderProfileSidebar(); }, 400);
                }
            }
            
            // Driven reset (e.g. the parent's "align time axes" toggle being turned
            // off) — same effect as a double-click zoom-out, but initiated remotely.
            if (msg.type === 'resetZoom') {
                _suppressRelayout = false;
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);
                _currentZoom = null;
                if (_originalPlotData) {
                    plotData = _originalPlotData;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                } else {
                    const invY = urlParams.get('invert_y') === 'true';
                    Plotly.relayout('plotDiv', { 'xaxis.autorange': true, 'yaxis.autorange': invY ? 'reversed' : true });
                }
                window.parent.postMessage({ type: 'plotZoomed', driven: true, limits: {} }, '*');
                renderProfileSidebar();   // zoom cleared remotely → drop the marginal greying
                return;
            }

            if (msg.type === 'updateColour' && !isNaN(msg.limits.cMin)) {
                // If dual trace, update the coloured trace (Passed QC / Selection)
                const traceIdx = colouredTraceIdx();
                // Ack once the restyle has actually been applied and painted, so the
                // parent paces the next slider value to this plot's real redraw cost
                // (keeps the slider smooth instead of flooding it with restyles).
                const ackColour = () => requestAnimationFrame(() => {
                    try { window.parent.postMessage({ type: 'colourUpdated' }, '*'); } catch (_) {}
                });
                const p = Plotly.restyle('plotDiv', { 'marker.cmin': [msg.limits.cMin], 'marker.cmax': [msg.limits.cMax] }, [traceIdx]);
                _cbarMin = msg.limits.cMin; _cbarMax = msg.limits.cMax; applyCbar();
                if (p && p.then) p.then(ackColour); else ackColour();
            }

            if (msg.type === 'setMultiview') {
                const nv = !!msg.multiview;
                if (nv !== _multiview) {
                    _multiview = nv;
                    try { Plotly.relayout('plotDiv', { 'margin.r': cbarActive() ? 5 : 20 }); } catch (_) {}
                    applyCbar();
                }
            }
            
            if (msg.type === 'downloadPlot') {
                Plotly.downloadImage('plotDiv', {
                    format: 'png',
                    width: 1200,
                    height: 800,
                    filename: `glider_plot_${urlParams.get('x')}_vs_${urlParams.get('y')}`
                });
            }

            if (msg.type === 'autoColour') {
                if (!plotData || !plotData.c || !plotData.c.length) return;

                const isXDate = plotData.is_x_dt;
                const parseDate = (d) => typeof d === 'string' ? new Date(d.replace(' ', 'T')).getTime() : new Date(d).getTime();

                let calcCMin = Infinity, calcCMax = -Infinity;

                if (msg.bounds) {
                    const xMinNum = isXDate ? parseDate(msg.bounds.xMin) : parseFloat(msg.bounds.xMin);
                    const xMaxNum = isXDate ? parseDate(msg.bounds.xMax) : parseFloat(msg.bounds.xMax);
                    const yMinNum = parseFloat(msg.bounds.yMin);
                    const yMaxNum = parseFloat(msg.bounds.yMax);

                    const SAMPLE_STEP = Math.max(1, Math.floor(plotData.x.length / 5000));
                    for (let i = 0; i < plotData.x.length; i += SAMPLE_STEP) {
                        if (plotData.x[i] === null || plotData.y[i] === null || plotData.c[i] === null) continue;
                        const px = isXDate ? parseDate(plotData.x[i]) : plotData.x[i];
                        const py = plotData.y[i];
                        if (px >= xMinNum && px <= xMaxNum && py >= yMinNum && py <= yMaxNum) {
                            const pc = plotData.c[i];
                            if (pc < calcCMin) calcCMin = pc;
                            if (pc > calcCMax) calcCMax = pc;
                        }
                    }
                }

                const newCMin = calcCMin !== Infinity ? calcCMin : plotData.c_min;
                const newCMax = calcCMax !== -Infinity ? calcCMax : plotData.c_max;

                const traceIdx = colouredTraceIdx();
                Plotly.restyle('plotDiv', { 'marker.cmin': [newCMin], 'marker.cmax': [newCMax] }, [traceIdx]);
                _cbarMin = newCMin; _cbarMax = newCMax; applyCbar();
                window.parent.postMessage({ type: 'autoColourResult', cMin: newCMin, cMax: newCMax }, '*');
            }
        });

        // ── Clicked-point popup ────────────────────────────────────────────
        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

        // Epoch-ms → "25 Apr 2026, 10:08:25 UTC". Data times are naive UTC, so we
        // read the UTC fields explicitly (never the viewer's local timezone).
        function fmtPlotTime(ms) {
            const d = new Date(ms);
            if (isNaN(d.getTime())) return String(ms);
            const p = (n) => String(n).padStart(2, '0');
            return `${p(d.getUTCDate())} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}, `
                 + `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())} UTC`;
        }


        function _unitSuffix(u) {
            u = (u || '').trim();
            // '1' / 'dimensionless' are placeholder "no real unit" values that read
            // as noise in the popup (e.g. "34.9295 1") — drop them.
            if (!u || u === 'No units' || u === '1' || u === '1.0' || u.toLowerCase() === 'dimensionless') return '';
            return ' ' + u;
        }

        function _fmtVal(v) {
            if (v === null || v === undefined || Number.isNaN(v)) return '–';
            const a = Math.abs(v);
            if (a !== 0 && (a < 0.001 || a >= 1e6)) return v.toExponential(3);
            return Number(v.toFixed(4)).toString();
        }

        function renderPointBubble(rows) {
            const wrap = document.getElementById('point-rows');
            if (!wrap) return;
            wrap.innerHTML = '';
            for (const [label, val] of rows) {
                const r = document.createElement('div'); r.className = 'pr';
                const l = document.createElement('span'); l.className = 'pr-label'; l.textContent = label;
                const v = document.createElement('span'); v.className = 'pr-val'; v.textContent = val;
                r.append(l, v); wrap.appendChild(r);
            }
            document.getElementById('point-bubble').classList.add('visible');
        }

        function hidePointBubble() {
            const b = document.getElementById('point-bubble');
            if (b) b.classList.remove('visible');
            _pinPoint = null;
            applyPinShape();
        }

        // The blue marker on the clicked point, drawn as a DOM overlay (#point-pin)
        // rather than a Plotly layout shape. We deliberately avoid Plotly.relayout
        // here: replacing layout.shapes on every click forced a relayout that
        // re-created the scattergl WebGL context, leaking contexts until the browser
        // reclaimed them and the data canvas blanked (axes + JS hit-testing survived,
        // so it still "picked" points — the bug being fixed). Instead we store the
        // point's DATA coords and project them to pixels with the axis c2p on every
        // redraw (positionPin is wired to plotly_afterplot), so the dot stays glued
        // to the point through zoom/pan with zero Plotly calls.
        let _pinPoint = null;   // null or { x, y } in data coords
        function positionPin() {
            const pin = document.getElementById('point-pin');
            if (!pin) return;
            const gd = document.getElementById('plotDiv');
            if (!_pinPoint || !gd || !gd._fullLayout) { pin.classList.remove('visible'); return; }
            const xa = gd._fullLayout.xaxis, ya = gd._fullLayout.yaxis;
            if (!xa || !ya || xa._offset === undefined || typeof xa.c2p !== 'function') {
                pin.classList.remove('visible'); return;
            }
            // Date axes plot in epoch-ms; convert a stored string x the same way the
            // click hit-test does so the projection matches the plotted position.
            const xv = _pinPoint.x;
            const xForPixel = (plotData && plotData.is_x_dt && typeof xv === 'string')
                ? new Date(xv.replace(' ', 'T') + 'Z').getTime() : xv;
            if (!isFinite(xForPixel) || !isFinite(_pinPoint.y)) { pin.classList.remove('visible'); return; }
            const sx = xa._offset + xa.c2p(xForPixel);
            const sy = ya._offset + ya.c2p(_pinPoint.y);
            // Clip to the drawing area — Plotly used to clip the shape for us. Done in
            // plotDiv-internal coords (what _offset/c2p return), before shifting below.
            if (sx < xa._offset || sx > xa._offset + xa._length ||
                sy < ya._offset || sy > ya._offset + ya._length) {
                pin.classList.remove('visible'); return;
            }
            // #point-pin is a body-level sibling of plotDiv, so its coords are relative
            // to the page, not the plot. plotDiv itself is shifted right when the depth
            // profile sidebar is open (and resized for the colour bar) — add its offset
            // so the marker lands on the point, not SIDEBAR_W px to its left.
            pin.style.left = (sx + gd.offsetLeft) + 'px';
            pin.style.top = (sy + gd.offsetTop) + 'px';
            pin.classList.add('visible');
        }
        // Back-compat name: callers just want the pin re-rendered at its current point.
        function applyPinShape() { positionPin(); }

        // Show the popup for data index `i` and ask the parent to pin its lat/lon
        // (resolved from the point's TIME) on every open globe + sync the matching
        // point onto sibling plots. `opts.silent` suppresses the outbound message —
        // used when THIS popup was itself driven by a sibling's pick, so a near (but
        // not exact) time match can't bounce back and cascade between plots.
        function showPointPopup(i, opts) {
            if (!plotData) return;
            const xv = plotData.x[i], yv = plotData.y[i];
            const cv = (plotData.c && plotData.c.length) ? plotData.c[i] : null;
            const rows = [];
            if (plotData.is_x_dt && xv != null) {
                const ms = typeof xv === 'number' ? xv : new Date(xv.replace(' ', 'T') + 'Z').getTime();
                rows.push(['Time', fmtPlotTime(ms)]);
            } else {
                rows.push([plotData.x_var || 'X', _fmtVal(xv) + _unitSuffix(plotData.x_units)]);
            }
            rows.push([plotData.y_var || 'Y', _fmtVal(yv) + _unitSuffix(plotData.y_units)]);
            if (cv !== null && cv !== undefined && !Number.isNaN(cv)) {
                rows.push([plotData.c_var || 'Value', _fmtVal(cv) + _unitSuffix(plotData.c_units)]);
            }
            renderPointBubble(rows);

            // Drop the blue marker on the point (tracks zoom/pan via the layout shape).
            _pinPoint = { x: xv, y: yv };
            applyPinShape();

            if (opts && opts.silent) return;   // driven by a sibling — don't echo back
            const payload = { type: 'plotPointPick' };
            if (plotData.is_x_dt && xv != null) {
                const ms = typeof xv === 'number' ? xv : new Date(xv.replace(' ', 'T') + 'Z').getTime();
                if (isFinite(ms)) payload.timeMs = ms;
            }
            try { window.parent.postMessage(payload, '*'); } catch (_) {}
        }

        // A sibling plot was clicked: select OUR nearest point at the same time and
        // show its values. Silent (never re-broadcast) so a slightly-off nearest
        // match can't ping-pong between plots. Only time-axis plots can match; others
        // clear any stale popup so the selection stays consistent across the board.
        function selectPointByTime(timeMs) {
            if (!plotData || !plotData.is_x_dt || typeof timeMs !== 'number') { hidePointBubble(); return; }
            const xs = plotData.x;
            let best = -1, bestD = Infinity;
            for (let i = 0; i < xs.length; i++) {
                const xv = xs[i];
                if (xv === null || xv === undefined) continue;
                const xms = typeof xv === 'number' ? xv : new Date(xv.replace(' ', 'T') + 'Z').getTime();
                if (!isFinite(xms)) continue;
                const d = Math.abs(xms - timeMs);
                if (d < bestD) { bestD = d; best = i; }
            }
            if (best >= 0) showPointPopup(best, { silent: true });
            else hidePointBubble();
        }

        // Nearest plotted point to a screen click, in pixel space. Returns when the
        // click lands within HIT_TOL pixels of a point; otherwise does nothing (a
        // click on truly empty plot area shouldn't open a popup). The radius is
        // deliberately generous: zoomed out the points are dense so the nearest is
        // always within a few px (so this changes nothing), but zoomed in they're
        // sparse, and a wider radius lets you click at/near any rendered point.
        const _HIT_TOL = 40;
        // Returns true if it placed a point marker, false otherwise (no plot, click
        // outside the drawing area, or no point within the hit radius) — the pointer
        // handler uses this to know whether a follow-up double-click should remove the
        // marker this click just dropped.
        function handlePlotClick(clientX, clientY) {
            const gd = document.getElementById('plotDiv');
            if (!gd || !gd._fullLayout || !plotData || !plotData.x || !plotData.x.length) return false;
            const xa = gd._fullLayout.xaxis, ya = gd._fullLayout.yaxis;
            if (!xa || !ya || xa._offset === undefined) return false;
            const rect = gd.getBoundingClientRect();
            const cx = clientX - rect.left, cy = clientY - rect.top;
            // Ignore clicks outside the drawing area (axes, margins).
            if (cx < xa._offset || cx > xa._offset + xa._length ||
                cy < ya._offset || cy > ya._offset + ya._length) return false;

            const xs = plotData.x, ys = plotData.y, n = xs.length;
            const isXDate = !!plotData.is_x_dt;
            let best = -1, bestD = _HIT_TOL * _HIT_TOL;
            for (let i = 0; i < n; i++) {
                const xv = xs[i], yv = ys[i];
                if (xv === null || yv === null || xv === undefined || yv === undefined) continue;
                if (Number.isNaN(yv)) continue;
                // Plotly's c2p on a date axis expects epoch-ms; convert strings.
                const xForPixel = (isXDate && typeof xv === 'string')
                    ? new Date(xv.replace(' ', 'T') + 'Z').getTime()
                    : xv;
                if (!isFinite(xForPixel)) continue;
                const sx = xa._offset + xa.c2p(xForPixel);
                const sy = ya._offset + ya.c2p(yv);
                const dx = sx - cx, dy = sy - cy;
                const d = dx * dx + dy * dy;
                if (d < bestD) { bestD = d; best = i; }
            }
            if (best >= 0) { showPointPopup(best); return true; }
            return false;
        }

        // Pressing 'x' anywhere clears this plot's marker and (via the parent) the
        // globe pin and every other plot's marker too.
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'x' || e.key === 'X') && !e.metaKey && !e.ctrlKey && !e.altKey
                && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) {
                hidePointBubble();
                try { window.parent.postMessage({ type: 'clearAllPicks' }, '*'); } catch (_) {}
            }
        });

        (function wirePointBubble() {
            const closeBtn = document.getElementById('point-close');
            if (closeBtn) closeBtn.addEventListener('click', () => {
                hidePointBubble();
                try { window.parent.postMessage({ type: 'plotPointClear' }, '*'); } catch (_) {}
            });
        })();

        // Plotly's responsive resize keeps the plot sized to its (shifted)
        // container; just re-pin the colour bar to the redrawn drawing area.
        window.addEventListener('resize', () => { if (cbarActive()) requestAnimationFrame(positionCbar); });

        initPlot();
    </script>
</body>
</html>
