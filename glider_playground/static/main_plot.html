<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Glider Plot</title>
    <script src="/static/console_log.js"></script>
    <link rel="stylesheet" href="/static/tailwind.css">
    <!-- Self-hosted partial Plotly: gl2d bundle (scatter + scattergl) instead of
         the full ~1MB-gzip build. Cuts parse time and drops a third-party fetch. -->
    <script src="/static/plotly-gl2d-2.32.0.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-secondary: #a1a9b8;
            --text-muted: #6b7280;
            --accent: #41658a;
            --border: #262b38;
            --spinner-track: #1f2432;
            --grid: rgba(255,255,255,0.05);
            --title: #e4e7ef;
            --anno-bg: rgba(18,20,32,0.85);
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-secondary: #4b525f;
            --text-muted: #7d8492;
            --accent: #41658a;
            --border: #e2e5ec;
            --spinner-track: #e2e5ec;
            --grid: rgba(0,0,0,0.06);
            --title: #171a22;
            --anno-bg: rgba(255,255,255,0.9);
        }
        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; color: var(--text-primary); }
        #plotDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        /* Depth-profile marginal: an SVG (no WebGL) value-vs-depth mini-plot on the
           far left. Hidden until the Profile sidebar is enabled; the main plot is
           shifted right to make room (see layoutPlotArea). */
        #profileDiv { position: absolute; top: 0; left: 0; height: 100%; display: none; }

        /* Compact, non-interactive colour bar shown only in multiview (>1 plot).
           Sits in a thin strip on the far left; the plot is shifted right to make
           room. Vertically pinned to the plot's drawing area via JS (top/bottom). */
        #cbar {
            position: absolute; right: 5px; z-index: 6; display: none;
            flex-direction: row; align-items: stretch; gap: 3px;
            pointer-events: none;
        }
        #cbar.active { display: flex; }
        #cbarTitle {
            writing-mode: vertical-rl; transform: rotate(180deg);
            text-align: center; font-size: 9px; font-weight: 600; letter-spacing: 0.03em;
            color: var(--text-secondary); white-space: nowrap; overflow: hidden;
        }
        #cbarBar {
            width: 13px; align-self: stretch; border-radius: 4px;
            border: 1px solid var(--border);
        }
        #cbarTicks {
            display: flex; flex-direction: column; justify-content: space-between;
            font-size: 8.5px; color: var(--text-secondary); line-height: 1; padding: 1px 0;
        }
        #cbarTicks span { white-space: nowrap; }
        #cbarMid { color: var(--text-muted); }
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.3s ease-in-out;
            color: var(--text-muted); font-size: 12px;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--spinner-track); border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #bgSpinner {
            position: absolute; top: 12px; left: 12px;
            width: 16px; height: 16px;
            border: 2px solid var(--spinner-track); border-top: 2px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0; transition: opacity 0.2s ease-in-out;
            pointer-events: none; z-index: 40;
        }
        #bgSpinner.active { opacity: 1; }

        .js-plotly-plot .plotly text { fill: var(--text-secondary) !important; }
    </style>
    <script>
        (function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const theme = params.get('theme') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Fetching data...</span>
    </div>
    <div id="bgSpinner"></div>

    <div id="plotDiv"></div>

    <div id="cbar" aria-hidden="true">
        <div id="cbarBar"></div>
        <div id="cbarTicks">
            <span id="cbarMax"></span>
            <span id="cbarMid"></span>
            <span id="cbarMin"></span>
        </div>
        <div id="cbarTitle"></div>
    </div>

    <!-- Optional depth-profile marginal (value vs depth), an SVG mini-plot pinned to
         the left. Toggled by the Advanced "Profile" control (profile_sidebar param). -->
    <div id="profileDiv"></div>

    <script>
        // --- Render timing ---------------------------------------------------
        // Absolute (shared epoch-ms) timestamp for when this script began running.
        // The gap from the parent's src-set time (_gpt1) to here is browser
        // navigation + HTML/Plotly parse — the biggest cost the old RENDER log hid.
        const _gpScriptStart = performance.timeOrigin + performance.now();
        const _gpParams = new URLSearchParams(window.location.search);
        // Click time and src-set time handed down by the parent (index.html). Absent
        // when the iframe is opened directly — then we just start the clock here.
        const _gpClick = parseFloat(_gpParams.get('_gpt0')) || _gpScriptStart;
        const _gpSrcSet = parseFloat(_gpParams.get('_gpt1')) || _gpScriptStart;

        // Parse a Server-Timing header ("read;dur=120.5, filter;dur=8.2") into the
        // child rows under the "server" phase. The "other" remainder the logger adds
        // captures whatever the backend didn't instrument (response encoding etc.).
        function parseServerTiming(header) {
            if (!header) return null;
            const out = [];
            for (const part of header.split(',')) {
                const m = part.match(/^\s*([^;]+);.*?dur=([\d.]+)/);
                if (m) out.push({ name: m[1].trim(), ms: parseFloat(m[2]), color: '#fbbf24' });
            }
            return out.length ? out : null;
        }

        // Break the "load + parse" gap (parent src-set -> this script running) into
        // browser dispatch, HTML fetch, blocking-asset download, and script eval,
        // using the iframe's own Navigation + Resource Timing. Best-effort: missing
        // entries just collapse into the logger's "other" remainder.
        function loadParseChildren() {
            try {
                const nav = performance.getEntriesByType('navigation')[0];
                const origin = performance.timeOrigin;
                const scriptRel = _gpScriptStart - origin;   // perf.now() at script start
                const htmlEnd = nav ? nav.responseEnd : 0;
                // Blocking <script> resources (console_log.js, plotly bundle).
                const scripts = performance.getEntriesByType('resource')
                    .filter(e => e.initiatorType === 'script');
                const lastScriptEnd = scripts.reduce((m, e) => Math.max(m, e.responseEnd), 0);
                const assetsEnd = Math.max(htmlEnd, lastScriptEnd);
                return [
                    { name: 'dispatch', ms: Math.max(0, origin - _gpSrcSet),        color: '#9aa6b8' },
                    { name: 'html',     ms: Math.max(0, htmlEnd),                    color: '#c4a8f5' },
                    { name: 'scripts',  ms: Math.max(0, lastScriptEnd - htmlEnd),    color: '#c4a8f5' },
                    { name: 'eval',     ms: Math.max(0, scriptRel - assetsEnd),      color: '#c4a8f5' },
                ];
            } catch (_) { return null; }
        }

        const bgSpinner = document.getElementById('bgSpinner');

        // Notify the dashboard parent when this panel is interacted with (click,
        // zoom-drag, touch) so it becomes the active panel. Capture phase so it
        // fires even though Plotly stops propagation on the plot surface.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        let _bgFetchController = null;
        let _pendingBounds = null;
        let _originalPlotData = null;
        let _currentZoom = null;
        let _globalExtent = null;  // full data extent for fallback when autorange hides layout.xaxis.range
        let _suppressRelayout = false;  // true while we are driving relayout programmatically

        // ---- Compact multiview colour bar -------------------------------------
        // In multiview (more than one plot panel) each plot shows its own small,
        // non-interactive colour bar on the left. The big interactive colour rail
        // in the parent is unchanged; this just mirrors the active colour range.
        const CBAR_W = 58;   // px reserved on the right for the colour bar strip
        let _multiview = false;   // set from the URL once urlParams is initialised
        let _cbarMin = null, _cbarMax = null;   // current colour range shown on the bar

        // Depth-profile marginal (left side). SIDEBAR_W is the reserved strip width;
        // the marginal matches the main plot's top/bottom margins so their depth axes
        // line up, and puts its value ticks on the bottom (no title).
        const SIDEBAR_W = 158;
        let _profileSidebar = false;   // set from the URL once urlParams is initialised

        // The CSS gradient stops (low→high) for the current colour map, or null when
        // there's no data-driven colour bar to show (solid colour, discrete, no c).
        function cbarStops() {
            if (!plotData || !plotData.c || !plotData.c.length) return null;
            if ((urlParams.get('cmap') || 'thermal') === 'discrete_09') return null;
            let cmapName = urlParams.get('cmap') || 'thermal';
            if (cmapName === 'black') return null;
            const reversed = cmapName.endsWith('_r');
            const base = reversed ? cmapName.slice(0, -2) : cmapName;
            const stops = cmoceanPalettes[base];
            if (!stops) return null;
            return reversed ? stops.slice().reverse() : stops.slice();
        }

        function cbarActive() { return _multiview && !!cbarStops(); }

        // Index of the coloured scatter trace (the one the colour slider/auto-colour
        // restyle). Highlight-QC draws a grey backdrop first, colour on top (idx 1).
        function colouredTraceIdx() {
            if (plotData && plotData.qc_applied && urlParams.get('highlight_qc') === 'true') return 1;
            return 0;
        }

        function fmtCbar(v) {
            if (v === null || v === undefined || isNaN(v)) return '';
            const a = Math.abs(v);
            if (a !== 0 && (a < 0.01 || a >= 100000)) return v.toExponential(1);
            const decimals = a >= 100 ? 0 : a >= 1 ? 1 : 2;
            return Number(v.toFixed(decimals)).toString();
        }

        // Pin the colour bar to the plot's drawing area (the y-axis span) using the
        // real computed margins, so it lines up regardless of theme/title/resize.
        function positionCbar() {
            const cbar = document.getElementById('cbar');
            const plotDiv = document.getElementById('plotDiv');
            const m = plotDiv && plotDiv._fullLayout && plotDiv._fullLayout.margin;
            if (m) { cbar.style.top = m.t + 'px'; cbar.style.bottom = m.b + 'px'; }
        }

        // Show/hide + rebuild the colour bar and shift the plot to make room. Cheap
        // and idempotent; safe to call after any render, relayout or state change.
        function applyCbar() {
            const cbar = document.getElementById('cbar');
            const plotDiv = document.getElementById('plotDiv');
            if (!cbar || !plotDiv) return;
            const active = cbarActive();

            layoutPlotArea();   // colour bar (right) shares the plot's sizing with the sidebar (left)
            cbar.classList.toggle('active', active);
            if (!active) return;

            const stops = cbarStops();
            document.getElementById('cbarBar').style.background =
                `linear-gradient(to top, ${stops.join(', ')})`;

            const label = (() => {
                const name = (plotData.c_var || '').trim();
                if (!name) return '';
                const u = (plotData.c_units || '').trim();
                return (u && u !== 'No units') ? `${name} (${u})` : name;
            })();
            document.getElementById('cbarTitle').textContent = label;

            if (_cbarMin === null) _cbarMin = plotData.c_min;
            if (_cbarMax === null) _cbarMax = plotData.c_max;
            document.getElementById('cbarMax').textContent = fmtCbar(_cbarMax);
            document.getElementById('cbarMin').textContent = fmtCbar(_cbarMin);
            document.getElementById('cbarMid').textContent = fmtCbar((_cbarMin + _cbarMax) / 2);

            positionCbar();
        }

        // Size the main plot to leave room for the left profile sidebar and/or the
        // right colour bar, then resize Plotly into the new box.
        function layoutPlotArea() {
            const plotDiv = document.getElementById('plotDiv');
            if (!plotDiv) return;
            const left = _profileSidebar ? SIDEBAR_W : 0;
            const right = cbarActive() ? CBAR_W : 0;
            const wantLeft = left + 'px';
            const wantWidth = `calc(100% - ${left + right}px)`;
            let changed = false;
            if (plotDiv.style.left !== wantLeft) { plotDiv.style.left = wantLeft; changed = true; }
            if (plotDiv.style.width !== wantWidth) { plotDiv.style.width = wantWidth; changed = true; }
            if (changed && plotDiv._fullLayout) { try { Plotly.Plots.resize(plotDiv); } catch (_) {} }
        }

        // ---- Depth-profile marginal (SVG) -------------------------------------
        function buildProfileTraces(pdata) {
            const cmapName = urlParams.get('cmap') || 'thermal';
            const scale = customColorscales[cmapName] || cmapName;
            const SZ = 4;
            const colourMarker = (c) => ({
                size: SZ, opacity: 0.9,
                color: (c && c.length && pdata.c && pdata.c.length) ? c : plotConfig.defaultColour,
                colorscale: (c && c.length && pdata.c && pdata.c.length) ? scale : undefined,
                cmin: pdata.c_min, cmax: pdata.c_max, cauto: false
            });
            // Grey the full column, colour the selected profile/cycle/direction on
            // top, when a filter is active; otherwise a single coloured gradient.
            if (pdata.profile_highlight && pdata.in_selection && pdata.in_selection.length === pdata.x.length) {
                const sx=[], sy=[], sc=[], gx=[], gy=[];
                for (let i = 0; i < pdata.x.length; i++) {
                    if (pdata.in_selection[i]) { sx.push(pdata.x[i]); sy.push(pdata.y[i]); sc.push(pdata.c ? pdata.c[i] : null); }
                    else { gx.push(pdata.x[i]); gy.push(pdata.y[i]); }
                }
                return [
                    { x: gx, y: gy, mode: 'markers', type: 'scatter', marker: { size: SZ, color: '#9ca3af', opacity: 0.3 }, hoverinfo: 'none' },
                    { x: sx, y: sy, mode: 'markers', type: 'scatter', marker: colourMarker(sc), hoverinfo: 'none' },
                ];
            }
            return [{ x: pdata.x, y: pdata.y, mode: 'markers', type: 'scatter', marker: colourMarker(pdata.c), hoverinfo: 'none' }];
        }

        function buildProfileLayout(pdata) {
            const TC = readThemeColors();
            const isInverted = urlParams.get('invert_y') === 'true';
            const plotDiv = document.getElementById('plotDiv');
            // Match the main plot's top/bottom margins so the two depth axes line up.
            const m = (plotDiv && plotDiv._fullLayout && plotDiv._fullLayout.margin) || { t: 8, b: 26 };
            return {
                margin: { l: 44, r: 6, t: m.t, b: m.b },
                font: { color: TC.axis, family: "'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
                xaxis: {
                    // Ticks on the bottom (aligned with the main plot's x-axis) and no
                    // title — the variable is obvious from the connected main plot, and
                    // dropping it lets the profile run the full height of the plot.
                    side: 'bottom', showgrid: true, zeroline: false, nticks: 4,
                    gridcolor: TC.grid, linecolor: TC.line, tickcolor: TC.line, tickfont: { color: TC.axis, size: 9 },
                },
                yaxis: {
                    autorange: isInverted ? 'reversed' : true, showgrid: true, zeroline: false,
                    gridcolor: TC.grid, linecolor: TC.line, tickcolor: TC.line, tickfont: { color: TC.axis, size: 9 },
                },
                hovermode: false, plot_bgcolor: 'transparent', paper_bgcolor: 'transparent', showlegend: false,
            };
        }

        // Fetch the value-vs-depth data (all points + selection flag, light point
        // budget) and draw the SVG marginal. Re-runs whenever the iframe reloads
        // (toggle / colour map / profile-filter changes all reload it).
        let _profileFetchSeq = 0;
        async function renderProfileSidebar() {
            const profileDiv = document.getElementById('profileDiv');
            if (!profileDiv) return;
            const cVar = urlParams.get('c_var');
            if (!_profileSidebar || !plotData || !cVar || cVar === 'black') {
                profileDiv.style.display = 'none';
                try { Plotly.purge('profileDiv'); } catch (_) {}
                layoutPlotArea();
                return;
            }
            profileDiv.style.display = 'block';
            profileDiv.style.width = SIDEBAR_W + 'px';
            layoutPlotArea();   // reserve the left strip on the main plot

            // Value on X, depth on Y, with the selection highlighted; capped to a
            // light point budget since SVG (not WebGL) draws these.
            const p = new URLSearchParams(window.location.search);
            const mainXVar = p.get('x_var');   // colour var becomes this fetch's x_var below
            p.set('x_var', cVar);
            p.set('highlight_profile', 'true');
            p.set('max_points', '2500');
            ['multiview', 'theme', 'profile_sidebar', 'zXmin', 'zXmax', 'zYmin', 'zYmax'].forEach(k => p.delete(k));

            // When the main plot is zoomed, grey the marginal points that fall
            // outside the current view — the same treatment as a single-profile
            // selection, but driven by the zoom window. The window lives in the
            // main plot's x_var / depth space, so pass the main x_var name plus
            // numeric (epoch-ms for dates) bounds and let the server flag in-view
            // points via `in_selection`.
            const z = _currentZoom;
            if (z && mainXVar && z.xMin !== undefined && z.xMax !== undefined
                    && z.yMin !== undefined && z.yMax !== undefined) {
                const toMs = (s) => {
                    if (typeof s === 'number') return s;
                    const t = Date.parse(String(s).replace(' ', 'T') + 'Z');
                    return isNaN(t) ? Date.parse(s) : t;
                };
                const isXDate = plotData && plotData.is_x_dt;
                const xlo = isXDate ? toMs(z.xMin) : Number(z.xMin);
                const xhi = isXDate ? toMs(z.xMax) : Number(z.xMax);
                const ylo = Number(z.yMin), yhi = Number(z.yMax);
                if (isFinite(xlo) && isFinite(xhi) && isFinite(ylo) && isFinite(yhi)) {
                    p.set('zoom_x_var', mainXVar);
                    p.set('zoom_x_min', Math.min(xlo, xhi));
                    p.set('zoom_x_max', Math.max(xlo, xhi));
                    p.set('zoom_y_min', Math.min(ylo, yhi));
                    p.set('zoom_y_max', Math.max(ylo, yhi));
                }
            }

            const seq = ++_profileFetchSeq;
            try {
                const resp = await fetch('/api/plot_data?' + p.toString());
                const pdata = await resp.json();
                if (seq !== _profileFetchSeq) return;   // a newer render superseded this one
                if (pdata.error || !pdata.x || !pdata.x.length) { profileDiv.style.display = 'none'; layoutPlotArea(); return; }
                Plotly.react('profileDiv', buildProfileTraces(pdata), buildProfileLayout(pdata),
                    { displayModeBar: false, responsive: true, staticPlot: true });
            } catch (_) {
                if (seq === _profileFetchSeq) { profileDiv.style.display = 'none'; layoutPlotArea(); }
            }
        }

        const plotConfig = {
            defaultMarkerSize: 8,
            defaultColour: '#41658a'
        };

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            const g = (n, fb) => (s.getPropertyValue(n).trim() || fb);
            return {
                axis:  g('--text-secondary', '#a1a9b8'),
                label: g('--text-primary',   '#cdd3de'),
                grid:  g('--grid',           'rgba(255,255,255,0.05)'),
                line:  g('--border',         '#262b38'),
                title: g('--title',          '#e4e7ef'),
                anno:  g('--anno-bg',        'rgba(18,20,32,0.85)')
            };
        }

        const cmoceanPalettes = {
            thermal: ['#042333','#1d1147','#45155e','#781f5e','#a13058','#bd4a38','#cc6c1a','#d5901c','#ddb33a','#e6d274','#e9f6ae'],
            haline:  ['#2a186c','#2a348a','#1d4ca7','#0e65a4','#0d7a95','#1a8e83','#3ea06d','#72ae4a','#b2ba38','#e8c75a','#fdef9a'],
            solar:   ['#331901','#512208','#702912','#8a311b','#a13e20','#b35120','#c06717','#ca8115','#cf9d24','#d6ba4c','#dfd77f'],
            ice:     ['#03051e','#101448','#1c2b69','#27396d','#34517e','#496d97','#6587b0','#87a2c3','#abbdd4','#cfd7e2','#ecedf1'],
            gray:    ['#000000','#1a1a1a','#333333','#4d4d4d','#666666','#808080','#999999','#b3b3b3','#cccccc','#e6e6e6','#ffffff'],
            oxy:     ['#400000','#5c0000','#780000','#808080','#8c8c8c','#979797','#a3a3a3','#aeaeae','#baba10','#dbdb0a','#fdfd00'],
            deep:    ['#fdfecc','#c9e3a9','#93c4a9','#61a1b5','#4883b5','#3d65a8','#3a4c93','#383779','#322263','#2c1050','#190628'],
            dense:   ['#e6f1f7','#c4d8e8','#a6bed9','#8ba4c9','#7489b8','#636c9f','#595388','#55406e','#4e3055','#3f2040','#2e1226'],
            algae:   ['#d6f5d6','#b5e4a9','#87cd80','#59b561','#319a4c','#0c7f3d','#006630','#00521e','#003d10','#002b08','#001b04'],
            matter:  ['#fff7cc','#f9d0a3','#f3a781','#ea8161','#de594e','#c7353f','#a91b3c','#812139','#5a2130','#331821','#160e12'],
            turbid:  ['#e8f6b1','#d3dba0','#bdc091','#a6a682','#928c74','#807364','#6e5a55','#5c4344','#4a2e32','#361a1f','#200910'],
            speed:   ['#fffdcc','#d9e7a5','#add28a','#7fbb7d','#56a377','#37886c','#26695b','#1c4848','#1b2838','#1b1024','#0c0412'],
            amp:     ['#fff5f0','#fcd1b3','#f7a788','#ef7963','#e24c3b','#c53126','#9c2121','#741313','#4d0707','#270303','#0a0000'],
            tempo:   ['#fff6cc','#d3e4bd','#a9d0b3','#80bca9','#5aa69e','#3b8d8f','#27707d','#1a5267','#133749','#0d2130','#050c17'],
            rain:    ['#eefcff','#cbe8f0','#a9d1df','#85b9cc','#68a0c0','#5f85b5','#5a67a3','#504c8c','#3a3a73','#232958','#11133d'],
            phase:   ['#a9795e','#c2656a','#c85080','#ad4ba6','#7652c5','#3f63c6','#1778a2','#0e8765','#3c933e','#7c9136','#a87d40'],
            topo:    ['#2d1451','#36276b','#3e3d7d','#3e5298','#3671a9','#5cb5ae','#cfe5a8','#b3a060','#8c6b35','#5f3d1b','#3b1e0a'],
            balance: ['#181c44','#3952a1','#5f89ca','#99b3d8','#cad4df','#f5f5f5','#e7c6a5','#d09168','#b35d40','#802b24','#400000'],
            delta:   ['#112f46','#164872','#275a8f','#3d7ea0','#5aa294','#97c07d','#e0d18a','#dba04b','#bd4e40','#7d2f38','#3b152f'],
            curl:    ['#150b2e','#2a245d','#3a3f85','#56659f','#8596b5','#c9c9c3','#d4c58b','#bfa05a','#a76b3e','#6d2e3e','#371032'],
            diff:    ['#241c2f','#2c3d6a','#38689e','#6098b8','#a3bfc5','#e2e2e2','#d0b6a9','#b37773','#874441','#51252b','#241414'],
            tarn:    ['#3a1e0b','#7a4622','#b17838','#d3a369','#e2c999','#e2e2d8','#a4c0a5','#6c9c86','#387367','#14494a','#0e2d35'],
            bbp:     ['#cccccc','#737373','#000000','#1335f5','#3f8df7','#67dffb','#a1fc4e','#f8d748','#ef8733','#ea3323'],
            temp:    ['#1b1c6e','#365292','#5286b7','#8db4c4','#dbe5cd','#f1d8b4','#d9997e','#c05e4c','#a0372b','#811910'],
            sal:     ['#f9e8b1','#f1c38f','#e8a074','#db7c5f','#cb5c58','#b2425c','#943061','#732460','#511c53','#321340'],
            sunset:  ['#ecf472','#f1c85b','#eea052','#db7e61','#ba6b78','#935c86','#714c8e','#4d3a99','#1f3479','#0f263b'],
            chla:    ['#182548','#2c5398','#4a88a4','#87b8b5','#dae4da','#e6d992','#a8ab3e','#56872e','#285932','#1b2617']
        };

        const customColorscales = (() => {
            const out = {};
            const stopsToScale = stops => stops.map((c, i) => [i / (stops.length - 1), c]);
            for (const [name, stops] of Object.entries(cmoceanPalettes)) {
                out[name] = stopsToScale(stops);
                out[name + '_r'] = stopsToScale(stops.slice().reverse());
            }
            return out;
        })();

        // Fixed 10-colour palette for integer values 0-9 (phases, QC flags, etc.)
        const DISCRETE_09_COLORS = [
            '#9ca3af',  // 0 – unknown / no QC (grey)
            '#22c55e',  // 1 – ascent / good (green)
            '#3b82f6',  // 2 – descent / probably good (blue)
            '#f97316',  // 3 – surfacing / correctable (orange)
            '#a855f7',  // 4 – parking / bad (purple)
            '#06b6d4',  // 5 – inflection / changed (cyan)
            '#ef4444',  // 6 – propelled (red)
            '#eab308',  // 7 – transition (yellow)
            '#ec4899',  // 8 – (pink)
            '#84cc16',  // 9 – (lime)
        ];

        const SCI_PHASE_NAMES = {
            0: 'Unknown', 1: 'Ascent', 2: 'Descent', 3: 'Surfacing',
            4: 'Parking', 5: 'Inflection', 6: 'Propelled', 7: 'Transition',
            8: 'Phase 8', 9: 'Phase 9',
        };

        const urlParams = new URLSearchParams(window.location.search);
        _multiview = (urlParams.get('multiview') === '1');
        _profileSidebar = (urlParams.get('profile_sidebar') === 'true');
        let plotData = null;

        function getSafeMin(arr) {
            let min = Infinity;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] < min) min = arr[i];
            }
            return min;
        }

        function getSafeMax(arr) {
            let max = -Infinity;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] > max) max = arr[i];
            }
            return max;
        }

        async function initPlot() {
            if (!window.location.search) return;

            const now = () => performance.timeOrigin + performance.now();
            try {
                // Strip our timing params before forwarding to the API (they're noise
                // to the server and would bloat the cache key if it ever keyed on them).
                const apiParams = new URLSearchParams(window.location.search);
                apiParams.delete('_gpt0'); apiParams.delete('_gpt1');

                const tFetchSent = now();
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();  // folded into PLOT log
                const fetchUrl = `/api/plot_data?${apiParams.toString()}`;
                const response = await fetch(fetchUrl);
                const tFetchResolved = now();
                // Server compute time (seconds) + per-step breakdown from the backend.
                const serverHdr = response.headers && response.headers.get('X-Process-Time');
                const serverMs = serverHdr ? parseFloat(serverHdr) * 1000 : 0;
                const serverChildren = parseServerTiming(response.headers && response.headers.get('Server-Timing'));

                plotData = await response.json();
                const tJsonParsed = now();

                if (plotData.error) throw new Error(plotData.error);

                // build + draw is split into trace-building / Plotly draw / paint via
                // the marks renderPlot records into this object.
                const renderMarks = {};
                const tRenderStart = now();
                await renderPlot(renderMarks);
                const tDrawn = now();
                // Wait one frame so the timestamp reflects pixels actually painted,
                // not just Plotly's draw call returning.
                await new Promise(r => requestAnimationFrame(r));
                const tPainted = now();

                // Timing/logging is purely diagnostic — it must NEVER throw out of the
                // render path (e.g. a stale cached console_log.js without logPlotTiming
                // would otherwise abort the overlay fade + zoom-reload below).
                try {
                    const fetchRoundTrip = tFetchResolved - tFetchSent;
                    // Resource Timing for THIS fetch splits the body download from the
                    // pure JSON.parse (same-origin, so full detail is exposed).
                    // fetch() resolves at the response headers (responseStart); the
                    // body then streams until responseEnd, after which JSON.parse runs.
                    // Match THIS exact URL — the profile sidebar also hits
                    // /api/plot_data (different params), so a bare path match could
                    // grab its entry instead.
                    const res = performance.getEntriesByType('resource')
                        .filter(e => e.name.indexOf(fetchUrl) !== -1)
                        .pop();
                    const absResponseEnd = (res && res.responseEnd)
                        ? performance.timeOrigin + res.responseEnd : 0;
                    const jsonTotal = tJsonParsed - tFetchResolved;
                    const jsonChildren = absResponseEnd ? [
                        { name: 'download', ms: Math.max(0, absResponseEnd - tFetchResolved), color: '#7ec8f7' },
                        { name: 'parse',    ms: Math.max(0, tJsonParsed - absResponseEnd),    color: '#7ec8f7' },
                    ] : null;

                    const loadParse = loadParseChildren();
                    const buildDraw = [
                        { name: 'traces', ms: (renderMarks.tBuilt || tRenderStart) - tRenderStart, color: '#86efac' },
                        { name: 'draw',   ms: tDrawn - (renderMarks.tBuilt || tRenderStart),       color: '#86efac' },
                        { name: 'paint',  ms: tPainted - tDrawn,                                    color: '#86efac' },
                    ];
                    // Phases with sub-steps are rendered as header-only labels (no
                    // parent bar/total) so the detail rows don't read as a double count.
                    const phases = [
                        { name: 'parent dispatch', ms: _gpSrcSet - _gpClick,       color: '#9aa6b8' },
                        { name: 'load + parse',    ms: _gpScriptStart - _gpSrcSet,  color: '#c4a8f5',
                          header: !!loadParse, children: loadParse },
                        { name: 'iframe init',     ms: tFetchSent - _gpScriptStart, color: '#9aa6b8' },
                        { name: 'server',          ms: serverMs,                    color: '#fbbf24',
                          header: !!serverChildren, children: serverChildren },
                        { name: 'network',         ms: fetchRoundTrip - serverMs,   color: '#7ec8f7' },
                        { name: 'json read',       ms: jsonTotal,                   color: '#7ec8f7',
                          header: !!jsonChildren, children: jsonChildren },
                        { name: 'build + draw',    ms: tPainted - tRenderStart,     color: '#86efac',
                          header: true, children: buildDraw },
                    ];
                    if (window.logPlotTiming) window.logPlotTiming('WebGL Plot', phases, tPainted - _gpClick);
                    else window.logRender && window.logRender('WebGL Plot', tPainted - _gpClick);
                } catch (_) { /* never let logging break the render */ }

                // Reloaded straight into a saved zoom (e.g. the user changed cmap or
                // draw order while zoomed in)? /api/plot_data returns the full,
                // downsampled record clipped to the zoom window, which can look sparse
                // or empty in a tight window. A live zoom-drag normally pulls the
                // high-res in-bounds chunk via triggerBgFetch, but a fresh load never
                // fires plotly_relayout — so drive that same fetch explicitly here.
                if (urlParams.has('zXmin') && urlParams.has('zXmax') &&
                    urlParams.has('zYmin') && urlParams.has('zYmax')) {
                    let zx0 = Number(urlParams.get('zXmin')), zx1 = Number(urlParams.get('zXmax'));
                    let zy0 = Number(urlParams.get('zYmin')), zy1 = Number(urlParams.get('zYmax'));
                    if (!isNaN(zx0) && !isNaN(zx1) && !isNaN(zy0) && !isNaN(zy1)) {
                        if (zx0 > zx1) { const t = zx0; zx0 = zx1; zx1 = t; }
                        if (zy0 > zy1) { const t = zy0; zy0 = zy1; zy1 = t; }
                        _currentZoom = { xMin: zx0, xMax: zx1, yMin: zy0, yMax: zy1 };
                        triggerBgFetch(zx0, zx1, zy0, zy1);
                    }
                }

                const overlay = document.getElementById('overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

            } catch (err) {
                document.getElementById('loadingIcon').style.display = 'none';
                document.getElementById('statusText').style.color = '#ef4444';
                document.getElementById('statusText').textContent = err.message || "Failed to load plot data.";
                console.error(err);
                window.parent.postMessage({ type: 'plotError', message: err.message }, '*');
            }
        }

        function buildLayout(xRange, yRange) {
            const isXDate = plotData.is_x_dt;
            const isInverted = urlParams.get('invert_y') === 'true';
            const axisLabel = (name, units) => {
                if (!name) return '';
                const u = (units || '').trim();
                return (u && u !== 'No units') ? `${name} (${u})` : name;
            };
            const xLabel = isXDate ? '' : axisLabel(plotData.x_var, plotData.x_units);
            const yLabel = axisLabel(plotData.y_var, plotData.y_units);
            const TC = readThemeColors();
            const AXIS_COLOR = TC.axis;
            const AXIS_LABEL_COLOR = TC.label;
            const GRID_COLOR = TC.grid;
            const LINE_COLOR = TC.line;
            const layout = {
                // Tight margins so stacked plots pack close in multiview. Top is
                // mostly empty space; bottom only needs to fit the x tick labels
                // (plus the axis title when there is one, i.e. non-datetime x).
                // With the colour bar active, tighten the right margin so the plot
                // sits snug against it (the strip itself provides the breathing room).
                // A date x-axis needs only one row of ticks (see tickformatstops), so
                // its bottom margin is tighter than a labelled value axis.
                margin: { l: 60, r: cbarActive() ? 5 : 20, t: 8, b: isXDate ? 26 : (xLabel ? 46 : 38) },
                font: { color: AXIS_COLOR, family: "'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
                xaxis: {
                    type: isXDate ? 'date' : 'linear', showgrid: true, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: xLabel ? { text: xLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined,
                    // Keep each date tick on a single line (Plotly's default splits the
                    // year onto a wasteful second row); the year rides inline instead.
                    tickformatstops: isXDate ? [
                        { dtickrange: [null, 60000], value: '%H:%M:%S' },
                        { dtickrange: [60000, 3600000], value: '%H:%M' },
                        { dtickrange: [3600000, 86400000], value: '%H:%M' },
                        { dtickrange: [86400000, 'M1'], value: "%d %b %Y" },
                        { dtickrange: ['M1', 'M12'], value: "%b %Y" },
                        { dtickrange: ['M12', null], value: '%Y' },
                    ] : undefined,
                },
                yaxis: {
                    showgrid: true, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: yLabel ? { text: yLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined
                },
                hovermode: false,
                plot_bgcolor: 'transparent',
                paper_bgcolor: 'transparent',
                dragmode: 'zoom',
                showlegend: (urlParams.get('cmap') || 'thermal') === 'discrete_09',
                // Overlay the phase legend inside the plot (top-left) rather than
                // outside to the right — keeps the plotting area full width so the
                // x axis lines up with other (colorbar/no-legend) plots in multiview.
                legend: { font: { size: 10, color: AXIS_COLOR }, bgcolor: TC.anno, bordercolor: GRID_COLOR, borderwidth: 1, x: 0.01, xanchor: 'left', y: 0.99, yanchor: 'top' },
            };

            if (xRange) {
                layout.xaxis.range = xRange;
                layout.xaxis.autorange = false;
            } else if (urlParams.has('zXmin') && urlParams.has('zXmax')) {
                // Saved zoom bounds for a date axis come through as epoch-ms strings;
                // Plotly's date axis wants numbers (a numeric string is read as a
                // date string and rejected). Coerce for dates, leave linear as-is.
                const zx0 = urlParams.get('zXmin'), zx1 = urlParams.get('zXmax');
                layout.xaxis.range = isXDate ? [Number(zx0), Number(zx1)] : [zx0, zx1];
                layout.xaxis.autorange = false;
            }

            if (yRange) {
                layout.yaxis.range = isInverted ? [yRange[1], yRange[0]] : yRange;
                layout.yaxis.autorange = false;
            } else if (urlParams.has('zYmin') && urlParams.has('zYmax')) {
                const zYmin = urlParams.get('zYmin');
                const zYmax = urlParams.get('zYmax');
                layout.yaxis.range = isInverted ? [zYmax, zYmin] : [zYmin, zYmax];
                layout.yaxis.autorange = false;
            } else {
                layout.yaxis.autorange = isInverted ? 'reversed' : true;
            }

            return layout;
        }

        function createTraces(data) {
            let cmapName = urlParams.get('cmap') || 'thermal';
            const isDiscrete09 = cmapName === 'discrete_09';
            // Point draw order: 'normal' = file/measurement order (as before),
            // 'largest' = high colour values drawn last (on top), 'smallest' = low
            // values on top. The two "on top" modes also use a smaller marker so the
            // surfaced points sit cleanly over the rest.
            const drawOrder = urlParams.get('draw_order') || 'normal';
            const orderActive = drawOrder === 'largest' || drawOrder === 'smallest';

            // --- Discrete 0-9 mode: one trace per integer value, legend instead of colorbar ---
            if (isDiscrete09 && data.c && data.c.length) {
                const isPhaseMode = (urlParams.get('c_var') || '') === 'SCI_PHASE';
                const byVal = new Map();
                for (let i = 0; i < data.x.length; i++) {
                    const raw = data.c[i];
                    if (raw === null || raw === undefined) continue;
                    const v = Math.round(raw);
                    if (v < 0 || v > 9) continue;
                    if (!byVal.has(v)) byVal.set(v, { x: [], y: [] });
                    byVal.get(v).x.push(data.x[i]);
                    byVal.get(v).y.push(data.y[i]);
                }
                const traces = [];
                for (const v of [...byVal.keys()].sort((a, b) => a - b)) {
                    const pts = byVal.get(v);
                    const label = isPhaseMode ? `${v}: ${SCI_PHASE_NAMES[v] || v}` : String(v);
                    traces.push({
                        x: pts.x, y: pts.y, mode: 'markers', type: 'scattergl',
                        name: label,
                        marker: { size: plotConfig.defaultMarkerSize, color: DISCRETE_09_COLORS[v], opacity: 0.85 },
                        showlegend: true, hoverinfo: 'none',
                    });
                }
                return traces;
            }

            let effectiveColorscale = customColorscales[cmapName] || cmapName;

            let traces = [];

            if (data.qc_applied && urlParams.get('highlight_qc') === 'true') {
                const gx=[], gy=[], gc=[], bx=[], by=[], bc=[];
                for(let i=0; i<data.x.length; i++) {
                    if(data.qc_pass[i]) {
                        gx.push(data.x[i]); gy.push(data.y[i]); 
                        gc.push(data.c ? data.c[i] : null);
                    } else {
                        bx.push(data.x[i]); by.push(data.y[i]);
                        bc.push(data.c ? data.c[i] : null);
                    }
                }
                
                traces.push({
                    x: bx, y: by, mode: 'markers', type: 'scattergl',
                    marker: { size: plotConfig.defaultMarkerSize, color: '#9ca3af', opacity: 0.6 },
                    hoverinfo: 'none', customdata: bc, name: 'Failed QC'
                });
                
                traces.push({
                    x: gx, y: gy, mode: 'markers', type: 'scattergl',
                    marker: {
                        size: plotConfig.defaultMarkerSize,
                        color: gc.length && data.c ? gc : plotConfig.defaultColour, opacity: 0.8,
                        colorscale: gc.length && data.c ? effectiveColorscale : undefined,
                        cmin: data.c_min, cmax: data.c_max, showscale: false, cauto: false
                    },
                    hoverinfo: 'none', customdata: gc, name: 'Passed QC'
                });
            } else {
                let px = data.x, py = data.y, pc = (data.c && data.c.length) ? data.c : null;
                // Reorder so the chosen extreme draws last (on top) — keeps outliers
                // (e.g. backscatter spikes) from hiding behind other points. Markers-
                // only, so reordering doesn't affect WebGL render speed, and we leave
                // data.x/data.c untouched for the running-mean trace below.
                if (pc && orderActive) {
                    const sign = drawOrder === 'smallest' ? -1 : 1;   // largest on top → ascending
                    const order = pc.map((_, i) => i).sort((a, b) => {
                        const va = pc[a], vb = pc[b];
                        const na = va === null || va === undefined, nb = vb === null || vb === undefined;
                        if (na && nb) return 0;
                        if (na) return -1;   // nulls to the bottom
                        if (nb) return 1;
                        return sign * (va - vb);
                    });
                    px = order.map(i => data.x[i]);
                    py = order.map(i => data.y[i]);
                    pc = order.map(i => data.c[i]);
                }
                traces.push({
                    x: px, y: py, mode: 'markers', type: 'scattergl',
                    marker: {
                        size: orderActive ? plotConfig.defaultMarkerSize / 2 : plotConfig.defaultMarkerSize,
                        color: pc ? pc : (cmapName === 'black' ? 'black' : plotConfig.defaultColour),
                        opacity: 0.8,
                        colorscale: pc ? effectiveColorscale : undefined,
                        cmin: data.c_min, cmax: data.c_max, showscale: false, cauto: false
                    },
                    hoverinfo: 'none', customdata: pc || []
                });
            }
            
            return traces;
        }

        function renderPlot(marks) {
            _originalPlotData = plotData;
            _cbarMin = plotData.c_min; _cbarMax = plotData.c_max;

            // Build traces + layout first so the timing can separate CPU trace-building
            // from the WebGL draw. `marks.tBuilt` is read by initPlot's build+draw split.
            const traces = createTraces(plotData);
            const layout = buildLayout(null, null);
            if (marks) marks.tBuilt = performance.timeOrigin + performance.now();

            // Returned so callers (initPlot) can await the actual WebGL draw, not just
            // the synchronous trace-building. The secondary work in .then (profile
            // sidebar, hover wiring) is incidental and not awaited by the timing.
            const drawDone = Plotly.newPlot('plotDiv', traces, layout, { displayModeBar: false, responsive: true, showAxisDragHandles: false, showAxisRangeEntryBoxes: false, editable: false }).then(function(plotDiv) {
                applyCbar();
                renderProfileSidebar();
                let xMin, xMax;
                let yMin = getSafeMin(plotData.y);
                let yMax = getSafeMax(plotData.y);

                if (plotData.is_x_dt) {
                    // x is now UTC epoch-ms numbers (see plot_logic), so the extent is
                    // just the first and last non-null endpoints — no Date parsing, and
                    // these are already in the same UTC-ms space as toNumX so the
                    // multiview align-X / bgFetch comparisons stay consistent. min/max
                    // of the endpoints also covers a reversed (descending) array.
                    const xs = plotData.x;
                    let first = null, last = null;
                    for (let i = 0; i < xs.length; i++) { if (xs[i] !== null) { first = xs[i]; break; } }
                    for (let i = xs.length - 1; i >= 0; i--) { if (xs[i] !== null) { last = xs[i]; break; } }
                    if (first !== null) {
                        xMin = Math.min(first, last); xMax = Math.max(first, last);
                    } else {
                        xMin = Infinity; xMax = -Infinity;
                    }
                } else {
                    xMin = getSafeMin(plotData.x);
                    xMax = getSafeMax(plotData.x);
                }

                _globalExtent = { xMin, xMax, yMin, yMax };

                window.parent.postMessage({
                    type: 'plotLoaded',
                    globalLimits: { xMin, xMax, yMin, yMax, cMin: plotData.c_min, cMax: plotData.c_max },
                    hasC: plotData.c && plotData.c.length > 0,
                    qc_applied: plotData.qc_applied,
                    stats: plotData.stats
                }, '*');

                plotDiv.on('plotly_hover', function(data){
                    if (data.points.length > 0) {
                        const pt = data.points[0];
                        window.parent.postMessage({
                            type: 'plotHover',
                            point: { x: pt.x, y: pt.y, c: pt.customdata !== undefined ? pt.customdata : null }
                        }, '*');
                    }
                });
            });
            
            const plotDiv = document.getElementById('plotDiv');

            // Explicit double-click reset — Plotly's autorange relayout event isn't always
            // reliably emitted after multiple Plotly.react calls (e.g. after Jelly overlays
            // re-render the plot), so we handle the dbl-click directly to guarantee zoom-out.
            plotDiv.on('plotly_doubleclick', function() {
                _suppressRelayout = false;
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);
                _currentZoom = null;
                if (_originalPlotData) {
                    plotData = _originalPlotData;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                }
                window.parent.postMessage({ type: 'plotZoomed', limits: {} }, '*');
                renderProfileSidebar();   // zoom cleared → drop the marginal greying
                return false;
            });

            plotDiv.on('plotly_relayout', function(eventData) {
                if (_suppressRelayout) return;
                const hasXRange = 'xaxis.range[0]' in eventData && 'xaxis.range[1]' in eventData;
                const hasYRange = 'yaxis.range[0]' in eventData && 'yaxis.range[1]' in eventData;
                // Plotly fires `'xaxis.autorange': true` for a normal axis and
                // `'yaxis.autorange': 'reversed'` for an inverted axis after
                // a dbl-click — treat any truthy value as "autoranged".
                const xAuto = !!eventData['xaxis.autorange'];
                const yAuto = !!eventData['yaxis.autorange'];

                if (!hasXRange && !hasYRange && !xAuto && !yAuto) return;

                if (_bgFetchController) {
                    _bgFetchController.abort();
                    _bgFetchController = null;
                }

                if (xAuto && yAuto) {
                    clearTimeout(_pendingBounds);
                    _currentZoom = null;
                    if (_originalPlotData) {
                        plotData = _originalPlotData;
                        Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                        window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                    }
                    window.parent.postMessage({ type: 'plotZoomed', limits: {} }, '*');
                    renderProfileSidebar();   // zoom cleared → drop the marginal greying
                    return;
                }

                const layout = plotDiv.layout || {};
                let xMin, xMax, yMin, yMax;

                if (hasXRange) {
                    xMin = eventData['xaxis.range[0]']; xMax = eventData['xaxis.range[1]'];
                } else if (layout.xaxis && Array.isArray(layout.xaxis.range)) {
                    xMin = layout.xaxis.range[0]; xMax = layout.xaxis.range[1];
                }

                if (hasYRange) {
                    yMin = eventData['yaxis.range[0]']; yMax = eventData['yaxis.range[1]'];
                } else if (layout.yaxis && Array.isArray(layout.yaxis.range)) {
                    yMin = layout.yaxis.range[0]; yMax = layout.yaxis.range[1];
                }

                // Fall back to global extent so a y-only or x-only zoom still triggers bgFetch
                if ((xMin === undefined || xMax === undefined) && _globalExtent) {
                    xMin = _globalExtent.xMin; xMax = _globalExtent.xMax;
                }
                if ((yMin === undefined || yMax === undefined) && _globalExtent) {
                    yMin = _globalExtent.yMin; yMax = _globalExtent.yMax;
                }
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                if (typeof yMin === 'number' && typeof yMax === 'number' && yMin > yMax) {
                    const t = yMin; yMin = yMax; yMax = t;
                }

                _currentZoom = { xMin, xMax, yMin, yMax };
                window.parent.postMessage({ type: 'plotZoomed', limits: { xMin, xMax, yMin, yMax } }, '*');

                clearTimeout(_pendingBounds);
                _pendingBounds = setTimeout(() => { triggerBgFetch(xMin, xMax, yMin, yMax); renderProfileSidebar(); }, 400);
            });

            return drawDone;
        }

        async function triggerBgFetch(xMin, xMax, yMin, yMax) {
            bgSpinner.classList.add('active'); 
            const params = new URLSearchParams(urlParams);
            
            // Plotly emits datetime axis values as naive strings like
            // '2026-04-25 10:08:25.6638'. The server's data is naive UTC, so
            // we MUST parse these as UTC. `new Date(naiveString).getTime()`
            // interprets them as *local* time, which silently shifts the
            // bounds by the user's UTC offset and makes the bounds query
            // match an offset window of data — visible as "missing points".
            const parseAxisDateAsUTC = (s) => {
                if (typeof s === 'number') return s;
                // Convert "YYYY-MM-DD HH:MM:SS[.fff]" to ISO-8601 UTC.
                const iso = String(s).replace(' ', 'T') + 'Z';
                const t = Date.parse(iso);
                return isNaN(t) ? Date.parse(s) : t;
            };
            const isXDate = plotData.is_x_dt;
            let xMinVal = isXDate ? parseAxisDateAsUTC(xMin) : Number(xMin);
            let xMaxVal = isXDate ? parseAxisDateAsUTC(xMax) : Number(xMax);
            let yMinVal = Number(yMin);
            let yMaxVal = Number(yMax);

            // Canonicalise: server expects min < max. Reversed bounds (e.g. inverted
            // axis or right-to-left drag) would otherwise make the padding tighten
            // the range and the >= / <= filter return zero points.
            if (xMinVal > xMaxVal) { const t = xMinVal; xMinVal = xMaxVal; xMaxVal = t; }
            if (yMinVal > yMaxVal) { const t = yMinVal; yMinVal = yMaxVal; yMaxVal = t; }

            // Expand the requested range generously before fetching the high-res
            // chunk. Reasons points at/near the visible edge can otherwise vanish:
            //   - datetime millisecond truncation in `new Date(str).getTime()`
            //   - float drift between Plotly's reported range and raw data values
            //   - Plotly's axis tick padding shows slightly past the box bounds,
            //     so points appearing "on the axis" can lie just outside it
            //   - server's strict >= / <= filter has no tolerance
            // Plotly still clips visually to the exact zoom range, so over-fetching
            // costs nothing visually — extra points are simply outside the viewport.
            const PAD = 0.15;
            const xPad = Math.abs(xMaxVal - xMinVal) * PAD;
            const yPad = Math.abs(yMaxVal - yMinVal) * PAD;

            params.set('x_min', xMinVal - xPad);
            params.set('x_max', xMaxVal + xPad);
            params.set('y_min', yMinVal - yPad);
            params.set('y_max', yMaxVal + yPad);

            // Exact (unpadded) view bounds so the server can report an honest
            // "Points in view" count that excludes the over-fetched margin.
            params.set('view_x_min', xMinVal);
            params.set('view_x_max', xMaxVal);
            params.set('view_y_min', yMinVal);
            params.set('view_y_max', yMaxVal);

            _bgFetchController = new AbortController();

            try {
                const res = await fetch(`/api/plot_data_bounds?${params.toString()}`, {
                    signal: _bgFetchController.signal
                });
                const newData = await res.json();
                if (newData.error) return;

                // Carry over var/unit metadata from the full-dataset load
                if (_originalPlotData) {
                    if (!newData.x_var) newData.x_var = _originalPlotData.x_var;
                    if (!newData.y_var) newData.y_var = _originalPlotData.y_var;
                    if (!newData.x_units) newData.x_units = _originalPlotData.x_units;
                    if (!newData.y_units) newData.y_units = _originalPlotData.y_units;
                }

                plotData = newData;
                plotData._zoomFetchedFor = { xMin, xMax, yMin, yMax };

                const zoom = _currentZoom;
                const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                // yAuto marks an x-only zoom (e.g. a synced time-axis update): keep
                // the y axis autoranged rather than pinning it to the full extent.
                const yRange = (zoom && !zoom.yAuto) ? [zoom.yMin, zoom.yMax] : null;

                _suppressRelayout = true;
                Plotly.react('plotDiv', createTraces(newData), buildLayout(xRange, yRange))
                    .then(() => { _suppressRelayout = false; });

                window.parent.postMessage({ type: 'bgFetchComplete', cMin: newData.c_min, cMax: newData.c_max, plotted: newData.plotted }, '*');

            } catch (err) {
                if (err.name !== 'AbortError') console.error('Background fetch failed:', err);
            } finally {
                bgSpinner.classList.remove('active');
            }
        }

        window.addEventListener('message', function(event) {
            if (!event.data) return;
            const msg = event.data;

            if (msg.type === 'setTheme') {
                const t = msg.theme === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
                if (plotData) {
                    const zoom = _currentZoom;
                    const xRange = zoom ? [zoom.xMin, zoom.xMax] : null;
                    const yRange = zoom ? [zoom.yMin, zoom.yMax] : null;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(xRange, yRange));
                }
                return;
            }

            if (!plotData) return;

            if (msg.type === 'updateLimits') {
                // A datetime x-axis reports its range as date strings (e.g.
                // '2026-04-25 10:08:25.6638'), which Plotly accepts directly — so
                // only number-type bounds are validated with isNaN. (This path is
                // used by the parent's "align time axes" feature, where x bounds
                // arrive as date strings copied from another plot's zoom.)
                const isValidBound = (v) => v !== undefined && v !== null && (typeof v === 'number' ? !isNaN(v) : true);
                const hasX = isValidBound(msg.limits.xMin) && isValidBound(msg.limits.xMax);
                const hasY = isValidBound(msg.limits.yMin) && isValidBound(msg.limits.yMax);
                const invY = urlParams.get('invert_y') === 'true';
                if (!hasX && !hasY) return;

                // Parse an axis bound to a comparable number (ms for date axes).
                const toNumX = (v) => {
                    if (typeof v === 'number') return v;
                    const t = Date.parse(String(v).replace(' ', 'T') + 'Z');
                    return isNaN(t) ? Date.parse(v) : t;
                };
                const gl = _globalExtent || {};

                // Numeric incoming x-range, for "is this a zoom-out?" comparisons.
                let reqXMin, reqXMax;
                if (hasX) {
                    reqXMin = plotData.is_x_dt ? toNumX(msg.limits.xMin) : Number(msg.limits.xMin);
                    reqXMax = plotData.is_x_dt ? toNumX(msg.limits.xMax) : Number(msg.limits.xMax);
                    if (reqXMin > reqXMax) { const t = reqXMin; reqXMin = reqXMax; reqXMax = t; }
                }

                // Decide whether the full downsampled record (_originalPlotData,
                // already in memory) should be shown right now instead of the
                // currently-displayed high-res chunk:
                //   coversFull — the incoming x-range spans our whole data extent
                //     (a synced double-click reset / "show all"). The base record
                //     IS the zoomed-out data, so no server fetch is needed at all.
                //   needBase   — we're showing a narrower zoom chunk that doesn't
                //     cover the new (wider) range, so relayouting it alone would
                //     leave a stale partial slice stretched across the axis until
                //     a fetch trickles in. Drop back to the full record instantly
                //     as a stopgap; the high-res fetch below still upgrades it.
                let coversFull = false, needBase = false;
                if (hasX && _originalPlotData && gl.xMin !== undefined && gl.xMax !== undefined) {
                    const span = Math.abs(gl.xMax - gl.xMin) || 1;
                    const tol = span * 0.01;
                    if (!hasY && reqXMin <= gl.xMin + tol && reqXMax >= gl.xMax - tol) coversFull = true;
                    const c = plotData._zoomFetchedFor;
                    if (c) {
                        const cMin = plotData.is_x_dt ? toNumX(c.xMin) : Number(c.xMin);
                        const cMax = plotData.is_x_dt ? toNumX(c.xMax) : Number(c.xMax);
                        if (reqXMin < cMin || reqXMax > cMax) needBase = true;
                    }
                }

                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);

                const showBase = coversFull || needBase;
                // Was this panel already displaying the full base record (vs a zoomed
                // high-res chunk)? If so, showing the base at a new range is just an axis
                // move — no trace data changes — so we can relayout instead of rebuilding.
                const wasBase = plotData === _originalPlotData;
                if (showBase && !wasBase) plotData = _originalPlotData;

                _suppressRelayout = true;
                if (showBase && !wasBase) {
                    // We swapped a high-res chunk back to the base record: the traces
                    // genuinely changed, so rebuild them, clipped to the requested axis
                    // range (y left autoranged when no y bounds were supplied).
                    Plotly.react('plotDiv', createTraces(plotData),
                        buildLayout(hasX ? [msg.limits.xMin, msg.limits.xMax] : null,
                                    hasY ? [msg.limits.yMin, msg.limits.yMax] : null))
                        .then(() => { _suppressRelayout = false; });
                } else {
                    // Already showing the right data (base record on a zoom-out, or the
                    // current chunk on a zoom-in) — only the axes need to move. A relayout
                    // skips the up-to-200k-point WebGL rebuild a react would do, which is
                    // what made synced panels lag a beat behind the one being driven.
                    const update = {};
                    if (hasX) update['xaxis.range'] = [msg.limits.xMin, msg.limits.xMax];
                    else if (showBase) update['xaxis.autorange'] = true;
                    if (hasY) update['yaxis.range'] = invY ? [msg.limits.yMax, msg.limits.yMin] : [msg.limits.yMin, msg.limits.yMax];
                    else if (showBase) update['yaxis.autorange'] = invY ? 'reversed' : true;
                    Plotly.relayout('plotDiv', update).then(() => { _suppressRelayout = false; });
                }

                const xMin = hasX ? msg.limits.xMin : gl.xMin;
                const xMax = hasX ? msg.limits.xMax : gl.xMax;
                const yMin = hasY ? msg.limits.yMin : gl.yMin;
                const yMax = hasY ? msg.limits.yMax : gl.yMax;
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                // Programmatic relayout doesn't always fire plotly_relayout with the flat-indexed
                // keys (xaxis.range[0], xaxis.range[1]) that the drag handler expects, so we
                // directly drive the same zoom flow here: record the new zoom bounds and notify
                // the parent. An x-only update (no y bounds — e.g. a synced time axis) leaves the
                // y axis autoranged on re-render. `driven` marks this as an alignment-driven echo
                // (not a fresh user zoom) so the parent doesn't re-propagate it into a feedback loop.
                _currentZoom = { xMin, xMax, yMin, yMax, yAuto: !hasY };
                window.parent.postMessage({ type: 'plotZoomed', driven: true, limits: { xMin, xMax, yMin, yMax } }, '*');

                if (showBase) {
                    // We're already showing the base record clipped to this range — either a
                    // full-extent reset (coversFull) or a zoom-OUT past our last-fetched window
                    // (needBase). The base record covers it at full downsample density, so skip
                    // the high-res fetch: re-fetching buys nothing, and across N synced panels it
                    // serializes on the server NETCDF lock and makes multiview zoom-out crawl in
                    // one panel at a time. The render above is the final state — report it done.
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                    renderProfileSidebar();   // match the marginal greying to the synced view
                } else {
                    // A true zoom-IN: the global downsample is too sparse for this narrower
                    // window, so fetch high-res data for it (triggerBgFetch reports completion).
                    _pendingBounds = setTimeout(() => { triggerBgFetch(xMin, xMax, yMin, yMax); renderProfileSidebar(); }, 400);
                }
            }
            
            // Driven reset (e.g. the parent's "align time axes" toggle being turned
            // off) — same effect as a double-click zoom-out, but initiated remotely.
            if (msg.type === 'resetZoom') {
                _suppressRelayout = false;
                if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
                clearTimeout(_pendingBounds);
                _currentZoom = null;
                if (_originalPlotData) {
                    plotData = _originalPlotData;
                    Plotly.react('plotDiv', createTraces(plotData), buildLayout(null, null));
                    window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
                } else {
                    const invY = urlParams.get('invert_y') === 'true';
                    Plotly.relayout('plotDiv', { 'xaxis.autorange': true, 'yaxis.autorange': invY ? 'reversed' : true });
                }
                window.parent.postMessage({ type: 'plotZoomed', driven: true, limits: {} }, '*');
                renderProfileSidebar();   // zoom cleared remotely → drop the marginal greying
                return;
            }

            if (msg.type === 'updateColour' && !isNaN(msg.limits.cMin)) {
                // If dual trace, update the coloured trace (Passed QC / Selection)
                const traceIdx = colouredTraceIdx();
                // Ack once the restyle has actually been applied and painted, so the
                // parent paces the next slider value to this plot's real redraw cost
                // (keeps the slider smooth instead of flooding it with restyles).
                const ackColour = () => requestAnimationFrame(() => {
                    try { window.parent.postMessage({ type: 'colourUpdated' }, '*'); } catch (_) {}
                });
                const p = Plotly.restyle('plotDiv', { 'marker.cmin': [msg.limits.cMin], 'marker.cmax': [msg.limits.cMax] }, [traceIdx]);
                _cbarMin = msg.limits.cMin; _cbarMax = msg.limits.cMax; applyCbar();
                if (p && p.then) p.then(ackColour); else ackColour();
            }

            if (msg.type === 'setMultiview') {
                const nv = !!msg.multiview;
                if (nv !== _multiview) {
                    _multiview = nv;
                    try { Plotly.relayout('plotDiv', { 'margin.r': cbarActive() ? 5 : 20 }); } catch (_) {}
                    applyCbar();
                }
            }
            
            if (msg.type === 'downloadPlot') {
                Plotly.downloadImage('plotDiv', {
                    format: 'png',
                    width: 1200,
                    height: 800,
                    filename: `glider_plot_${urlParams.get('x')}_vs_${urlParams.get('y')}`
                });
            }

            if (msg.type === 'autoColour') {
                if (!plotData || !plotData.c || !plotData.c.length) return;

                const isXDate = plotData.is_x_dt;
                const parseDate = (d) => typeof d === 'string' ? new Date(d.replace(' ', 'T')).getTime() : new Date(d).getTime();

                let calcCMin = Infinity, calcCMax = -Infinity;

                if (msg.bounds) {
                    const xMinNum = isXDate ? parseDate(msg.bounds.xMin) : parseFloat(msg.bounds.xMin);
                    const xMaxNum = isXDate ? parseDate(msg.bounds.xMax) : parseFloat(msg.bounds.xMax);
                    const yMinNum = parseFloat(msg.bounds.yMin);
                    const yMaxNum = parseFloat(msg.bounds.yMax);

                    const SAMPLE_STEP = Math.max(1, Math.floor(plotData.x.length / 5000));
                    for (let i = 0; i < plotData.x.length; i += SAMPLE_STEP) {
                        if (plotData.x[i] === null || plotData.y[i] === null || plotData.c[i] === null) continue;
                        const px = isXDate ? parseDate(plotData.x[i]) : plotData.x[i];
                        const py = plotData.y[i];
                        if (px >= xMinNum && px <= xMaxNum && py >= yMinNum && py <= yMaxNum) {
                            const pc = plotData.c[i];
                            if (pc < calcCMin) calcCMin = pc;
                            if (pc > calcCMax) calcCMax = pc;
                        }
                    }
                }

                const newCMin = calcCMin !== Infinity ? calcCMin : plotData.c_min;
                const newCMax = calcCMax !== -Infinity ? calcCMax : plotData.c_max;

                const traceIdx = colouredTraceIdx();
                Plotly.restyle('plotDiv', { 'marker.cmin': [newCMin], 'marker.cmax': [newCMax] }, [traceIdx]);
                _cbarMin = newCMin; _cbarMax = newCMax; applyCbar();
                window.parent.postMessage({ type: 'autoColourResult', cMin: newCMin, cMax: newCMax }, '*');
            }
        });

        // Plotly's responsive resize keeps the plot sized to its (shifted)
        // container; just re-pin the colour bar to the redrawn drawing area.
        window.addEventListener('resize', () => { if (cbarActive()) requestAnimationFrame(positionCbar); });

        initPlot();
    </script>
</body>
</html>
