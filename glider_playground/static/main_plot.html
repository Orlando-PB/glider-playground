<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>Glider Plot</title>
    <script src="/static/js/console_log.js"></script>
    <script src="/api/plot_presets.js"></script>
    <link rel="stylesheet" href="/static/vendor/tailwind.css">
    <!-- Self-hosted partial Plotly (gl2d bundle), not the full build. -->
    <script src="/static/vendor/plotly-gl2d-2.32.0.min.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-secondary: #a1a9b8;
            --text-muted: #8b93a3;
            --accent: #41658a;
            --border: #262b38;
            --spinner-track: #1f2432;
            --grid: rgba(255,255,255,0.05);
            --title: #e4e7ef;
            --anno-bg: rgba(18,20,32,0.85);
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-secondary: #4b525f;
            --text-muted: #5f6673;
            --accent: #41658a;
            --border: #e2e5ec;
            --spinner-track: #e2e5ec;
            --grid: rgba(0,0,0,0.06);
            --title: #171a22;
            --anno-bg: rgba(255,255,255,0.9);
        }
        body { margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif; color: var(--text-primary); }
        #plotDiv { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        /* Depth-profile marginal (SVG) on the far left; the main plot shifts right (see layoutPlotArea). */
        #profileDiv { position: absolute; top: 0; left: 0; height: 100%; display: none; }

        /* Compact, non-interactive colour bar strip on the right, multiview only. */
        #cbar {
            position: absolute; top: 0; bottom: 0; right: 0; z-index: 6; display: none;
            flex-direction: row; align-items: stretch; gap: 3px;
            padding: 10px 5px 10px 0; box-sizing: border-box;
            pointer-events: none;
        }
        #cbar.active { display: flex; }
        #cbarTitle {
            writing-mode: vertical-rl; transform: rotate(180deg);
            text-align: center; font-size: 9px; font-weight: 600; letter-spacing: 0.03em;
            color: var(--text-secondary); white-space: nowrap; overflow: hidden;
        }
        #cbarBar {
            width: 13px; align-self: stretch;
            border-left: 1px solid var(--border);
        }
        #cbarTicks {
            display: flex; flex-direction: column; justify-content: space-between;
            font-size: 8.5px; color: var(--text-secondary); line-height: 1; padding: 1px 0;
        }
        #cbarTicks span { white-space: nowrap; }
        #cbarMid { color: var(--text-muted); }
        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.3s ease-in-out;
            color: var(--text-muted); font-size: 12px;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--spinner-track); border-top: 3px solid var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #bgSpinner {
            position: absolute; top: 12px; left: 12px;
            width: 16px; height: 16px;
            border: 2px solid var(--spinner-track); border-top: 2px solid var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0; transition: opacity 0.2s ease-in-out;
            pointer-events: none; z-index: 40;
        }
        #bgSpinner.active { opacity: 1; }

        /* Zoom hint / reset pill — replaces Plotly's stock notifier (showTips:false). */
        #zoomHint {
            position: absolute; top: 4px; right: 56px;
            display: flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-radius: 999px;
            font-size: 11px; line-height: 1; letter-spacing: 0.01em;
            color: var(--text-secondary); background: var(--anno-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            cursor: pointer; user-select: none;
            opacity: 0; transform: translateY(-4px); pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.15s ease;
            z-index: 40;
        }
        #zoomHint.active { opacity: 1; transform: none; pointer-events: auto; }
        #zoomHint:hover { color: var(--text-primary); border-color: var(--accent); }
        #zoomHint svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #zoomHint .kbd { color: var(--text-muted); }

        .js-plotly-plot .plotly text { fill: var(--text-secondary) !important; }

        /* Clicked-point readout; its close button also clears the pin on every open globe. */
        #point-bubble {
            display: none; position: absolute; top: 8px; left: 50%;
            transform: translateX(-50%); z-index: 30;
            align-items: flex-start; gap: 8px; padding: 6px 6px 6px 11px;
            border-radius: 8px; color: var(--text-primary);
            background: var(--anno-bg);
            box-shadow: 0 1px 8px rgba(0,0,0,0.35); backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            max-width: calc(100% - 16px); box-sizing: border-box;
        }
        #point-bubble.visible { display: flex; }
        /* Clicked-point marker: a DOM overlay, NOT a layout shape — a relayout per click
           re-creates the scattergl WebGL context and leaks it. */
        #point-pin {
            display: none; position: absolute; z-index: 25; pointer-events: none;
            width: 10px; height: 10px; border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #3b82f6; border: 2px solid #ffffff;
            box-shadow: 0 0 2px rgba(0,0,0,0.4);
        }
        #point-pin.visible { display: block; }
        #point-bubble .pin-dot {
            flex: 0 0 auto; width: 9px; height: 9px; margin-top: 3px;
            border-radius: 50%; background: #3b82f6; border: 1px solid rgba(255,255,255,0.7);
        }
        #point-rows { display: flex; flex-direction: column; gap: 1px; }
        #point-rows .pr { display: flex; gap: 6px; white-space: nowrap; line-height: 1.35; font-size: 11px; }
        #point-rows .pr-label { color: var(--text-muted); font-weight: 600; }
        #point-rows .pr-val {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            user-select: text;
        }
        #point-close {
            flex: 0 0 auto; width: 20px; height: 20px; border: none; border-radius: 5px;
            cursor: pointer; background: transparent; color: var(--text-muted);
            font-size: 13px; line-height: 1; padding: 0;
        }
        #point-close:hover { background: color-mix(in srgb, var(--text-primary) 14%, transparent); color: var(--text-primary); }
    </style>
    <script>
        (function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const theme = params.get('theme') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Fetching data...</span>
    </div>
    <div id="bgSpinner"></div>
    <div id="zoomHint" title="Reset zoom (or double-click the plot)">
        <svg viewBox="0 0 24 24"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></svg>
        <span>Reset zoom</span><span class="kbd">· double-click</span>
    </div>

    <div id="plotDiv" role="img" aria-label="Plot" tabindex="0"></div>
    <div id="point-pin"></div>

    <div id="cbar" aria-hidden="true">
        <div id="cbarBar"></div>
        <div id="cbarTicks">
            <span id="cbarMax"></span>
            <span id="cbarMid"></span>
            <span id="cbarMin"></span>
        </div>
        <div id="cbarTitle"></div>
    </div>

    <!-- Depth-profile marginal (profile_sidebar param). -->
    <div id="profileDiv"></div>

    <!-- Clicked-point readout (top-centre). Populated when a point is clicked. -->
    <div id="point-bubble">
        <span class="pin-dot"></span>
        <div id="point-rows" role="status" aria-live="polite"></div>
        <button id="point-close" type="button" title="Close" aria-label="Close point readout">✕</button>
    </div>

    <script>
        // --- Render timing (absolute epoch-ms). `let`: a warm 'replot' re-seeds these. ---
        let _gpScriptStart = performance.timeOrigin + performance.now();
        const _gpParams = new URLSearchParams(window.location.search);
        // Click / src-set times from the parent; absent when the iframe is opened directly.
        let _gpClick = parseFloat(_gpParams.get('_gpt0')) || _gpScriptStart;
        let _gpSrcSet = parseFloat(_gpParams.get('_gpt1')) || _gpScriptStart;
        // True once re-driven in place, so timing skips stale Navigation/Resource entries.
        let _reused = false;
        // Plotly handlers attach once; guard so a warm replot doesn't stack listeners.
        let _handlersAttached = false;

        // Parse a Server-Timing header ("read;dur=120.5, filter;dur=8.2") into child rows.
        function parseServerTiming(header) {
            if (!header) return null;
            const out = [];
            for (const part of header.split(',')) {
                const m = part.match(/^\s*([^;]+);.*?dur=([\d.]+)/);
                if (m) out.push({ name: m[1].trim(), ms: parseFloat(m[2]), color: '#fbbf24' });
            }
            return out.length ? out : null;
        }

        // Split the load+parse gap into dispatch / html / scripts / eval (best-effort).
        function loadParseChildren() {
            try {
                const nav = performance.getEntriesByType('navigation')[0];
                const origin = performance.timeOrigin;
                const scriptRel = _gpScriptStart - origin;   // perf.now() at script start
                const htmlEnd = nav ? nav.responseEnd : 0;
                // Blocking <script> resources (console_log.js, plotly bundle).
                const scripts = performance.getEntriesByType('resource')
                    .filter(e => e.initiatorType === 'script');
                const lastScriptEnd = scripts.reduce((m, e) => Math.max(m, e.responseEnd), 0);
                const assetsEnd = Math.max(htmlEnd, lastScriptEnd);
                return [
                    { name: 'dispatch', ms: Math.max(0, origin - _gpSrcSet),        color: '#9aa6b8' },
                    { name: 'html',     ms: Math.max(0, htmlEnd),                    color: '#c4a8f5' },
                    { name: 'scripts',  ms: Math.max(0, lastScriptEnd - htmlEnd),    color: '#c4a8f5' },
                    { name: 'eval',     ms: Math.max(0, scriptRel - assetsEnd),      color: '#c4a8f5' },
                ];
            } catch (_) { return null; }
        }

        const bgSpinner = document.getElementById('bgSpinner');
        const zoomHint = document.getElementById('zoomHint');
        zoomHint.addEventListener('click', () => resetZoomToFull());
        // Pill only shows on the active panel (parent sends 'panelActive'); no parent → active.
        let _zoomHintOn = false;
        let _isActivePanel = true;
        function setZoomHint(on) { _zoomHintOn = !!on; zoomHint.classList.toggle('active', _zoomHintOn && _isActivePanel); }

        // Tell the parent this panel was interacted with. Capture phase: Plotly stops propagation.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        let _bgFetchController = null;
        // Aborts the previous main fetch on a warm 'replot' so stale data can't draw over a newer plot.
        let _mainFetchController = null;
        let _pendingBounds = null;
        let _originalPlotData = null;
        let _currentZoom = null;
        let _globalExtent = null;  // full data extent for fallback when autorange hides layout.xaxis.range
        let _suppressRelayout = false;  // true while the draw gate is running a programmatic draw

        // ---- The draw gate: EVERY Plotly draw on plotDiv goes through drawPlot() ----
        // Never draws mid zoom-drag, serialises draws (concurrent reacts corrupt autorange), suppresses its own
        // plotly_relayout, coalesces queued jobs per `key`, and always starts from a macrotask (never inside a Plotly handler).
        const _draw = { busy: false, queue: [], timer: null };
        function drawPlot(key, fn, opts) {
            const o = opts || {};
            return new Promise((resolve, reject) => {
                // Already stale: don't let it supersede a live job of the same key.
                if (o.skipIf && o.skipIf()) { resolve(undefined); return; }
                _draw.queue = _draw.queue.filter(j => {
                    if (j.key !== key) return true;
                    j.resolve(undefined);   // superseded — settle so awaiters continue
                    return false;
                });
                _draw.queue.push({ key, fn, resolve, reject,
                                   suppress: o.suppress !== false, skipIf: o.skipIf || null });
                clearTimeout(_draw.timer);
                _draw.timer = setTimeout(_drawPump, 0);
            });
        }
        function _drawPump() {
            clearTimeout(_draw.timer); _draw.timer = null;
            if (_draw.busy || !_draw.queue.length) return;
            const gd = document.getElementById('plotDiv');
            if (gd && (gd._dragging || gd.querySelector('.zoombox'))) {
                _draw.timer = setTimeout(_drawPump, 50);
                return;
            }
            const job = _draw.queue.shift();
            if (job.skipIf && job.skipIf()) { job.resolve(undefined); _drawPump(); return; }
            _draw.busy = true;
            // A 'data' job runs after Plotly's post-double-click relayout, so the ignore flag can clear.
            if (job.key === 'data') _dblClickPending = false;
            if (job.suppress) _suppressRelayout = true;
            let p;
            try { p = Promise.resolve(job.fn(gd)); } catch (e) { p = Promise.reject(e); }
            p.then(job.resolve, (e) => { console.error('Plot draw failed:', e); job.reject(e); })
             .finally(() => {
                 if (job.suppress) _suppressRelayout = false;
                 _draw.busy = false;
                 _drawPump();
             });
        }
        // Drop every queued draw (a replot brings new data).
        function drawPlotClear() {
            clearTimeout(_draw.timer); _draw.timer = null;
            _draw.queue.splice(0).forEach(j => j.resolve(undefined));
        }
        // Side padding per x edge. Must match index.html unionTimeRange's pad (span * 0.015).
        const SIDE_PAD_FRAC = 0.015;

        // ---- Compact multiview colour bar (mirrors the active colour range) ----
        const CBAR_W = 58;   // px reserved on the right for the colour bar strip
        let _multiview = false;   // set from the URL once urlParams is initialised
        let _cbarMin = null, _cbarMax = null;   // current colour range shown on the bar

        // Depth-profile marginal (left); margins match the main plot so the depth axes line up.
        const SIDEBAR_W = 158;
        let _profileSidebar = false;   // set from the URL once urlParams is initialised

        // CSS gradient stops (low→high) for the current cmap, or null when there's no colour bar.
        function cbarStops() {
            if (!plotData || !plotData.c || !plotData.c.length) return null;
            if ((urlParams.get('cmap') || 'thermal') === 'discrete_09') return null;
            let cmapName = urlParams.get('cmap') || 'thermal';
            if (cmapName === 'black') return null;
            const reversed = cmapName.endsWith('_r');
            const base = reversed ? cmapName.slice(0, -2) : cmapName;
            const stops = cmoceanPalettes[base];
            if (!stops) return null;
            return reversed ? stops.slice().reverse() : stops.slice();
        }

        function cbarActive() { return _multiview && !!cbarStops(); }

        // Index of the coloured scatter trace (always the first).
        function colouredTraceIdx() {
            return 0;
        }

        function fmtCbar(v) {
            if (v === null || v === undefined || isNaN(v)) return '';
            const a = Math.abs(v);
            if (a !== 0 && (a < 0.01 || a >= 100000)) return v.toExponential(1);
            const decimals = a >= 100 ? 0 : a >= 1 ? 1 : 2;
            return Number(v.toFixed(decimals)).toString();
        }

        // Show/hide + rebuild the colour bar; idempotent.
        function applyCbar() {
            const cbar = document.getElementById('cbar');
            const plotDiv = document.getElementById('plotDiv');
            if (!cbar || !plotDiv) return;
            const active = cbarActive();

            layoutPlotArea();   // colour bar (right) shares the plot's sizing with the sidebar (left)
            cbar.classList.toggle('active', active);
            if (!active) return;

            const stops = cbarStops();
            document.getElementById('cbarBar').style.background =
                `linear-gradient(to top, ${stops.join(', ')})`;

            const label = (() => {
                const name = (plotData.c_var || '').trim();
                if (!name) return '';
                const u = (plotData.c_units || '').trim();
                return (u && u !== 'No units') ? `${name} (${u})` : name;
            })();
            document.getElementById('cbarTitle').textContent = label;

            if (_cbarMin === null) _cbarMin = plotData.c_min;
            if (_cbarMax === null) _cbarMax = plotData.c_max;
            document.getElementById('cbarMax').textContent = fmtCbar(_cbarMax);
            document.getElementById('cbarMin').textContent = fmtCbar(_cbarMin);
            document.getElementById('cbarMid').textContent = fmtCbar((_cbarMin + _cbarMax) / 2);
        }

        // Size the main plot around the left sidebar / right colour bar, then resize Plotly.
        function layoutPlotArea() {
            const plotDiv = document.getElementById('plotDiv');
            if (!plotDiv) return;
            const left = _profileSidebar ? SIDEBAR_W : 0;
            // Reserve the gutter for EVERY multiview plot (bar or not) so stacked synced plots line up.
            const right = _multiview ? CBAR_W : 0;
            const wantLeft = left + 'px';
            const wantWidth = `calc(100% - ${left + right}px)`;
            let changed = false;
            if (plotDiv.style.left !== wantLeft) { plotDiv.style.left = wantLeft; changed = true; }
            if (plotDiv.style.width !== wantWidth) { plotDiv.style.width = wantWidth; changed = true; }
            if (changed && plotDiv._fullLayout) drawPlot('resize', gd => Plotly.Plots.resize(gd));
        }

        // ---- Depth-profile marginal (SVG) -------------------------------------
        function buildProfileTraces(pdata) {
            const cmapName = urlParams.get('cmap') || 'thermal';
            const scale = customColorscales[cmapName] || cmapName;
            const SZ = 4;
            const colourMarker = (c) => ({
                size: SZ, opacity: 0.9,
                color: (c && c.length && pdata.c && pdata.c.length) ? c : plotConfig.defaultColour,
                colorscale: (c && c.length && pdata.c && pdata.c.length) ? scale : undefined,
                cmin: pdata.c_min, cmax: pdata.c_max, cauto: false
            });
            // With a filter active: grey full column, coloured selection on top.
            if (pdata.profile_highlight && pdata.in_selection && pdata.in_selection.length === pdata.x.length) {
                const sx=[], sy=[], sc=[], gx=[], gy=[];
                for (let i = 0; i < pdata.x.length; i++) {
                    if (pdata.in_selection[i]) { sx.push(pdata.x[i]); sy.push(pdata.y[i]); sc.push(pdata.c ? pdata.c[i] : null); }
                    else { gx.push(pdata.x[i]); gy.push(pdata.y[i]); }
                }
                return [
                    { x: gx, y: gy, mode: 'markers', type: 'scatter', marker: { size: SZ, color: '#9ca3af', opacity: 0.3 }, hoverinfo: 'none' },
                    { x: sx, y: sy, mode: 'markers', type: 'scatter', marker: colourMarker(sc), hoverinfo: 'none' },
                ];
            }
            return [{ x: pdata.x, y: pdata.y, mode: 'markers', type: 'scatter', marker: colourMarker(pdata.c), hoverinfo: 'none' }];
        }

        function buildProfileLayout(pdata) {
            const TC = readThemeColors();
            const isInverted = urlParams.get('invert_y') === 'true';
            const plotDiv = document.getElementById('plotDiv');
            // Match the main plot's top/bottom margins so the two depth axes line up.
            const m = (plotDiv && plotDiv._fullLayout && plotDiv._fullLayout.margin) || { t: 8, b: 26 };
            return {
                margin: { l: 44, r: 6, t: m.t, b: m.b },
                font: { color: TC.axis, family: "'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
                xaxis: {
                    // Ticks on the bottom, no title (obvious from the main plot).
                    side: 'bottom', showgrid: true, zeroline: false, nticks: 4,
                    gridcolor: TC.grid, linecolor: TC.line, tickcolor: TC.line, tickfont: { color: TC.axis, size: 9 },
                },
                yaxis: {
                    autorange: isInverted ? 'reversed' : true, showgrid: true, zeroline: false,
                    gridcolor: TC.grid, linecolor: TC.line, tickcolor: TC.line, tickfont: { color: TC.axis, size: 9 },
                },
                hovermode: false, plot_bgcolor: 'transparent', paper_bgcolor: 'transparent', showlegend: false,
            };
        }

        // Marginal is built locally from _originalPlotData; only an active sub-selection
        // (payload filtered) needs a fetch — see _profileNeedsFetch.
        let _profileFetchSeq = 0;

        async function renderProfileSidebar() {
            const profileDiv = document.getElementById('profileDiv');
            if (!profileDiv) return;
            const cVar = urlParams.get('c_var');
            if (!_profileSidebar || !plotData || !cVar || cVar === 'black') {
                profileDiv.style.display = 'none';
                try { Plotly.purge('profileDiv'); } catch (_) {}
                layoutPlotArea();
                return;
            }
            profileDiv.style.display = 'block';
            profileDiv.style.width = SIDEBAR_W + 'px';
            layoutPlotArea();   // reserve the left strip on the main plot

            return _profileNeedsFetch() ? _renderProfileSidebarFetch()
                                        : _renderProfileSidebarLocal();
        }

        // True when a filter prunes the main payload, so the greyed context must be fetched.
        function _profileNeedsFetch() {
            return ['profile_num', 'cycle_num', 'sci_phases', 'direction_filter']
                .some(k => { const v = urlParams.get(k); return v !== null && v !== ''; });
        }

        // Axis x value (Plotly date string or number) → epoch-ms. Uses Plotly's own xaxis.r2l:
        // Plotly's emitted date strings follow its own tz convention, so never re-parse them by hand.
        function axisXToMs(v) {
            if (typeof v === 'number') return v;
            if (v === null || v === undefined) return NaN;
            const gd = document.getElementById('plotDiv');
            const xa = gd && gd._fullLayout && gd._fullLayout.xaxis;
            if (xa && typeof xa.r2l === 'function') {
                const m = xa.r2l(v);
                if (typeof m === 'number' && isFinite(m)) return m;
            }
            const t = Date.parse(String(v).replace(' ', 'T') + 'Z');   // axis not ready yet
            return isNaN(t) ? Date.parse(v) : t;
        }

        // Per-point in-zoom flag (null = no zoom); mirrors the server's zoom_mask.
        function _zoomSelectionMask(src) {
            const z = _currentZoom;
            if (!z || z.xMin === undefined || z.xMax === undefined
                   || z.yMin === undefined || z.yMax === undefined) return null;
            const toMs = axisXToMs;
            const isXDate = !!src.is_x_dt;
            const xlo = isXDate ? toMs(z.xMin) : Number(z.xMin);
            const xhi = isXDate ? toMs(z.xMax) : Number(z.xMax);
            const ylo = Number(z.yMin), yhi = Number(z.yMax);
            if (!(isFinite(xlo) && isFinite(xhi) && isFinite(ylo) && isFinite(yhi))) return null;
            const xMin = Math.min(xlo, xhi), xMax = Math.max(xlo, xhi);
            const yMin = Math.min(ylo, yhi), yMax = Math.max(ylo, yhi);
            const xs = src.x, ys = src.y, n = src.y.length;
            const sel = new Array(n);
            let any = false;
            if (isXDate) {
                // x are 'YYYY-MM-DD HH:MM:SS' strings (sort lexicographically) — compare as strings.
                const pad = n => String(n).padStart(2, '0');
                const toStr = ms => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`; };
                const xMinS = toStr(xMin), xMaxS = toStr(xMax);
                for (let i = 0; i < n; i++) {
                    const inside = xs[i] >= xMinS && xs[i] <= xMaxS && ys[i] >= yMin && ys[i] <= yMax;
                    sel[i] = inside; if (inside) any = true;
                }
            } else {
                for (let i = 0; i < n; i++) {
                    const inside = xs[i] >= xMin && xs[i] <= xMax && ys[i] >= yMin && ys[i] <= yMax;
                    sel[i] = inside; if (inside) any = true;
                }
            }
            return any ? sel : null;   // nothing in view → treat as no greying
        }

        // Indices to keep when thinning to `budget` (mirrors the server): selection stays dense. null = keep all.
        function _marginalKeepIdx(n, sel, budget) {
            if (n <= budget) return null;
            const thin = (idx, cap) => {
                if (idx.length <= cap) return idx;
                const step = Math.ceil(idx.length / cap);
                const out = [];
                for (let j = 0; j < idx.length; j += step) out.push(idx[j]);
                return out;
            };
            if (sel) {
                const selIdx = [], ctxIdx = [];
                for (let i = 0; i < n; i++) (sel[i] ? selIdx : ctxIdx).push(i);
                const keep = thin(selIdx, 20000).concat(thin(ctxIdx, budget));
                keep.sort((a, b) => a - b);
                return keep;
            }
            const keep = [];
            const step = Math.ceil(n / budget);
            for (let i = 0; i < n; i += step) keep.push(i);
            return keep;
        }

        // Build + draw the marginal from the payload already in hand — no fetch.
        function _renderProfileSidebarLocal() {
            const profileDiv = document.getElementById('profileDiv');
            const src = _originalPlotData;
            if (!src || !src.c || !src.c.length || src.c.length !== src.y.length) {
                profileDiv.style.display = 'none'; layoutPlotArea(); return null;
            }
            ++_profileFetchSeq;   // supersede any in-flight fetch from a previous render
            const t0 = performance.timeOrigin + performance.now();
            const sel = _zoomSelectionMask(src);
            const keep = _marginalKeepIdx(src.c.length, sel, 2500);
            const pick = (arr) => keep ? keep.map(i => arr[i]) : arr;
            const pdata = {
                x: pick(src.c),   // colour value → horizontal position
                y: pick(src.y),
                c: pick(src.c),
                c_min: src.c_min, c_max: src.c_max,
                c_var: src.c_var, c_units: src.c_units,
                profile_highlight: !!sel,
                in_selection: sel ? (keep ? keep.map(i => sel[i]) : sel) : [],
            };
            Plotly.react('profileDiv', buildProfileTraces(pdata), buildProfileLayout(pdata),
                { displayModeBar: false, responsive: true, staticPlot: true });
            const t1 = performance.timeOrigin + performance.now();
            return { points: pdata.x.length, fetchMs: 0, drawMs: t1 - t0 };
        }

        // Fetch value-vs-depth data + selection flag and draw the marginal (sub-selection only).
        async function _renderProfileSidebarFetch() {
            const profileDiv = document.getElementById('profileDiv');
            const cVar = urlParams.get('c_var');
            // Value on X, depth on Y; light point budget because SVG draws these.
            const p = new URLSearchParams(window.location.search);
            const mainXVar = p.get('x_var');   // colour var becomes this fetch's x_var below
            p.set('x_var', cVar);
            p.set('highlight_profile', 'true');
            p.set('max_points', '2500');
            ['multiview', 'theme', 'profile_sidebar', 'zXmin', 'zXmax', 'zYmin', 'zYmax'].forEach(k => p.delete(k));

            // When zoomed, pass the main x_var + numeric bounds (epoch-ms for dates) so the
            // server flags in-view points via `in_selection`.
            const z = _currentZoom;
            if (z && mainXVar && z.xMin !== undefined && z.xMax !== undefined
                    && z.yMin !== undefined && z.yMax !== undefined) {
                const toMs = axisXToMs;
                const isXDate = plotData && plotData.is_x_dt;
                const xlo = isXDate ? toMs(z.xMin) : Number(z.xMin);
                const xhi = isXDate ? toMs(z.xMax) : Number(z.xMax);
                const ylo = Number(z.yMin), yhi = Number(z.yMax);
                if (isFinite(xlo) && isFinite(xhi) && isFinite(ylo) && isFinite(yhi)) {
                    p.set('zoom_x_var', mainXVar);
                    p.set('zoom_x_min', Math.min(xlo, xhi));
                    p.set('zoom_x_max', Math.max(xlo, xhi));
                    p.set('zoom_y_min', Math.min(ylo, yhi));
                    p.set('zoom_y_max', Math.max(ylo, yhi));
                }
            }

            const seq = ++_profileFetchSeq;
            try {
                // Internal sub-request: folded into the parent's PLOT timing log.
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();
                const t0 = performance.timeOrigin + performance.now();
                const resp = await fetch('/api/plot_data?' + p.toString());
                const pdata = await resp.json();
                const tFetched = performance.timeOrigin + performance.now();
                if (seq !== _profileFetchSeq) return null;   // a newer render superseded this one
                if (pdata.error || !pdata.x || !pdata.x.length) { profileDiv.style.display = 'none'; layoutPlotArea(); return null; }
                Plotly.react('profileDiv', buildProfileTraces(pdata), buildProfileLayout(pdata),
                    { displayModeBar: false, responsive: true, staticPlot: true });
                const tDrawn = performance.timeOrigin + performance.now();
                return { points: pdata.x.length, fetchMs: tFetched - t0, drawMs: tDrawn - tFetched };
            } catch (_) {
                if (seq === _profileFetchSeq) { profileDiv.style.display = 'none'; layoutPlotArea(); }
                return null;
            }
        }

        const plotConfig = {
            defaultMarkerSize: 8,
            defaultColour: '#41658a'
        };

        function readThemeColors() {
            const s = getComputedStyle(document.documentElement);
            const g = (n, fb) => (s.getPropertyValue(n).trim() || fb);
            return {
                axis:  g('--text-secondary', '#a1a9b8'),
                label: g('--text-primary',   '#cdd3de'),
                grid:  g('--grid',           'rgba(255,255,255,0.05)'),
                line:  g('--border',         '#262b38'),
                title: g('--title',          '#e4e7ef'),
                anno:  g('--anno-bg',        'rgba(18,20,32,0.85)')
            };
        }

        // Palettes live in glider_playground/plot_presets.json (served as /api/plot_presets.js).
        const cmoceanPalettes = (window.GP_PLOT_PRESETS || {}).palettes || {};

        const customColorscales = (() => {
            const out = {};
            const stopsToScale = stops => stops.map((c, i) => [i / (stops.length - 1), c]);
            for (const [name, stops] of Object.entries(cmoceanPalettes)) {
                out[name] = stopsToScale(stops);
                out[name + '_r'] = stopsToScale(stops.slice().reverse());
            }
            return out;
        })();

        // Fixed 10-colour palette for integer values 0-9 (phases, QC flags, etc.)
        const DISCRETE_09_COLORS = [
            '#9ca3af',  // 0 – unknown / no QC (grey)
            '#22c55e',  // 1 – ascent / good (green)
            '#3b82f6',  // 2 – descent / probably good (blue)
            '#f97316',  // 3 – surfacing / correctable (orange)
            '#a855f7',  // 4 – parking / bad (purple)
            '#06b6d4',  // 5 – inflection / changed (cyan)
            '#ef4444',  // 6 – propelled (red)
            '#eab308',  // 7 – transition (yellow)
            '#ec4899',  // 8 – (pink)
            '#84cc16',  // 9 – (lime)
        ];

        const SCI_PHASE_NAMES = {
            0: 'Unknown', 1: 'Ascent', 2: 'Descent', 3: 'Surfacing',
            4: 'Parking', 5: 'Inflection', 6: 'Propelled', 7: 'Transition',
            8: 'Phase 8', 9: 'Phase 9',
        };

        let urlParams = new URLSearchParams(window.location.search);
        // Marker opacity; 1.0 is the faster WebGL path (override with &marker_opacity=).
        const MARKER_OPACITY = (() => { const v = parseFloat(urlParams.get('marker_opacity')); return (v >= 0 && v <= 1) ? v : 1.0; })();
        _multiview = (urlParams.get('multiview') === '1');
        _profileSidebar = (urlParams.get('profile_sidebar') === 'true');
        let plotData = null;

        function getSafeMin(arr) {
            let min = Infinity;
            if (!arr) return min;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] < min) min = arr[i];
            }
            return min;
        }

        function getSafeMax(arr) {
            let max = -Infinity;
            if (!arr) return max;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== null && arr[i] > max) max = arr[i];
            }
            return max;
        }

        // Numeric x extent: epoch-ms for a date axis (x are naive-UTC strings), raw numbers otherwise.
        // Shared by buildLayout and the post-render extent report so they can't drift.
        function xDataExtent(xs, isDt) {
            if (!isDt) return { min: getSafeMin(xs), max: getSafeMax(xs) };
            if (!xs) return { min: Infinity, max: -Infinity };
            let first = null, last = null;
            for (let i = 0; i < xs.length; i++) { if (xs[i] !== null) { first = xs[i]; break; } }
            for (let i = xs.length - 1; i >= 0; i--) { if (xs[i] !== null) { last = xs[i]; break; } }
            if (first === null) return { min: Infinity, max: -Infinity };
            const a = new Date(first.replace(' ', 'T') + 'Z').getTime();
            const b = new Date(last.replace(' ', 'T') + 'Z').getTime();
            return { min: Math.min(a, b), max: Math.max(a, b) };
        }

        // Binary container (see _pack_plot_binary): uint32 LE header length, JSON header with an `arrays`
        // descriptor, then each array's raw LE bytes in declared order. NaN = gap; absent optional arrays → [].
        function parsePlotBinary(buf) {
            const dv = new DataView(buf);
            const headerLen = dv.getUint32(0, true);
            const meta = JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(buf, 4, headerLen)));
            const layout = meta.arrays || {};
            delete meta.arrays;
            meta.x = []; meta.y = []; meta.c = []; meta.in_selection = [];
            let off = 4 + headerLen;
            for (const name of Object.keys(layout)) {
                const { dtype, len } = layout[name];
                // slice() copies into a fresh aligned buffer, so the typed view is always valid.
                if (dtype === 'f64') { meta[name] = new Float64Array(buf.slice(off, off + len * 8)); off += len * 8; }
                else if (dtype === 'f32') { meta[name] = new Float32Array(buf.slice(off, off + len * 4)); off += len * 4; }
                else if (dtype === 'u8') { meta[name] = new Uint8Array(buf.slice(off, off + len)); off += len; }
            }
            // Datetime x is packed as epoch-ms f64; convert to naive-UTC 'YYYY-MM-DD HH:MM:SS' strings.
            if (meta.is_x_dt && meta.x instanceof Float64Array) {
                const fa = meta.x;
                const pad = n => String(n).padStart(2, '0');
                const strs = new Array(fa.length);
                for (let i = 0; i < fa.length; i++) {
                    const ms = fa[i];
                    if (!isFinite(ms)) { strs[i] = null; continue; }
                    const d = new Date(ms);
                    strs[i] = `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
                }
                meta.x = strs;
            }
            return meta;
        }

        async function initPlot() {
            // urlParams: the URL query on first load, or the 'replot' message's params.
            if (!urlParams.toString()) return;

            const now = () => performance.timeOrigin + performance.now();
            try {
                // Strip our timing params before forwarding to the API.
                const apiParams = new URLSearchParams(urlParams.toString());
                apiParams.delete('_gpt0'); apiParams.delete('_gpt1');

                // Binary payload: arrays map straight into TypedArrays (no big JSON.parse).
                apiParams.set('binary', '1');

                const tFetchSent = now();
                if (window.gpSkipNextApiLog) window.gpSkipNextApiLog();  // folded into PLOT log
                const fetchUrl = `/api/plot_data?${apiParams.toString()}`;
                if (_mainFetchController) _mainFetchController.abort();   // supersede a prior warm replot's fetch
                const mainController = new AbortController();
                _mainFetchController = mainController;
                const response = await fetch(fetchUrl, { signal: mainController.signal });
                // Superseded after the response resolved — bail rather than race the newer render.
                if (mainController.signal.aborted) return;
                const tFetchResolved = now();
                // Server compute time (seconds) + per-step breakdown from the backend.
                const serverHdr = response.headers && response.headers.get('X-Process-Time');
                const serverMs = serverHdr ? parseFloat(serverHdr) * 1000 : 0;
                const serverChildren = parseServerTiming(response.headers && response.headers.get('Server-Timing'));

                // Binary on success; JSON when the server returned an error dict.
                const ctype = (response.headers && response.headers.get('Content-Type')) || '';
                if (ctype.indexOf('application/octet-stream') !== -1) {
                    plotData = parsePlotBinary(await response.arrayBuffer());
                } else {
                    plotData = await response.json();
                }
                const tJsonParsed = now();

                if (plotData.error) {
                    // Expected (empty/filtered result) — logged as a note, not console.error.
                    const e = new Error(plotData.error);
                    e.expected = true;
                    throw e;
                }

                // renderPlot records trace-build / draw / paint marks into this object.
                const renderMarks = {};
                const tRenderStart = now();
                await renderPlot(renderMarks);
                const tDrawn = now();
                // Wait one frame so the timestamp reflects painted pixels.
                await new Promise(r => requestAnimationFrame(r));
                const tMainPainted = now();
                // Fold the concurrently-started profile-sidebar sub-plot into this plot's timing.
                const profileInfo = renderMarks.profilePromise ? await renderMarks.profilePromise : null;
                const tPainted = now();

                // Timing/logging is diagnostic only — it must NEVER throw out of the render path.
                try {
                    const fetchRoundTrip = tFetchResolved - tFetchSent;
                    // Resource Timing splits body download from parse. Match THIS exact URL — the
                    // profile sidebar also hits /api/plot_data with different params.
                    const res = performance.getEntriesByType('resource')
                        .filter(e => e.name.indexOf(fetchUrl) !== -1)
                        .pop();
                    const absResponseEnd = (res && res.responseEnd)
                        ? performance.timeOrigin + res.responseEnd : 0;
                    const jsonTotal = tJsonParsed - tFetchResolved;
                    const jsonChildren = absResponseEnd ? [
                        { name: 'download', ms: Math.max(0, absResponseEnd - tFetchResolved), color: '#7ec8f7' },
                        { name: 'parse',    ms: Math.max(0, tJsonParsed - absResponseEnd),    color: '#7ec8f7' },
                    ] : null;

                    // Warm reuse: Navigation/Resource entries are stale, so drop the breakdown.
                    const loadParse = _reused ? null : loadParseChildren();
                    const buildDraw = [
                        { name: 'traces', ms: (renderMarks.tBuilt || tRenderStart) - tRenderStart, color: '#86efac' },
                        { name: 'draw',   ms: tDrawn - (renderMarks.tBuilt || tRenderStart),       color: '#86efac' },
                        { name: 'paint',  ms: tMainPainted - tDrawn,                                color: '#86efac' },
                    ];
                    // Phases with sub-steps render as header-only labels (no double count).
                    const phases = [
                        { name: 'parent dispatch', ms: _gpSrcSet - _gpClick,       color: '#9aa6b8' },
                        { name: 'load + parse',    ms: _gpScriptStart - _gpSrcSet,  color: '#c4a8f5',
                          header: !!loadParse, children: loadParse },
                        { name: 'iframe init',     ms: tFetchSent - _gpScriptStart, color: '#9aa6b8' },
                        { name: 'server',          ms: serverMs,                    color: '#fbbf24',
                          header: !!serverChildren, children: serverChildren },
                        { name: 'network',         ms: fetchRoundTrip - serverMs,   color: '#7ec8f7' },
                        { name: 'json read',       ms: jsonTotal,                   color: '#7ec8f7',
                          header: !!jsonChildren, children: jsonChildren },
                        { name: 'build + draw',    ms: tMainPainted - tRenderStart, color: '#86efac',
                          header: true, children: buildDraw },
                    ];
                    // Profile sidebar paints concurrently: charge only the time beyond the main paint.
                    if (profileInfo) {
                        phases.push({ name: 'profile', ms: Math.max(0, tPainted - tMainPainted), color: '#c4a8f5' });
                    }
                    let ptNote = ((plotData.x && plotData.x.length) || 0).toLocaleString() + ' pts';
                    if (profileInfo && profileInfo.points) ptNote += '  +  ' + profileInfo.points.toLocaleString() + ' prof';
                    // Log the request's data-affecting params so a sparse plot shows why.
                    const FILTER_KEYS = ['x_var','y_var','c_var','qc_flags',
                        'profile_num','cycle_num','cycle_var','sci_phases','direction_filter',
                        'zXmin','zXmax','zYmin','zYmax','max_points'];
                    const reqDetail = 'req: ' + FILTER_KEYS
                        .filter(k => apiParams.has(k) && apiParams.get(k) !== '' && apiParams.get(k) !== 'false')
                        .map(k => `${k}=${apiParams.get(k)}`).join('  ');
                    if (window.logPlotTiming) window.logPlotTiming('WebGL Plot', phases, tPainted - _gpClick, ptNote, reqDetail);
                    else window.logRender && window.logRender('WebGL Plot', tPainted - _gpClick);
                } catch (_) { /* never let logging break the render */ }

                // Loaded straight into a saved zoom: no plotly_relayout fires, so drive the
                // high-res in-bounds fetch explicitly.
                if (urlParams.has('zXmin') && urlParams.has('zXmax') &&
                    urlParams.has('zYmin') && urlParams.has('zYmax')) {
                    let zx0 = Number(urlParams.get('zXmin')), zx1 = Number(urlParams.get('zXmax'));
                    let zy0 = Number(urlParams.get('zYmin')), zy1 = Number(urlParams.get('zYmax'));
                    if (!isNaN(zx0) && !isNaN(zx1) && !isNaN(zy0) && !isNaN(zy1)) {
                        if (zx0 > zx1) { const t = zx0; zx0 = zx1; zx1 = t; }
                        if (zy0 > zy1) { const t = zy0; zy0 = zy1; zy1 = t; }
                        _currentZoom = { xMin: zx0, xMax: zx1, yMin: zy0, yMax: zy1 };
                        setZoomHint(true);
                        triggerBgFetch(zx0, zx1, zy0, zy1);
                    }
                }

                const overlay = document.getElementById('overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);

            } catch (err) {
                // Superseded by a newer replot — drop silently.
                if (err && err.name === 'AbortError') return;
                document.getElementById('loadingIcon').style.display = 'none';
                document.getElementById('statusText').style.color = '#ef4444';
                document.getElementById('statusText').textContent = err.message || "Failed to load plot data.";
                if (err && err.expected && window.logNote) window.logNote(err.message);
                else console.error(err);
                window.parent.postMessage({ type: 'plotError', message: err.message }, '*');
            }
        }

        function buildLayout(xRange, yRange) {
            const isXDate = plotData.is_x_dt;
            const isInverted = urlParams.get('invert_y') === 'true';
            const axisLabel = (name, units) => {
                if (!name) return '';
                const u = (units || '').trim();
                return (u && u !== 'No units') ? `${name} (${u})` : name;
            };
            const xLabel = isXDate ? '' : axisLabel(plotData.x_var, plotData.x_units);
            const yLabel = axisLabel(plotData.y_var, plotData.y_units);
            // Screen-reader summary of the plot (axes, colour variable, extents).
            try {
                const ext = (arr, isDt) => {
                    if (isDt) { const e = xDataExtent(arr, true); return [e.min, e.max].map(v => typeof v === 'number' ? new Date(v).toISOString().slice(0, 10) : String(v).slice(0, 10)); }
                    return [getSafeMin(arr), getSafeMax(arr)].map(v => Number(v).toPrecision(4));
                };
                const xr = ext(plotData.x, isXDate), yr = ext(plotData.y, false);
                const cLabel = axisLabel(plotData.c_var, plotData.c_units);
                document.getElementById('plotDiv').setAttribute('aria-label',
                    `Scatter plot. X axis: ${isXDate ? 'time' : xLabel}, from ${xr[0]} to ${xr[1]}. ` +
                    `Y axis: ${yLabel}, from ${yr[0]} to ${yr[1]}${isInverted ? ', inverted' : ''}.` +
                    (cLabel ? ` Coloured by ${cLabel}.` : '') +
                    ` ${(plotData.x || []).length} points. Click a point to read its values.`);
            } catch (_) {}
            const TC = readThemeColors();
            const AXIS_COLOR = TC.axis;
            const AXIS_LABEL_COLOR = TC.label;
            const GRID_COLOR = TC.grid;
            const LINE_COLOR = TC.line;
            // T-S mode: isopycnals are the reference grid, so hide the default gridlines.
            const isTSMode = TS_SALINITY_VARS.includes(plotData.x_var) && TS_TEMP_VARS.includes(plotData.y_var);
            const layout = {
                // Tight margins for multiview stacking. Right margin keys on _multiview (NOT on whether
                // this plot has a bar) so synced plots share an identical plotting box.
                margin: { l: 60, r: _multiview ? 5 : 20, t: 8, b: isXDate ? 26 : (xLabel ? 46 : 38) },
                font: { color: AXIS_COLOR, family: "'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" },
                xaxis: {
                    type: isXDate ? 'date' : 'linear', showgrid: !isTSMode, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: xLabel ? { text: xLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined,
                    // Keep each date tick on a single line; the year rides inline.
                    tickformatstops: isXDate ? [
                        { dtickrange: [null, 60000], value: '%H:%M:%S' },
                        { dtickrange: [60000, 3600000], value: '%H:%M' },
                        { dtickrange: [3600000, 86400000], value: '%H:%M' },
                        { dtickrange: [86400000, 'M1'], value: "%d %b %Y" },
                        { dtickrange: ['M1', 'M12'], value: "%b %Y" },
                        { dtickrange: ['M12', null], value: '%Y' },
                    ] : undefined,
                },
                yaxis: {
                    showgrid: !isTSMode, zeroline: false,
                    gridcolor: GRID_COLOR, linecolor: LINE_COLOR, tickcolor: LINE_COLOR, tickfont: { color: AXIS_COLOR, size: 10 },
                    title: yLabel ? { text: yLabel, font: { size: 11, color: AXIS_LABEL_COLOR }, standoff: 6 } : undefined
                },
                hovermode: false,
                plot_bgcolor: 'transparent',
                paper_bgcolor: 'transparent',
                dragmode: 'zoom',
                showlegend: (urlParams.get('cmap') || 'thermal') === 'discrete_09',
                // Legend overlays the plot (top-left) so the plotting area stays full width in multiview.
                legend: { font: { size: 10, color: AXIS_COLOR }, bgcolor: TC.anno, bordercolor: GRID_COLOR, borderwidth: 1, x: 0.01, xanchor: 'left', y: 0.99, yanchor: 'top' },
            };

            if (xRange) {
                layout.xaxis.range = xRange;
                layout.xaxis.autorange = false;
            } else if (urlParams.has('zXmin') && urlParams.has('zXmax')) {
                // Saved date-axis zoom bounds arrive as epoch-ms strings; coerce to numbers
                // (converted to naive-UTC strings below).
                const zx0 = urlParams.get('zXmin'), zx1 = urlParams.get('zXmax');
                layout.xaxis.range = isXDate ? [Number(zx0), Number(zx1)] : [zx0, zx1];
                layout.xaxis.autorange = false;
            } else {
                // No explicit range: pin one with the SAME side padding as the parent's union range
                // (SIDE_PAD_FRAC) so the on-load sync is a no-op; also clears a stale range on react reuse.
                const { min: xMin, max: xMax } = xDataExtent(plotData.x, plotData.is_x_dt);
                if (isFinite(xMin) && isFinite(xMax) && xMax > xMin) {
                    const pad = (xMax - xMin) * SIDE_PAD_FRAC;
                    layout.xaxis.range = [xMin - pad, xMax + pad];
                    layout.xaxis.autorange = false;
                } else {
                    layout.xaxis.autorange = true;
                }
            }

            // TIMEZONE: never pass epoch-ms NUMBERS into a date axis `range` — Plotly round-trips them via a
            // browser-local string and shifts the axis. Convert to the trace's naive-UTC string format (toNaiveStr).
            if (isXDate && Array.isArray(layout.xaxis.range)) {
                const pad2 = n => String(n).padStart(2, '0');
                const toNaiveStr = (v) => {
                    if (typeof v !== 'number') return v;
                    const d = new Date(v);
                    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}.${String(d.getUTCMilliseconds()).padStart(3, '0')}`;
                };
                layout.xaxis.range = layout.xaxis.range.map(toNaiveStr);
            }

            if (yRange) {
                layout.yaxis.range = isInverted ? [yRange[1], yRange[0]] : yRange;
                layout.yaxis.autorange = false;
            } else if (urlParams.has('zYmin') && urlParams.has('zYmax')) {
                const zYmin = urlParams.get('zYmin');
                const zYmax = urlParams.get('zYmax');
                layout.yaxis.range = isInverted ? [zYmax, zYmin] : [zYmin, zYmax];
                layout.yaxis.autorange = false;
            } else {
                layout.yaxis.autorange = isInverted ? 'reversed' : true;
            }

            // Clicked-point marker is a DOM overlay (#point-pin, see positionPin), not a shape.
            layout.shapes = [];

            return layout;
        }

        // --- T-S diagram density (isopycnal) contours ---
        // Density at atmospheric pressure (Millero & Poisson 1981 / EOS-80 dens0); fine as a visual reference grid.
        function dens0(S, T) {
            const T68 = T * 1.00024;
            const rhoW = 999.842594 + T68 * (6.793952e-2 + T68 * (-9.095290e-3 + T68 * (1.001685e-4 + T68 * (-1.120083e-6 + T68 * 6.536332e-9))));
            return rhoW
                + S * (8.24493e-1 + T68 * (-4.0899e-3 + T68 * (7.6438e-5 + T68 * (-8.2467e-7 + T68 * 5.3875e-9))))
                + S * Math.sqrt(S) * (-5.72466e-3 + T68 * (1.0227e-4 + T68 * -1.6546e-6))
                + 4.8314e-4 * S * S;
        }

        const TS_SALINITY_VARS = ['PRAC_SALINITY', 'ABS_SALINITY'];
        const TS_TEMP_VARS = ['TEMP', 'CONS_TEMP'];

        // Bisect for T at fixed S where dens0(S,T)-1000 == target (density falls monotonically with T).
        function solveIsopycnalT(S, target, tLo, tHi) {
            let fLo = dens0(S, tLo) - 1000 - target;
            let fHi = dens0(S, tHi) - 1000 - target;
            if (fLo === 0) return tLo;
            if (fHi === 0) return tHi;
            if ((fLo > 0) === (fHi > 0)) return null; // target outside [tLo,tHi] density range at this S
            for (let i = 0; i < 25; i++) {
                const tMid = (tLo + tHi) / 2;
                const fMid = dens0(S, tMid) - 1000 - target;
                if ((fMid > 0) === (fLo > 0)) { tLo = tMid; fLo = fMid; } else { tHi = tMid; }
            }
            return (tLo + tHi) / 2;
        }

        function buildDensityContourTraces(data) {
            if (!TS_SALINITY_VARS.includes(data.x_var) || !TS_TEMP_VARS.includes(data.y_var)) return [];
            const sExt = xDataExtent(data.x, false);
            const tExt = xDataExtent(data.y, false);
            if (!isFinite(sExt.min) || !isFinite(sExt.max) || !isFinite(tExt.min) || !isFinite(tExt.max)) return [];
            if (sExt.max <= sExt.min || tExt.max <= tExt.min) return [];
            const sPad = (sExt.max - sExt.min) * 0.05;
            const tPad = (tExt.max - tExt.min) * 0.05;
            const sLo = sExt.min - sPad, sHi = sExt.max + sPad;
            const tLo = tExt.min - tPad, tHi = tExt.max + tPad;

            // Extreme corners bound the sigma-t range (density falls with T, rises with S).
            const sigLo = dens0(sLo, tHi) - 1000;
            const sigHi = dens0(sHi, tLo) - 1000;
            const STEP = 0.5;
            const levelStart = Math.ceil(sigLo / STEP) * STEP;
            const levelEnd = Math.floor(sigHi / STEP) * STEP;
            if (!isFinite(levelStart) || !isFinite(levelEnd) || levelStart > levelEnd) return [];
            const MAX_LEVELS = 60; // guards against a runaway loop on a degenerate range
            const nLevels = Math.min(MAX_LEVELS, Math.round((levelEnd - levelStart) / STEP) + 1);

            const N_SAMPLES = 40;
            const lineX = [], lineY = [];
            const labelX = [], labelY = [], labelText = [];
            for (let li = 0; li < nLevels; li++) {
                const level = levelStart + li * STEP;
                let lastValid = null;
                for (let i = 0; i <= N_SAMPLES; i++) {
                    const s = sLo + (sHi - sLo) * i / N_SAMPLES;
                    const t = solveIsopycnalT(s, level, tLo, tHi);
                    if (t === null) {
                        lineX.push(null); lineY.push(null);
                    } else {
                        lineX.push(s); lineY.push(t);
                        lastValid = { s, t };
                    }
                }
                lineX.push(null); lineY.push(null); // break between isopycnals
                if (lastValid) {
                    labelX.push(lastValid.s); labelY.push(lastValid.t);
                    labelText.push(level.toFixed(1));
                }
            }

            const TC = readThemeColors();
            return [
                {
                    x: lineX, y: lineY, mode: 'lines', type: 'scatter',
                    line: { color: TC.grid === 'rgba(255,255,255,0.05)' ? 'rgba(160,170,190,0.45)' : 'rgba(90,100,120,0.45)', width: 1, dash: 'dot' },
                    hoverinfo: 'none', showlegend: false, connectgaps: false,
                },
                {
                    x: labelX, y: labelY, mode: 'text', type: 'scatter',
                    text: labelText, textposition: 'top left',
                    textfont: { size: 9, color: TC.label },
                    hoverinfo: 'none', showlegend: false,
                },
            ];
        }

        function createTraces(data) {
            const densityContourTraces = buildDensityContourTraces(data);
            let cmapName = urlParams.get('cmap') || 'thermal';
            const isDiscrete09 = cmapName === 'discrete_09';
            // draw_order: 'normal' | 'largest' | 'smallest' | 'outliers' (what draws on top);
            // size_mode: 'small' | 'med' | 'large'.
            const drawOrder = urlParams.get('draw_order') || 'normal';
            const orderActive = drawOrder === 'largest' || drawOrder === 'smallest' || drawOrder === 'outliers';
            const sizeMode = urlParams.get('size_mode') || 'large';   // 'small' | 'med' | 'large'
            const MARKER_SIZE_FACTORS = { small: 0.5, med: 0.75, large: 1 };
            const markerSize = plotConfig.defaultMarkerSize * (MARKER_SIZE_FACTORS[sizeMode] ?? 1);

            // --- Discrete 0-9 mode: one trace per integer value, legend instead of colorbar ---
            if (isDiscrete09 && data.c && data.c.length) {
                const isPhaseMode = (urlParams.get('c_var') || '') === 'SCI_PHASE';
                const byVal = new Map();
                for (let i = 0; i < data.x.length; i++) {
                    const raw = data.c[i];
                    if (raw === null || raw === undefined) continue;
                    const v = Math.round(raw);
                    if (v < 0 || v > 9) continue;
                    if (!byVal.has(v)) byVal.set(v, { x: [], y: [] });
                    byVal.get(v).x.push(data.x[i]);
                    byVal.get(v).y.push(data.y[i]);
                }
                const traces = [];
                for (const v of [...byVal.keys()].sort((a, b) => a - b)) {
                    const pts = byVal.get(v);
                    const label = isPhaseMode ? `${v}: ${SCI_PHASE_NAMES[v] || v}` : String(v);
                    traces.push({
                        x: pts.x, y: pts.y, mode: 'markers', type: 'scattergl',
                        name: label,
                        marker: { size: plotConfig.defaultMarkerSize, color: DISCRETE_09_COLORS[v], opacity: 0.85 },
                        showlegend: true, hoverinfo: 'none',
                    });
                }
                return densityContourTraces.concat(traces);
            }

            let effectiveColorscale = customColorscales[cmapName] || cmapName;

            let traces = densityContourTraces.slice();

            let px = data.x, py = data.y, pc = (data.c && data.c.length) ? data.c : null;
            // Reorder so the chosen extreme draws last (on top); data.x/data.c stay untouched.
            if (pc && orderActive) {
                const sign = drawOrder === 'smallest' ? -1 : 1;   // largest on top → ascending
                const isOutliers = drawOrder === 'outliers';
                // 'outliers': rank by distance from the median.
                let extremityOf = null;
                if (isOutliers) {
                    const finite = Array.from(pc).filter(v => v !== null && v !== undefined && !Number.isNaN(v));
                    finite.sort((a, b) => a - b);
                    const n = finite.length;
                    if (n) {
                        const median = n % 2 ? finite[(n - 1) / 2] : (finite[n / 2 - 1] + finite[n / 2]) / 2;
                        extremityOf = v => Math.abs(v - median);
                    } else {
                        extremityOf = () => 0;
                    }
                }
                // Plain Array, not pc.map(): a typed-array `order` would coerce date-string x values to NaN.
                const order = Array.from({ length: pc.length }, (_, i) => i).sort((a, b) => {
                    const va = pc[a], vb = pc[b];
                    const na = va === null || va === undefined, nb = vb === null || vb === undefined;
                    if (na && nb) return 0;
                    if (na) return -1;   // nulls to the bottom
                    if (nb) return 1;
                    if (isOutliers) return extremityOf(va) - extremityOf(vb);
                    return sign * (va - vb);
                });
                px = order.map(i => data.x[i]);
                py = order.map(i => data.y[i]);
                pc = order.map(i => data.c[i]);
            }
            traces.push({
                x: px, y: py, mode: 'markers', type: 'scattergl',
                marker: {
                    size: markerSize,
                    color: pc ? pc : (cmapName === 'black' ? 'black' : plotConfig.defaultColour),
                    opacity: MARKER_OPACITY,
                    colorscale: pc ? effectiveColorscale : undefined,
                    cmin: data.c_min, cmax: data.c_max, showscale: false, cauto: false
                },
                hoverinfo: 'none', customdata: pc || []
            });

            return traces;
        }

        function renderPlot(marks) {
            _originalPlotData = plotData;
            _cbarMin = plotData.c_min; _cbarMax = plotData.c_max;

            // `marks.tBuilt` is read by initPlot's build+draw timing split.
            const traces = createTraces(plotData);
            const layout = buildLayout(null, null);
            if (marks) marks.tBuilt = performance.timeOrigin + performance.now();

            // Reserve the colour-bar / sidebar strip BEFORE the first draw so Plotly paints once into the final box.
            applyCbar();

            // Returned so initPlot can await the actual draw. Warm reuse → Plotly.react (keeps the
            // WebGL context); first draw → newPlot.
            const PLOT_CFG = { displayModeBar: false, responsive: true, showAxisDragHandles: false, showAxisRangeEntryBoxes: false, editable: false, showTips: false };
            const drawDone = drawPlot('data', gd => gd._fullLayout
                ? Plotly.react(gd, traces, layout, PLOT_CFG)
                : Plotly.newPlot(gd, traces, layout, PLOT_CFG)
            ).then(function(plotDiv) {
                applyCbar();
                // Start the profile sidebar concurrently; initPlot folds its time into the PLOT log.
                const _profilePromise = renderProfileSidebar();
                if (marks) marks.profilePromise = _profilePromise;
                let yMin = getSafeMin(plotData.y);
                let yMax = getSafeMax(plotData.y);
                // Same extent basis buildLayout pads from, so the parent's union range agrees.
                const { min: xMin, max: xMax } = xDataExtent(plotData.x, plotData.is_x_dt);

                _globalExtent = { xMin, xMax, yMin, yMax };

                window.parent.postMessage({
                    type: 'plotLoaded',
                    globalLimits: { xMin, xMax, yMin, yMax, cMin: plotData.c_min, cMax: plotData.c_max },
                    hasC: plotData.c && plotData.c.length > 0,
                    stats: plotData.stats
                }, '*');
            });

            const plotDiv = document.getElementById('plotDiv');

            // Attach Plotly handlers exactly once (they persist across react reuses), and only after
            // the first draw lands — plotDiv.on doesn't exist before that.
            drawDone.then(function() {
            if (_handlersAttached || typeof plotDiv.on !== 'function') return;
            _handlersAttached = true;

            // Re-project the clicked-point pin after every redraw (no-op when nothing is pinned).
            plotDiv.on('plotly_afterplot', positionPin);

            plotDiv.on('plotly_hover', function(data){
                if (data.points.length > 0) {
                    const pt = data.points[0];
                    window.parent.postMessage({
                        type: 'plotHover',
                        point: { x: pt.x, y: pt.y, c: pt.customdata !== undefined ? pt.customdata : null }
                    }, '*');
                }
            });

            // Double-click reset. Plotly then emits its own relayout (from a possibly stale initial range) on the
            // same stack; _dblClickPending makes the relayout handler ignore it, and clears when the reset job runs.
            plotDiv.on('plotly_doubleclick', function() {
                _dblClickPending = true;
                resetZoomToFull();
            });

            plotDiv.on('plotly_relayout', function(eventData) {
                if (_dblClickPending) return;   // Plotly's own post-double-click relayout; reset already queued
                if (_suppressRelayout) return;
                const hasXRange = 'xaxis.range[0]' in eventData && 'xaxis.range[1]' in eventData;
                const hasYRange = 'yaxis.range[0]' in eventData && 'yaxis.range[1]' in eventData;
                // autorange is `true` or 'reversed' (inverted axis) — treat any truthy value as autoranged.
                const xAuto = !!eventData['xaxis.autorange'];
                const yAuto = !!eventData['yaxis.autorange'];

                if (!hasXRange && !hasYRange && !xAuto && !yAuto) return;

                if (_bgFetchController) {
                    _bgFetchController.abort();
                    _bgFetchController = null;
                }

                if (xAuto && yAuto) {
                    // Same reset as plotly_doubleclick — delegate; two racing reacts corrupt autorange.
                    resetZoomToFull();
                    return;
                }

                const layout = plotDiv.layout || {};
                let xMin, xMax, yMin, yMax;

                if (hasXRange) {
                    xMin = eventData['xaxis.range[0]']; xMax = eventData['xaxis.range[1]'];
                } else if (layout.xaxis && Array.isArray(layout.xaxis.range)) {
                    xMin = layout.xaxis.range[0]; xMax = layout.xaxis.range[1];
                }

                if (hasYRange) {
                    yMin = eventData['yaxis.range[0]']; yMax = eventData['yaxis.range[1]'];
                } else if (layout.yaxis && Array.isArray(layout.yaxis.range)) {
                    yMin = layout.yaxis.range[0]; yMax = layout.yaxis.range[1];
                }

                // Fall back to global extent so a y-only or x-only zoom still triggers bgFetch
                if ((xMin === undefined || xMax === undefined) && _globalExtent) {
                    xMin = _globalExtent.xMin; xMax = _globalExtent.xMax;
                }
                if ((yMin === undefined || yMax === undefined) && _globalExtent) {
                    yMin = _globalExtent.yMin; yMax = _globalExtent.yMax;
                }
                if (xMin === undefined || xMax === undefined || yMin === undefined || yMax === undefined) return;

                if (typeof yMin === 'number' && typeof yMax === 'number' && yMin > yMax) {
                    const t = yMin; yMin = yMax; yMax = t;
                }

                // TIMEZONE: resolve date bounds to epoch-ms HERE via this panel's live axis (axisXToMs) before
                // posting — consumers of 'plotZoomed' have no axis to disambiguate Plotly's date strings.
                if (plotData.is_x_dt) {
                    xMin = axisXToMs(xMin);
                    xMax = axisXToMs(xMax);
                }

                _currentZoom = { xMin, xMax, yMin, yMax };
                setZoomHint(true);
                window.parent.postMessage({ type: 'plotZoomed', limits: { xMin, xMax, yMin, yMax } }, '*');

                clearTimeout(_pendingBounds);
                // Fast path: the current chunk already holds every raw point in this window — skip the fetch.
                if (!_skipFetchIfCovered(xMin, xMax, yMin, yMax)) {
                    _pendingBounds = setTimeout(() => { triggerBgFetch(xMin, xMax, yMin, yMax); renderProfileSidebar(); }, 400);
                }
            });

            // Click-to-inspect: hovermode is off (WebGL perf) so plotly_click never fires — own pixel-space hit test,
            // on document in the capture phase (Plotly stops propagation). A double-click's second click removes
            // the marker only if its first click placed it (_lastUpDidPick).
            let _ptDown = null;
            let _lastUpT = 0, _lastUpPos = null, _lastUpOnBubble = false, _lastUpDidPick = false;
            const _PT_MOVE_TOL = 6;
            const _DBL_MS = 300;     // single/double-click discrimination window (≈ Plotly's)
            const _DBL_DIST = 14;    // max px between two clicks to count as a double
            document.addEventListener('pointerdown', (e) => {
                _ptDown = { x: e.clientX, y: e.clientY };
            }, true);
            document.addEventListener('pointerup', (e) => {
                const start = _ptDown; _ptDown = null;
                if (!start) return;
                if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > _PT_MOVE_TOL) return; // a drag/zoom

                const now = performance.now();
                const isDouble = _lastUpPos && (now - _lastUpT) < _DBL_MS &&
                    Math.hypot(e.clientX - _lastUpPos.x, e.clientY - _lastUpPos.y) < _DBL_DIST;
                const onBubble = !!(e.target && e.target.closest && e.target.closest('#point-bubble'));
                const prevOnBubble = _lastUpOnBubble;
                _lastUpT = now; _lastUpPos = { x: e.clientX, y: e.clientY }; _lastUpOnBubble = onBubble;

                if (isDouble) {
                    // Double-click = zoom out, not a pick. Plotly only fires plotly_doubleclick when BOTH clicks
                    // hit its drag layer, so reset ourselves if either landed on the popup.
                    if (_lastUpDidPick) {
                        hidePointBubble();
                        try { window.parent.postMessage({ type: 'plotPointClear' }, '*'); } catch (_) {}
                    }
                    _lastUpDidPick = false;
                    if (onBubble || prevOnBubble) resetZoomToFull();
                    return;
                }

                // Single click on the popup → not a plot pick.
                if (onBubble) { _lastUpDidPick = false; return; }

                // Single click on the plot → pick immediately.
                _lastUpDidPick = handlePlotClick(e.clientX, e.clientY);
            }, true);

            });   // end handler attach (once, after first draw)

            return drawDone;
        }

        // Reset to full extent (double-click zoom-out), restoring the base record. Idempotent: a real
        // double-click reaches here twice (plotly_doubleclick + autorange relayout).
        let _dblClickPending = false;   // set by plotly_doubleclick, cleared when the reset job runs
        function resetZoomToFull() {
            if (_bgFetchController) { _bgFetchController.abort(); _bgFetchController = null; }
            clearTimeout(_pendingBounds);
            _currentZoom = null;
            setZoomHint(false);
            if (_originalPlotData) {
                plotData = _originalPlotData;
                const pd = plotData;
                // Coalesces with any queued 'data' draw so only one react runs; the gate suppresses the
                // react's relayout, which would otherwise read as a fresh zoom.
                drawPlot('data', gd => {
                    _dblClickPending = false;
                    return Plotly.react(gd, createTraces(pd), buildLayout(null, null));
                });
                if (window.logRedraw) window.logRedraw('zoom out (dbl-click)', (plotData.x && plotData.x.length) || 0);
                window.parent.postMessage({ type: 'bgFetchComplete', cMin: plotData.c_min, cMax: plotData.c_max, stats: plotData.stats }, '*');
            } else {
                _dblClickPending = false;
            }
            // With a profile/cycle filter, report the reset as a zoom to THIS panel's filtered extent — an empty
            // `limits` tells the parent to fit every synced panel to the whole-file union (applyUnionRange).
            const hasSelection = urlParams.has('cycle_num') || urlParams.has('profile_num');
            const limits = (hasSelection && _globalExtent) ? { ..._globalExtent } : {};
            window.parent.postMessage({ type: 'plotZoomed', limits }, '*');
            renderProfileSidebar();   // zoom cleared → drop the marginal greying
        }

        // Zoom window in numeric space (epoch-ms for date x), lo<=hi; null if unresolvable.
        function _numViewBox(xMin, xMax, yMin, yMax) {
            const isDt = !!(plotData && plotData.is_x_dt);
            let xlo = isDt ? axisXToMs(xMin) : Number(xMin);
            let xhi = isDt ? axisXToMs(xMax) : Number(xMax);
            let ylo = Number(yMin), yhi = Number(yMax);
            if (xlo > xhi) { const t = xlo; xlo = xhi; xhi = t; }
            if (ylo > yhi) { const t = ylo; ylo = yhi; yhi = t; }
            if (![xlo, xhi, ylo, yhi].every(isFinite)) return null;
            return { xlo, xhi, ylo, yhi };
        }

        // True when the current chunk is complete (un-decimated) and `box` sits within its fetched box.
        function _chunkCovers(box) {
            if (!box || !plotData || !plotData._complete || !plotData._fetchBox) return false;
            const fb = plotData._fetchBox;
            return box.xlo >= fb.xMin && box.xhi <= fb.xMax &&
                   box.ylo >= fb.yMin && box.yhi <= fb.yMax;
        }

        // Count in-view points and stretch the colour scale to the in-view 0.1–99.9 percentiles (matches the
        // server's hi-res refetch). Date x is compared as ISO strings (sort lexicographically).
        function _autoColourInView(box) {
            const xs = plotData.x, ys = plotData.y, cs = plotData.c, n = ys.length;
            const hasC = !!(cs && cs.length);
            let inX;
            if (plotData.is_x_dt) {
                const pad = k => String(k).padStart(2, '0');
                const toStr = ms => { const d = new Date(ms); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`; };
                const sLo = toStr(box.xlo), sHi = toStr(box.xhi);
                inX = i => xs[i] >= sLo && xs[i] <= sHi;
            } else {
                inX = i => xs[i] >= box.xlo && xs[i] <= box.xhi;
            }
            const vals = hasC ? [] : null;
            let cnt = 0;
            for (let i = 0; i < n; i++) {
                if (xs[i] === null || ys[i] === null) continue;
                if (ys[i] < box.ylo || ys[i] > box.yhi || !inX(i)) continue;
                cnt++;
                if (hasC) {
                    const c = cs[i];
                    if (c !== null && c === c) vals.push(c);   // c===c rejects NaN
                }
            }
            let cMin = plotData.c_min, cMax = plotData.c_max;
            if (hasC && vals.length) {
                vals.sort((a, b) => a - b);
                const q = p => vals[Math.min(vals.length - 1, Math.max(0, Math.round(p * (vals.length - 1))))];
                cMin = q(0.001); cMax = q(0.999);                  // 0.1th / 99.9th percentile
                if (cMin === cMax) { cMin = vals[0]; cMax = vals[vals.length - 1]; }
                const traceIdx = colouredTraceIdx();
                drawPlot('colour', gd => Plotly.restyle(gd, { 'marker.cmin': [cMin], 'marker.cmax': [cMax] }, [traceIdx]));
                _cbarMin = cMin; _cbarMax = cMax; applyCbar();
            }
            return { plotted: cnt, cMin, cMax };
        }

        // Skip a redundant hi-res refetch when the chunk already covers the box; returns true when it took over.
        function _skipFetchIfCovered(xMin, xMax, yMin, yMax) {
            const box = _numViewBox(xMin, xMax, yMin, yMax);
            if (!_chunkCovers(box)) return false;
            const r = _autoColourInView(box);
            window.parent.postMessage({ type: 'bgFetchComplete',
                cMin: r.cMin, cMax: r.cMax, plotted: r.plotted }, '*');
            renderProfileSidebar();
            return true;
        }

        async function triggerBgFetch(xMin, xMax, yMin, yMax) {
            bgSpinner.classList.add('active'); 
            const params = new URLSearchParams(urlParams);
            
            const isXDate = plotData.is_x_dt;
            let xMinVal, xMaxVal;
            // TIMEZONE: for a date axis read the window from the axis pixel scale (p2c: pure linear ms math),
