<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Comparison Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #050505; overflow: hidden; }
        .map-container { position: absolute; inset: 0; width: 100vw; height: 100vh; transition: opacity 0.3s ease-in-out; }
        #leaflet-map { z-index: 1; background-color: #a1cae6; }
        #globe-map { z-index: 2; cursor: grab; visibility: hidden; }
        #globe-map:active { cursor: grabbing; }
        
        .hidden-map { opacity: 0; pointer-events: none; }
        
        #overlay { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 100; background: #050505; }
        .control-panel { position: absolute; top: 1rem; right: 1rem; z-index: 150; }
    </style>
</head>
<body>
    <div class="control-panel flex gap-2">
        <button onclick="switchView('2d')" id="btn-2d" class="bg-black/50 hover:bg-black/70 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 backdrop-blur-md border border-white/20 transition-all">
            <span class="material-symbols-outlined text-sm">map</span> 2D FLAT
        </button>
        <button onclick="switchView('3d-tiles')" id="btn-3d-tiles" class="bg-black/50 hover:bg-black/70 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 backdrop-blur-md border border-white/20 transition-all">
            <span class="material-symbols-outlined text-sm">language</span> 3D OCEAN
        </button>
        <button onclick="switchView('3d-dark')" id="btn-3d-dark" class="bg-black/50 hover:bg-black/70 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 backdrop-blur-md border border-white/20 transition-all">
            <span class="material-symbols-outlined text-sm">dark_mode</span> 3D DARK
        </button>
    </div>

    <div id="overlay" class="flex flex-col items-center gap-2 text-gray-400">
        <span class="material-symbols-outlined text-2xl animate-spin" id="loadingIcon">progress_activity</span>
        <span class="text-[10px] font-medium" id="statusText">Initialising Map Engine...</span>
    </div>
    
    <div id="leaflet-map" class="map-container hidden-map"></div>
    <div id="globe-map" class="map-container"></div>

    <script>
        // --- Configuration Variables ---
        const CONFIG = {
            pathColour: '#ffeb3b',
            pathThickness: 2.5,
            cameraAltitude: 0.3,
            darkBackground: '#050505',
            oceanBackground: '#a1cae6',
            globeTexture: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
            bumpMap: 'https://unpkg.com/three-globe/example/img/earth-topology.png'
        };

        // --- Fake Data Generation ---
        function generateSamplePath() {
            const startLat = 45.0;
            const startLng = -35.0;
            const points = [];
            for (let i = 0; i < 150; i++) {
                points.push([
                    startLat + (Math.sin(i * 0.1) * 3), 
                    startLng + (i * 0.3)
                ]);
            }
            return points;
        }

        const samplePath = generateSamplePath();
        let leafletInstance = null;
        let globeInstance = null;

        function switchView(type) {
            const is2D = type === '2d';
            
            document.getElementById('leaflet-map').classList.toggle('hidden-map', is2D === false);
            document.getElementById('globe-map').classList.toggle('hidden-map', is2D === true);

            const activeClass = "bg-yellow-400 text-black px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 transition-all border border-yellow-500 shadow-md";
            const inactiveClass = "bg-black/50 hover:bg-black/70 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-2 backdrop-blur-md border border-white/20 transition-all";
            
            document.getElementById('btn-2d').className = type === '2d' ? activeClass : inactiveClass;
            document.getElementById('btn-3d-tiles').className = type === '3d-tiles' ? activeClass : inactiveClass;
            document.getElementById('btn-3d-dark').className = type === '3d-dark' ? activeClass : inactiveClass;

            if (is2D) {
                setTimeout(() => leafletInstance.invalidateSize(), 100);
            } else {
                if (type === '3d-tiles') {
                    globeInstance
                        .globeImageUrl(null)
                        .bumpImageUrl(null)
                        .globeTileEngineUrl((x, y, l) => `https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/${l}/${y}/${x}`)
                        .backgroundColor(CONFIG.oceanBackground)
                        .atmosphereColor('#ffffff');
                } else if (type === '3d-dark') {
                    globeInstance
                        .globeTileEngineUrl(() => null)
                        .globeImageUrl(CONFIG.globeTexture)
                        .bumpImageUrl(CONFIG.bumpMap)
                        .backgroundColor(CONFIG.darkBackground)
                        .atmosphereColor('#3b82f6');
                }
            }
        }

        function initMaps() {
            try {
                // 1. Initialise Leaflet (2D)
                leafletInstance = L.map('leaflet-map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 13
                }).addTo(leafletInstance);

                const leafletPoly = L.polyline(samplePath, {
                    color: CONFIG.pathColour, weight: CONFIG.pathThickness, opacity: 1, lineJoin: 'round'
                }).addTo(leafletInstance);
                
                leafletInstance.fitBounds(leafletPoly.getBounds());

                // 2. Initialise Globe (3D)
                const formattedPath = samplePath.map(p => ({ lat: p[0], lng: p[1] }));
                
                globeInstance = Globe()
                    (document.getElementById('globe-map'))
                    .showAtmosphere(true)
                    .pathsData([{ coords: formattedPath }])
                    .pathPoints('coords')
                    .pathPointLat('lat')
                    .pathPointLng('lng')
                    .pathColor(() => CONFIG.pathColour)
                    .pathStroke(() => CONFIG.pathThickness);

                // Snap the camera instantly to the start point (0ms transition) for correct lighting
                globeInstance.pointOfView({ 
                    lat: formattedPath[0].lat, 
                    lng: formattedPath[0].lng, 
                    altitude: CONFIG.cameraAltitude 
                }, 0);

                // Wait until the initial state is fully loaded before revealing
                globeInstance.onGlobeReady(() => {
                    document.getElementById('globe-map').style.visibility = 'visible';
                    document.getElementById('overlay').style.display = 'none';
                });

                // Set default starting view
                switchView('3d-tiles');

            } catch (err) {
                document.getElementById('statusText').textContent = 'Error initialising engine';
                console.error(err);
            }
        }

        // --- Keyboard Shortcuts ---
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchView('2d');
            if (e.key === '2') switchView('3d-tiles');
            if (e.key === '3') switchView('3d-dark');
        });

        initMaps();

        window.addEventListener('resize', () => {
            if (globeInstance) globeInstance.width(window.innerWidth).height(window.innerHeight);
            if (leafletInstance) leafletInstance.invalidateSize();
        });
    </script>
</body>
</html>
