<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>3D Ocean Chunk</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <script src="/static/console_log.js"></script>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #6b7280;
            --accent: #5b9cff;
            --spinner-track: #1f2432;
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #7d8492;
            --accent: #1a73e8;
            --spinner-track: #e2e5ec;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,sans-serif;
            color: var(--text-primary);
        }
        #plot3d { width: 100vw; height: 100vh; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.5s ease-in-out;
            color: var(--text-muted); font-size: 11px;
        }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--spinner-track);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Spin pause / resume control — top-left, appears on hover */
        #spinToggle {
            position: absolute; bottom: 8px; right: 8px; z-index: 40;
            width: 26px; height: 26px; border: none; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.45); color: #fff; cursor: pointer;
            font-size: 12px; line-height: 1; opacity: 0; transition: opacity 0.15s, background 0.15s;
        }
        body:hover #spinToggle { opacity: 1; }
        #spinToggle:hover { background: var(--accent); }
        #spinToggle.paused { opacity: 1; }   /* keep visible while paused */
    </style>
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const t = p.get('theme') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Awaiting Dataset...</span>
    </div>

    <div id="plot3d"></div>
    <button id="spinToggle" title="Pause / resume auto-rotate">⏸</button>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'setTheme') return;
            const t = event.data.theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        });

        const earthColour = '#c2b2a4';
        const earthGradientEnd = '#e5d9cc';
        const waterTopColour = '#90e0ef';
        const waterBottomColour = '#004e89'; 
        const waterOpacity = 0.4;
        
        const verticalExaggeration = 100;
        
        const idleDelayMs = 4000; 
        const orbitSpeed = 0.0015;

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id') || urlParams.get('filename');

        if (!fileId) {
            document.getElementById('loadingIcon').style.display = 'none';
            document.getElementById('statusText').textContent = "No dataset selected.";
        } else {
            document.getElementById('statusText').textContent = "Rendering Ocean...";
            const startTime = performance.now();

            fetch(`/api/3d_data?id=${encodeURIComponent(fileId)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    const traces = [];

                    // Horizontal extent, needed up front so the focus depth
                    // stays within a sensible aspect ratio for the viewport.
                    const METERS_PER_DEGREE = 111111;
                    const avgLat = (data.bounds.max_lat + data.bounds.min_lat) / 2;
                    const distY = (data.bounds.max_lat - data.bounds.min_lat) * METERS_PER_DEGREE;
                    const distX = (data.bounds.max_lon - data.bounds.min_lon) * METERS_PER_DEGREE * Math.cos(avgLat * Math.PI / 180);
                    const maxHoriz = Math.max(distX, distY, 1);

                    // Focus vertical range on the glider path, but bound the
                    // focus depth so the scene doesn't clip (too tall) or look
                    // flat (too shallow relative to horizontal extent).
                    let gliderDeepest = 0;
                    for (const z of data.elevation) if (z < gliderDeepest) gliderDeepest = z;
                    const gliderFocusDepth = Math.abs(gliderDeepest) * 1.3 + 20;
                    const minFocusDepth = (1.0 * maxHoriz) / verticalExaggeration;
                    const maxFocusDepth = (3.0 * maxHoriz) / verticalExaggeration;
                    const desiredFocusDepth = Math.min(
                        Math.max(gliderFocusDepth, minFocusDepth, 50),
                        maxFocusDepth
                    );

                    const trueMinZ = Math.min(...data.bathy_z.flat());
                    const displayMinZ = Math.max(-desiredFocusDepth, trueMinZ);
                    // Only render the seafloor if it actually falls within the focus range.
                    // When the ocean is much deeper than the glider dives, clamping all bathy
                    // values to displayMinZ would paint a flat floor at the wrong depth.
                    const showSeafloor = trueMinZ >= displayMinZ;
                    const bathyZ = showSeafloor ? data.bathy_z : null;

                    const minZ = displayMinZ;
                    const baseZ = minZ - (Math.abs(minZ) * 0.15);

                    const xLen = data.bathy_lon.length;
                    const yLen = data.bathy_lat.length;

                    const tiny = 0.00001;

                    const lon0 = data.bathy_lon[0];
                    const lon1 = data.bathy_lon[xLen - 1];
                    const lat0 = data.bathy_lat[0];
                    const lat1 = data.bathy_lat[yLen - 1];

                    const noContours = { contours: { x: {show: false}, y: {show: false}, z: {show: false} } };

                    if (showSeafloor) {
                        const zSouth = bathyZ[0];
                        const zNorth = bathyZ[yLen - 1];
                        const zWest = bathyZ.map(row => row[0]);
                        const zEast = bathyZ.map(row => row[xLen - 1]);

                        traces.push({
                            x: data.bathy_lon, y: data.bathy_lat, z: bathyZ,
                            type: 'surface', colorscale: [[0, earthColour], [1, earthGradientEnd]],
                            showscale: false, hoverinfo: 'skip',
                            lighting: { ambient: 0.6, diffuse: 0.8, specular: 0.1, roughness: 0.6 },
                            ...noContours
                        });

                        const earthWallConfig = {
                            type: 'surface', colorscale: [[0, earthColour], [1, earthColour]],
                            showscale: false, hoverinfo: 'skip',
                            lighting: { ambient: 0.8, diffuse: 0.8, roughness: 0.9 },
                            ...noContours
                        };

                        traces.push({ ...earthWallConfig, x: data.bathy_lon, y: [lat0 - tiny, lat0], z: [Array(xLen).fill(baseZ), zSouth] });
                        traces.push({ ...earthWallConfig, x: data.bathy_lon, y: [lat1, lat1 + tiny], z: [zNorth, Array(xLen).fill(baseZ)] });
                        traces.push({ ...earthWallConfig, x: [lon0 - tiny, lon0], y: data.bathy_lat, z: zWest.map(z => [baseZ, z]) });
                        traces.push({ ...earthWallConfig, x: [lon1, lon1 + tiny], y: data.bathy_lat, z: zEast.map(z => [z, baseZ]) });
                        traces.push({ ...earthWallConfig, x: [lon0 - tiny, lon1 + tiny], y: [lat0 - tiny, lat1 + tiny], z: [[baseZ, baseZ], [baseZ, baseZ]] });
                    }

                    const waterWallConfig = {
                        type: 'surface', 
                        colorscale: [[0, waterBottomColour], [1, waterTopColour]], 
                        cmin: baseZ, cmax: 0,
                        opacity: waterOpacity, showscale: false, hoverinfo: 'skip',
                        lighting: { ambient: 0.8, diffuse: 0.8, roughness: 0.9 },
                        ...noContours
                    };

                    const wZSouth = showSeafloor ? bathyZ[0]              : Array(xLen).fill(baseZ);
                    const wZNorth = showSeafloor ? bathyZ[yLen - 1]        : Array(xLen).fill(baseZ);
                    const wZWest  = showSeafloor ? bathyZ.map(r => r[0])   : Array(yLen).fill(baseZ);
                    const wZEast  = showSeafloor ? bathyZ.map(r => r[xLen - 1]) : Array(yLen).fill(baseZ);

                    traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon1 + tiny], y: [lat0 - tiny, lat1 + tiny], z: [[0, 0], [0, 0]] });
                    traces.push({ ...waterWallConfig, x: data.bathy_lon, y: [lat0 - tiny, lat0], z: [Array(xLen).fill(0), wZSouth] });
                    traces.push({ ...waterWallConfig, x: data.bathy_lon, y: [lat1, lat1 + tiny], z: [wZNorth, Array(xLen).fill(0)] });
                    traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon0], y: data.bathy_lat, z: wZWest.map(z => [0, z]) });
                    traces.push({ ...waterWallConfig, x: [lon1, lon1 + tiny], y: data.bathy_lat, z: wZEast.map(z => [z, 0]) });

                    const hasTemp = data.temp && data.temp.length > 0;

                    traces.push({
                        x: data.lon, y: data.lat, z: data.elevation,
                        mode: 'lines',
                        line: {
                            color: hasTemp ? data.temp : data.elevation,
                            colorscale: hasTemp ? [
                                [0, '#313695'],   
                                [0.25, '#74add1'],
                                [0.5, '#ffffbf'],  
                                [0.75, '#f46d43'],
                                [1, '#a50026']    
                            ] : 'Portland',
                            width: 5,
                            reversescale: hasTemp ? false : true,

                        },
                        type: 'scatter3d', name: 'Glider', hoverinfo: 'skip'
                    });

                    const distZ = Math.abs(baseZ);
                    const aspectX = distX / maxHoriz;
                    const aspectY = distY / maxHoriz;
                    const aspectZ = (distZ / maxHoriz) * verticalExaggeration;

                    const noAxis = { showgrid: false, zeroline: false, showline: false, showticklabels: false, showbackground: false, title: '', visible: false };
                    const layout = {
                        hovermode: false,
                        margin: { l: 0, r: 0, b: 0, t: 0 },
                        paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                        scene: { xaxis: noAxis, yaxis: noAxis, zaxis: noAxis, aspectmode: 'manual', aspectratio: { x: aspectX, y: aspectY, z: aspectZ }, camera: { eye: { x: 1.25, y: -1.25, z: 0.6 } }},
                        showlegend: false
                    };

                    const config = { displayModeBar: false, responsive: true };

                    Plotly.newPlot('plot3d', traces, layout, config).then(() => {
                        window.logRender('3D Map Frontend', performance.now() - startTime);

                        // Fade out the loading overlay
                        const overlay = document.getElementById('overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);

                        const plotDiv = document.getElementById('plot3d');

                        let lastInteractionTime = 0;
                        let currentEye = { x: 1.25, y: -1.25, z: 0.6 };
                        let paused = false;   // hard pause toggled by a click

                        const resetIdle = () => { lastInteractionTime = Date.now(); };

                        plotDiv.on('plotly_relayout', (e) => {
                            if (e && e['scene.camera'] && e['scene.camera'].eye) {
                                currentEye = { ...currentEye, ...e['scene.camera'].eye };
                            } else if (e && e['scene.camera.eye']) {
                                currentEye = { ...currentEye, ...e['scene.camera.eye'] };
                            }
                        });

                        plotDiv.addEventListener('mousedown', resetIdle, true);
                        plotDiv.addEventListener('wheel', resetIdle, true);
                        plotDiv.addEventListener('touchstart', resetIdle, true);
                        plotDiv.addEventListener('touchmove', resetIdle, true);

                        // Pause / resume on a click (not a drag-to-rotate). A click
                        // is a press+release with little movement; a drag rotates and
                        // must NOT toggle the pause.
                        const spinToggle = document.getElementById('spinToggle');
                        const updateSpinIcon = () => {
                            spinToggle.textContent = paused ? '▶' : '⏸';
                            spinToggle.classList.toggle('paused', paused);
                            spinToggle.title = paused ? 'Resume auto-rotate' : 'Pause auto-rotate';
                        };
                        const togglePause = () => { paused = !paused; updateSpinIcon(); };

                        let _downX = 0, _downY = 0, _downT = 0, _moved = false;
                        document.addEventListener('pointerdown', (e) => {
                            _downX = e.clientX; _downY = e.clientY; _downT = Date.now(); _moved = false;
                        }, true);
                        document.addEventListener('pointermove', (e) => {
                            if (Math.abs(e.clientX - _downX) > 4 || Math.abs(e.clientY - _downY) > 4) _moved = true;
                        }, true);
                        document.addEventListener('pointerup', (e) => {
                            if (e.target.closest && e.target.closest('#spinToggle')) return; // button handles itself
                            if (!_moved && (Date.now() - _downT) < 400) togglePause();
                        }, true);
                        spinToggle.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
                        updateSpinIcon();

                        let lastFrameTime = 0;

                        function animate(time) {
                            requestAnimationFrame(animate);

                            if (paused) return;
                            if (Date.now() - lastInteractionTime < idleDelayMs) return;
                            if (time - lastFrameTime < 30) return;
                            
                            lastFrameTime = time;

                            const cx = currentEye.x;
                            const cy = currentEye.y;
                            const cz = currentEye.z;
                            
                            const r = Math.sqrt(cx*cx + cy*cy);
                            let theta = Math.atan2(cy, cx);
                            theta += orbitSpeed; 
                            
                            currentEye = {
                                x: r * Math.cos(theta),
                                y: r * Math.sin(theta),
                                z: cz 
                            };
                            
                            Plotly.relayout('plot3d', { 'scene.camera.eye': currentEye });
                        }
                        
                        requestAnimationFrame(animate);
                    });
                })
                .catch(err => {
                    document.getElementById('loadingIcon').style.display = 'none';
                    document.getElementById('statusText').style.color = '#ef4444';
                    document.getElementById('statusText').textContent = err.message || "Failed to load 3D data.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
