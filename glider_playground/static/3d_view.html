<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>3D Ocean Chunk</title>
    <!-- Self-hosted partial Plotly: gl3d bundle (scatter3d + surface) instead of
         the full ~1MB-gzip build. Cuts parse time and drops a third-party fetch. -->
    <script src="/static/plotly-gl3d-2.32.0.min.js"></script>
    <script src="/static/console_log.js"></script>
    <!-- Decorative scenery (kelp, trees...) behind the "Scenery" style toggle; see static/3d_view/scenery/. -->
    <script src="/static/3d_view/scenery/scenery.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    </noscript>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #6b7280;
            --accent: #5b9cff;
            --spinner-track: #1f2432;
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #7d8492;
            --accent: #1a73e8;
            --spinner-track: #e2e5ec;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,sans-serif;
            color: var(--text-primary);
        }
        #plot3d { width: 100vw; height: 100vh; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.5s ease-in-out;
            color: var(--text-muted); font-size: 11px;
        }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--spinner-track);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ── Style sidebar (collapsible, bottom-right) — same look as the
           map view's Layers panel. ─────────────────────────────────────── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            max-height: calc(100vh - 20px); box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        #layer-panel.collapsed { max-width: none; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; min-height: 0; flex-shrink: 1;
        }
        .fxBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
            white-space: nowrap;
        }
        .fxBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        .fxBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovSwatch { flex: 0 0 auto; }

        #scaleNote {
            position: absolute; bottom: 8px; left: 10px; z-index: 40;
            font-size: 10px; color: var(--text-muted); opacity: 0.8;
            user-select: none;
        }
        #scaleNote a { color: inherit; text-decoration: underline; }
        #scaleNote a:hover { color: var(--text-primary); }

        /* ── Glider position bar (bottom-centre): play/pause + scrub slider +
           time/depth readout. Hidden until the scene has rendered. ─────── */
        #posBar {
            display: none; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 60; align-items: center; gap: 8px; padding: 6px 10px;
            width: clamp(180px, 55%, 520px); box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #posBar.ready { display: flex; }
        #posPlay {
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
            width: 24px; height: 24px; border: none; border-radius: 6px; cursor: pointer;
            background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--text-primary);
        }
        #posPlay:hover { background: color-mix(in srgb, var(--accent) 45%, transparent); }
        #posPlay .material-symbols-outlined { font-size: 16px; }
        #posPlay { position: relative; overflow: visible; }
        #posPlay svg.ring { position: absolute; inset: -3px; width: 30px; height: 30px; pointer-events: none; display: none; }
        #posPlay.cooldown svg.ring { display: block; }
        #posPlay svg.ring circle {
            fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
            transform: rotate(-90deg); transform-origin: 50% 50%;
            stroke-dasharray: 81.7; stroke-dashoffset: 81.7;
        }
        #posPlay.cooldown svg.ring circle { animation: ringFill var(--cooldown, 1.5s) linear forwards; }
        @keyframes ringFill { from { stroke-dashoffset: 81.7; } to { stroke-dashoffset: 0; } }
        #posSlider {
            flex: 1 1 auto; min-width: 60px; margin: 0; cursor: pointer;
            accent-color: #ffd60a; height: 4px;
        }
        #posSpeed {
            flex: 0 0 auto; min-width: 34px; height: 24px; padding: 0 6px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums;
            background: color-mix(in srgb, var(--text-primary) 10%, transparent); color: var(--text-primary);
        }
        #posSpeed:hover { background: color-mix(in srgb, var(--text-primary) 20%, transparent); }
        #posReadout {
            flex: 0 0 auto; font-size: 10px; font-variant-numeric: tabular-nums;
            color: var(--text-muted); white-space: nowrap; text-align: right; line-height: 1.25;
        }
        #posReadout b { color: var(--text-primary); font-weight: 600; }
    </style>
    <script>
        (function() {
            try {
                // Theme from the URL; when absent (the placeholder frame the
                // shell loads before any dataset is picked) inherit the parent
                // shell's theme so an empty panel doesn't flash dark in light mode.
                const p = new URLSearchParams(window.location.search);
                let t = p.get('theme');
                if (!t) { try { t = window.parent.document.documentElement.getAttribute('data-theme'); } catch (_) {} }
                document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Awaiting Dataset...</span>
    </div>

    <div id="plot3d"></div>
    <div id="posBar">
        <button id="posPlay" title="Play glider along track"><span class="material-symbols-outlined">play_arrow</span><svg class="ring" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/></svg></button>
        <input id="posSlider" type="range" min="0" max="0" value="0" step="1" title="Glider position along track">
        <button id="posSpeed" title="Playback speed">1x</button>
        <span id="posReadout"></span>
    </div>
    <span id="scaleNote">Bathymetry data provided by <a href="https://www.ncei.noaa.gov/products/etopo-global-relief-model" target="_blank" rel="noopener">NOAA</a></span>

    <!-- Style sidebar (collapsible). Rows are generated by JS from EFFECTS.
         Hidden until the scene has rendered. -->
    <div id="layer-panel" class="collapsed">
        <button id="layer-header" title="Show style options">
            <span class="material-symbols-outlined">tune</span>
            <span id="layer-title">Style</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body"></div>
    </div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'setTheme') return;
            const t = event.data.theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        });

        const earthColour = '#c2b2a4';
        const earthGradientEnd = '#e5d9cc';
        const earthDeepColour = '#7d7060';     // deep-seabed tone for the depth-shaded ramp
        const landColour = '#a8bf9a';          // faded green for terrain above sea level
        const landGradientEnd = '#c9d8bd';
        const snowColour = '#cfd8df';          // polar land: cool ice-grey, kept off pure white so it reads against the light background
        const snowGradientEnd = '#e9eef2';
        const snowLatCutoff = 60;              // |lat| beyond this is drawn white (Greenland / Antarctica)
        const snowBlendKm = 200;               // width of the green→white blend straddling the cutoff

        // Camera: don't let the user zoom out past this eye distance. The
        // default view already fits the whole chunk, and far-out views hit
        // WebGL depth-precision glitches.
        const maxEyeDist = 2.6;
        const maxEyeDistTrueHeight = 1.9;   // flat true-scale scene z-fights sooner when far away
        const eyeCap = () => (fx.trueHeight ? maxEyeDistTrueHeight : maxEyeDist);
        // ...nor zoom in past this: the pivot sits on the glider, so any closer
        // and the near clip plane starts eating the glider and the seabed.
        const minEyeDist = 0.25;

        // Depth-buffer precision is set by the near/far clip ratio. Plotly's
        // gl-plot3d defaults to 0.01 .. 1000, which wastes almost all of the
        // 24-bit depth range and makes the (very flat) chunk z-fight when the
        // camera pulls back. The scene is ~1 unit across and the eye never
        // gets closer than a few tenths, so tighten the planes. Not a public
        // Plotly option: reach into the live scene, which re-reads these every
        // frame.
        const clipNear = 0.02, clipFar = 12;   // eye never nearer than minEyeDist to the pivot; scene ≲ 3 units across
        const tightenClipPlanes = () => {
            try {
                const gl = document.getElementById('plot3d')._fullLayout.scene._scene.glplot;
                gl.zNear = clipNear; gl.zFar = clipFar;
            } catch (_) {}
        };
        const trackColour = '#ffd60a';       // glider dive track (single bright yellow - reads against blue water)
        const trackAheadColour = '#7a6a10';  // the part of the track still to come: thinner + darker
        const waterTopColour = '#90e0ef';
        const waterBottomColour = '#004e89';
        const waterOpacity = 0.28;   // five translucent panes stack up when looking through the box, so keep each one light

        const verticalExaggeration = 100;
        // Land (bathy values above sea level) gets a much gentler exaggeration
        // than the water column; otherwise coastal hills tower over the scene.
        const landExaggeration = 5;

        // Playback: the glider sweeps the track in trackSeconds (at 1x). The
        // camera follows from behind - it eases round to look from where the
        // glider has come toward where it's going, so the glider sits on the
        // near side with the water ahead in the distance. At the end of the
        // track it holds for endHoldSeconds, then starts again.
        const trackSeconds = 1600;   // at 1x: seconds for the glider to sweep the whole deployment
        const idleOrbitSeconds = 240; // wall clock per full turn: a slow drift so the view never sits dead still (surface waits, hold at the end)
        // Viewing angle relative to "directly behind": wanders smoothly between
        // roughly side-on to port and side-on to starboard (±viewSwingDeg) on
        // two slow, incommensurate periods, so it lingers behind for a while,
        // drifts round to a side view, and comes back - never a snap.
        const viewSwingDeg = 80;
        const viewPeriodsS = [95, 217];
        const endHoldSeconds = 4;    // wall-clock pause at the end before looping
        const camAzimuthTau = 6;     // s: how lazily the camera swings round behind the glider (wall clock)
        const camHeadingMove = 0.08; // scene units the track must progress before the heading counts
        const SPEEDS = [0.1, 0.25, 0.5, 1, 2, 5, 10, 25];
        const cameraTau = 2.0;       // s: camera-centre smoothing time constant (bigger = lazier follow)
        const trackEveryMs = 500;    // past/ahead track split cadence during playback
        const trackLineMax = 4000;   // points in the drawn track line (the split re-uploads both halves; the model still uses every sample)
        const followDist = 1.0;      // scene units: the camera eases in to this if it's further out during playback (never pushes out)
        const leadFrac = 0.3;        // the pivot sits this fraction of the camera distance ahead of the glider, so the glider is off-centre with the water ahead filling the frame
        const cooldownMs = 1500;     // resume delay after a manual rotate/zoom
        // Argo floats. The index only gives us surfacings (position + time per
        // profile), so between two of them the float follows the standard Argo
        // mission synthetically: a short surface stint, descent to park depth,
        // a long drift at park depth, a deeper dip, then the ascent that ends
        // at the next surfacing. Horizontal position is interpolated between
        // the two surfacings, so the float drifts underwater like a real one.
        const ARGO = {
            surfaceH: 1,        // hours at the surface after a profile
            descendH: 6,        // hours from surface to park depth
            parkM: 1000,        // park depth (m) - the mission default
            deepStartH: 12,     // hours before the next surfacing the deep dip begins
            deepEndH: 7,        // hours before the next surfacing the ascent begins
            profileM: 2000,     // profile depth (m)
            leadH: 12,          // show a float this many hours before its first known profile (ascending)
        };
        const argoWindowHours = ARGO.leadH;   // query margin around the deployment span
        const argoLength = 0.03;     // scene units top-to-bottom (same visual size as the glider)
        const buoyLength = 0.014;    // start (green) / end (red) buoys, scene units tall
        const buoyOffset = 0.022;    // scene units sideways from the track end (glider half-length is 0.015)

        // ── Style toggles ────────────────────────────────────────────────
        // Each entry is a row in the Style panel (bottom-right, same look as the
        // map's Layers panel). Flip `def` to change the default; the user's
        // choices persist in localStorage under FX_STORE_KEY.
        const EFFECTS = [
            { key: 'greenLand',  label: 'Colour land',      icon: 'park',          def: true  },
            { key: 'trueHeight', label: 'True height',      icon: 'straighten',    def: false },
            { key: 'scenery',    label: 'Scenery',          icon: 'nature',        def: true  },   // decorative life (static/3d_view/scenery/) + depth-shaded seabed
        ];
        const FX_STORE_KEY = 'gp3d_fx_v3';   // bump when defaults change so they take effect
        const fx = {};
        for (const e of EFFECTS) fx[e.key] = e.def;
        try {
            const saved = JSON.parse(localStorage.getItem(FX_STORE_KEY) || '{}');
            for (const e of EFFECTS) if (typeof saved[e.key] === 'boolean') fx[e.key] = saved[e.key];
        } catch (_) {}
        const saveFx = () => { try { localStorage.setItem(FX_STORE_KEY, JSON.stringify(fx)); } catch (_) {} };


        // ── Colour helpers ───────────────────────────────────────────────
        const hexToRgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
        const rgbToHex = rgb => '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
        const shade = (hex, k) => rgbToHex(hexToRgb(hex).map(v => v * k));
        const lerpHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => v + (B[i] - v) * t)); };

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id') || urlParams.get('filename');

        // ── Style panel ──────────────────────────────────────────────────
        let rerender = null;   // set once data has loaded
        (function buildStylePanel() {
            const body = document.getElementById('layer-body');
            for (const e of EFFECTS) {
                const btn = document.createElement('button');
                btn.className = 'fxBtn';
                btn.dataset.key = e.key;
                btn.title = 'Toggle ' + e.label.toLowerCase();
                btn.innerHTML = `<span class="material-symbols-outlined ovSwatch" style="font-size:14px;">${e.icon}</span>${e.label}`;
                btn.classList.toggle('on', fx[e.key]);
                btn.addEventListener('click', () => {
                    fx[e.key] = !fx[e.key];
                    btn.classList.toggle('on', fx[e.key]);
                    saveFx();
                    if (rerender) rerender();
                });
                body.appendChild(btn);
            }
            document.getElementById('layer-header').addEventListener('click', () => {
                const panel = document.getElementById('layer-panel');
                const collapsed = panel.classList.toggle('collapsed');
                document.getElementById('layer-header').title = collapsed ? 'Show style options' : 'Collapse style options';
            });
        })();

        if (!fileId) {
            document.getElementById('loadingIcon').style.display = 'none';
            document.getElementById('statusText').textContent = "No dataset selected.";
        } else {
            document.getElementById('statusText').textContent = "Rendering Ocean...";
            const startTime = performance.now();

            let currentEye = { x: 1.25, y: -1.25, z: 0.6 };
            // The camera looks at (and orbits around) the glider. Plotly's
            // camera.center / eye are both absolute, in normalised scene units
            // (the data box is centred on the origin and spans aspectratio).
            let currentCenter = { x: 0, y: 0, z: 0 };
            let sceneBox = null;            // ranges + aspect from buildScene, for centerFor()
            const eyeOffset = () => ({ x: currentEye.x - currentCenter.x, y: currentEye.y - currentCenter.y, z: currentEye.z - currentCenter.z });
            const eyeDist = () => { const o = eyeOffset(); return Math.hypot(o.x, o.y, o.z); };
            const clampEye = () => {
                const r = eyeDist();
                const want = r > eyeCap() ? eyeCap() : r < minEyeDist ? minEyeDist : 0;
                if (!want) return false;
                const k = want / r, o = eyeOffset();
                currentEye = { x: currentCenter.x + o.x * k, y: currentCenter.y + o.y * k, z: currentCenter.z + o.z * k };
                return true;
            };
            // Normalised scene position of track point i (horizontal only - the
            // vertical pivot stays at the box centre so the view doesn't bob).
            function centerFor(data, f) {
                if (!sceneBox) return { x: 0, y: 0, z: 0 };
                const B = sceneBox, p = sample(data, f);
                return {
                    x: ((p[0] - B.xRange[0]) / (B.xRange[1] - B.xRange[0]) - 0.5) * B.aspectX,
                    y: ((p[1] - B.yRange[0]) / (B.yRange[1] - B.yRange[0]) - 0.5) * B.aspectY,
                    z: 0,
                };
            }
            // Move the pivot to track point i, carrying the eye with it so the
            // viewing angle/distance are unchanged (the scene slides, not the camera).
            function lookAtIdx(data, i) {
                const c = centerFor(data, i);
                currentEye = { x: currentEye.x + c.x - currentCenter.x, y: currentEye.y + c.y - currentCenter.y, z: currentEye.z + c.z - currentCenter.z };
                currentCenter = c;
            }
            let posIdx = 0;                 // current slider index into the track
            let sceneScale = null;          // data units per scene unit, set by buildScene
            let gliderTraceIdx = -1;
            let pastTraceIdx = -1, aheadTraceIdx = -1;
            let argoTraceIdx = -1;
            let sceneryTraceIdx = -1;       // merged scenery mesh (only when fx.scenery and the seafloor is drawn)
            let buoyModels = null;         // { start: mesh, end: mesh } (green / red buoys), or null if not loaded
            let argoModel = null;           // merged mesh, metres, +z up, origin at hull mid
            let argoFloats = [];            // [{wmo, profs:[{lat,lon,ms}...] sorted}] inside the scene box + deployment window
            let argoShownKey = '';          // which profiles are currently drawn (to skip redundant updates)
            let gliderModel = null;         // merged { x,y,z,i,j,k,cell,colorscale,length } in metres, +x nose, +z up

            // Catmull-Rom upsample of the bathy grid to about `target` points
            // along its longer side (integer factor, at most 4×). Lon/lat are
            // linear; heights get a smooth cubic through the samples, so the
            // mesh facets get finer without adding steps. Factor 1 = untouched.
            const bathyUpsampleTo = 160;
            const coastStepFrac = 0.012;   // land's minimum height as a fraction of the box depth (coast step)
            function upsampleGrid(lon, lat, z, target) {
                const nx = lon.length, ny = lat.length;
                const f = Math.min(4, Math.max(1, Math.round(target / Math.max(nx, ny))));
                if (f === 1 || nx < 2 || ny < 2) return { lon, lat, z };
                const NX = (nx - 1) * f + 1, NY = (ny - 1) * f + 1;
                const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
                const at = (arr, i) => arr[Math.max(0, Math.min(arr.length - 1, i))];
                const lin = (arr, N) => { const o = new Array(N); for (let X = 0; X < N; X++) { const i = Math.floor(X / f), t = (X % f) / f; o[X] = i + 1 < arr.length ? arr[i] + (arr[i + 1] - arr[i]) * t : arr[i]; } return o; };
                const rows = z.map(row => { const o = new Array(NX); for (let X = 0; X < NX; X++) { const i = Math.floor(X / f), t = (X % f) / f; o[X] = t ? cr(at(row, i - 1), row[i], at(row, i + 1), at(row, i + 2), t) : row[i]; } return o; });
                const Z = new Array(NY);
                for (let Y = 0; Y < NY; Y++) {
                    const j = Math.floor(Y / f), t = (Y % f) / f;
                    if (!t) { Z[Y] = rows[j]; continue; }
                    const r0 = at(rows, j - 1), r1 = rows[j], r2 = at(rows, j + 1), r3 = at(rows, j + 2), o = new Array(NX);
                    for (let X = 0; X < NX; X++) o[X] = cr(r0[X], r1[X], r2[X], r3[X], t);
                    Z[Y] = o;
                }
                return { lon: lin(lon, NX), lat: lin(lat, NY), z: Z };
            }

            // Build the full trace list + layout for the current `fx` settings.
            function buildScene(data) {
                const traces = [];

                // True height: X, Y and Z all to the same scale (no vertical
                // exaggeration for water or land).
                const vExag = fx.trueHeight ? 1 : verticalExaggeration;
                const lExag = fx.trueHeight ? 1 : landExaggeration;

                // Horizontal extent, needed up front so the focus depth
                // stays within a sensible aspect ratio for the viewport.
                const METERS_PER_DEGREE = 111111;
                const avgLat = (data.bounds.max_lat + data.bounds.min_lat) / 2;
                const cosLat = Math.cos(avgLat * Math.PI / 180);
                const distY = (data.bounds.max_lat - data.bounds.min_lat) * METERS_PER_DEGREE;
                const distX = (data.bounds.max_lon - data.bounds.min_lon) * METERS_PER_DEGREE * cosLat;
                const maxHoriz = Math.max(distX, distY, 1);

                // Focus vertical range on the glider path, but bound the
                // focus depth so the scene doesn't clip (too tall) or look
                // flat (too shallow relative to horizontal extent).
                let gliderDeepest = 0;
                for (const z of data.elevation) if (z < gliderDeepest) gliderDeepest = z;
                const gliderFocusDepth = Math.abs(gliderDeepest) * 1.3 + 20;
                const minFocusDepth = (1.0 * maxHoriz) / vExag;
                const maxFocusDepth = (3.0 * maxHoriz) / vExag;
                const desiredFocusDepth = Math.min(
                    Math.max(gliderFocusDepth, minFocusDepth, 50),
                    maxFocusDepth

                const trueMinZ = Math.min(...data.bathy_z.flat());
                const displayMinZ = Math.max(-desiredFocusDepth, trueMinZ);
                // Only render the seafloor if it actually falls within the focus range.
                // When the ocean is much deeper than the glider dives, clamping all bathy
                // values to displayMinZ would paint a flat floor at the wrong depth.
                const showSeafloor = trueMinZ >= displayMinZ;
                // The scene's aspect ratio applies vExag to every
                // z value, so scale positive (land) heights down here so they end

                // Smoothly upsample the (≤ ~80²) bathy grid before meshing so

                const bLon = grid.lon, bLat = grid.lat;
                // Land gets a small minimum height (a fraction of the box depth)

                const bathyZ = showSeafloor
                    ? grid.z.map(row => row.map(z => (z > 0 ? Math.max(z * landScale, coastStep) : z)))
                    : null;

                const minZ = displayMinZ;
                // Base slab thickness. At true scale the seabed relief is a few
                // thousandths of the horizontal span, so give the slab a visible
                // thickness (decorative only) or the walls z-fight into noise.
                const baseZ = fx.trueHeight
                    ? minZ - Math.max(Math.abs(minZ) * 0.15, maxHoriz * 0.02)
                    : minZ - (Math.abs(minZ) * 0.15);
                const distZ = Math.abs(baseZ);

                const xLen = bLon.length;
                const yLen = bLat.length;

                const tiny = 0.00001;

                const lon0 = bLon[0];
                const lon1 = bLon[xLen - 1];
                const lat0 = bLat[0];
                const lat1 = bLat[yLen - 1];

                const noContours = { contours: { x: {show: false, highlight: false}, y: {show: false, highlight: false}, z: {show: false, highlight: false} } };


                if (showSeafloor) {
                    const flat = bathyZ.flat();
                    const bathyMax = Math.max(...flat);
                    const bathyMin = Math.min(...flat);

                    // Colour ramp as [[z, hex]] stops: earth tones below sea
                    // level (optionally darkening with depth) and green (or more
                    // earth) above.
                    // `snow` (0..1) blends the land colours towards white for
                    // polar latitudes.
                    const makeStops = (snow) => {
                        const stops = [];
                        if (bathyMin < 0) {
                            // Scenery on: seabed darkens with depth; off: plain earth ramp.
                            stops.push([bathyMin, fx.scenery ? earthDeepColour : earthColour]);
                            stops.push([0, fx.scenery ? earthColour : earthGradientEnd]);
                        }
                        if (bathyMax > 0) {
                            const lc  = fx.greenLand ? lerpHex(landColour, snowColour, snow) : earthColour;
                            const lce = fx.greenLand ? lerpHex(landGradientEnd, snowGradientEnd, snow) : earthGradientEnd;
                            stops.push([Math.max(0, bathyMin), lc]);
                            stops.push([bathyMax, lce]);

                        return stops;

                    // 1 poleward, smooth blend across snowBlendKm.
                    const blendDeg = snowBlendKm / 111.111;
                    const snowAt = (lat) => {
                        if (!fx.greenLand || bathyMax <= 0) return 0;

                        const c = Math.max(0, Math.min(1, t));
                        return c * c * (3 - 2 * c);
                    };
