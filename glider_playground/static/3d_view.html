                }

                const noAxis = { showgrid: false, zeroline: false, showline: false, showticklabels: false, showbackground: false, title: '', visible: false };
                const layout = {
                    hovermode: false,
                    margin: { l: 0, r: 0, b: 0, t: 0 },
                    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                    scene: {
                        xaxis: { ...noAxis, range: xRange, autorange: false },
                        yaxis: { ...noAxis, range: yRange, autorange: false },
                        zaxis: { ...noAxis, range: zRange, autorange: false },
                        aspectmode: 'manual', aspectratio: { x: aspectX, y: aspectY, z: aspectZ }, camera: { eye: { ...currentEye }, center: { ...currentCenter } }
                    },
                    showlegend: false
                };
                return { traces, layout };
            }

            // ── Glider marker geometry ───────────────────────────────────
            // Model meshes (static/3d_view/models/<kind>.json) are in metres, +x nose, y across the wings, +z up.
            // Placement is done in scene units (via sceneScale), then converted back to lon/lat/depth for Plotly.
            const gliderLength = 0.03;     // scene units nose-to-tail (scene is ~1 unit across)

            // Track split at index i; both halves share the current point. The line is every sample unless
            // trackLineMax caps it (then a decimated copy with the exact current sample spliced in).
            let trackLine = null;   // { idx: [sample indices], x, y, z }
            function trackGeometry(data, i) {
                if (!trackLine) {
                    const n = data.lon.length, step = Math.max(1, Math.ceil(n / trackLineMax)), idx = [];
                    for (let q = 0; q < n; q += step) idx.push(q);
                    if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
                    trackLine = { idx, x: idx.map(q => data.lon[q]), y: idx.map(q => data.lat[q]), z: idx.map(q => data.elevation[q]) };
                }
                const L = trackLine;
                // First decimated point strictly after i.
                let lo = 0, hi = L.idx.length;
                while (lo < hi) { const mid = (lo + hi) >> 1; if (L.idx[mid] <= i) lo = mid + 1; else hi = mid; }
                // Include every sample between the neighbouring decimated points and i so the line end follows the real path.
                const from = lo > 0 ? L.idx[lo - 1] + 1 : 0, to = lo < L.idx.length ? L.idx[lo] : i + 1;
                const seg = (arr, a, b) => arr.slice(a, b);
                return {
                    past:  { x: L.x.slice(0, lo).concat(seg(data.lon, from, i + 1)), y: L.y.slice(0, lo).concat(seg(data.lat, from, i + 1)), z: L.z.slice(0, lo).concat(seg(data.elevation, from, i + 1)) },
                    ahead: { x: seg(data.lon, i, to).concat(L.x.slice(lo)), y: seg(data.lat, i, to).concat(L.y.slice(lo)), z: seg(data.elevation, i, to).concat(L.z.slice(lo)) },
                };
            }

            // The bright line's tip: samples from the last split (i0) to fractional position f; pushed every frame.
            function tipGeometry(data, i0, f) {
                const p = sample(data, f), x = [], y = [], z = [];
                for (let q = Math.max(0, i0); q <= Math.floor(f) && q < data.lon.length; q++) { x.push(data.lon[q]); y.push(data.lat[q]); z.push(data.elevation[q]); }
                x.push(p[0]); y.push(p[1]); z.push(p[2]);
                if (x.length < 2) { x.push(p[0]); y.push(p[1]); z.push(p[2]); }
                return { x, y, z };
            }

            // Track point at fractional index f (linear between samples).
            function sample(data, f) {
                const n = data.lon.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                return [data.lon[i0] + (data.lon[i1] - data.lon[i0]) * t,
                        data.lat[i0] + (data.lat[i1] - data.lat[i0]) * t,
                        data.elevation[i0] + (data.elevation[i1] - data.elevation[i0]) * t];
            }

            // Interpolated value of a per-point array (null if either neighbour is missing).
            function sampleVar(arr, f) {
                if (!arr) return null;
                const n = arr.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                const a = arr[i0], b = arr[i1];
                if (a == null || b == null) return null;
                return a + (b - a) * t;
            }

            // Horizontal unit heading (scene units) at sample `from`, looking `dir` (+1/-1) along the track
            // until it has moved at least `minMove`. Falls back to east.
            function horizHeading(data, from, dir, minMove) {
                const S = sceneScale, n = data.lon.length;
                let hx = 0, hy = 0, j = from;
                for (let step = 0; step < n; step++) {
                    j += dir;
                    if (j < 0 || j >= n) break;
                    hx = (data.lon[j] - data.lon[from]) / S.kx; hy = (data.lat[j] - data.lat[from]) / S.ky;
                    if (Math.hypot(hx, hy) >= minMove) break;
                }
                if (dir < 0) { hx = -hx; hy = -hy; }
                const hl = Math.hypot(hx, hy);
                return hl > 1e-9 ? [hx / hl, hy / hl] : [1, 0];
            }

            // Broad direction of travel around fractional index f for the camera: unit [hx, hy] in scene units,
            // or null when the track loops back on itself.
            function travelHeading(data, f) {
                const S = sceneScale, n = data.lon.length;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky]; };
                const c = P(f);
                let W = Math.max(2, n / 400);
                for (let it = 0; it < 12; it++, W *= 1.8) {
                    if (W > n / 3) break;
                    const a = P(f - W), b = P(f + W);
                    const hx = b[0] - a[0], hy = b[1] - a[1], hl = Math.hypot(hx, hy);
                    if (hl >= camHeadingMove) return [hx / hl, hy / hl];
                    // Straddling the ends shrinks one side; only the displacement magnitude matters.
                }
                return null;
            }

            // Model vertices (metres, +z up) scaled to `length` scene units, upright at (lon, lat, z); returns data units.
            function uprightGeometry(M, length, lon, lat, z) {
                const S = sceneScale, k = length / M.length;
                const c = [lon / S.kx, lat / S.ky, z / S.kz];
                const m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    xs[q] = (c[0] + M.x[q] * k) * S.kx;
                    ys[q] = (c[1] + M.y[q] * k) * S.ky;
                    zs[q] = (c[2] + M.z[q] * k) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            // Synthetic Argo state at clock `ms`: {lon, lat, depth (m, positive down)}, or null before the first profile.
            function argoState(profs, ms) {
                const H = 3600e3;
                const first = profs[0], last = profs[profs.length - 1];
                if (ms < first.ms - ARGO.leadH * H) return null;
                // Ascent into the first known profile (park → deep dip → up).
                if (ms < first.ms) {
                    const t = (first.ms - ms) / H;   // hours to go
                    let depth;
                    if (t > ARGO.deepStartH) depth = ARGO.parkM;
                    else if (t > ARGO.deepEndH) depth = ARGO.parkM + (ARGO.profileM - ARGO.parkM) * (ARGO.deepStartH - t) / (ARGO.deepStartH - ARGO.deepEndH);
                    else depth = ARGO.profileM * t / ARGO.deepEndH;
                    return { lon: first.lon, lat: first.lat, depth };
                }
                // Surfacing at or before `ms`, and the next one (if any).
                let lo = 0, hi = profs.length - 1;
                while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (profs[mid].ms <= ms) lo = mid; else hi = mid; }
                const a = profs[lo], b = profs[hi].ms > ms ? profs[hi] : null;
                const since = (ms - a.ms) / H;
                if (!b) {
                    // Last known profile: surface stint, descend, park for good.
                    let depth;
                    if (since < ARGO.surfaceH) depth = 0;
                    else if (since < ARGO.surfaceH + ARGO.descendH) depth = ARGO.parkM * (since - ARGO.surfaceH) / ARGO.descendH;
                    else depth = ARGO.parkM;
                    return { lon: a.lon, lat: a.lat, depth };
                }
                // One cycle a → b as piecewise-linear depth keyframes; cycles shorter than ~19 h compress every phase proportionally.
                const T = (b.ms - a.ms) / H;
                const need = ARGO.surfaceH + ARGO.descendH + ARGO.deepStartH;
                const k = T < need ? T / need : 1;
                const keys = [
                    [0, 0],
                    [ARGO.surfaceH * k, 0],
                    [(ARGO.surfaceH + ARGO.descendH) * k, ARGO.parkM],
                    [T - ARGO.deepStartH * k, ARGO.parkM],
                    [T - ARGO.deepEndH * k, ARGO.profileM],
                    [T, 0],
                ];
                let depth = 0;
                for (let q = 1; q < keys.length; q++) {
                    if (since <= keys[q][0]) {
                        const [t0, d0] = keys[q - 1], [t1, d1] = keys[q];
                        depth = t1 > t0 ? d0 + (d1 - d0) * (since - t0) / (t1 - t0) : d1;
                        break;
                    }
                }
                const u = Math.max(0, Math.min(1, (ms - a.ms) / (b.ms - a.ms)));   // drift fraction
                return { lon: a.lon + (b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u, depth };
            }

            // Seabed depth (m, positive down; 0 over land/no data) at lon/lat, nearest bathy cell.
            function seabedDepthAt(data, lon, lat) {
                const bx = data.bathy_lon, by = data.bathy_lat, bz = data.bathy_z;
                if (!bx || !by || !bz || bx.length < 2 || by.length < 2) return Infinity;
                const ix = Math.max(0, Math.min(bx.length - 1, Math.round((lon - bx[0]) / (bx[bx.length - 1] - bx[0]) * (bx.length - 1))));
                const iy = Math.max(0, Math.min(by.length - 1, Math.round((lat - by[0]) / (by[by.length - 1] - by[0]) * (by.length - 1))));
                const z = bz[iy] && bz[iy][ix];
                return (z == null || !isFinite(z)) ? Infinity : Math.max(0, -z);
            }

            // All Argo floats at clock `ms` as one merged mesh; `key` identifies the set of floats. Null when empty.
            function argoGeometry(data, ms) {
                if (!fx.argo || !argoModel || !argoFloats.length || ms == null || !sceneBox) return null;
                // Keep submerged floats inside the drawn box (the scene floor is set by the glider's dives).
                const floorZ = sceneBox.zRange[0] * 0.9;
                const out = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [], key: '', count: 0 };
                const shown = [];
                for (const fl of argoFloats) {
                    const st = argoState(fl.profs, ms);
                    if (!st) continue;
                    shown.push(fl.wmo);
                    // Never below the seabed (with clearance) nor below the scene floor.
                    const seabed = seabedDepthAt(data, st.lon, st.lat);
                    const clearance = argoLength * 0.6 * sceneScale.kz;   // data units (m) ≈ the model's half-height on screen
                    const depth = Math.min(st.depth, Math.max(0, seabed - clearance));
                    const g = uprightGeometry(argoModel, argoLength, st.lon, st.lat, Math.max(floorZ, -depth));
                    const base = out.x.length;
                    out.x.push(...g.x); out.y.push(...g.y); out.z.push(...g.z);
                    out.i.push(...argoModel.i.map(v => v + base)); out.j.push(...argoModel.j.map(v => v + base)); out.k.push(...argoModel.k.map(v => v + base));
                    out.cell.push(...argoModel.cell);
                }
                if (!shown.length) return null;
                out.key = shown.join('|'); out.count = shown.length;
                return out;
            }

            function gliderGeometry(data, f) {
                const n = data.lon.length;
                const S = sceneScale;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky, p[2] / S.kz]; };
                const c = P(f);
                // Heading + pitch from a few samples either side so the model doesn't twitch.
                const w = Math.max(1, Math.min(8, Math.floor(n / 200)));
                const a0 = P(f - w), a1 = P(f + w);
                let fw = [a1[0] - a0[0], a1[1] - a0[1], a1[2] - a0[2]];
                // Level out over the first/last few samples, where the heading window is one-sided.
                const edge = Math.max(2, 2 * w);
                const level = Math.min(1, Math.min(f, n - 1 - f) / edge);   // 0 at the ends → 1 inside
                fw[2] *= level;
                // No real horizontal movement locally: use the longer look-along heading the buoys use.
                if (Math.hypot(fw[0], fw[1]) < gliderLength * 0.25) {
                    const near = Math.round(f), dir = near < n / 2 ? +1 : -1;
                    const [hx, hy] = horizHeading(data, near, dir, gliderLength);
                    const vz = fw[2];
                    fw = [hx * gliderLength, hy * gliderLength, vz];
                }
                let len = Math.hypot(...fw);
                if (!(len > 1e-9)) { fw = [1, 0, 0]; len = 1; }
                fw = fw.map(v => v / len);

                // Attitude: measured pitch/roll when present (true angles), else tangent to the drawn track, wings level.
                let pitchDeg = sampleVar(data.pitch, f), rollDeg = sampleVar(data.roll, f);
                if (pitchDeg != null) { pitchDeg *= level; rollDeg = (rollDeg || 0) * level; }
                let sd, up;
                if (pitchDeg != null) {
                    const hl = Math.hypot(fw[0], fw[1]);
                    let h = hl > 1e-9 ? [fw[0] / hl, fw[1] / hl, 0] : [1, 0, 0];   // horizontal heading (from the track)
                    // Measured compass heading when present; interpolate via sin/cos (wraps at 360), then map to scene units.
                    if (data.heading) {
                        const n1 = data.heading.length - 1, g = Math.max(0, Math.min(n1, f));
                        const i0 = Math.floor(g), i1 = Math.min(n1, i0 + 1), t = g - i0;
                        const d0 = data.heading[i0] != null ? data.heading[i0] : data.heading[i1];
                        const d1 = data.heading[i1] != null ? data.heading[i1] : d0;
                        const r0 = d0 * Math.PI / 180, r1 = d1 * Math.PI / 180;
                        const e = Math.sin(r0) * (1 - t) + Math.sin(r1) * t, nn = Math.cos(r0) * (1 - t) + Math.cos(r1) * t;
                        const coslat = Math.max(0.05, Math.cos(sample(data, f)[1] * Math.PI / 180));
                        const sx = e / coslat / S.kx, sy = nn / S.ky, sl = Math.hypot(sx, sy);
                        if (d0 != null && sl > 1e-12) h = [sx / sl, sy / sl, 0];
                    }
                    // Halfway between the measured pitch and that pitch stretched by the scene's vertical exaggeration
                    // (the slope of the drawn track): the stretched one alone is near-vertical at high exaggeration.
                    const pr0 = pitchDeg * Math.PI / 180;
                    // Shallow angles and the surface keep the true pitch, so a slightly tilted glider stays nearly flat.
                    const ss = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo))); return t * t * (3 - 2 * t); };
                    const wEx = 0.5 * ss(Math.abs(pitchDeg), pitchExagFromDeg, pitchExagFullDeg) * ss(-sample(data, f)[2], 2, 10);
                    const pr = pr0 + (Math.atan(Math.tan(pr0) * sceneVExag) - pr0) * wEx, cp = Math.cos(pr), sp = Math.sin(pr);
                    fw = [h[0] * cp, h[1] * cp, sp];
                    const s0 = [-h[1], h[0], 0];                                       // port side, level
                    const u0 = [fw[1] * s0[2] - fw[2] * s0[1], fw[2] * s0[0] - fw[0] * s0[2], fw[0] * s0[1] - fw[1] * s0[0]];
                    const rr = (rollDeg || 0) * Math.PI / 180, cr = Math.cos(rr), sr = Math.sin(rr);
                    sd = [s0[0] * cr + u0[0] * sr, s0[1] * cr + u0[1] * sr, s0[2] * cr + u0[2] * sr];
                    up = [u0[0] * cr - s0[0] * sr, u0[1] * cr - s0[1] * sr, u0[2] * cr - s0[2] * sr];
                } else {
                    // Wings stay level: side = up × forward (horizontal), up = forward × side.
                    const ref = Math.abs(fw[2]) < 0.99 ? [0, 0, 1] : [0, 1, 0];
                    sd = [ref[1] * fw[2] - ref[2] * fw[1], ref[2] * fw[0] - ref[0] * fw[2], ref[0] * fw[1] - ref[1] * fw[0]];
                    const sl = Math.hypot(...sd); sd = sd.map(v => v / sl);
                    up = [fw[1] * sd[2] - fw[2] * sd[1], fw[2] * sd[0] - fw[0] * sd[2], fw[0] * sd[1] - fw[1] * sd[0]];
                }

                const k = gliderLength / gliderModel.length;   // metres -> scene units
                const M = gliderModel, m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    const mx = M.x[q] * k, my = M.y[q] * k, mz = M.z[q] * k;
                    xs[q] = (c[0] + fw[0] * mx + sd[0] * my + up[0] * mz) * S.kx;
                    ys[q] = (c[1] + fw[1] * mx + sd[1] * my + up[1] * mz) * S.ky;
                    zs[q] = (c[2] + fw[2] * mx + sd[2] * my + up[2] * mz) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            // Vehicle to draw: detected platform kind, then name heuristics; Slocum if unknown.
            const MODEL_KINDS = ['slocum', 'seaglider', 'alr'];
            function platformKindFor(kind, name) {
                if (kind && MODEL_KINDS.includes(kind)) return kind;
                const n = String(name || '').toLowerCase();
                if (/^alr[_\-\d]/.test(n)) return 'alr';
                if (/^(sg\d|seaglider)/.test(n)) return 'seaglider';
                if (/slocum/.test(n)) return 'slocum';
                return '';
            }
            const modelPromise = fetch('/api/files').then(r => r.json()).catch(() => ({ files: [] }))
                .then(({ files }) => {
                    const rec = (files || []).find(f => f.id === fileId) || {};
                    return platformKindFor(rec.platform_kind, rec.name) || 'slocum';
                })
                .then(kind => loadModel(kind));
            // Argo float model: optional, never blocks the scene.
            const argoModelPromise = loadModel('argo').catch(() => null);
            // Start/end buoys: loaded with the scene (tiny files); optional.
            const buoyPromise = Promise.all([loadModel('buoy_green'), loadModel('buoy_red')])
                .then(([start, end]) => ({ start, end })).catch(() => null);

            // Scenery models (one bundle) load with the scene so the first draw is complete; optional.
            const sceneryPromise = Scenery.load(mergeParts).catch(() => null);

            // `name` is a model in static/3d_view/models, or a full URL (starts with '/').
            function loadModel(name) {
                const url = name.startsWith('/') ? name : `/static/3d_view/models/${name}.json`;
                return fetch(url).then(r => { if (!r.ok) throw new Error(url); return r.json(); }).then(mergeParts);
            }
            function mergeParts(parts) {
                {
                    // Merge parts into one mesh; each triangle carries its part's colour index (intensitymode:'cell').
                    const M = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [] };
                    const colors = [];
                    for (const p of Object.values(parts)) {
                        if (!colors.includes(p.color)) colors.push(p.color);
                        const ci = colors.indexOf(p.color), base = M.x.length;
                        M.x.push(...p.x); M.y.push(...p.y); M.z.push(...p.z);
                        M.i.push(...p.i.map(v => v + base)); M.j.push(...p.j.map(v => v + base)); M.k.push(...p.k.map(v => v + base));
                        for (let q = 0; q < p.i.length; q++) M.cell.push(ci);
                    }
                    M.cmax = Math.max(colors.length - 1, 1);
                    M.colorscale = colors.map((c, q) => [q / M.cmax, c]);
                    if (colors.length === 1) M.colorscale.push([1, colors[0]]);
                    // Nose-to-tail length: from the hull if present, else from every vertex.
                    const hx = parts.hull ? parts.hull.x : M.x;
                    M.length = Math.max(...hx) - Math.min(...hx);
                    if (!parts.hull) M.length = Math.max(...M.z) - Math.min(...M.z);   // upright objects: height
                    return M;
                }
            }

            // Playback clock value (epoch ms) at the current position, or null when the file has no times.
            let playClockMs = () => null;
            // Shared pinned point (map/plot click): jump there and pause; clearing it resumes playback.
            let pinTo = () => {}, unpin = () => {};
            window.addEventListener('message', (event) => {
                const m = event.data;
                if (!m) return;
                if (m.type === 'pinTime' && typeof m.timeMs === 'number') pinTo(m.timeMs);
                else if (m.type === 'clearPin') unpin();
            });

            Promise.all([fetch(`/api/3d_data?id=${encodeURIComponent(fileId)}`).then(r => r.json()), modelPromise, buoyPromise, sceneryPromise])
                .then(([data, model, buoys]) => {
                    if (data.error) throw new Error(data.error);
                    gliderModel = model;
                    buoyModels = buoys;

                    // Argo floats that surfaced inside the scene box; arrives after the first draw, scene rebuilt once.
                    if (data.time_ms) {
                        const ts = data.time_ms.filter(v => v != null && isFinite(v));
                        if (ts.length) {
                            const b = data.bounds, q = new URLSearchParams({
                                min_lat: b.min_lat, max_lat: b.max_lat, min_lon: b.min_lon, max_lon: b.max_lon,
                                t0: Math.min(...ts) - argoWindowHours * 3600e3, t1: Math.max(...ts) + argoWindowHours * 3600e3,
                            });
                            Promise.all([fetch('/api/argo/profiles?' + q).then(r => r.json()), argoModelPromise])
                                .then(([res, m]) => {
                                    if (!m || !res || !res.profiles || !res.profiles.length) return;
                                    argoModel = m;
                                    const byWmo = new Map();
                                    for (const r of res.profiles) {
                                        if (!byWmo.has(r[0])) byWmo.set(r[0], []);
                                        byWmo.get(r[0]).push({ lat: r[1], lon: r[2], ms: r[3] });
                                    }
                                    // The index lists some profiles twice; collapse anything within a few hours or the float snaps.
                                    argoFloats = [...byWmo].map(([wmo, profs]) => {
                                        profs.sort((a, b) => a.ms - b.ms);
                                        const out = [];
                                        for (const p of profs) if (!out.length || p.ms - out[out.length - 1].ms > 3 * 3600e3) out.push(p);
                                        return { wmo, profs: out };
                                    });
                                    if (rerender) rerender();
                                })
                                .catch(() => {});
                        }
                    }

                    const config = { displayModeBar: false, responsive: true };
                    let first = buildScene(data);   // also sets the scene scale the camera placement below needs
                    // Open the view already behind the glider at follow distance.
                    {
                        const hd = travelHeading(data, posIdx);
                        if (hd) {
                            // Start on the most open side (the same choice playback will make, so it doesn't swing away at once).
                            const behind = Math.atan2(-hd[1], -hd[0]);
                            pickClearDir(data, posIdx, behind, followDist, currentEye.z - currentCenter.z, 1);
                            const az0 = clearDir < 0 ? behind : clearDir * 2 * Math.PI / clearViewDirs;
                            currentEye = { x: currentCenter.x + Math.cos(az0) * followDist, y: currentCenter.y + Math.sin(az0) * followDist, z: currentEye.z };
                            first = buildScene(data);
                        }
                    }

                    // Re-render in place on a style toggle, keeping the camera.
                    rerender = () => {
                        clampEye();
                        const scene = buildScene(data);
                        Plotly.react('plot3d', scene.traces, scene.layout, config).then(tightenClipPlanes);
                    };

                    Plotly.newPlot('plot3d', first.traces, first.layout, config).then(() => {
                        window.logRender('3D Map Frontend', performance.now() - startTime);
                        tightenClipPlanes();

                        // Fade out the loading overlay
                        const overlay = document.getElementById('overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        document.getElementById('layer-panel').classList.add('ready');

                        const plotDiv = document.getElementById('plot3d');

                        // ── Position slider ──────────────────────────────
                        const posSlider = document.getElementById('posSlider');
                        const posPlay = document.getElementById('posPlay');
                        const posReadout = document.getElementById('posReadout');
                        const nPts = data.lon.length;
                        posSlider.max = String(Math.max(0, nPts - 1));
                        posSlider.value = '0';

                        const fmtTime = ms => {
                            if (ms == null || !isFinite(ms)) return '';
                            const iso = new Date(ms).toISOString();   // epoch-ms -> always UTC
                            return iso.slice(0, 10) + ' ' + iso.slice(11, 16) + ' UTC';
                        };
                        let lastReadout = '';
                        const updateReadout = () => {
                            const t = data.time_ms ? fmtTime(data.time_ms[posIdx]) : '';
                            const html = t;
                            if (html !== lastReadout) { lastReadout = html; posReadout.innerHTML = html; }   // no DOM write (and no layout) when nothing changed
                        };
                        // Camera fast path: call scene.setViewport directly (relayout re-runs supplyDefaults over every
                        // trace) and keep layout/_fullLayout in step so user drags and later replots agree.
                        // gl-plot3d's own rAF loop draws once per frame when any object is dirty. Flag one rather than calling
                        // glplot.redraw(), which renders synchronously (a second full draw on top of the loop's own).
                        const markDirty = (scene) => { const o = scene.glplot.objects; if (o && o.length) o[0].dirty = true; else scene.glplot.redraw(); };
                        const pushCamera = () => {
                            try {
                                const full = plotDiv._fullLayout.scene, scene = full._scene;
                                full.camera.eye = { ...currentEye }; full.camera.center = { ...currentCenter };
                                const lay = plotDiv.layout.scene.camera || (plotDiv.layout.scene.camera = {});
                                lay.eye = { ...currentEye }; lay.center = { ...currentCenter };
                                scene.setViewport(full);
                                markDirty(scene);
                            } catch (_) {
                                Plotly.relayout('plot3d', { 'scene.camera.eye': { ...currentEye }, 'scene.camera.center': { ...currentCenter } });
                            }
                        };
                        // mesh3d update() rebuilds the colour texture on every call; drop `colormap` on the way through.
                        // Scatter3d wrappers have no .mesh and take the plain update.
                        const traceUpdate = (w, ft) => {
                            const m = w.mesh;
                            if (!m || typeof m.update !== 'function') { w.update(ft); return; }
                            const own = Object.prototype.hasOwnProperty.call(m, 'update'), orig = m.update;
                            m.update = p => { if (p) delete p.colormap; return orig.call(m, p); };
                            try { w.update(ft); } finally { if (own) m.update = orig; else delete m.update; }
                        };
                        // Fast path: hand trace attributes straight to the WebGL wrapper (Plotly internals);
                        // falls back to a normal restyle if the internals aren't where expected.
                        const fastPatch = (ti, patch) => {
                            try {
                                const scene = plotDiv._fullLayout.scene._scene;
                                const ft = plotDiv._fullData[ti], w = scene.traces[ft.uid];
                                if (!w || typeof w.update !== 'function') throw new Error('no wrapper');
                                Object.assign(plotDiv.data[ti], patch); Object.assign(ft, patch);
                                traceUpdate(w, ft);
                                markDirty(scene);
                            } catch (_) {
                                Plotly.restyle('plot3d', Object.fromEntries(Object.entries(patch).map(([k, v]) => [k, [v]])), [ti]);
                            }
                        };
                        const fastXYZ = (indices, upd) => indices.forEach((ti, q) => fastPatch(ti, { x: upd.x[q], y: upd.y[q], z: upd.z[q] }));
                        const pushGlider = (f) => {
                            if (gliderTraceIdx < 0) return;
                            const b = gliderGeometry(data, f);
                            fastXYZ([gliderTraceIdx], { x: [b.x], y: [b.y], z: [b.z] });
                            if (tipTraceIdx >= 0) {
                                const tp = tipGeometry(data, lastTrackIdx < 0 || lastTrackIdx > f || f - lastTrackIdx > 2000 ? Math.floor(f) : lastTrackIdx   /* scrub jump: pushTrack catches up right after */, f);
                                fastXYZ([tipTraceIdx], { x: [tp.x], y: [tp.y], z: [tp.z] });
                            }
                            updateReadout();
                        };
                        let lastTrackIdx = -1;
                        const pushTrack = () => {
                            if (pastTraceIdx < 0 || posIdx === lastTrackIdx) return;   // re-uploads both halves of the track: skip when the split hasn't moved
                            lastTrackIdx = posIdx;
                            const t = trackGeometry(data, posIdx);
                            fastXYZ([pastTraceIdx, aheadTraceIdx], { x: [t.past.x, t.ahead.x], y: [t.past.y, t.ahead.y], z: [t.past.z, t.ahead.z] });
                        };
                        // Argo floats always go through the fast path (collapsed placeholder when none/off).
                        const pushArgo = () => {
                            if (argoTraceIdx < 0) return;
                            const ag = argoGeometry(data, playClockMs());
                            if (!ag && !argoShownKey) return;   // nothing drawn, nothing to draw
                            argoShownKey = ag ? ag.key : '';
                            fastPatch(argoTraceIdx, ag ? { x: ag.x, y: ag.y, z: ag.z, i: ag.i, j: ag.j, k: ag.k, intensity: ag.cell } : argoPlaceholder());
                        };
                        // Scenery sway (underwater plants only), wall-clock driven.
                        const pushScenery = (t) => {
                            if (sceneryTraceIdx < 0 || !fx.scenery) return;
                            const s = Scenery.sway(t / 1000);
                            if (s) fastXYZ([sceneryTraceIdx], { x: [s.x], y: [s.y], z: [s.z] });
                        };
                        // Argo / scenery toggles without a replot. Returns false for anything it can't do in place (→ full re-render).
                        softToggle = (key) => {
                            try {
                                if (key === 'argo') {
                                    if (argoTraceIdx < 0) return !argoModel;   // no trace yet: nothing to show either way
                                    pushArgo();
                                    return true;
                                }
                                if (key === 'scenery') {
                                    if (sceneryTraceIdx < 0 || !sceneryBase) return false;
                                    const fresh = buildScene(data).traces;   // recolours the seabed for the new setting (JS only, nothing drawn)
                                    const sb = fresh.findIndex(t => t.name === 'Seabed');
                                    if (sb >= 0 && plotDiv.data[sb] && plotDiv.data[sb].name === 'Seabed') fastPatch(sb, { vertexcolor: fresh[sb].vertexcolor });
                                    const on = fx.scenery && (Scenery.sway(performance.now() / 1000) || sceneryBase);
                                    fastPatch(sceneryTraceIdx, on ? { x: on.x, y: on.y, z: on.z } : collapsed(sceneryBase.x.length));
                                    return true;
                                }
                            } catch (_) {}
                            return false;
                        };
                        // Slider scrub: snap the camera to the glider and redraw everything.
                        let posRaf = 0;
                        const setPos = (i) => {
                            posIdx = Math.max(0, Math.min(nPts - 1, i | 0));
                            posSlider.value = String(posIdx);
                            if (!posRaf) posRaf = requestAnimationFrame(() => {
                                posRaf = 0;
                                posFloat = posIdx;
                                lookAtIdx(data, posIdx);
                                pushGlider(posIdx); pushArgo(); pushTrack(); pushCamera();
                            });
                        };
                        posSlider.addEventListener('input', () => setPos(+posSlider.value));

                        // ── Playback: one rAF loop; camera centre is low-pass filtered (cameraTau). A manual rotate/zoom
                        // holds and resumes after a cooldown; a plain click or the button pauses fully. ──
                        let playing = false, playRaf = 0, lastT = 0;
                        let posFloat = 0;         // fractional track position
                        // Playback runs on the deployment clock (times forward-filled and forced monotonic);
                        // with no usable times the sample index is the clock.
                        const clock = (() => {
                            const raw = data.time_ms;
                            if (!raw || raw.length !== nPts) return null;
                            const tm = new Array(nPts); let last = null;
                            for (let q = 0; q < nPts; q++) { const v = raw[q]; if (v != null && isFinite(v) && (last == null || v > last)) last = v; tm[q] = last; }
                            let first = tm.findIndex(v => v != null);
                            if (first < 0 || tm[nPts - 1] <= tm[first]) return null;
                            for (let q = 0; q < first; q++) tm[q] = tm[first];
                            return tm;
                        })();
                        const clockSpan = clock ? clock[nPts - 1] - clock[0] : nPts - 1;
                        playClockMs = () => clock ? clockAt(posFloat) : null;
                        const clockAt = f => {          // fractional index -> clock value
                            if (!clock) return f;
                            const i0 = Math.floor(f), i1 = Math.min(nPts - 1, i0 + 1);
                            return clock[i0] + (clock[i1] - clock[i0]) * (f - i0);
                        };
                        const indexAt = c => {          // clock value -> fractional index
                            if (!clock) return c;
                            let lo = 0, hi = nPts - 1;
                            while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (clock[mid] <= c) lo = mid; else hi = mid; }
                            const d = clock[hi] - clock[lo];
                            return d > 0 ? lo + (c - clock[lo]) / d : lo;
                        };
                        let endHeld = 0;          // wall seconds spent holding at the end of the track
                        let lastClearT = 0;
                        let sinceStart = 0;       // wall seconds since playback (re)started, for the camera's soft start
                        let aimTh = null;         // smoothed target azimuth (null = restart from the eye's own)
                        let viewT = 0;            // wall seconds of playback, drives the viewing-angle wander
                        let lastTrackT = 0, lastSceneryT = 0;
                        let holding = false;      // pointer down on the plot (rotating)
                        let cooldownTimer = 0;    // pending resume after a manual interaction
                        let speed = 1;
                        const posSpeed = document.getElementById('posSpeed');
                        posSpeed.addEventListener('click', (e) => {
                            e.stopPropagation();
                            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
                            posSpeed.textContent = speed + 'x';
                        });
                        const setIcon = () => {
                            posPlay.querySelector('.material-symbols-outlined').textContent = playing ? 'pause' : 'play_arrow';
                            posPlay.title = playing ? 'Pause' : 'Play glider along track';
                        };
                        const clearCooldown = () => {
                            clearTimeout(cooldownTimer); cooldownTimer = 0;
                            posPlay.classList.remove('cooldown');
                        };
                        const setPlaying = (on) => {
                            playing = on; clearCooldown(); setIcon();
                            cancelAnimationFrame(playRaf); playRaf = 0;
                            if (on) { posFloat = posIdx; lastT = 0; sinceStart = 0; aimTh = null; playRaf = requestAnimationFrame(tick); }
                        };
                        // Temporary hold: called on any manual camera interaction.
                        const holdThenResume = () => {
                            if (!playing) return;
                            clearTimeout(cooldownTimer);
                            lastT = 0;   // don't integrate the time spent held
                            posPlay.classList.remove('cooldown');
                            void posPlay.offsetWidth;   // restart the ring animation
                            posPlay.style.setProperty('--cooldown', cooldownMs + 'ms');
                            posPlay.classList.add('cooldown');
                            cooldownTimer = setTimeout(() => { cooldownTimer = 0; posPlay.classList.remove('cooldown'); }, cooldownMs);
                        };
                        const held = () => holding || cooldownTimer !== 0;

                        function tick(t) {
                            playRaf = requestAnimationFrame(tick);
                            if (held()) { lastT = t; aimTh = null; sinceStart = 0; return; }
                            const dtRaw = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
                            lastT = t;
                            if (!dtRaw) return;
                            const dt = dtRaw * speed;

                            if (posIdx < nPts - 1) {
                                posFloat = Math.min(nPts - 1, indexAt(clockAt(posFloat) + dt * clockSpan / trackSeconds));
                            } else if ((endHeld += dtRaw) >= endHoldSeconds) {
                                posFloat = 0; endHeld = 0;           // held at the end → start again
                            }
                            posIdx = Math.round(posFloat);

                            // Camera: ease the pivot toward a point a little ahead of the glider, carry the eye with it,
                            // then swing the eye (shortest way) toward the azimuth behind the direction of travel.
                            const target = centerFor(data, posFloat);
                            const gl = { x: target.x, y: target.y };
                            const hd0 = travelHeading(data, posFloat);
                            if (hd0) {
                                const o0 = eyeOffset(), r0 = Math.min(followDist, Math.hypot(o0.x, o0.y));
                                target.x += hd0[0] * leadFrac * r0; target.y += hd0[1] * leadFrac * r0;
                            }
                            // Soft start: all camera easing ramps in over the first few seconds, so play/resume never kicks.
                            sinceStart += dtRaw;
                            const ramp0 = Math.min(1, sinceStart / camSoftStartS), ramp = ramp0 * ramp0 * (3 - 2 * ramp0);
                            const a = (1 - Math.exp(-dtRaw / cameraTau)) * ramp;
                            let dx = (target.x - currentCenter.x) * a, dy = (target.y - currentCenter.y) * a;
                            {   // Leash: the smoothed pivot lags a fast glider; pull it back within maxOffFrac of the eye distance.
                                const e = eyeOffset(), lim = maxOffFrac * Math.hypot(e.x, e.y, e.z);
                                const ox = currentCenter.x + dx - gl.x, oy = currentCenter.y + dy - gl.y, off = Math.hypot(ox, oy);
                                if (off > lim) { const k = (1 - lim / off) * ramp; dx -= ox * k; dy -= oy * k; }
                            }
                            currentCenter = { x: currentCenter.x + dx, y: currentCenter.y + dy, z: currentCenter.z };
                            const o = { x: currentEye.x + dx - currentCenter.x, y: currentEye.y + dy - currentCenter.y };
                            let r = Math.hypot(o.x, o.y);
                            if (r > followDist) r += (followDist - r) * (1 - Math.exp(-dtRaw / camAzimuthTau)) * ramp;   // ease in, never out
                            let th = Math.atan2(o.y, o.x);
                            // A slow constant drift keeps the picture alive while the glider sits still.
                            th += ramp * dtRaw * 2 * Math.PI / idleOrbitSeconds;
                            viewT += dtRaw;
                            const swing = (viewSwingDeg * Math.PI / 180) *
                                (0.6 * Math.sin(2 * Math.PI * viewT / viewPeriodsS[0]) + 0.4 * Math.sin(2 * Math.PI * viewT / viewPeriodsS[1] + 1.3));
                            const hd = hd0;
                            if (hd) {
                                const behind = Math.atan2(-hd[1], -hd[0]) + swing;    // behind the glider, swung to one side
                                if (viewT - lastClearT >= clearViewEveryS) {
                                    lastClearT = viewT;
                                    pickClearDir(data, posFloat, behind, r, currentEye.z - currentCenter.z, 0.25);
                                }
                                const want = clearDir < 0 ? behind : clearDir * 2 * Math.PI / clearViewDirs;
                                // Two easing stages (aim chases the target, the eye chases the aim), so a change of target
                                // builds up speed gradually instead of kicking the camera.
                                const wrap = v => ((v + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
                                if (aimTh == null) aimTh = th;
                                aimTh += wrap(want - aimTh) * (1 - Math.exp(-dtRaw / camAimTau));
                                th += wrap(aimTh - th) * (1 - Math.exp(-dtRaw / camAzimuthTau)) * ramp;
                            }
                            currentEye = { x: currentCenter.x + r * Math.cos(th), y: currentCenter.y + r * Math.sin(th), z: currentEye.z };
                            // Glider every frame, track split less often, camera last so its redraw picks up both.
                            pushGlider(posFloat);
                            pushArgo();   // floats move every frame too (same fast path; only a membership change replots)
                            if (t - lastSceneryT >= sceneryEveryMs) { lastSceneryT = t; pushScenery(t); }
                            if (t - lastTrackT >= trackEveryMs) { lastTrackT = t; posSlider.value = String(posIdx); pushTrack(); }
                            pushCamera();
                        }
                        posPlay.addEventListener('click', (e) => { e.stopPropagation(); pinned = false; setPlaying(!playing); });
                        let pinned = false, resumeAfterPin = false;
                        pinTo = (ms) => {
                            if (!clock) return;
                            if (!pinned) resumeAfterPin = playing;
                            pinned = true;
                            if (playing) setPlaying(false);
                            setPos(Math.round(indexAt(Math.max(clock[0], Math.min(clock[nPts - 1], ms)))));
                        };
                        unpin = () => {
                            if (!pinned) return;
                            pinned = false;
                            if (resumeAfterPin && !playing) setPlaying(true);
                        };
                        posSlider.addEventListener('pointerdown', () => { if (playing) setPlaying(false); });

                        // Manual camera interaction: hold while the pointer is down, then cool down; a still click pauses.
                        let downX = 0, downY = 0, moved = false;
                        plotDiv.addEventListener('pointerdown', (e) => {
                            holding = true; moved = false; downX = e.clientX; downY = e.clientY;
                            if (playing) { clearTimeout(cooldownTimer); cooldownTimer = 0; posPlay.classList.remove('cooldown'); }
                        }, true);
                        document.addEventListener('pointermove', (e) => {
                            if (holding && (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4)) moved = true;
                        }, true);
                        const release = (e) => {
                            if (!holding) return;
                            holding = false;
                            if (e && e.target && e.target.closest && e.target.closest('#posBar, #layer-panel')) return;
                            if (!moved) { if (playing) setPlaying(false); return; }   // plain click → full pause
                            holdThenResume();
                        };
                        document.addEventListener('pointerup', release, true);
                        document.addEventListener('pointercancel', release, true);
                        plotDiv.addEventListener('wheel', () => holdThenResume(), { capture: true, passive: true });

                        updateReadout();
                        document.getElementById('posBar').classList.add('ready');
                        if (nPts > 1) setPlaying(true);   // start playing as soon as a glider loads

                        plotDiv.on('plotly_relayout', (e) => {
                            const cam = (e && e['scene.camera']) || {};
                            const eye = cam.eye || (e && e['scene.camera.eye']);
                            const ctr = cam.center || (e && e['scene.camera.center']);
                            if (eye) currentEye = { ...currentEye, ...eye };
                            if (ctr) currentCenter = { ...currentCenter, ...ctr };   // user panned (right-drag)
                            // Clamp zoom-out: pull the eye back in if it drifted past the cap.
                            if (clampEye()) Plotly.relayout('plot3d', { 'scene.camera.eye': currentEye });
                        });
                        // Swallow wheel events at either zoom cap so the view doesn't snap back.
                        plotDiv.addEventListener('wheel', (e) => {
                            if ((e.deltaY > 0 && eyeDist() >= eyeCap() - 1e-3) || (e.deltaY < 0 && eyeDist() <= minEyeDist + 1e-3)) {
                                e.preventDefault(); e.stopPropagation();
                            }
                        }, { capture: true, passive: false });
                    });
                })
                .catch(err => {
                    document.getElementById('loadingIcon').style.display = 'none';
                    document.getElementById('statusText').style.color = '#ef4444';
                    document.getElementById('statusText').textContent = err.message || "Failed to load 3D data.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
