                    // memoised. Applied per VERTEX (`vertexcolor`, exact colours -
                    // no colourscale texture to bleed between).
                    const colourCache = new Map();
                    const span = Math.max(bathyMax - bathyMin, 1e-6);
                    const facetColour = (z, snow) => {
                        const zq = Math.round((z - bathyMin) / span * 128) / 128, sq = Math.round(snow * 8) / 8;
                        const key = zq + ':' + sq;
                        let col = colourCache.get(key);
                        if (col) return col;
                        const zz = bathyMin + zq * span, stops = makeStops(sq);
                        col = stops[stops.length - 1][1];
                        for (let q = 1; q < stops.length; q++) {
                            if (zz <= stops[q][0]) { const [z0, c0] = stops[q - 1], [z1, c1] = stops[q]; col = z1 > z0 ? lerpHex(c0, c1, (zz - z0) / (z1 - z0)) : c1; break; }
                        }
                        colourCache.set(key, col);
                        return col;
                    };

                    // One mesh for seabed + walls + base: shared rim vertices so
                    // the walls meet the seabed exactly (no overlapping slivers
                    // to z-fight). Grid vertex (ix, iy) is index iy*xLen+ix; the
                    // rim is copied down to baseZ for the walls.
                    const G = { x: [], y: [], z: [], i: [], j: [], k: [], col: [] };
                    for (let iy = 0; iy < yLen; iy++) {
                        const snow = snowAt(bLat[iy]);
                        for (let ix = 0; ix < xLen; ix++) { const z = bathyZ[iy][ix]; G.x.push(bLon[ix]); G.y.push(bLat[iy]); G.z.push(z); G.col.push(facetColour(z, snow)); }
                    }
                    const V = (ix, iy) => iy * xLen + ix;
                    const face = (a, b, c) => { G.i.push(a); G.j.push(b); G.k.push(c); };
                    for (let iy = 0; iy < yLen - 1; iy++) for (let ix = 0; ix < xLen - 1; ix++) {
                        const v00 = V(ix, iy), v10 = V(ix + 1, iy), v01 = V(ix, iy + 1), v11 = V(ix + 1, iy + 1);
                        // Split along alternating diagonals so ridges don't all lean one way.
                        if ((ix + iy) % 2) { face(v00, v10, v11); face(v00, v11, v01); }
                        else { face(v00, v10, v01); face(v10, v11, v01); }
                    }
                    // Rim (anticlockwise from the SW corner) and its copy at baseZ.
                    const rim = [];
                    for (let ix = 0; ix < xLen - 1; ix++) rim.push(V(ix, 0));
                    for (let iy = 0; iy < yLen - 1; iy++) rim.push(V(xLen - 1, iy));
                    for (let ix = xLen - 1; ix > 0; ix--) rim.push(V(ix, yLen - 1));
                    for (let iy = yLen - 1; iy > 0; iy--) rim.push(V(0, iy));
                    // Walls + base are the plain earth tone. They get their OWN
                    // copy of the rim (same positions, earth colour) rather than
                    // sharing the seabed's vertices, or the seabed colour (snow,
                    // green) would blend down the wall face.
                    const rimTop = rim.map(v => { G.x.push(G.x[v]); G.y.push(G.y[v]); G.z.push(G.z[v]); G.col.push(earthColour); return G.x.length - 1; });
                    const rimBase = rim.map(v => { G.x.push(G.x[v]); G.y.push(G.y[v]); G.z.push(baseZ); G.col.push(earthColour); return G.x.length - 1; });
                    for (let q = 0; q < rim.length; q++) {
                        const r = (q + 1) % rim.length;
                        face(rimTop[q], rimBase[q], rimBase[r]); face(rimTop[q], rimBase[r], rimTop[r]);
                    }
                    // Base: fan from the SW base corner over the base ring.
                    for (let q = 1; q < rimBase.length - 1; q++) face(rimBase[0], rimBase[q + 1], rimBase[q]);

                    // Smooth shading: the grid is already a smooth cubic upsample,
                    // so smoothed normals give clean relief with no triangle
                    // edges; flat normals outlined every facet.
                    traces.push({
                        x: G.x, y: G.y, z: G.z, i: G.i, j: G.j, k: G.k, vertexcolor: G.col,
                        type: 'mesh3d', showscale: false, flatshading: false, hoverinfo: 'skip',
                        lighting: { ambient: 0.65, diffuse: 0.75, specular: 0.05, roughness: 0.8, fresnel: 0.05 },
                        name: 'Seabed'
                    });
                }

                const waterWallConfig = {
                    type: 'surface',
                    colorscale: [[0, waterBottomColour], [1, waterTopColour]],
                    cmin: baseZ, cmax: 0,
                    opacity: waterOpacity, showscale: false, hoverinfo: 'skip',
                    // Mostly flat tint: specular/fresnel on the panes reads as a reflective haze.
                    lighting: { ambient: 0.9, diffuse: 0.35, specular: 0, roughness: 1, fresnel: 0 },
                    ...noContours
                };

                const wZSouth = showSeafloor ? bathyZ[0]              : Array(xLen).fill(baseZ);
                const wZNorth = showSeafloor ? bathyZ[yLen - 1]        : Array(xLen).fill(baseZ);
                const wZWest  = showSeafloor ? bathyZ.map(r => r[0])   : Array(yLen).fill(baseZ);
                const wZEast  = showSeafloor ? bathyZ.map(r => r[xLen - 1]) : Array(yLen).fill(baseZ);

                // Sea surface.
                traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon1 + tiny], y: [lat0 - tiny, lat1 + tiny], z: [[0, 0], [0, 0]] });
                traces.push({ ...waterWallConfig, x: bLon, y: [lat0 - tiny, lat0], z: [Array(xLen).fill(0), wZSouth] });
                traces.push({ ...waterWallConfig, x: bLon, y: [lat1, lat1 + tiny], z: [wZNorth, Array(xLen).fill(0)] });
                traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon0], y: bLat, z: wZWest.map(z => [0, z]) });
                traces.push({ ...waterWallConfig, x: [lon1, lon1 + tiny], y: bLat, z: wZEast.map(z => [z, 0]) });



                const aspectX = distX / maxHoriz;
                const aspectY = distY / maxHoriz;
                const aspectZ = (distZ / maxHoriz) * vExag;

                // Explicit axis ranges (rather than autorange) so the glider
                // marker can convert between data units and scene units
                // exactly - see sceneScale below.
                const xRange = [lon0 - tiny, lon1 + tiny];
                const yRange = [lat0 - tiny, lat1 + tiny];
                // Headroom above the highest ground (or the surface) so nothing
                // standing on it is clipped by the axis range: a glider pitched
                // up at the surface (~0.8 of its length above its centre, mast
                // included) or the tallest scenery on the highest land. Objects
                // are sized in scene units, and scene→data scale (kz) itself
                // depends on the range, so solve top = zTop0 + h·(top − baseZ)/aspectZ.
                const zTop0 = showSeafloor ? Math.max(0, ...bathyZ.flat()) : 0;
                const hTop = Math.max(gliderLength * 0.8, fx.scenery ? Scenery.maxHeight() : 0);
                const zRange = [baseZ, hTop < aspectZ * 0.5 ? (zTop0 - hTop * baseZ / aspectZ) / (1 - hTop / aspectZ) : zTop0 + hTop * (zTop0 - baseZ) / aspectZ];
                // Data units per scene unit along each axis. A shape that is
                // `r` scene units across in every direction looks round on
                // screen regardless of the (very anisotropic) data scaling.
                sceneScale = {
                    kx: (xRange[1] - xRange[0]) / aspectX,
                    ky: (yRange[1] - yRange[0]) / aspectY,
                    kz: (zRange[1] - zRange[0]) / aspectZ,
                };
                sceneBox = { xRange, yRange, zRange, aspectX, aspectY, aspectZ };
                // Keep the pivot on the glider (ranges/aspect may have changed on a
                // style toggle, so recompute rather than trusting the old value).
                { const c = centerFor(data, posIdx); currentEye = { x: currentEye.x + c.x - currentCenter.x, y: currentEye.y + c.y - currentCenter.y, z: currentEye.z + c.z - currentCenter.z }; currentCenter = c; }

                const n = data.lon.length;

                // The dive track, split at the slider: where the glider has
                // been (bright, thick) and where it still has to go (thin, dark).
                const tk = trackGeometry(data, posIdx);
                aheadTraceIdx = traces.length;
                traces.push({
                    ...tk.ahead, mode: 'lines', line: { color: trackAheadColour, width: 2 },
                    type: 'scatter3d', name: 'Track ahead', hoverinfo: 'skip'
                });
                pastTraceIdx = traces.length;
                traces.push({
                    ...tk.past, mode: 'lines', line: { color: trackColour, width: 5 },
                    type: 'scatter3d', name: 'Track so far', hoverinfo: 'skip'
                });

                // Start / end buoys on the surface (green = start, red = end),
                // merged into one static mesh. Falls back to diamond markers if
                // the models didn't load.
                if (n > 0 && buoyModels) {
                    // Offset each buoy sideways (perpendicular to the local track
                    // heading, in scene units) so it sits beside the glider
                    // rather than on top of it at the first/last frame.
                    // The heading window grows until the track has actually moved
                    // sideways on screen: positions are interpolated between GPS
                    // fixes, so the first few samples of a dive often share one
                    // lon/lat and would give no direction at all (buoy on the
                    // glider). Falls back to "east" if the whole track is a point.
                    const S = sceneScale;
                    const beside = (from, dir) => {
                        const [hx, hy] = horizHeading(data, from, dir, gliderLength);
                        return [-hy * buoyOffset * S.kx, hx * buoyOffset * S.ky];   // port side, data units
                    };
                    const o0 = beside(0, +1), o1 = beside(n - 1, -1);
                    const parts = [[buoyModels.start, data.lon[0] + o0[0], data.lat[0] + o0[1]], [buoyModels.end, data.lon[n - 1] + o1[0], data.lat[n - 1] + o1[1]]];
                    const B = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [] }, colors = [];
                    for (const [M, lon, lat] of parts) {
                        const g = uprightGeometry(M, buoyLength, lon, lat, 0), base = B.x.length;
                        B.x.push(...g.x); B.y.push(...g.y); B.z.push(...g.z);
                        B.i.push(...M.i.map(v => v + base)); B.j.push(...M.j.map(v => v + base)); B.k.push(...M.k.map(v => v + base));
                        // Re-index this model's colours into the merged palette.
                        const map = M.colorscale.map(([, c]) => { if (!colors.includes(c)) colors.push(c); return colors.indexOf(c); });
                        B.cell.push(...M.cell.map(ci => map[ci]));
                    }
                    const cmax = Math.max(colors.length - 1, 1);
                    traces.push({
                        ...B, type: 'mesh3d', intensity: B.cell, intensitymode: 'cell',
                        cmin: 0, cmax, colorscale: colors.map((c, q) => [q / cmax, c]), showscale: false,
                        flatshading: true, lighting: { ambient: 0.55, diffuse: 0.7, specular: 0.1, roughness: 0.8 },
                        name: 'Start/End', hoverinfo: 'skip'
                    });
                } else if (n > 0) {
                    traces.push({
                        x: [data.lon[0], data.lon[n - 1]], y: [data.lat[0], data.lat[n - 1]], z: [0, 0],
                        mode: 'markers',
                        marker: { size: 5, color: ['#2E9E4F', '#D32F2F'], symbol: 'diamond', line: { color: '#ffffff', width: 1 } },
                        type: 'scatter3d', name: 'Start/End', hoverinfo: 'skip'
                    });
                }

                // The glider at the current slider position. Its trace index is
                // remembered so playback can update it in place without a
                // full re-render. Low-poly look: one flat-shaded mesh, hull +
                // fins coloured per triangle via a discrete colourscale, soft
                // matte lighting.
                const body = gliderGeometry(data, posIdx);
                gliderTraceIdx = traces.length;
                traces.push({
                    ...body, i: gliderModel.i, j: gliderModel.j, k: gliderModel.k,
                    type: 'mesh3d', intensity: gliderModel.cell, intensitymode: 'cell',
                    cmin: 0, cmax: gliderModel.cmax, colorscale: gliderModel.colorscale, showscale: false,
                    flatshading: true,
                    lighting: { ambient: 0.55, diffuse: 0.7, specular: 0.1, roughness: 0.8 },
                    name: 'Glider', hoverinfo: 'skip'
                });

                // Argo floats currently at the surface (may be none → hidden).
                if (argoModel) {
                    const ag = argoGeometry(data, playClockMs());
                    argoShownKey = ag ? ag.key : '';
                    argoTraceIdx = traces.length;
                    traces.push({
                        type: 'mesh3d', visible: !!ag,
                        x: ag ? ag.x : [0], y: ag ? ag.y : [0], z: ag ? ag.z : [0],
                        i: ag ? ag.i : [0], j: ag ? ag.j : [0], k: ag ? ag.k : [0],
                        intensity: ag ? ag.cell : [0], intensitymode: 'cell',
                        cmin: 0, cmax: argoModel.cmax, colorscale: argoModel.colorscale, showscale: false,
                        flatshading: true, lighting: { ambient: 0.55, diffuse: 0.7, specular: 0.1, roughness: 0.8 },
                        name: 'Argo floats', hoverinfo: 'skip'
                    });
                }

                // Decorative scenery: stands on the drawn seabed/land, or (when
                // the seafloor is out of the focus range) only floats in the water.
                sceneryTraceIdx = -1;
                if (fx.scenery) {
                    // Same latitude→snow blend the land colouring uses (0 when land isn't coloured).
                    const snowAt = lat => {
                        if (!fx.greenLand) return 0;
                        const c = Math.max(0, Math.min(1, (Math.abs(lat) - snowLatCutoff) / (snowBlendKm / 111.111) + 0.5));
                        return c * c * (3 - 2 * c);
                    };
                    const sc = Scenery.build({ ...data, bathy_lon: bLon, bathy_lat: bLat }, showSeafloor ? bathyZ : null, sceneScale, fileId, snowAt, baseZ);
                    if (sc) { sceneryTraceIdx = traces.length; traces.push(sc); }
                }

                const noAxis = { showgrid: false, zeroline: false, showline: false, showticklabels: false, showbackground: false, title: '', visible: false };
                const layout = {
                    hovermode: false,
                    margin: { l: 0, r: 0, b: 0, t: 0 },
                    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                    scene: {
                        xaxis: { ...noAxis, range: xRange, autorange: false },
                        yaxis: { ...noAxis, range: yRange, autorange: false },
                        zaxis: { ...noAxis, range: zRange, autorange: false },
                        aspectmode: 'manual', aspectratio: { x: aspectX, y: aspectY, z: aspectZ }, camera: { eye: { ...currentEye }, center: { ...currentCenter } }
                    },
                    showlegend: false
                };
                return { traces, layout };
            }

            // ── Glider marker geometry ───────────────────────────────────
            // The vehicle mesh (static/3d_view/models/<kind>.json: metres, +x nose,
            // y across the wings, +z up) is scaled to a fixed on-screen size
            // and oriented along the track. Everything is done in "scene
            // units" (via sceneScale) so the model keeps its proportions no
            // matter how stretched the data axes are, then converted back to
            // lon/lat/depth for Plotly. Only x/y/z change per frame; the
            // i/j/k index arrays are reused untouched.
            const gliderLength = 0.03;     // scene units nose-to-tail (scene is ~1 unit across)

            // Track split at index i; both halves share the current point so
            // there's no gap. The line itself is drawn from a decimated copy
            // (trackLineMax points) - re-uploading two 20k-point lines every
            // half second is what used to hitch playback - with the exact
            // current sample spliced in so the split lands on the glider.
            let trackLine = null;   // { idx: [sample indices], x, y, z }
            function trackGeometry(data, i) {
                if (!trackLine) {
                    const n = data.lon.length, step = Math.max(1, Math.ceil(n / trackLineMax)), idx = [];
                    for (let q = 0; q < n; q += step) idx.push(q);
                    if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
                    trackLine = { idx, x: idx.map(q => data.lon[q]), y: idx.map(q => data.lat[q]), z: idx.map(q => data.elevation[q]) };
                }
                const L = trackLine;
                // First decimated point strictly after i.
                let lo = 0, hi = L.idx.length;
                while (lo < hi) { const mid = (lo + hi) >> 1; if (L.idx[mid] <= i) lo = mid + 1; else hi = mid; }
                const cx = data.lon[i], cy = data.lat[i], cz = data.elevation[i];
                return {
                    past:  { x: L.x.slice(0, lo).concat(cx), y: L.y.slice(0, lo).concat(cy), z: L.z.slice(0, lo).concat(cz) },
                    ahead: { x: [cx].concat(L.x.slice(lo)),  y: [cy].concat(L.y.slice(lo)),  z: [cz].concat(L.z.slice(lo)) },
                };
            }

            // Track point at fractional index f (linear between samples).
            function sample(data, f) {
                const n = data.lon.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                return [data.lon[i0] + (data.lon[i1] - data.lon[i0]) * t,
                        data.lat[i0] + (data.lat[i1] - data.lat[i0]) * t,
                        data.elevation[i0] + (data.elevation[i1] - data.elevation[i0]) * t];
            }

            // Interpolated value of a per-point array with nulls (null if either
            // neighbour is missing).
            function sampleVar(arr, f) {
                if (!arr) return null;
                const n = arr.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                const a = arr[i0], b = arr[i1];
                if (a == null || b == null) return null;
                return a + (b - a) * t;
            }

            // Horizontal direction of travel at sample `from` (unit vector, scene
            // units), looking `dir` (+1 forward / -1 back) along the track until
            // the path has moved at least `minMove` on screen. Positions are
            // interpolated between GPS fixes, so a short window at the start of
            // a dive often has no horizontal movement at all. Falls back to east.
            function horizHeading(data, from, dir, minMove) {
                const S = sceneScale, n = data.lon.length;
                let hx = 0, hy = 0, j = from;
                for (let step = 0; step < n; step++) {
                    j += dir;
                    if (j < 0 || j >= n) break;
                    hx = (data.lon[j] - data.lon[from]) / S.kx; hy = (data.lat[j] - data.lat[from]) / S.ky;
                    if (Math.hypot(hx, hy) >= minMove) break;
                }
                if (dir < 0) { hx = -hx; hy = -hy; }
                const hl = Math.hypot(hx, hy);
                return hl > 1e-9 ? [hx / hl, hy / hl] : [1, 0];
            }

            // Broad direction of travel around fractional index f, for the camera:
            // horizontal displacement between points far enough either side that
            // the track has really progressed (camHeadingMove on screen). Returns
            // a unit [hx, hy] in scene units, or null when the track loops back
            // on itself and there is no clear direction (camera keeps its azimuth).
            function travelHeading(data, f) {
                const S = sceneScale, n = data.lon.length;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky]; };
                const c = P(f);
                let W = Math.max(2, n / 400);
                for (let it = 0; it < 12; it++, W *= 1.8) {
                    if (W > n / 3) break;
                    const a = P(f - W), b = P(f + W);
                    const hx = b[0] - a[0], hy = b[1] - a[1], hl = Math.hypot(hx, hy);
                    if (hl >= camHeadingMove) return [hx / hl, hy / hl];
                    // Straddling the ends shrinks one side; still fine - only
                    // the displacement magnitude matters.
                }
                return null;
            }

            // Model placement: vertices (metres, +z up) scaled to `length` scene
            // units and dropped upright at data point (lon, lat, z). Returns the
            // x/y/z arrays in data units.
            function uprightGeometry(M, length, lon, lat, z) {
                const S = sceneScale, k = length / M.length;
                const c = [lon / S.kx, lat / S.ky, z / S.kz];
                const m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    xs[q] = (c[0] + M.x[q] * k) * S.kx;
                    ys[q] = (c[1] + M.y[q] * k) * S.ky;
                    zs[q] = (c[2] + M.z[q] * k) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            // Synthetic Argo state at clock `ms` for one float's sorted
            // profiles: {lon, lat, depth (m, positive down)} or null when the
            // float isn't yet "known" (before its first profile's ascent).
            function argoState(profs, ms) {
                const H = 3600e3;
                const first = profs[0], last = profs[profs.length - 1];
                if (ms < first.ms - ARGO.leadH * H) return null;
                // Ascent into the first known profile (park → deep dip → up).
                if (ms < first.ms) {
                    const t = (first.ms - ms) / H;   // hours to go
                    let depth;
                    if (t > ARGO.deepStartH) depth = ARGO.parkM;
                    else if (t > ARGO.deepEndH) depth = ARGO.parkM + (ARGO.profileM - ARGO.parkM) * (ARGO.deepStartH - t) / (ARGO.deepStartH - ARGO.deepEndH);
                    else depth = ARGO.profileM * t / ARGO.deepEndH;
                    return { lon: first.lon, lat: first.lat, depth };
                }
                // Surfacing at or before `ms`, and the next one (if any).
                let lo = 0, hi = profs.length - 1;
                while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (profs[mid].ms <= ms) lo = mid; else hi = mid; }
                const a = profs[lo], b = profs[hi].ms > ms ? profs[hi] : null;
                const since = (ms - a.ms) / H;
                if (!b) {
                    // Last known profile: surface stint, descend, park for good.
                    let depth;
                    if (since < ARGO.surfaceH) depth = 0;
                    else if (since < ARGO.surfaceH + ARGO.descendH) depth = ARGO.parkM * (since - ARGO.surfaceH) / ARGO.descendH;
                    else depth = ARGO.parkM;
                    return { lon: a.lon, lat: a.lat, depth };
                }
                // One cycle a → b as a piecewise-linear depth keyframe track.
                // Nominal phases need ~19 h; a shorter cycle compresses every
                // phase proportionally so the keyframes stay ordered and the
                // depth stays continuous (no overlapping "surface" and "ascent"
                // rules fighting each other).
                const T = (b.ms - a.ms) / H;
                const need = ARGO.surfaceH + ARGO.descendH + ARGO.deepStartH;
                const k = T < need ? T / need : 1;
                const keys = [
                    [0, 0],
                    [ARGO.surfaceH * k, 0],
                    [(ARGO.surfaceH + ARGO.descendH) * k, ARGO.parkM],
                    [T - ARGO.deepStartH * k, ARGO.parkM],
                    [T - ARGO.deepEndH * k, ARGO.profileM],
                    [T, 0],
                ];
                let depth = 0;
                for (let q = 1; q < keys.length; q++) {
                    if (since <= keys[q][0]) {
                        const [t0, d0] = keys[q - 1], [t1, d1] = keys[q];
                        depth = t1 > t0 ? d0 + (d1 - d0) * (since - t0) / (t1 - t0) : d1;
                        break;
                    }
                }
                const u = Math.max(0, Math.min(1, (ms - a.ms) / (b.ms - a.ms)));   // drift fraction
                return { lon: a.lon + (b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u, depth };
            }

            // Seabed depth (m, positive down; 0 over land/no data) at lon/lat
            // from the bathymetry grid (nearest cell). Used to keep synthetic
            // float depths above the seafloor in shallow water.
            function seabedDepthAt(data, lon, lat) {
                const bx = data.bathy_lon, by = data.bathy_lat, bz = data.bathy_z;
                if (!bx || !by || !bz || bx.length < 2 || by.length < 2) return Infinity;
                const ix = Math.max(0, Math.min(bx.length - 1, Math.round((lon - bx[0]) / (bx[bx.length - 1] - bx[0]) * (bx.length - 1))));
                const iy = Math.max(0, Math.min(by.length - 1, Math.round((lat - by[0]) / (by[by.length - 1] - by[0]) * (by.length - 1))));
                const z = bz[iy] && bz[iy][ix];
                return (z == null || !isFinite(z)) ? Infinity : Math.max(0, -z);
            }

            // All Argo floats in play at clock `ms`: one merged mesh (a copy of
            // the model per float) at each float's synthetic position. `key`
            // identifies the set of floats (not their positions) so the caller
            // can tell a membership change from a mere move. Null when empty.
            function argoGeometry(data, ms) {
                if (!argoModel || !argoFloats.length || ms == null || !sceneBox) return null;
                // Keep submerged floats inside the drawn box: the scene floor is
                // set by the glider's dives, so a float parked at 1000 m under a
                // 200 m glider sits just above the floor instead of vanishing.
                const floorZ = sceneBox.zRange[0] * 0.9;
                const out = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [], key: '', count: 0 };
                const shown = [];
                for (const fl of argoFloats) {
                    const st = argoState(fl.profs, ms);
                    if (!st) continue;
                    shown.push(fl.wmo);
                    // Never below the seabed (keep a little clearance so the model
                    // doesn't intersect the surface mesh) nor below the scene floor.
                    const seabed = seabedDepthAt(data, st.lon, st.lat);
                    const clearance = argoLength * 0.6 * sceneScale.kz;   // data units (m) ≈ the model's half-height on screen
                    const depth = Math.min(st.depth, Math.max(0, seabed - clearance));
                    const g = uprightGeometry(argoModel, argoLength, st.lon, st.lat, Math.max(floorZ, -depth));
                    const base = out.x.length;
                    out.x.push(...g.x); out.y.push(...g.y); out.z.push(...g.z);
                    out.i.push(...argoModel.i.map(v => v + base)); out.j.push(...argoModel.j.map(v => v + base)); out.k.push(...argoModel.k.map(v => v + base));
                    out.cell.push(...argoModel.cell);
                }
                if (!shown.length) return null;
                out.key = shown.join('|'); out.count = shown.length;
                return out;
            }

            function gliderGeometry(data, f) {
                const n = data.lon.length;
                const S = sceneScale;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky, p[2] / S.kz]; };
                const c = P(f);
                // Heading + pitch: from a few samples behind to a few ahead so
                // the model doesn't twitch on every sample.
                const w = Math.max(1, Math.min(8, Math.floor(n / 200)));
                const a0 = P(f - w), a1 = P(f + w);
                let fw = [a1[0] - a0[0], a1[1] - a0[1], a1[2] - a0[2]];
                // Level out over the first/last few samples: at the very ends
                // the heading window is one-sided and often points straight
                // down the first dive, which looks wrong on a parked glider.
                const edge = Math.max(2, 2 * w);
                const level = Math.min(1, Math.min(f, n - 1 - f) / edge);   // 0 at the ends → 1 inside
                fw[2] *= level;
                // If the local window has no real horizontal movement (interpolated
                // positions during a dive), take the heading from a longer look
                // along the track - the same one the start/end buoys use - so the
                // parked glider and its buoy agree on which way is "forward".
                if (Math.hypot(fw[0], fw[1]) < gliderLength * 0.25) {
                    const near = Math.round(f), dir = near < n / 2 ? +1 : -1;
                    const [hx, hy] = horizHeading(data, near, dir, gliderLength);
                    const vz = fw[2];
                    fw = [hx * gliderLength, hy * gliderLength, vz];
                }
                let len = Math.hypot(...fw);
                if (!(len > 1e-9)) { fw = [1, 0, 0]; len = 1; }
                fw = fw.map(v => v / len);

                // Attitude. With measured pitch/roll in the file: heading from
                // the track, pitch and roll from the sensors (true angles, so
                // the model won't lie along the vertically-exaggerated track).
                // Without: tangent to the drawn track, wings level.
                let pitchDeg = sampleVar(data.pitch, f), rollDeg = sampleVar(data.roll, f);
                if (pitchDeg != null) { pitchDeg *= level; rollDeg = (rollDeg || 0) * level; }
                let sd, up;
                if (pitchDeg != null) {
                    const hl = Math.hypot(fw[0], fw[1]);
                    const h = hl > 1e-9 ? [fw[0] / hl, fw[1] / hl, 0] : [1, 0, 0];   // horizontal heading
                    const pr = pitchDeg * Math.PI / 180, cp = Math.cos(pr), sp = Math.sin(pr);
                    fw = [h[0] * cp, h[1] * cp, sp];
                    const s0 = [-h[1], h[0], 0];                                       // port side, level
                    const u0 = [fw[1] * s0[2] - fw[2] * s0[1], fw[2] * s0[0] - fw[0] * s0[2], fw[0] * s0[1] - fw[1] * s0[0]];
                    const rr = (rollDeg || 0) * Math.PI / 180, cr = Math.cos(rr), sr = Math.sin(rr);
                    sd = [s0[0] * cr + u0[0] * sr, s0[1] * cr + u0[1] * sr, s0[2] * cr + u0[2] * sr];
                    up = [u0[0] * cr - s0[0] * sr, u0[1] * cr - s0[1] * sr, u0[2] * cr - s0[2] * sr];
                } else {
                    // Wings stay level: side = up × forward (horizontal), up = forward × side.
                    const ref = Math.abs(fw[2]) < 0.99 ? [0, 0, 1] : [0, 1, 0];
                    sd = [ref[1] * fw[2] - ref[2] * fw[1], ref[2] * fw[0] - ref[0] * fw[2], ref[0] * fw[1] - ref[1] * fw[0]];
                    const sl = Math.hypot(...sd); sd = sd.map(v => v / sl);
                    up = [fw[1] * sd[2] - fw[2] * sd[1], fw[2] * sd[0] - fw[0] * sd[2], fw[0] * sd[1] - fw[1] * sd[0]];
                }

                const k = gliderLength / gliderModel.length;   // metres -> scene units
                const M = gliderModel, m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    const mx = M.x[q] * k, my = M.y[q] * k, mz = M.z[q] * k;
                    xs[q] = (c[0] + fw[0] * mx + sd[0] * my + up[0] * mz) * S.kx;
                    ys[q] = (c[1] + fw[1] * mx + sd[1] * my + up[1] * mz) * S.ky;
                    zs[q] = (c[2] + fw[2] * mx + sd[2] * my + up[2] * mz) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            // Which vehicle to draw: the file's detected platform kind, with the
            // same name heuristics as the file list as a fallback; Slocum if unknown.
            const MODEL_KINDS = ['slocum', 'seaglider', 'alr'];
            function platformKindFor(kind, name) {
                if (kind && MODEL_KINDS.includes(kind)) return kind;
                const n = String(name || '').toLowerCase();
                if (/^alr[_\-\d]/.test(n)) return 'alr';
                if (/^(sg\d|seaglider)/.test(n)) return 'seaglider';
                if (/slocum/.test(n)) return 'slocum';
                return '';
            }
            const modelPromise = fetch('/api/files').then(r => r.json()).catch(() => ({ files: [] }))
                .then(({ files }) => {
                    const rec = (files || []).find(f => f.id === fileId) || {};
                    return platformKindFor(rec.platform_kind, rec.name) || 'slocum';
                })
                .then(kind => loadModel(kind));
            // Argo float model: optional, never blocks the scene.
            const argoModelPromise = loadModel('argo').catch(() => null);
            // Start/end buoys: loaded with the scene (tiny files); optional.
            const buoyPromise = Promise.all([loadModel('buoy_green'), loadModel('buoy_red')])
                .then(([start, end]) => ({ start, end })).catch(() => null);

            // Scenery models: optional, never block the scene; redraw once they
            // arrive if the toggle is already on.
            Scenery.load(loadModel).then(() => { if (fx.scenery && rerender) rerender(); }).catch(() => {});

            // `name` is a vehicle/object in static/3d_view/models, or a full
            // URL (starts with '/') for models kept elsewhere (scenery).
            function loadModel(name) {
                const url = name.startsWith('/') ? name : `/static/3d_view/models/${name}.json`;
                return fetch(url).then(r => { if (!r.ok) throw new Error(url); return r.json(); }).then(parts => {
                    // Merge hull + fins into one mesh; each triangle carries the
                    // index of its part's colour (drawn with intensitymode:'cell').
                    const M = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [] };
                    const colors = [];
                    for (const p of Object.values(parts)) {
                        if (!colors.includes(p.color)) colors.push(p.color);
                        const ci = colors.indexOf(p.color), base = M.x.length;
                        M.x.push(...p.x); M.y.push(...p.y); M.z.push(...p.z);
                        M.i.push(...p.i.map(v => v + base)); M.j.push(...p.j.map(v => v + base)); M.k.push(...p.k.map(v => v + base));
                        for (let q = 0; q < p.i.length; q++) M.cell.push(ci);
                    }
                    M.cmax = Math.max(colors.length - 1, 1);
                    M.colorscale = colors.map((c, q) => [q / M.cmax, c]);
                    if (colors.length === 1) M.colorscale.push([1, colors[0]]);
                    // Nose-to-tail length: from the hull if the model has one
                    // (vehicles), else from every vertex (buoys, moorings, ships).
                    const hx = parts.hull ? parts.hull.x : M.x;
                    M.length = Math.max(...hx) - Math.min(...hx);
                    if (!parts.hull) M.length = Math.max(...M.z) - Math.min(...M.z);   // upright objects: height
                    return M;
                });
            }

            // Playback clock value (epoch ms) at the current position, or null
            // when the file has no times. Set once the slider is wired up.
            let playClockMs = () => null;

            Promise.all([fetch(`/api/3d_data?id=${encodeURIComponent(fileId)}`).then(r => r.json()), modelPromise, buoyPromise])
                .then(([data, model, buoys]) => {
                    if (data.error) throw new Error(data.error);
                    gliderModel = model;
                    buoyModels = buoys;

                    // Argo floats that surfaced inside the scene box during the
                    // deployment. Arrives after the first draw; the scene is
                    // rebuilt once (camera kept) when it does.
                    if (data.time_ms) {
                        const ts = data.time_ms.filter(v => v != null && isFinite(v));
                        if (ts.length) {
                            const b = data.bounds, q = new URLSearchParams({
                                min_lat: b.min_lat, max_lat: b.max_lat, min_lon: b.min_lon, max_lon: b.max_lon,
                                t0: Math.min(...ts) - argoWindowHours * 3600e3, t1: Math.max(...ts) + argoWindowHours * 3600e3,
                            });
                            Promise.all([fetch('/api/argo/profiles?' + q).then(r => r.json()), argoModelPromise])
                                .then(([res, m]) => {
                                    if (!m || !res || !res.profiles || !res.profiles.length) return;
                                    argoModel = m;
                                    const byWmo = new Map();
                                    for (const r of res.profiles) {
                                        if (!byWmo.has(r[0])) byWmo.set(r[0], []);
                                        byWmo.get(r[0]).push({ lat: r[1], lon: r[2], ms: r[3] });
                                    }
                                    // The index lists some profiles twice (real-time + delayed-mode
                                    // files, descending + ascending halves); collapse anything within
                                    // a few hours of the previous one or the cycle logic sees a
                                    // zero-length cycle and the float snaps.
                                    argoFloats = [...byWmo].map(([wmo, profs]) => {
                                        profs.sort((a, b) => a.ms - b.ms);
                                        const out = [];
                                        for (const p of profs) if (!out.length || p.ms - out[out.length - 1].ms > 3 * 3600e3) out.push(p);
                                        return { wmo, profs: out };
                                    });
                                    if (rerender) rerender();
                                })
                                .catch(() => {});
                        }
                    }

                    const config = { displayModeBar: false, responsive: true };
                    let first = buildScene(data);
                    // Open the view already behind the glider at follow distance,
                    // looking the way it's about to go, instead of the generic
                    // corner view (which the follow camera would then have to
                    // swing all the way round from).
                    {
                        const hd = travelHeading(data, posIdx);
                        if (hd) {
                            currentEye = { x: currentCenter.x - hd[0] * followDist, y: currentCenter.y - hd[1] * followDist, z: currentEye.z };
                            first = buildScene(data);
                        }
                    }

                    // Re-render in place on a style toggle, keeping the camera.
                    rerender = () => {
                        clampEye();
                        const scene = buildScene(data);
                        Plotly.react('plot3d', scene.traces, scene.layout, config).then(tightenClipPlanes);
                    };

                    Plotly.newPlot('plot3d', first.traces, first.layout, config).then(() => {
                        window.logRender('3D Map Frontend', performance.now() - startTime);
                        tightenClipPlanes();

                        // Fade out the loading overlay
                        const overlay = document.getElementById('overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        document.getElementById('layer-panel').classList.add('ready');

                        const plotDiv = document.getElementById('plot3d');

                        // ── Position slider ──────────────────────────────
                        const posSlider = document.getElementById('posSlider');
                        const posPlay = document.getElementById('posPlay');
                        const posReadout = document.getElementById('posReadout');
                        const nPts = data.lon.length;
                        posSlider.max = String(Math.max(0, nPts - 1));
                        posSlider.value = '0';

                        const fmtTime = ms => {
                            if (ms == null || !isFinite(ms)) return '';
                            const iso = new Date(ms).toISOString();   // epoch-ms -> always UTC
                            return iso.slice(0, 10) + ' ' + iso.slice(11, 16) + ' UTC';
                        };
                        const updateReadout = () => {
                            const depth = Math.max(0, -data.elevation[posIdx]);
                            const t = data.time_ms ? fmtTime(data.time_ms[posIdx]) : '';
                            const p = data.pitch ? data.pitch[posIdx] : null, r = data.roll ? data.roll[posIdx] : null;
                            const att = (p != null ? ' · pitch ' + p.toFixed(0) + '°' : '') + (r != null ? ' · roll ' + r.toFixed(0) + '°' : '');
                            const ag = argoFloats.length && playClockMs() != null ? argoFloats.filter(fl => argoState(fl.profs, playClockMs())).length : 0;
                            posReadout.innerHTML = (t ? t + '<br>' : '') + '<b>' + depth.toFixed(0) + ' m</b>' + att + (ag ? ' · ' + ag + ' Argo' : '');
                        };
                        // Data updates (mesh / track split) each force a full
                        // Plotly replot, so during playback they run at a throttled
                        // cadence. The camera goes through relayout alone, which is
                        // just a viewport change - cheap enough for every frame.
                        const pushCamera = () => Plotly.relayout('plot3d',
                            { 'scene.camera.eye': { ...currentEye }, 'scene.camera.center': { ...currentCenter } });
                        // Fast path: hand new x/y/z straight to the trace's WebGL
                        // wrapper (what Plotly.restyle ends up doing) without the
                        // replot around it, which is what stalls the frame. Same
                        // reach-into-internals as tightenClipPlanes; falls back to a
                        // normal restyle if the internals aren't where we expect.
                        const fastXYZ = (indices, upd) => {
                            try {
                                const scene = plotDiv._fullLayout.scene._scene;
                                indices.forEach((ti, q) => {
                                    const ft = plotDiv._fullData[ti], w = scene.traces[ft.uid];
                                    if (!w || typeof w.update !== 'function') throw new Error('no wrapper');
                                    const patch = { x: upd.x[q], y: upd.y[q], z: upd.z[q] };
                                    Object.assign(plotDiv.data[ti], patch); Object.assign(ft, patch);
                                    w.update(ft);
                                });
                                const gl = scene.glplot;
                                if (typeof gl.redraw === 'function') gl.redraw(); else gl.dirty = true;
                            } catch (_) {
                                Plotly.restyle('plot3d', upd, indices);
                            }
                        };
                        const pushGlider = (f) => {
                            if (gliderTraceIdx < 0) return;
                            const b = gliderGeometry(data, f);
                            fastXYZ([gliderTraceIdx], { x: [b.x], y: [b.y], z: [b.z] });
                            updateReadout();
                        };
                        const pushTrack = () => {
                            if (pastTraceIdx < 0) return;
                            const t = trackGeometry(data, posIdx);
                            fastXYZ([pastTraceIdx, aheadTraceIdx], { x: [t.past.x, t.ahead.x], y: [t.past.y, t.ahead.y], z: [t.past.z, t.ahead.z] });
                        };
                        // Argo floats: only touch the trace when the visible set
                        // changes (they don't move between surfacings). Showing /
                        // hiding goes through a normal restyle (rare); a change of
                        // members while visible takes the fast path.
                        const pushArgo = () => {
                            if (argoTraceIdx < 0) return;
                            const ag = argoGeometry(data, playClockMs());
                            const key = ag ? ag.key : '';
                            const wasShown = !!argoShownKey;
                            const membersChanged = key !== argoShownKey;
                            argoShownKey = key;
                            if (!ag) { if (wasShown) Plotly.restyle('plot3d', { visible: false }, [argoTraceIdx]); return; }
                            const patch = { x: ag.x, y: ag.y, z: ag.z, i: ag.i, j: ag.j, k: ag.k, intensity: ag.cell };
                            if (!wasShown || membersChanged) { Plotly.restyle('plot3d', { ...Object.fromEntries(Object.entries(patch).map(([k, v]) => [k, [v]])), visible: true }, [argoTraceIdx]); return; }
                            try {
                                const scene = plotDiv._fullLayout.scene._scene;
                                const ft = plotDiv._fullData[argoTraceIdx], w = scene.traces[ft.uid];
                                Object.assign(plotDiv.data[argoTraceIdx], patch); Object.assign(ft, patch);
                                w.update(ft);
                            } catch (_) {
                                Plotly.restyle('plot3d', Object.fromEntries(Object.entries(patch).map(([k, v]) => [k, [v]])), [argoTraceIdx]);
                            }
                        };
                        // Scenery sway (underwater plants only), wall-clock driven.
                        const pushScenery = (t) => {
                            if (sceneryTraceIdx < 0) return;
                            const s = Scenery.sway(t / 1000);
                            if (s) fastXYZ([sceneryTraceIdx], { x: [s.x], y: [s.y], z: [s.z] });
                        };
                        // Slider scrub: snap the camera to the glider and redraw everything.
                        let posRaf = 0;
                        const setPos = (i) => {
                            posIdx = Math.max(0, Math.min(nPts - 1, i | 0));
                            posSlider.value = String(posIdx);
                            if (!posRaf) posRaf = requestAnimationFrame(() => {
                                posRaf = 0;
                                posFloat = posIdx;
                                lookAtIdx(data, posIdx);
                                pushGlider(posIdx); pushArgo(); pushTrack(); pushCamera();
                            });
                        };
                        posSlider.addEventListener('input', () => setPos(+posSlider.value));

                        // ── Playback ─────────────────────────────────────
                        // One rAF loop. Each lap: the glider travels the track while
                        // the camera orbits it; at the end the glider parks while the
                        // orbit completes its 360°, then it all starts again.
                        // The camera centre chases the glider through a low-pass
                        // filter (cameraTau) so GPS scatter never reaches the view.
                        // A manual rotate/zoom holds everything and resumes after a
                        // cooldown (ring on the play button); a plain click anywhere,
                        // or the button, pauses fully.
                        let playing = false, playRaf = 0, lastT = 0;
                        let posFloat = 0;         // fractional track position
                        // Playback runs on the deployment clock so it's linear in
                        // real time however unevenly the samples are spaced. Times
                        // are forward-filled over gaps and forced monotonic; if the
                        // file has no usable times the sample index is the clock.
                        const clock = (() => {
                            const raw = data.time_ms;
                            if (!raw || raw.length !== nPts) return null;
                            const tm = new Array(nPts); let last = null;
                            for (let q = 0; q < nPts; q++) { const v = raw[q]; if (v != null && isFinite(v) && (last == null || v > last)) last = v; tm[q] = last; }
                            let first = tm.findIndex(v => v != null);
                            if (first < 0 || tm[nPts - 1] <= tm[first]) return null;
                            for (let q = 0; q < first; q++) tm[q] = tm[first];
                            return tm;
                        })();
                        const clockSpan = clock ? clock[nPts - 1] - clock[0] : nPts - 1;
                        playClockMs = () => clock ? clockAt(posFloat) : null;
                        const clockAt = f => {          // fractional index -> clock value
                            if (!clock) return f;
                            const i0 = Math.floor(f), i1 = Math.min(nPts - 1, i0 + 1);
                            return clock[i0] + (clock[i1] - clock[i0]) * (f - i0);
                        };
                        const indexAt = c => {          // clock value -> fractional index
                            if (!clock) return c;
                            let lo = 0, hi = nPts - 1;
                            while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (clock[mid] <= c) lo = mid; else hi = mid; }
                            const d = clock[hi] - clock[lo];
                            return d > 0 ? lo + (c - clock[lo]) / d : lo;
                        };
                        let endHeld = 0;          // wall seconds spent holding at the end of the track
                        let viewT = 0;            // wall seconds of playback, drives the viewing-angle wander
                        let lastTrackT = 0;
                        let holding = false;      // pointer down on the plot (rotating)
                        let cooldownTimer = 0;    // pending resume after a manual interaction
                        let speed = 1;
                        const posSpeed = document.getElementById('posSpeed');
                        posSpeed.addEventListener('click', (e) => {
                            e.stopPropagation();
                            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
                            posSpeed.textContent = speed + 'x';
                        });
                        const setIcon = () => {
                            posPlay.querySelector('.material-symbols-outlined').textContent = playing ? 'pause' : 'play_arrow';
                            posPlay.title = playing ? 'Pause' : 'Play glider along track';
                        };
                        const clearCooldown = () => {
                            clearTimeout(cooldownTimer); cooldownTimer = 0;
                            posPlay.classList.remove('cooldown');
                        };
                        const setPlaying = (on) => {
                            playing = on; clearCooldown(); setIcon();
                            cancelAnimationFrame(playRaf); playRaf = 0;
                            if (on) { posFloat = posIdx; lastT = 0; playRaf = requestAnimationFrame(tick); }
                        };
                        // Temporary hold: called on any manual camera interaction.
                        const holdThenResume = () => {
                            if (!playing) return;
                            clearTimeout(cooldownTimer);
                            lastT = 0;   // don't integrate the time spent held
                            posPlay.classList.remove('cooldown');
                            void posPlay.offsetWidth;   // restart the ring animation
                            posPlay.style.setProperty('--cooldown', cooldownMs + 'ms');
                            posPlay.classList.add('cooldown');
                            cooldownTimer = setTimeout(() => { cooldownTimer = 0; posPlay.classList.remove('cooldown'); }, cooldownMs);
                        };
                        const held = () => holding || cooldownTimer !== 0;

                        function tick(t) {
                            playRaf = requestAnimationFrame(tick);
                            if (held()) { lastT = t; return; }
                            const dtRaw = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
                            lastT = t;
                            if (!dtRaw) return;
                            const dt = dtRaw * speed;

                            if (posIdx < nPts - 1) {
                                posFloat = Math.min(nPts - 1, indexAt(clockAt(posFloat) + dt * clockSpan / trackSeconds));
                            } else if ((endHeld += dtRaw) >= endHoldSeconds) {
                                posFloat = 0; endHeld = 0;           // held at the end → start again
                            }
                            posIdx = Math.round(posFloat);

                            // Camera: ease the pivot toward the glider and carry the eye
                            // with it, then swing the eye round (shortest way) toward
                            // the azimuth directly behind the direction of travel.
                            // Pivot a little ahead of the glider (along its heading) so
                            // the glider sits toward one side of the frame rather than
                            // dead centre. Uses the previous frame's eye distance.
                            const target = centerFor(data, posFloat);
                            const hd0 = travelHeading(data, posFloat);
                            if (hd0) {
                                const o0 = eyeOffset(), r0 = Math.min(followDist, Math.hypot(o0.x, o0.y));
                                target.x += hd0[0] * leadFrac * r0; target.y += hd0[1] * leadFrac * r0;
                            }
                            const a = 1 - Math.exp(-dtRaw / cameraTau);
                            const dx = (target.x - currentCenter.x) * a, dy = (target.y - currentCenter.y) * a;
                            currentCenter = { x: currentCenter.x + dx, y: currentCenter.y + dy, z: currentCenter.z };
                            const o = { x: currentEye.x + dx - currentCenter.x, y: currentEye.y + dy - currentCenter.y };
                            let r = Math.hypot(o.x, o.y);
                            if (r > followDist) r += (followDist - r) * (1 - Math.exp(-dtRaw / camAzimuthTau));   // ease in, never out
                            let th = Math.atan2(o.y, o.x);
                            // A slow constant drift keeps the picture alive while the
                            // glider sits still (surface intervals, the end hold);
                            // the follow-behind easing rides on top of it.
                            th += dtRaw * 2 * Math.PI / idleOrbitSeconds;
                            viewT += dtRaw;
                            const swing = (viewSwingDeg * Math.PI / 180) *
                                (0.6 * Math.sin(2 * Math.PI * viewT / viewPeriodsS[0]) + 0.4 * Math.sin(2 * Math.PI * viewT / viewPeriodsS[1] + 1.3));
                            const hd = hd0;
                            if (hd) {
                                const want = Math.atan2(-hd[1], -hd[0]) + swing;      // behind the glider, swung to one side
                                let d = want - th;
                                d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
                                th += d * (1 - Math.exp(-dtRaw / camAzimuthTau));
                            }
                            currentEye = { x: currentCenter.x + r * Math.cos(th), y: currentCenter.y + r * Math.sin(th), z: currentEye.z };
                            // Glider every frame (interpolated), track split less often
                            // (it slices the whole track), camera last so its redraw
                            // picks up both.
                            pushGlider(posFloat);
                            pushArgo();   // floats move every frame too (same fast path; only a membership change replots)
                            pushScenery(t);
                            if (t - lastTrackT >= trackEveryMs) { lastTrackT = t; posSlider.value = String(posIdx); pushTrack(); }
                            pushCamera();
                        }
                        posPlay.addEventListener('click', (e) => { e.stopPropagation(); setPlaying(!playing); });
                        posSlider.addEventListener('pointerdown', () => { if (playing) setPlaying(false); });

                        // Manual camera interaction on the plot: hold while the pointer
                        // is down, then cool down. A click without movement pauses fully.
                        let downX = 0, downY = 0, moved = false;
                        plotDiv.addEventListener('pointerdown', (e) => {
                            holding = true; moved = false; downX = e.clientX; downY = e.clientY;
                            if (playing) { clearTimeout(cooldownTimer); cooldownTimer = 0; posPlay.classList.remove('cooldown'); }
                        }, true);
                        document.addEventListener('pointermove', (e) => {
                            if (holding && (Math.abs(e.clientX - downX) > 4 || Math.abs(e.clientY - downY) > 4)) moved = true;
                        }, true);
                        const release = (e) => {
                            if (!holding) return;
                            holding = false;
                            if (e && e.target && e.target.closest && e.target.closest('#posBar, #layer-panel')) return;
                            if (!moved) { if (playing) setPlaying(false); return; }   // plain click → full pause
                            holdThenResume();
                        };
                        document.addEventListener('pointerup', release, true);
                        document.addEventListener('pointercancel', release, true);
                        plotDiv.addEventListener('wheel', () => holdThenResume(), { capture: true, passive: true });

                        updateReadout();
                        document.getElementById('posBar').classList.add('ready');

                        plotDiv.on('plotly_relayout', (e) => {
                            const cam = (e && e['scene.camera']) || {};
                            const eye = cam.eye || (e && e['scene.camera.eye']);
                            const ctr = cam.center || (e && e['scene.camera.center']);
                            if (eye) currentEye = { ...currentEye, ...eye };
                            if (ctr) currentCenter = { ...currentCenter, ...ctr };   // user panned (right-drag)
                            // Clamp zoom-out: pull the eye back in if it drifted past the cap.
                            if (clampEye()) Plotly.relayout('plot3d', { 'scene.camera.eye': currentEye });
                        });
                        // Swallow wheel events once at either zoom cap so the
                        // view doesn't flicker past and snap back.
                        plotDiv.addEventListener('wheel', (e) => {
                            if ((e.deltaY > 0 && eyeDist() >= eyeCap() - 1e-3) || (e.deltaY < 0 && eyeDist() <= minEyeDist + 1e-3)) {
                                e.preventDefault(); e.stopPropagation();
                            }
                        }, { capture: true, passive: false });
                    });
                })
                .catch(err => {
                    document.getElementById('loadingIcon').style.display = 'none';
                    document.getElementById('statusText').style.color = '#ef4444';
                    document.getElementById('statusText').textContent = err.message || "Failed to load 3D data.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
