<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>3D Ocean Chunk</title>
    <!-- Self-hosted partial Plotly: gl3d bundle (scatter3d + surface) only. -->
    <script src="/static/vendor/plotly-gl3d-2.32.0.min.js"></script>
    <script src="/static/js/console_log.js"></script>
    <!-- Decorative scenery (kelp, trees...) behind the "Scenery" style toggle; see static/3d_view/scenery/. -->
    <script src="/api/plot_presets.js"></script>
    <script src="/static/3d_view/scene_kit.js"></script>
    <script src="/static/3d_view/scenery/scenery.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    </noscript>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #8b93a3;
            --accent: #5b9cff;
            --spinner-track: #1f2432;
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #5f6673;
            --accent: #1a73e8;
            --spinner-track: #e2e5ec;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,sans-serif;
            color: var(--text-primary);
        }
        #plot3d { width: 100vw; height: 100vh; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.5s ease-in-out;
            color: var(--text-muted); font-size: 11px;
        }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--spinner-track);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ── Style sidebar (collapsible, bottom-right), same look as the map's Layers panel ── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            max-height: calc(100vh - 20px); box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        /* Collapsed: same 32px height as #posBar so the two sit level. */
        #layer-panel.collapsed { max-width: none; height: 32px; justify-content: center; }
        #layer-panel.collapsed #trackColourRow { display: none !important; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; min-height: 0; flex-shrink: 1;
        }
        .fxBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
            white-space: nowrap;
        }
        .fxBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        .fxBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovSwatch { flex: 0 0 auto; }
        #trackColourRow { display: none; padding: 6px 8px 4px; border-top: 1px solid color-mix(in srgb, var(--text-primary) 12%, transparent); margin-top: 4px; }
        #trackColourRow label { display: block; font-size: 10px; font-weight: 600; color: var(--text-secondary, var(--text-primary)); margin-bottom: 3px; }
        #trackColourSel { width: 100%; font: inherit; font-size: 11px; font-weight: 600; padding: 3px 4px; border-radius: 6px; border: none; color: var(--text-primary);
                          background: color-mix(in srgb, var(--text-primary) 10%, transparent); }
        #trackColourBar { display: none; margin-top: 6px; } #trackColourBar i { display: block; height: 7px; border-radius: 4px; }
        #trackColourBar div { display: flex; justify-content: space-between; font-size: 10px; margin-top: 2px; color: var(--text-primary); font-variant-numeric: tabular-nums; }

        #scaleNote {
            position: absolute; top: 8px; left: 10px; z-index: 40;
            font-size: 10px; color: var(--text-muted); opacity: 0.8;
            user-select: none;
        }
        #scaleNote a { color: inherit; text-decoration: underline; }
        #scaleNote a:hover { color: var(--text-primary); }

        /* ── Glider position bar (bottom-left, like the map's overlay bar); hidden until the scene has rendered ── */
        #posBar {
            display: none; position: absolute; bottom: 10px; left: 10px;
            z-index: 60; align-items: center; gap: 8px; padding: 0 10px;
            width: clamp(180px, 50%, 460px); max-width: calc(100% - 66px); height: 32px; box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #posBar.ready { display: flex; }
        #posPlay {
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
            width: 24px; height: 24px; border: none; border-radius: 6px; cursor: pointer;
            background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--text-primary);
        }
        #posPlay:hover { background: color-mix(in srgb, var(--accent) 45%, transparent); }
        #posPlay .material-symbols-outlined { font-size: 16px; }
        #posPlay { position: relative; overflow: visible; }
        #posPlay svg.ring { position: absolute; inset: -3px; width: 30px; height: 30px; pointer-events: none; display: none; }
        #posPlay.cooldown svg.ring { display: block; }
        /* pathLength=100 on the rect keeps the dash maths independent of its perimeter. */
        #posPlay svg.ring rect {
            fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
            stroke-dasharray: 100; stroke-dashoffset: 100;
        }
        #posPlay.cooldown svg.ring rect { animation: ringFill var(--cooldown, 1.5s) linear forwards; }
        @keyframes ringFill { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
        #posSlider {
            flex: 1 1 auto; min-width: 60px; margin: 0; cursor: pointer;
            accent-color: #ffd60a; height: 4px;
        }
        #posSpeed {
            flex: 0 0 auto; min-width: 34px; height: 24px; padding: 0 6px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums;
            background: color-mix(in srgb, var(--text-primary) 10%, transparent); color: var(--text-primary);
        }
        #posSpeed:hover { background: color-mix(in srgb, var(--text-primary) 20%, transparent); }
        #posReadout {
            flex: 0 0 auto; font-size: 10px; font-variant-numeric: tabular-nums;
            color: var(--text-muted); white-space: nowrap; text-align: right; line-height: 1.25;
        }
        #posReadout b { color: var(--text-primary); font-weight: 600; }

        /* Narrow panels: compact bar filling the row between the left edge and the Style button. */
        @media (max-width: 560px) {
            #posBar { left: 8px; right: 56px; width: auto; max-width: none; bottom: 8px; gap: 6px; padding: 0 6px; }
            #posSlider { min-width: 30px; }
            #posSpeed { min-width: 28px; padding: 0 4px; }
            #posReadout { font-size: 9px; }
            #layer-panel { bottom: 8px; right: 8px; }
            #scaleNote { left: 8px; font-size: 9px; }
        }
        @media (max-width: 340px) { #posSpeed { display: none; } }
    </style>
    <script>
        (function() {
            try {
                // Theme from the URL; when absent, inherit the parent shell's theme.
                const p = new URLSearchParams(window.location.search);
                let t = p.get('theme');
                if (!t) { try { t = window.parent.document.documentElement.getAttribute('data-theme'); } catch (_) {} }
                if (!t) { const c = document.cookie.split('; ').find(v => v.startsWith('gp_theme=')); t = c ? decodeURIComponent(c.slice(9)) : 'light'; }   // the shell's theme cookie
                document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Awaiting Dataset...</span>
    </div>

    <div id="plot3d"></div>
    <div id="posBar">
        <button id="posPlay" title="Play glider along track"><span class="material-symbols-outlined">play_arrow</span><svg class="ring" viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" rx="8" pathLength="100"/></svg></button>
        <input id="posSlider" type="range" min="0" max="0" value="0" step="1" title="Glider position along track">
        <button id="posSpeed" title="Playback speed">1x</button>
        <span id="posReadout"></span>
    </div>
    <span id="scaleNote"><span id="scaleX"></span>Bathymetry data provided by <a href="https://www.ncei.noaa.gov/products/etopo-global-relief-model" target="_blank" rel="noopener">NOAA</a></span>

    <!-- Style sidebar (collapsible); rows are generated by JS from EFFECTS. -->
    <div id="layer-panel" class="collapsed">
        <button id="layer-header" title="Show style options">
            <span class="material-symbols-outlined">tune</span>
            <span id="layer-title">Style</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body"></div>
        <div id="trackColourRow"><label for="trackColourSel">Track colour</label><select id="trackColourSel"></select>
            <div id="trackColourBar"><i></i><div></div></div></div>
    </div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'setTheme') return;
            const t = event.data.theme === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        });

        const SK = window.SceneKit;   // the look shared with the mission view (static/3d_view/scene_kit.js)

        // Max eye distance: further out hits WebGL depth-precision glitches.
        const maxEyeDist = 2.6;
        const maxEyeDistTrueHeight = 1.9;   // flat true-scale scene z-fights sooner when far away
        let boxAspectZ = 1;   // set by buildScene; a tall box needs more zoom-out room
        const eyeCap = () => (fx.trueHeight ? maxEyeDistTrueHeight : maxEyeDist * Math.max(1, boxAspectZ));
        // Min eye distance: closer and the near clip plane eats the glider and seabed.
        const minEyeDist = 0.25;

        // Tight clip planes + no pick pass; redo after every (re)plot, which makes fresh WebGL objects.
        const tightenClipPlanes = () => SK.tuneGl(document.getElementById('plot3d'));
        const trackColour = SK.LOOK.trackColour;
        const trackAheadColour = '#6e643a';
        const trackOpacity = 0.7;            // travelled track: slightly see-through so the vehicle shows through it  // the part of the track still to come: thinner + darker

        const verticalExaggeration = 100;   // upper limit; small-footprint / deep scenes get less (see buildScene)
        const targetTrackAspect = 0.7;      // glider's dive depth as a fraction of the scene width
        const maxBoxAspect = 1.5;           // tallest the whole box (down to the seabed) may get

        // Playback: the glider sweeps the track in trackSeconds (at 1x) with a follow-behind camera,
        // holds endHoldSeconds at the end, then restarts.
        const trackSeconds = 1600;   // at 1x: seconds for the glider to sweep the whole deployment
        const idleOrbitSeconds = 240; // wall clock per full turn: a slow drift so the view never sits dead still (surface waits, hold at the end)
        // Viewing angle wanders ±viewSwingDeg either side of "directly behind" on two slow periods.
        const viewSwingDeg = 80;
        const viewPeriodsS = [95, 217];
        const endHoldSeconds = 4;    // wall-clock pause at the end before looping
        const camAzimuthTau = 6;     // s: how lazily the camera swings round behind the glider (wall clock)
        const camHeadingMove = 0.08; // scene units the track must progress before the heading counts
        const SPEEDS = [0.1, 0.25, 0.5, 1, 2, 5, 10, 25];
        const clearViewEveryS = 0.5;  // s: how often playback re-checks whether the seabed hides the glider
        const clearViewDirs = 24;           // compass directions scored for an open view
        const clearViewBehindBias = 0.15;   // how much "behind the glider" is preferred over a slightly clearer side
        const clearViewSticky = 0.06;       // a new direction must beat the current one by this much
        const pitchExagFromDeg = 6, pitchExagFullDeg = 18;   // measured pitch below/above which the model's pitch is not / fully (half-way) stretched
        const camSoftStartS = 4;     // s: camera easing ramps in over this long after play / resume
        const camAimTau = 3;         // s: smoothing of the target azimuth itself, ahead of camAzimuthTau
        const cameraTau = 2.0;       // s: camera-centre smoothing time constant (bigger = lazier follow)
        const trackEveryMs = 500;    // past/ahead track split cadence during playback
        const sceneryEveryMs = 50;   // scenery sway/swim cadence during playback (~20 fps: the motion is slow, and every update re-meshes ~15k vertices)
        const trackLineMax = Infinity;   // cap on points in the drawn track line. Uncapped: a decimated line visibly differs from the full-resolution tip, so the path "changed" once the glider had passed
        const followDist = 0.64;      // scene units: the camera eases in to this if it's further out during playback (never pushes out)
        const maxOffFrac = 0.35;     // the pivot may never sit further than this fraction of the eye distance from the glider, so the glider stays in frame however fast it moves
        const leadFrac = 0.3;        // the pivot sits this fraction of the camera distance ahead of the glider, so the glider is off-centre with the water ahead filling the frame
        const cooldownMs = 1500;     // resume delay after a manual rotate/zoom
        const ARGO = SK.ARGO;   // synthetic float cycle between known surfacings
        const argoWindowHours = ARGO.leadH;   // query margin around the deployment span
        const argoLength = SK.SIZES.argo, buoyLength = SK.SIZES.buoy;   // scene units tall; sizes are SceneKit's, as the mission view
        const buoyOffset = 0.012;    // scene units sideways from the track end

        // ── Style toggles: one row each in the Style panel; choices persist in localStorage (FX_STORE_KEY) ──
        const EFFECTS = [
            { key: 'greenLand',  label: 'Colour land',      icon: 'park',          def: true  },
            { key: 'trueHeight', label: 'True height',      icon: 'straighten',    def: false },
            { key: 'scenery',    label: 'Scenery',          icon: 'nature',        def: true  },   // decorative life (static/3d_view/scenery/) + depth-shaded seabed
            { key: 'argo',       label: 'Argo floats',      icon: 'sensors',       def: true  },   // Argo floats profiling near the glider during playback
        ];
        const FX_STORE_KEY = 'gp3d_fx_v3';   // bump when defaults change so they take effect
        const fx = {};
        for (const e of EFFECTS) fx[e.key] = e.def;
        try {
            const saved = JSON.parse(localStorage.getItem(FX_STORE_KEY) || '{}');
            for (const e of EFFECTS) if (typeof saved[e.key] === 'boolean') fx[e.key] = saved[e.key];
        } catch (_) {}
        const saveFx = () => { try { localStorage.setItem(FX_STORE_KEY, JSON.stringify(fx)); } catch (_) {} };


        // ── Track colour: the travelled track coloured by a preset's variable (/api/3d_colour), else plain ──
        const TRACK_COLOUR_KEY = 'gp3d_track_colour';
        const trackNoDataColour = SK.LOOK.noDataColour;
        let trackColourData = null;     // { values, cmin, cmax, plotMin, scale, palette, label, units }
        const paletteFor = SK.paletteFor;
        // Missing values sit just below the scale, on a grey band at its foot.
        const DISCRETE_09 = ['#9ca3af', '#22c55e', '#3b82f6', '#f97316', '#a855f7', '#06b6d4', '#ef4444', '#eab308', '#ec4899', '#84cc16'];   // as main_plot.html
        const prepTrackColour = (res) => {
            if (res.discrete) {      // integer flags 0-9: one hard band each, missing on a grey band below
                const scale = [];
                [trackNoDataColour].concat(DISCRETE_09).forEach((c, k) => scale.push([k / 11, c], [(k + 1) / 11, c]));
                return { ...res, palette: DISCRETE_09, cmin: 0, cmax: 9.5, plotMin: -1.5, scale };
            }
            const pal = paletteFor(res.cmap);
            return { ...res, palette: pal, ...SK.colourScale(pal, res.cmin, res.cmax) };
        };
        const trackColourValues = (vals) => { const d = trackColourData; return vals.map(v => (v == null ? d.plotMin : Math.min(d.cmax, Math.max(d.cmin, v)))); };
        const trackLineStyle = (vals, width) => (trackColourData
            ? { width, color: trackColourValues(vals), colorscale: trackColourData.scale, cmin: trackColourData.plotMin, cmax: trackColourData.cmax }
            : { width, color: trackColour });
        const trackValueHex = (v) => {
            const d = trackColourData; if (!d || v == null) return d ? trackNoDataColour : trackColour;
            if (d.discrete) return d.palette[Math.round(v)] || trackNoDataColour;
            const t = Math.max(0, Math.min(1, (v - d.cmin) / (d.cmax - d.cmin))) * (d.palette.length - 1), q = Math.min(d.palette.length - 2, Math.floor(t));
            return d.palette.length < 2 ? d.palette[0] : lerpHex(d.palette[q], d.palette[q + 1], t - q);
        };

        const lerpHex = SK.lerpHex;

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id') || urlParams.get('filename');

        // ── Style panel ──────────────────────────────────────────────────
        let rerender = null;   // set once data has loaded
        let softToggle = null; // (key) => true when the toggle was applied in place (no replot); set once the scene is up
        (function buildStylePanel() {
            const body = document.getElementById('layer-body');
            for (const e of EFFECTS) {
                const btn = document.createElement('button');
                btn.className = 'fxBtn';
                btn.dataset.key = e.key;
                btn.title = 'Toggle ' + e.label.toLowerCase();
                btn.innerHTML = `<span class="material-symbols-outlined ovSwatch" style="font-size:14px;">${e.icon}</span>${e.label}`;
                btn.classList.toggle('on', fx[e.key]);
                btn.addEventListener('click', () => {
                    fx[e.key] = !fx[e.key];
                    btn.classList.toggle('on', fx[e.key]);
                    saveFx();
                    if (softToggle && softToggle(e.key)) return;   // Argo / scenery: patched in place, no replot, playback carries on
                    if (rerender) rerender();
                });
                body.appendChild(btn);
            }
            document.getElementById('layer-header').addEventListener('click', () => {
                const panel = document.getElementById('layer-panel');
                const collapsed = panel.classList.toggle('collapsed');
                document.getElementById('layer-header').title = collapsed ? 'Show style options' : 'Collapse style options';
            });
        })();

        if (!fileId) {
            document.getElementById('loadingIcon').style.display = 'none';
            document.getElementById('statusText').textContent = "No dataset selected.";
        } else {
            document.getElementById('statusText').textContent = "Rendering Ocean...";
            const startTime = performance.now();

            let currentEye = { x: 0.8, y: -0.8, z: 0.38 };
            // The camera orbits the glider. Plotly's camera.center / eye are absolute, in normalised
            // scene units (data box centred on the origin, spanning aspectratio).
            let currentCenter = { x: 0, y: 0, z: 0 };
            let sceneBox = null;            // ranges + aspect from buildScene, for centerFor()
            const eyeOffset = () => ({ x: currentEye.x - currentCenter.x, y: currentEye.y - currentCenter.y, z: currentEye.z - currentCenter.z });
            const eyeDist = () => { const o = eyeOffset(); return Math.hypot(o.x, o.y, o.z); };
            const clampEye = () => {
                const r = eyeDist();
                const want = r > eyeCap() ? eyeCap() : r < minEyeDist ? minEyeDist : 0;
                if (!want) return false;
                const k = want / r, o = eyeOffset();
                currentEye = { x: currentCenter.x + o.x * k, y: currentCenter.y + o.y * k, z: currentCenter.z + o.z * k };
                return true;
            };
            // Normalised scene position of track point i (horizontal only, so the view doesn't bob).
            function centerFor(data, f) {
                if (!sceneBox) return { x: 0, y: 0, z: 0 };
                const B = sceneBox, p = sample(data, f);
                return {
                    x: ((p[0] - B.xRange[0]) / (B.xRange[1] - B.xRange[0]) - 0.5) * B.aspectX,
                    y: ((p[1] - B.yRange[0]) / (B.yRange[1] - B.yRange[0]) - 0.5) * B.aspectY,
                    z: B.pivotZ,
                };
            }
            // Move the pivot to track point i, carrying the eye with it.
            function lookAtIdx(data, i) {
                const c = centerFor(data, i);
                currentEye = { x: currentEye.x + c.x - currentCenter.x, y: currentEye.y + c.y - currentCenter.y, z: currentEye.z + c.z - currentCenter.z };
                currentCenter = c;
            }
            let sceneVExag = 1;             // vertical exaggeration of the current scene, set by buildScene
            let occGrid = null;             // drawn seabed grid { lon, lat, z }, for the playback line-of-sight test
            // Fraction of sight lines from an eye at azimuth `th` (horizontal radius r, height dz above the
            // pivot) to glider positions around track index f that hit the seabed anywhere. 0 = clear view.
            function blockedFrac(data, f, th, r, dz) {
                const B = sceneBox, G = occGrid;
                if (!B || !G) return 0;
                const nx = G.lon.length, ny = G.lat.length, steps = 48;
                const ex = currentCenter.x + r * Math.cos(th), ey = currentCenter.y + r * Math.sin(th), ez = currentCenter.z + dz;
                const toData = (v, range, asp) => range[0] + (v / asp + 0.5) * (range[1] - range[0]);
                const eLon = toData(ex, B.xRange, B.aspectX), eLat = toData(ey, B.yRange, B.aspectY), eZ = toData(ez, B.zRange, B.aspectZ);
                const k = Math.max(10, data.lon.length / 80);   // positions span ±2k: a long stretch, not one dive
                let hit = 0, tot = 0;
                for (let m = -4; m <= 4; m++) {
                    const ff = f + m * k / 2;
                    const p = sample(data, ff);
                    let blocked = false;
                    for (let q = 2; q <= steps; q++) {
                        const t = q / steps, lon = p[0] + (eLon - p[0]) * t, lat = p[1] + (eLat - p[1]) * t, z = p[2] + (eZ - p[2]) * t;
                        const ix = Math.round((lon - G.lon[0]) / (G.lon[nx - 1] - G.lon[0]) * (nx - 1));
                        const iy = Math.round((lat - G.lat[0]) / (G.lat[ny - 1] - G.lat[0]) * (ny - 1));
                        if (ix < 0 || iy < 0 || ix >= nx || iy >= ny) break;   // left the box: nothing more in the way
                        if (G.z[iy][ix] > z) { blocked = true; break; }   // any wall hides it, however thin
                    }
                    tot++; if (blocked) hit++;
                }
                return tot ? hit / tot : 0;
            }
            // Score fixed compass directions for how hidden the glider is from each (smoothed over calls by
            // `blend`), and aim for the most open one, leaning towards `behind`. World-fixed and sticky, so the
            // target doesn't chase the heading or each dive. clearDir = -1 in open water (plain follow).
            let clearDir = -1;
            const clearScores = new Array(clearViewDirs).fill(null);
            function pickClearDir(data, f, behind, r, dz, blend) {
                const N = clearViewDirs, cost = new Array(N);
                let worst = 0, bestI = -1, bestC = Infinity;
                for (let q = 0; q < N; q++) {
                    const az = q * 2 * Math.PI / N, sc = blockedFrac(data, f, az, r, dz);
                    clearScores[q] = clearScores[q] == null ? sc : clearScores[q] + (sc - clearScores[q]) * blend;
                    worst = Math.max(worst, clearScores[q]);
                    const off = Math.abs(((az - behind + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
                    cost[q] = clearScores[q] + clearViewBehindBias * off / Math.PI;
                    if (cost[q] < bestC) { bestC = cost[q]; bestI = q; }
                }
                if (worst < 0.02) clearDir = -1;
                else if (clearDir < 0 || cost[clearDir] > bestC + clearViewSticky) clearDir = bestI;
            }
            let posIdx = 0;                 // current slider index into the track
            let sceneScale = null;          // data units per scene unit, set by buildScene
            let gliderTraceIdx = -1;
            let pastTraceIdx = -1, aheadTraceIdx = -1, tipTraceIdx = -1;
            let argoTraceIdx = -1;
            let sceneryTraceIdx = -1;       // the moving scenery mesh, which the sway patches (only when fx.scenery and the seafloor is drawn)
            let buoyModels = null;         // { start: mesh, end: mesh } (green / red buoys), or null if not loaded
            let argoModel = null;           // merged mesh, metres, +z up, origin at hull mid
            let argoFloats = [];            // [{wmo, profs:[{lat,lon,ms}...] sorted}] inside the scene box + deployment window
            let argoShownKey = '';          // which profiles are currently drawn (to skip redundant updates)
            // Argo + scenery traces are ALWAYS in the plot (toggling never changes the trace list);
            // "off" is the same mesh collapsed onto one point.
            let hidePoint = [0, 0, 0];      // where collapsed meshes sit (a base corner of the scene box)
            let sceneryParts = [];          // scenery traces (still, moving): {idx, base: the real {x, y, z}, to restore after a collapse}
            const collapsed = n => SK.collapsed(n, hidePoint);
            const argoPlaceholder = () => ({ ...collapsed(1), i: [0], j: [0], k: [0], intensity: [0] });
            let gliderModel = null;         // merged { x,y,z,i,j,k,cell,colorscale,length } in metres, +x nose, +z up

            let bathyGrid = null, coast = null;   // upsampled bathy grid + the basemap's coastline (SK.loadCoast), set once with the data
            let seabed = null;                    // SK.buildSeabed result for the current box
            // Scenery on: seabed darkens with depth; off: plain earth ramp.
            const seabedStyle = () => ({ depthShade: fx.scenery, greenLand: fx.greenLand });

            // Build the full trace list + layout for the current `fx` settings.
            function buildScene(data) {
                const traces = [];

                const b = data.bounds, fp = SK.footprint(b.min_lon, b.max_lon, b.min_lat, b.max_lat), maxHoriz = fp.maxHoriz;

                // The box always spans the full water column: down to the seabed or the deepest dive.
                let gliderDeepest = 0;
                for (const z of data.elevation) if (z < gliderDeepest) gliderDeepest = z;
                const trueMinZ = Math.min(...data.bathy_z.flat());
                const displayMinZ = Math.min(trueMinZ, gliderDeepest, -10);
                // Base slab thickness; at true scale it needs a visible thickness or the walls z-fight.
                const baseZ = fx.trueHeight
                    ? displayMinZ - Math.max(Math.abs(displayMinZ) * 0.15, maxHoriz * 0.02)
                    : displayMinZ - (Math.abs(displayMinZ) * 0.15);
                const distZ = Math.abs(baseZ);

                // Vertical exaggeration adapts to the footprint: the dives fill ~targetTrackAspect of the
                // width, and a much deeper seabed can't stretch the box past maxBoxAspect. True height: 1.
                const vExag = fx.trueHeight ? 1 : Math.max(1, Math.min(
                    verticalExaggeration,
                    targetTrackAspect * maxHoriz / Math.max(-gliderDeepest, 10),
                    maxBoxAspect * maxHoriz / distZ));
                document.getElementById('scaleX').textContent = vExag > 1.05 ? `Vertical scale ×${vExag >= 10 ? Math.round(vExag) : vExag.toFixed(1)} · ` : '';

                // Seabed, land and coastline (SceneKit). The geometry only changes with True height, so style toggles reuse it.
                const bLon = bathyGrid.lon, bLat = bathyGrid.lat, seabedKey = vExag + ':' + baseZ;
                if (!seabed || seabed.key !== seabedKey) {
                    seabed = SK.buildSeabed(bathyGrid, { landScale: SK.landScale(vExag), coastStep: Math.abs(displayMinZ) * SK.LOOK.coastStepFrac, baseZ, basemap: coast });
                    seabed.key = seabedKey;
                }
                const bathyZ = seabed.bathyZ;

                const xLen = bLon.length, yLen = bLat.length;
                const lon0 = bLon[0], lon1 = bLon[xLen - 1], lat0 = bLat[0], lat1 = bLat[yLen - 1];
                const snowAt = lat => (fx.greenLand ? SK.snowAt(lat) : 0);
                traces.push(...seabed.traces(seabedStyle()));
                traces.push(SK.waterTrace(bLon, bLat, bathyZ, baseZ));


                // Scenery headroom is reserved even when off, so toggling doesn't rescale the scene.
                const box = SK.sceneBox(fp, lon0, lon1, lat0, lat1, baseZ, vExag, Math.max(0, ...bathyZ.flat()), Math.max(gliderLength * 0.8, Scenery.maxHeight()));
                const { zRange, aspectZ } = box;
                boxAspectZ = aspectZ;
                sceneVExag = vExag;
                occGrid = { lon: bLon, lat: bLat, z: bathyZ };
                hidePoint = [lon0, lat0, baseZ];
                sceneScale = box.scale;   // data units per scene unit along each axis
                // Pivot at the dives' mid-depth, so a deep seabed sits below the view rather than in its middle.
                const pivotZ = ((gliderDeepest / 2 - zRange[0]) / (zRange[1] - zRange[0]) - 0.5) * aspectZ;
                sceneBox = { ...box, pivotZ };
                // Keep the pivot on the glider (ranges/aspect may have changed on a style toggle).
                { const c = centerFor(data, posIdx); currentEye = { x: currentEye.x + c.x - currentCenter.x, y: currentEye.y + c.y - currentCenter.y, z: currentEye.z + c.z - currentCenter.z }; currentCenter = c; }

                const n = data.lon.length;

                // The dive track, split at the slider: travelled (bright, thick) and remaining (thin, dark).
                const tk = trackGeometry(data, posIdx);
                aheadTraceIdx = traces.length;
                traces.push({
                    x: tk.ahead.x, y: tk.ahead.y, z: tk.ahead.z, mode: 'lines', line: trackColourData ? trackLineStyle(tk.ahead.c || [], 3) : { color: trackAheadColour, width: 2 },
                    type: 'scatter3d', name: 'Track ahead', hoverinfo: 'skip'
                });
                pastTraceIdx = traces.length;
                traces.push({
                    x: tk.past.x, y: tk.past.y, z: tk.past.z, mode: 'lines', line: trackLineStyle(tk.past.c || [], 5),
                    type: 'scatter3d', opacity: trackColourData ? 1 : trackOpacity, name: 'Track so far', hoverinfo: 'skip'
                });
                tipTraceIdx = traces.length;
                traces.push({
                    ...tipGeometry(data, posIdx, posIdx), mode: 'lines', line: { color: trackValueHex(trackColourData ? trackColourData.values[posIdx] : null), width: 5 },
                    type: 'scatter3d', opacity: trackColourData ? 1 : trackOpacity, name: 'Track tip', hoverinfo: 'skip', showlegend: false
                });

                // Start / end buoys (green / red) as one static mesh; diamond markers if the models didn't load.
                if (n > 0 && buoyModels) {
                    // Offset each buoy sideways from the track heading (scene units). The heading window grows until
                    // the track has really moved (interpolated positions often share one lon/lat); falls back to east.
                    const S = sceneScale;
                    const beside = (from, dir) => {
                        const [hx, hy] = horizHeading(data, from, dir, gliderLength);
                        return [-hy * buoyOffset * S.kx, hx * buoyOffset * S.ky];   // port side, data units
                    };
                    const o0 = beside(0, +1), o1 = beside(n - 1, -1);
                    const parts = [[buoyModels.start, data.lon[0] + o0[0], data.lat[0] + o0[1]], [buoyModels.end, data.lon[n - 1] + o1[0], data.lat[n - 1] + o1[1]]];
                    const B = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [] }, colors = [];
                    for (const [M, lon, lat] of parts) {
                        const g = uprightGeometry(M, buoyLength, lon, lat, 0), base = B.x.length;
                        B.x.push(...g.x); B.y.push(...g.y); B.z.push(...g.z);
                        B.i.push(...M.i.map(v => v + base)); B.j.push(...M.j.map(v => v + base)); B.k.push(...M.k.map(v => v + base));
                        // Re-index this model's colours into the merged palette.
                        const map = M.colorscale.map(([, c]) => { if (!colors.includes(c)) colors.push(c); return colors.indexOf(c); });
                        B.cell.push(...M.cell.map(ci => map[ci]));
                    }
                    const cmax = Math.max(colors.length - 1, 1);
                    traces.push({
                        ...B, type: 'mesh3d', intensity: B.cell, intensitymode: 'cell',
                        cmin: 0, cmax, colorscale: colors.map((c, q) => [q / cmax, c]), showscale: false,
                        flatshading: true, lighting: SK.LIGHT.model,
                        name: 'Start/End', hoverinfo: 'skip'
                    });
                } else if (n > 0) {
                    traces.push({
                        x: [data.lon[0], data.lon[n - 1]], y: [data.lat[0], data.lat[n - 1]], z: [0, 0],
                        mode: 'markers',
                        marker: { size: 5, color: ['#2E9E4F', '#D32F2F'], symbol: 'diamond', line: { color: '#ffffff', width: 1 } },
                        type: 'scatter3d', name: 'Start/End', hoverinfo: 'skip'
                    });
                }

                // The glider at the current slider position; its trace index is kept so playback updates it in place.
                const body = gliderGeometry(data, posIdx);
                gliderTraceIdx = traces.length;
                traces.push(SK.modelTrace(gliderModel, body, SK.LIGHT.model, 'Glider'));

                // Argo floats currently at the surface (may be none → hidden).
                if (argoModel) {
                    const ag = argoGeometry(data, playClockMs());
                    argoShownKey = ag ? ag.key : '';
                    argoTraceIdx = traces.length;
                    const ap = ag ? { x: ag.x, y: ag.y, z: ag.z, i: ag.i, j: ag.j, k: ag.k, intensity: ag.cell } : argoPlaceholder();
                    traces.push({
                        type: 'mesh3d', ...ap, intensitymode: 'cell',
                        cmin: 0, cmax: argoModel.cmax, colorscale: argoModel.colorscale, showscale: false,
                        flatshading: true, lighting: SK.LIGHT.model,
                        name: 'Argo floats', hoverinfo: 'skip'
                    });
                }

                // Decorative scenery: stands on the drawn seabed/land, or only floats when the seafloor is out of range.
                sceneryTraceIdx = -1;
                {
                    const sc = Scenery.build({ ...data, bathy_lon: bLon, bathy_lat: bLat }, bathyZ, sceneScale, fileId, snowAt, baseZ);
                    sceneryParts = [];
                    for (const part of sc ? [sc.still, sc.moving] : []) {
                        if (!part) continue;
                        const p = { idx: traces.length, base: { x: part.x, y: part.y, z: part.z } };
                        if (part === sc.moving) sceneryTraceIdx = p.idx;
                        sceneryParts.push(p);
                        if (!fx.scenery) Object.assign(part, collapsed(part.x.length));
                        traces.push(part);
                    }
                }

                const layout = SK.layout(box, { eye: { ...currentEye }, center: { ...currentCenter } });
                return { traces, layout };
            }

            // ── Glider marker geometry ───────────────────────────────────
            // Model meshes (static/3d_view/models/<kind>.json) are in metres, +x nose, y across the wings, +z up.
            // Placement is done in scene units (via sceneScale), then converted back to lon/lat/depth for Plotly.
            let gliderLength = SK.SIZES.slocum;     // scene units nose-to-tail (scene is ~1 unit across); set from the vehicle kind

            // Track split at index i; both halves share the current point. The line is every sample unless
            // trackLineMax caps it (then a decimated copy with the exact current sample spliced in).
            let trackLine = null;   // { idx: [sample indices], x, y, z }
            function trackGeometry(data, i) {
                if (!trackLine) {
                    const n = data.lon.length, step = Math.max(1, Math.ceil(n / trackLineMax)), idx = [];
                    for (let q = 0; q < n; q += step) idx.push(q);
                    if (idx[idx.length - 1] !== n - 1) idx.push(n - 1);
                    trackLine = { idx, x: idx.map(q => data.lon[q]), y: idx.map(q => data.lat[q]), z: idx.map(q => data.elevation[q]) };
                }
                const C = trackColourData && trackColourData.values.length === data.lon.length ? trackColourData.values : null;
                if (C && !trackLine.c) trackLine.c = trackLine.idx.map(q => C[q]);
                const L = trackLine;
                // First decimated point strictly after i.
                let lo = 0, hi = L.idx.length;
                while (lo < hi) { const mid = (lo + hi) >> 1; if (L.idx[mid] <= i) lo = mid + 1; else hi = mid; }
                // Include every sample between the neighbouring decimated points and i so the line end follows the real path.
                const from = lo > 0 ? L.idx[lo - 1] + 1 : 0, to = lo < L.idx.length ? L.idx[lo] : i + 1;
                const seg = (arr, a, b) => arr.slice(a, b);
                return {
                    past:  { x: L.x.slice(0, lo).concat(seg(data.lon, from, i + 1)), y: L.y.slice(0, lo).concat(seg(data.lat, from, i + 1)), z: L.z.slice(0, lo).concat(seg(data.elevation, from, i + 1)),
                             c: C ? L.c.slice(0, lo).concat(seg(C, from, i + 1)) : null },
                    ahead: { x: seg(data.lon, i, to).concat(L.x.slice(lo)), y: seg(data.lat, i, to).concat(L.y.slice(lo)), z: seg(data.elevation, i, to).concat(L.z.slice(lo)),
                             c: C ? seg(C, i, to).concat(L.c.slice(lo)) : null },
                };
            }

            // The bright line's tip: samples from the last split (i0) to fractional position f; pushed every frame.
            function tipGeometry(data, i0, f) {
                const p = sample(data, f), x = [], y = [], z = [];
                for (let q = Math.max(0, i0); q <= Math.floor(f) && q < data.lon.length; q++) { x.push(data.lon[q]); y.push(data.lat[q]); z.push(data.elevation[q]); }
                x.push(p[0]); y.push(p[1]); z.push(p[2]);
                if (x.length < 2) { x.push(p[0]); y.push(p[1]); z.push(p[2]); }
                return { x, y, z };
            }

            // Track point at fractional index f (linear between samples).
            function sample(data, f) {
                const n = data.lon.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                return [data.lon[i0] + (data.lon[i1] - data.lon[i0]) * t,
                        data.lat[i0] + (data.lat[i1] - data.lat[i0]) * t,
                        data.elevation[i0] + (data.elevation[i1] - data.elevation[i0]) * t];
            }

            // Interpolated value of a per-point array (null if either neighbour is missing).
            function sampleVar(arr, f) {
                if (!arr) return null;
                const n = arr.length;
                f = Math.max(0, Math.min(n - 1, f));
                const i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), t = f - i0;
                const a = arr[i0], b = arr[i1];
                if (a == null || b == null) return null;
                return a + (b - a) * t;
            }

            // Horizontal unit heading (scene units) at sample `from`, looking `dir` (+1/-1) along the track
            // until it has moved at least `minMove`. Falls back to east.
            function horizHeading(data, from, dir, minMove) {
                const S = sceneScale, n = data.lon.length;
                let hx = 0, hy = 0, j = from;
                for (let step = 0; step < n; step++) {
                    j += dir;
                    if (j < 0 || j >= n) break;
                    hx = (data.lon[j] - data.lon[from]) / S.kx; hy = (data.lat[j] - data.lat[from]) / S.ky;
                    if (Math.hypot(hx, hy) >= minMove) break;
                }
                if (dir < 0) { hx = -hx; hy = -hy; }
                const hl = Math.hypot(hx, hy);
                return hl > 1e-9 ? [hx / hl, hy / hl] : [1, 0];
            }

            // Broad direction of travel around fractional index f for the camera: unit [hx, hy] in scene units,
            // or null when the track loops back on itself.
            function travelHeading(data, f) {
                const S = sceneScale, n = data.lon.length;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky]; };
                const c = P(f);
                let W = Math.max(2, n / 400);
                for (let it = 0; it < 12; it++, W *= 1.8) {
                    if (W > n / 3) break;
                    const a = P(f - W), b = P(f + W);
                    const hx = b[0] - a[0], hy = b[1] - a[1], hl = Math.hypot(hx, hy);
                    if (hl >= camHeadingMove) return [hx / hl, hy / hl];
                    // Straddling the ends shrinks one side; only the displacement magnitude matters.
                }
                return null;
            }

            // Model vertices (metres, +z up) scaled to `length` scene units, upright at (lon, lat, z); returns data units.
            function uprightGeometry(M, length, lon, lat, z) {
                const S = sceneScale, k = length / M.length;
                const c = [lon / S.kx, lat / S.ky, z / S.kz];
                const m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    xs[q] = (c[0] + M.x[q] * k) * S.kx;
                    ys[q] = (c[1] + M.y[q] * k) * S.ky;
                    zs[q] = (c[2] + M.z[q] * k) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            // Synthetic Argo state at clock `ms`: {lon, lat, depth (m, positive down)}, or null before the first profile.
            function argoState(profs, ms) {
                const H = 3600e3;
                const first = profs[0], last = profs[profs.length - 1];
                if (ms < first.ms - ARGO.leadH * H) return null;
                // Ascent into the first known profile (park → deep dip → up).
                if (ms < first.ms) {
                    const t = (first.ms - ms) / H;   // hours to go
                    let depth;
                    if (t > ARGO.deepStartH) depth = ARGO.parkM;
                    else if (t > ARGO.deepEndH) depth = ARGO.parkM + (ARGO.profileM - ARGO.parkM) * (ARGO.deepStartH - t) / (ARGO.deepStartH - ARGO.deepEndH);
                    else depth = ARGO.profileM * t / ARGO.deepEndH;
                    return { lon: first.lon, lat: first.lat, depth };
                }
                // Surfacing at or before `ms`, and the next one (if any).
                let lo = 0, hi = profs.length - 1;
                while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (profs[mid].ms <= ms) lo = mid; else hi = mid; }
                const a = profs[lo], b = profs[hi].ms > ms ? profs[hi] : null;
                const since = (ms - a.ms) / H;
                if (!b) return { lon: a.lon, lat: a.lat, depth: SK.argoParkDepth(since) };
                const depth = SK.argoCycleDepth(since, (b.ms - a.ms) / H);
                const u = Math.max(0, Math.min(1, (ms - a.ms) / (b.ms - a.ms)));   // drift fraction
                return { lon: a.lon + (b.lon - a.lon) * u, lat: a.lat + (b.lat - a.lat) * u, depth };
            }

            // Seabed depth (m, positive down; 0 over land/no data) at lon/lat, nearest bathy cell.
            function seabedDepthAt(data, lon, lat) {
                const bx = data.bathy_lon, by = data.bathy_lat, bz = data.bathy_z;
                if (!bx || !by || !bz || bx.length < 2 || by.length < 2) return Infinity;
                const ix = Math.max(0, Math.min(bx.length - 1, Math.round((lon - bx[0]) / (bx[bx.length - 1] - bx[0]) * (bx.length - 1))));
                const iy = Math.max(0, Math.min(by.length - 1, Math.round((lat - by[0]) / (by[by.length - 1] - by[0]) * (by.length - 1))));
                const z = bz[iy] && bz[iy][ix];
                return (z == null || !isFinite(z)) ? Infinity : Math.max(0, -z);
            }

            // All Argo floats at clock `ms` as one merged mesh; `key` identifies the set of floats. Null when empty.
            function argoGeometry(data, ms) {
                if (!fx.argo || !argoModel || !argoFloats.length || ms == null || !sceneBox) return null;
                // Keep submerged floats inside the drawn box (the scene floor is set by the glider's dives).
                const floorZ = sceneBox.zRange[0] * 0.9;
                const out = { x: [], y: [], z: [], i: [], j: [], k: [], cell: [], key: '', count: 0 };
                const shown = [];
                for (const fl of argoFloats) {
                    const st = argoState(fl.profs, ms);
                    if (!st) continue;
                    shown.push(fl.wmo);
                    // Never below the seabed (with clearance) nor below the scene floor.
                    const seabed = seabedDepthAt(data, st.lon, st.lat);
                    const clearance = argoLength * 0.6 * sceneScale.kz;   // data units (m) ≈ the model's half-height on screen
                    const depth = Math.min(st.depth, Math.max(0, seabed - clearance));
                    const g = uprightGeometry(argoModel, argoLength, st.lon, st.lat, Math.max(floorZ, -depth));
                    const base = out.x.length;
                    out.x.push(...g.x); out.y.push(...g.y); out.z.push(...g.z);
                    out.i.push(...argoModel.i.map(v => v + base)); out.j.push(...argoModel.j.map(v => v + base)); out.k.push(...argoModel.k.map(v => v + base));
                    out.cell.push(...argoModel.cell);
                }
                if (!shown.length) return null;
                out.key = shown.join('|'); out.count = shown.length;
                return out;
            }

            function gliderGeometry(data, f) {
                const n = data.lon.length;
                const S = sceneScale;
                const P = g => { const p = sample(data, g); return [p[0] / S.kx, p[1] / S.ky, p[2] / S.kz]; };
                const c = P(f);
                // Heading + pitch from a few samples either side so the model doesn't twitch.
                const w = Math.max(1, Math.min(8, Math.floor(n / 200)));
                const a0 = P(f - w), a1 = P(f + w);
                let fw = [a1[0] - a0[0], a1[1] - a0[1], a1[2] - a0[2]];
                // Level out over the first/last few samples, where the heading window is one-sided.
                const edge = Math.max(2, 2 * w);
                const level = Math.min(1, Math.min(f, n - 1 - f) / edge);   // 0 at the ends → 1 inside
                fw[2] *= level;
                // No real horizontal movement locally: use the longer look-along heading the buoys use.
                if (Math.hypot(fw[0], fw[1]) < gliderLength * 0.25) {
                    const near = Math.round(f), dir = near < n / 2 ? +1 : -1;
                    const [hx, hy] = horizHeading(data, near, dir, gliderLength);
                    const vz = fw[2];
                    fw = [hx * gliderLength, hy * gliderLength, vz];
                }
                let len = Math.hypot(...fw);
                if (!(len > 1e-9)) { fw = [1, 0, 0]; len = 1; }
                fw = fw.map(v => v / len);

                // Attitude: measured pitch/roll when present (true angles), else tangent to the drawn track, wings level.
                let pitchDeg = sampleVar(data.pitch, f), rollDeg = sampleVar(data.roll, f);
                if (pitchDeg != null) { pitchDeg *= level; rollDeg = (rollDeg || 0) * level; }
                let sd, up;
                if (pitchDeg != null) {
                    const hl = Math.hypot(fw[0], fw[1]);
                    let h = hl > 1e-9 ? [fw[0] / hl, fw[1] / hl, 0] : [1, 0, 0];   // horizontal heading (from the track)
                    // Measured compass heading when present; interpolate via sin/cos (wraps at 360), then map to scene units.
                    if (data.heading) {
                        const n1 = data.heading.length - 1, g = Math.max(0, Math.min(n1, f));
                        const i0 = Math.floor(g), i1 = Math.min(n1, i0 + 1), t = g - i0;
                        const d0 = data.heading[i0] != null ? data.heading[i0] : data.heading[i1];
                        const d1 = data.heading[i1] != null ? data.heading[i1] : d0;
                        const r0 = d0 * Math.PI / 180, r1 = d1 * Math.PI / 180;
                        const e = Math.sin(r0) * (1 - t) + Math.sin(r1) * t, nn = Math.cos(r0) * (1 - t) + Math.cos(r1) * t;
                        const coslat = Math.max(0.05, Math.cos(sample(data, f)[1] * Math.PI / 180));
                        const sx = e / coslat / S.kx, sy = nn / S.ky, sl = Math.hypot(sx, sy);
                        if (d0 != null && sl > 1e-12) h = [sx / sl, sy / sl, 0];
                    }
                    // Halfway between the measured pitch and that pitch stretched by the scene's vertical exaggeration
                    // (the slope of the drawn track): the stretched one alone is near-vertical at high exaggeration.
                    const pr0 = pitchDeg * Math.PI / 180;
                    // Shallow angles and the surface keep the true pitch, so a slightly tilted glider stays nearly flat.
                    const ss = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo))); return t * t * (3 - 2 * t); };
                    const wEx = 0.5 * ss(Math.abs(pitchDeg), pitchExagFromDeg, pitchExagFullDeg) * ss(-sample(data, f)[2], 2, 10);
                    const pr = pr0 + (Math.atan(Math.tan(pr0) * sceneVExag) - pr0) * wEx, cp = Math.cos(pr), sp = Math.sin(pr);
                    fw = [h[0] * cp, h[1] * cp, sp];
                    const s0 = [-h[1], h[0], 0];                                       // port side, level
                    const u0 = [fw[1] * s0[2] - fw[2] * s0[1], fw[2] * s0[0] - fw[0] * s0[2], fw[0] * s0[1] - fw[1] * s0[0]];
                    const rr = (rollDeg || 0) * Math.PI / 180, cr = Math.cos(rr), sr = Math.sin(rr);
                    sd = [s0[0] * cr + u0[0] * sr, s0[1] * cr + u0[1] * sr, s0[2] * cr + u0[2] * sr];
                    up = [u0[0] * cr - s0[0] * sr, u0[1] * cr - s0[1] * sr, u0[2] * cr - s0[2] * sr];
                } else {
                    // Wings stay level: side = up × forward (horizontal), up = forward × side.
                    const ref = Math.abs(fw[2]) < 0.99 ? [0, 0, 1] : [0, 1, 0];
                    sd = [ref[1] * fw[2] - ref[2] * fw[1], ref[2] * fw[0] - ref[0] * fw[2], ref[0] * fw[1] - ref[1] * fw[0]];
                    const sl = Math.hypot(...sd); sd = sd.map(v => v / sl);
                    up = [fw[1] * sd[2] - fw[2] * sd[1], fw[2] * sd[0] - fw[0] * sd[2], fw[0] * sd[1] - fw[1] * sd[0]];
                }

                const k = gliderLength / gliderModel.extent;   // metres -> scene units
                const M = gliderModel, m = M.x.length, xs = new Array(m), ys = new Array(m), zs = new Array(m);
                for (let q = 0; q < m; q++) {
                    const mx = M.x[q] * k, my = M.y[q] * k, mz = M.z[q] * k;
                    xs[q] = (c[0] + fw[0] * mx + sd[0] * my + up[0] * mz) * S.kx;
                    ys[q] = (c[1] + fw[1] * mx + sd[1] * my + up[1] * mz) * S.ky;
                    zs[q] = (c[2] + fw[2] * mx + sd[2] * my + up[2] * mz) * S.kz;
                }
                return { x: xs, y: ys, z: zs };
            }

            const loadModel = SK.loadModel, mergeParts = SK.mergeParts;
            // Vehicle to draw: detected platform kind, then name heuristics; Slocum if unknown.
            const MODEL_KINDS = ['slocum', 'seaglider', 'alr'];
            function platformKindFor(kind, name) {
                if (kind && MODEL_KINDS.includes(kind)) return kind;
                const n = String(name || '').toLowerCase();
                if (/^alr[_\-\d]/.test(n)) return 'alr';
                if (/^(sg\d|seaglider)/.test(n)) return 'seaglider';
                if (/slocum/.test(n)) return 'slocum';
                return '';
            }
            const modelPromise = fetch('/api/files').then(r => r.json()).catch(() => ({ files: [] }))
                .then(({ files }) => {
                    const rec = (files || []).find(f => f.id === fileId) || {};
                    return platformKindFor(rec.platform_kind, rec.name) || 'slocum';
                })
                .then(kind => { gliderLength = SK.SIZES[kind] || SK.SIZES.slocum; return loadModel(kind); });
            // Argo float model: optional, never blocks the scene.
            const argoModelPromise = loadModel('argo').catch(() => null);
            // Start/end buoys: loaded with the scene (tiny files); optional.
            const buoyPromise = Promise.all([loadModel('buoy_green'), loadModel('buoy_red')])
                .then(([start, end]) => ({ start, end })).catch(() => null);

            // Scenery models (one bundle) load with the scene so the first draw is complete; optional.
            const sceneryPromise = Scenery.load(mergeParts).catch(() => null);


            // Playback clock value (epoch ms) at the current position, or null when the file has no times.
            let playClockMs = () => null;
            // Shared pinned point (map/plot click): jump there and pause; clearing it resumes playback.
            let pinTo = () => {}, unpin = () => {};
            window.addEventListener('message', (event) => {
                const m = event.data;
                if (!m) return;
                if (m.type === 'pinTime' && typeof m.timeMs === 'number') pinTo(m.timeMs);
                else if (m.type === 'clearPin') unpin();
            });

            const dataPromise = fetch(`/api/3d_data?id=${encodeURIComponent(fileId)}`).then(r => r.json()).then(async (data) => {
                if (data.error) throw new Error(data.error);
                bathyGrid = SK.upsampleGrid(data.bathy_lon, data.bathy_lat, data.bathy_z, SK.LOOK.bathyUpsampleTo);
                coast = await SK.loadCoast(bathyGrid);
                return data;
            });
            Promise.all([dataPromise, modelPromise, buoyPromise, sceneryPromise])
                .then(([data, model, buoys]) => {
                    if (data.error) throw new Error(data.error);
                    gliderModel = model;
                    buoyModels = buoys;

                    // Argo floats that surfaced inside the scene box; arrives after the first draw, scene rebuilt once.
                    if (data.time_ms) {
                        const ts = data.time_ms.filter(v => v != null && isFinite(v));
                        if (ts.length) {
                            const b = data.bounds, q = new URLSearchParams({
                                min_lat: b.min_lat, max_lat: b.max_lat, min_lon: b.min_lon, max_lon: b.max_lon,
                                t0: Math.min(...ts) - argoWindowHours * 3600e3, t1: Math.max(...ts) + argoWindowHours * 3600e3,
                            });
                            Promise.all([fetch('/api/argo/profiles?' + q).then(r => r.json()), argoModelPromise])
                                .then(([res, m]) => {
                                    if (!m || !res || !res.profiles || !res.profiles.length) return;
                                    argoModel = m;
                                    const byWmo = new Map();
                                    for (const r of res.profiles) {
                                        if (!byWmo.has(r[0])) byWmo.set(r[0], []);
                                        byWmo.get(r[0]).push({ lat: r[1], lon: r[2], ms: r[3] });
                                    }
                                    // The index lists some profiles twice; collapse anything within a few hours or the float snaps.
                                    argoFloats = [...byWmo].map(([wmo, profs]) => {
                                        profs.sort((a, b) => a.ms - b.ms);
                                        const out = [];
                                        for (const p of profs) if (!out.length || p.ms - out[out.length - 1].ms > 3 * 3600e3) out.push(p);
                                        return { wmo, profs: out };
                                    });
                                    if (rerender) rerender();
                                })
                                .catch(() => {});
                        }
                    }

                    const config = { displayModeBar: false, responsive: true };
                    let first = buildScene(data);   // also sets the scene scale the camera placement below needs
                    // Open the view already behind the glider at follow distance.
                    {
                        const hd = travelHeading(data, posIdx);
                        if (hd) {
                            // Start on the most open side (the same choice playback will make, so it doesn't swing away at once).
                            const behind = Math.atan2(-hd[1], -hd[0]);
                            pickClearDir(data, posIdx, behind, followDist, currentEye.z - currentCenter.z, 1);
                            const az0 = clearDir < 0 ? behind : clearDir * 2 * Math.PI / clearViewDirs;
                            currentEye = { x: currentCenter.x + Math.cos(az0) * followDist, y: currentCenter.y + Math.sin(az0) * followDist, z: currentEye.z };
                            first = buildScene(data);
                        }
                    }

                    // Re-render in place on a style toggle, keeping the camera.
                    rerender = () => {
                        clampEye();
                        const scene = buildScene(data);
                        Plotly.react('plot3d', scene.traces, scene.layout, config).then(tightenClipPlanes);
                    };

                    // Track colour: the picker lists the presets this file has the variables for; the shell's
                    // 'followColour' (the plot being viewed) can also set any variable. Responses are kept per variable.
                    {
                        const row = document.getElementById('trackColourRow'), sel = document.getElementById('trackColourSel'), bar = document.getElementById('trackColourBar');
                        const fmt = SK.fmtValue;
                        const cache = new Map();      // query string -> Promise(response)
                        let options = [], wanted = 0;
                        const show = (res) => {
                            trackColourData = res && res.values ? prepTrackColour(res) : null;
                            trackLine = null;
                            bar.style.display = trackColourData ? 'block' : 'none';
                            if (trackColourData) {
                                const used = res.discrete ? [...new Set(res.values.filter(v => v != null))].sort((a, b) => a - b) : null;
                                bar.querySelector('i').style.background = `linear-gradient(90deg, ${used
                                    ? used.map((v, k) => `${DISCRETE_09[v]} ${100 * k / used.length}% ${100 * (k + 1) / used.length}%`).join(',')
                                    : trackColourData.palette.join(',')})`;
                                bar.querySelector('div').innerHTML = used ? used.map(v => `<span>${v}</span>`).join('') : `<span>${fmt(res.cmin)}</span><span>${res.units || ''}</span><span>${fmt(res.cmax)}</span>`;
                            }
                            rerender();
                        };
                        const load = (query) => {
                            const mine = ++wanted;
                            if (!query) { show(null); return; }
                            if (!cache.has(query)) cache.set(query, fetch(`/api/3d_colour?id=${encodeURIComponent(fileId)}&${query}`).then(r => r.json()).catch(() => { cache.delete(query); return null; }));
                            cache.get(query).then(res => { if (mine === wanted) show(res); });
                        };
                        const renderSel = (extra) => {
                            sel.innerHTML = '<option value="">Plain</option>' + options.map(o => `<option value="${o.key}">${o.label}</option>`).join('')
                                + (extra ? `<option value="var:${extra}">${extra}</option>` : '');
                            row.style.display = (options.length || extra) ? 'block' : 'none';
                        };
                        const follow = (m) => {
                            if (!m || !m.var) return;
                            const opt = options.find(o => o.var === m.var && o.cmap === m.cmap) || options.find(o => o.var === m.var);
                            renderSel(opt ? '' : m.var);
                            sel.value = opt ? opt.key : `var:${m.var}`;
                            load(`var=${encodeURIComponent(m.var)}&cmap=${encodeURIComponent(m.cmap || (opt && opt.cmap) || '')}`);
                        };
                        sel.addEventListener('change', () => {
                            if (sel.value.startsWith('var:')) return;
                            try { localStorage.setItem(TRACK_COLOUR_KEY, sel.value); } catch (_) {}
                            load(sel.value ? `preset=${encodeURIComponent(sel.value)}` : '');
                        });
                        let followMsg = null, optionsReady = false;
                        window.addEventListener('message', (e) => {
                            if (!e.data || e.data.type !== 'followColour') return;
                            followMsg = e.data;
                            if (optionsReady) follow(followMsg);
                        });
                        fetch(`/api/3d_colours?id=${encodeURIComponent(fileId)}`).then(r => r.json()).catch(() => ({})).then((res) => {
                            options = (res && res.options) || [];
                            optionsReady = true;
                            renderSel('');
                            if (followMsg && followMsg.var) { follow(followMsg); return; }
                            let saved = ''; try { saved = localStorage.getItem(TRACK_COLOUR_KEY) || ''; } catch (_) {}
                            if (saved && options.some(o => o.key === saved)) { sel.value = saved; load(`preset=${encodeURIComponent(saved)}`); }
                        });
                        try { window.parent.postMessage({ type: 'view3dReady' }, '*'); } catch (_) {}
                    }

                    Plotly.newPlot('plot3d', first.traces, first.layout, config).then(() => {
                        window.logRender('3D Map Frontend', performance.now() - startTime);
                        tightenClipPlanes();

                        // Fade out the loading overlay
                        const overlay = document.getElementById('overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        document.getElementById('layer-panel').classList.add('ready');

                        const plotDiv = document.getElementById('plot3d');

                        // ── Position slider ──────────────────────────────
                        const posSlider = document.getElementById('posSlider');
                        const posPlay = document.getElementById('posPlay');
                        const posReadout = document.getElementById('posReadout');
                        const nPts = data.lon.length;
                        posSlider.max = String(Math.max(0, nPts - 1));
                        posSlider.value = '0';

                        const fmtTime = ms => {
                            if (ms == null || !isFinite(ms)) return '';
                            const iso = new Date(ms).toISOString();   // epoch-ms -> always UTC
                            return iso.slice(0, 10) + ' ' + iso.slice(11, 16) + ' UTC';
                        };
                        let lastReadout = '';
                        const updateReadout = () => {
                            const t = data.time_ms ? fmtTime(data.time_ms[posIdx]) : '';
                            const html = t;
                            if (html !== lastReadout) { lastReadout = html; posReadout.innerHTML = html; }   // no DOM write (and no layout) when nothing changed
                        };
                        // Camera fast path: call scene.setViewport directly (relayout re-runs supplyDefaults over every
                        // trace) and keep layout/_fullLayout in step so user drags and later replots agree.
                        const markDirty = SK.markDirty;
                        const pushCamera = () => {
                            try {
                                const full = plotDiv._fullLayout.scene, scene = full._scene;
                                full.camera.eye = { ...currentEye }; full.camera.center = { ...currentCenter };
                                const lay = plotDiv.layout.scene.camera || (plotDiv.layout.scene.camera = {});
                                lay.eye = { ...currentEye }; lay.center = { ...currentCenter };
                                scene.setViewport(full);
                                markDirty(scene);
                            } catch (_) {
                                Plotly.relayout('plot3d', { 'scene.camera.eye': { ...currentEye }, 'scene.camera.center': { ...currentCenter } });
                            }
                        };
                        // mesh3d update() rebuilds the colour texture on every call; drop `colormap` on the way through.
                        // Scatter3d wrappers have no .mesh and take the plain update.
                        const fastPatch = (ti, patch) => SK.fastPatch(plotDiv, ti, patch);
                        const fastXYZ = (indices, upd) => indices.forEach((ti, q) => fastPatch(ti, { x: upd.x[q], y: upd.y[q], z: upd.z[q] }));
                        const pushGlider = (f) => {
                            if (gliderTraceIdx < 0) return;
                            const b = gliderGeometry(data, f);
                            fastXYZ([gliderTraceIdx], { x: [b.x], y: [b.y], z: [b.z] });
                            if (tipTraceIdx >= 0) {
                                const tp = tipGeometry(data, lastTrackIdx < 0 || lastTrackIdx > f || f - lastTrackIdx > 2000 ? Math.floor(f) : lastTrackIdx   /* scrub jump: pushTrack catches up right after */, f);
                                fastXYZ([tipTraceIdx], { x: [tp.x], y: [tp.y], z: [tp.z] });
                            }
                            updateReadout();
                        };
                        let lastTrackIdx = -1;
                        const pushTrack = () => {
                            if (pastTraceIdx < 0 || posIdx === lastTrackIdx) return;   // re-uploads both halves of the track: skip when the split hasn't moved
                            lastTrackIdx = posIdx;
                            const t = trackGeometry(data, posIdx);
                            if (trackColourData && t.past.c) {   // coloured: the travelled line's colour array is re-sliced with it
                                fastPatch(pastTraceIdx, { x: t.past.x, y: t.past.y, z: t.past.z, line: { ...plotDiv._fullData[pastTraceIdx].line, color: trackColourValues(t.past.c) } });
                                fastPatch(aheadTraceIdx, { x: t.ahead.x, y: t.ahead.y, z: t.ahead.z, line: { ...plotDiv._fullData[aheadTraceIdx].line, color: trackColourValues(t.ahead.c) } });
                                if (tipTraceIdx >= 0) fastPatch(tipTraceIdx, { line: { ...plotDiv._fullData[tipTraceIdx].line, color: trackValueHex(trackColourData.values[posIdx]) } });
                                return;
                            }
                            fastXYZ([pastTraceIdx, aheadTraceIdx], { x: [t.past.x, t.ahead.x], y: [t.past.y, t.ahead.y], z: [t.past.z, t.ahead.z] });
                        };
                        // Argo floats always go through the fast path (collapsed placeholder when none/off).
                        const pushArgo = () => {
                            if (argoTraceIdx < 0) return;
                            const ag = argoGeometry(data, playClockMs());
                            if (!ag && !argoShownKey) return;   // nothing drawn, nothing to draw
                            argoShownKey = ag ? ag.key : '';
                            fastPatch(argoTraceIdx, ag ? { x: ag.x, y: ag.y, z: ag.z, i: ag.i, j: ag.j, k: ag.k, intensity: ag.cell } : argoPlaceholder());
                        };
                        // Scenery sway (underwater plants only), wall-clock driven.
                        const pushScenery = (t) => {
                            if (sceneryTraceIdx < 0 || !fx.scenery) return;
                            const s = Scenery.sway(t / 1000);
                            if (s) fastXYZ([sceneryTraceIdx], { x: [s.x], y: [s.y], z: [s.z] });
                        };
                        // Argo / scenery toggles without a replot. Returns false for anything it can't do in place (→ full re-render).
                        softToggle = (key) => {
                            try {
                                if (key === 'argo') {
                                    if (argoTraceIdx < 0) return !argoModel;   // no trace yet: nothing to show either way
                                    pushArgo();
                                    return true;
                                }
                                if (key === 'scenery') {
                                    if (!sceneryParts.length) return false;
                                    const col = seabed.colours(seabedStyle());   // recolours the seabed for the new setting
                                    plotDiv.data.forEach((t, ti) => { if (t.name === 'Seabed' || t.name === 'Land') fastPatch(ti, { vertexcolor: col }); });
                                    for (const p of sceneryParts) {
                                        const on = fx.scenery && ((p.idx === sceneryTraceIdx && Scenery.sway(performance.now() / 1000)) || p.base);
                                        fastPatch(p.idx, on ? { x: on.x, y: on.y, z: on.z } : collapsed(p.base.x.length));
                                    }
                                    return true;
                                }
                            } catch (_) {}
                            return false;
                        };
                        // Slider scrub: snap the camera to the glider and redraw everything.
                        let posRaf = 0;
                        const setPos = (i) => {
                            posIdx = Math.max(0, Math.min(nPts - 1, i | 0));
                            posSlider.value = String(posIdx);
                            if (!posRaf) posRaf = requestAnimationFrame(() => {
                                posRaf = 0;
                                posFloat = posIdx;
                                lookAtIdx(data, posIdx);
                                pushGlider(posIdx); pushArgo(); pushTrack(); pushCamera();
                            });
                        };
                        posSlider.addEventListener('input', () => setPos(+posSlider.value));

                        // ── Playback: one rAF loop; camera centre is low-pass filtered (cameraTau). A manual rotate/zoom
                        // holds and resumes after a cooldown; a plain click or the button pauses fully. ──
                        let playing = false, playRaf = 0, lastT = 0;
                        let posFloat = 0;         // fractional track position
                        // Playback runs on the deployment clock (times forward-filled and forced monotonic);
                        // with no usable times the sample index is the clock.
                        const clock = (() => {
                            const raw = data.time_ms;
                            if (!raw || raw.length !== nPts) return null;
                            const tm = new Array(nPts); let last = null;
                            for (let q = 0; q < nPts; q++) { const v = raw[q]; if (v != null && isFinite(v) && (last == null || v > last)) last = v; tm[q] = last; }
                            let first = tm.findIndex(v => v != null);
                            if (first < 0 || tm[nPts - 1] <= tm[first]) return null;
                            for (let q = 0; q < first; q++) tm[q] = tm[first];
                            return tm;
                        })();
                        const clockSpan = clock ? clock[nPts - 1] - clock[0] : nPts - 1;
                        playClockMs = () => clock ? clockAt(posFloat) : null;
                        const clockAt = f => {          // fractional index -> clock value
                            if (!clock) return f;
                            const i0 = Math.floor(f), i1 = Math.min(nPts - 1, i0 + 1);
                            return clock[i0] + (clock[i1] - clock[i0]) * (f - i0);
                        };
                        const indexAt = c => {          // clock value -> fractional index
                            if (!clock) return c;
                            let lo = 0, hi = nPts - 1;
                            while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (clock[mid] <= c) lo = mid; else hi = mid; }
                            const d = clock[hi] - clock[lo];
                            return d > 0 ? lo + (c - clock[lo]) / d : lo;
                        };
                        let endHeld = 0;          // wall seconds spent holding at the end of the track
                        let lastClearT = 0;
                        let sinceStart = 0;       // wall seconds since playback (re)started, for the camera's soft start
                        let aimTh = null;         // smoothed target azimuth (null = restart from the eye's own)
                        let viewT = 0;            // wall seconds of playback, drives the viewing-angle wander
                        let lastTrackT = 0, lastSceneryT = 0;
                        let holding = false;      // pointer down on the plot (rotating)
                        let cooldownTimer = 0;    // pending resume after a manual interaction
                        let speed = 1;
                        const posSpeed = document.getElementById('posSpeed');
                        posSpeed.addEventListener('click', (e) => {
                            e.stopPropagation();
                            speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
                            posSpeed.textContent = speed + 'x';
                        });
                        const setIcon = () => {
                            posPlay.querySelector('.material-symbols-outlined').textContent = playing ? 'pause' : 'play_arrow';
                            posPlay.title = playing ? 'Pause' : 'Play glider along track';
                        };
                        const clearCooldown = () => {
                            clearTimeout(cooldownTimer); cooldownTimer = 0;
