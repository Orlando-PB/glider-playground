<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <title>3D Ocean Chunk</title>
    <!-- Self-hosted partial Plotly: gl3d bundle (scatter3d + surface) instead of
         the full ~1MB-gzip build. Cuts parse time and drops a third-party fetch. -->
    <script src="/static/plotly-gl3d-2.32.0.min.js"></script>
    <script src="/static/console_log.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    </noscript>
    <style>
        :root, :root[data-theme="dark"] {
            --bg-panel: #121420;
            --text-primary: #e4e7ef;
            --text-muted: #6b7280;
            --accent: #5b9cff;
            --spinner-track: #1f2432;
        }
        :root[data-theme="light"] {
            --bg-panel: #ffffff;
            --text-primary: #171a22;
            --text-muted: #7d8492;
            --accent: #1a73e8;
            --spinner-track: #e2e5ec;
        }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-panel); font-family: 'Inter','Segoe UI',Roboto,sans-serif;
            color: var(--text-primary);
        }
        #plot3d { width: 100vw; height: 100vh; }

        #overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            background: var(--bg-panel); z-index: 50;
            transition: opacity 0.5s ease-in-out;
            color: var(--text-muted); font-size: 11px;
        }
        .spinner {
            width: 22px; height: 22px;
            border: 3px solid var(--spinner-track);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Spin pause / resume control — top-right, appears on hover */
        #spinToggle {
            position: absolute; top: 8px; right: 8px; z-index: 40;
            width: 26px; height: 26px; border: none; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.45); color: #fff; cursor: pointer;
            font-size: 12px; line-height: 1; opacity: 0; transition: opacity 0.15s, background 0.15s;
        }
        body:hover #spinToggle { opacity: 1; }
        #spinToggle:hover { background: var(--accent); }
        #spinToggle.paused { opacity: 1; }   /* keep visible while paused */

        /* ── Style sidebar (collapsible, bottom-right) — same look as the
           map view's Layers panel. ─────────────────────────────────────── */
        #layer-panel {
            display: none; position: absolute; bottom: 10px; right: 10px; z-index: 60;
            flex-direction: column-reverse; gap: 4px; padding: 6px; max-width: 168px;
            max-height: calc(100vh - 20px); box-sizing: border-box;
            border-radius: 10px; background: color-mix(in srgb, var(--bg-panel) 82%, transparent);
            box-shadow: 0 1px 8px rgba(0,0,0,0.25); backdrop-filter: blur(4px);
        }
        #layer-panel.ready { display: flex; }
        #layer-header {
            display: flex; align-items: center; gap: 6px; cursor: pointer; border: none;
            background: transparent; color: var(--text-primary); font-size: 11px;
            font-weight: 700; padding: 2px 4px; width: 100%;
        }
        #layer-header .material-symbols-outlined { font-size: 16px; }
        #layer-title { letter-spacing: 0.04em; }
        #layer-header .chev { margin-left: auto; transition: transform 0.2s; }
        #layer-panel.collapsed { max-width: none; }
        #layer-panel.collapsed #layer-title,
        #layer-panel.collapsed .chev,
        #layer-panel.collapsed #layer-body { display: none; }
        #layer-body {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; min-height: 0; flex-shrink: 1;
        }
        .fxBtn {
            display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
            padding: 5px 8px; border: none; cursor: pointer; border-radius: 6px;
            font-size: 11px; font-weight: 600; color: var(--text-primary); background: transparent;
            white-space: nowrap;
        }
        .fxBtn:hover { background: color-mix(in srgb, var(--text-primary) 12%, transparent); }
        .fxBtn.on { background: color-mix(in srgb, var(--accent) 30%, transparent); }
        .ovSwatch { flex: 0 0 auto; }

        #scaleNote {
            position: absolute; bottom: 8px; left: 10px; z-index: 40;
            font-size: 10px; color: var(--text-muted); opacity: 0.8;
            pointer-events: none; user-select: none;
        }
    </style>
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const t = p.get('theme') === 'light' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (_) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="overlay">
        <div class="spinner" id="loadingIcon"></div>
        <span id="statusText">Awaiting Dataset...</span>
    </div>

    <div id="plot3d"></div>
    <button id="spinToggle" title="Pause / resume auto-rotate">⏸</button>
    <span id="scaleNote">Height not to scale</span>

    <!-- Style sidebar (collapsible). Rows are generated by JS from EFFECTS.
         Hidden until the scene has rendered. -->
    <div id="layer-panel" class="collapsed">
        <button id="layer-header" title="Show style options">
            <span class="material-symbols-outlined">tune</span>
            <span id="layer-title">Style</span>
            <span class="material-symbols-outlined chev">expand_more</span>
        </button>
        <div id="layer-body"></div>
    </div>

    <script>
        // Tell the dashboard parent to activate this panel on interaction.
        ['pointerdown', 'mousedown', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, () => {
                try { window.parent.postMessage({ type: 'panelActivate' }, '*'); } catch (_) {}
            }, true);
        });

        window.addEventListener('message', function(event) {
            if (!event.data || event.data.type !== 'setTheme') return;
            const t = event.data.theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
        });

        const earthColour = '#c2b2a4';
        const earthGradientEnd = '#e5d9cc';
        const earthDeepColour = '#7d7060';     // deep-seabed tone for the depth-shaded ramp
        const landColour = '#a8bf9a';          // faded green for terrain above sea level
        const landGradientEnd = '#c9d8bd';
        const snowColour = '#cfd8df';          // polar land: cool ice-grey, kept off pure white so it reads against the light background
        const snowGradientEnd = '#e9eef2';
        const snowLatCutoff = 60;              // |lat| beyond this is drawn white (Greenland / Antarctica)
        const snowBlendKm = 200;               // width of the green→white blend straddling the cutoff

        // Camera: don't let the user zoom out past this eye distance. The
        // default view already fits the whole chunk, and far-out views hit
        // WebGL depth-precision glitches.
        const maxEyeDist = 2.6;
        const maxEyeDistTrueHeight = 1.9;   // flat true-scale scene z-fights sooner when far away
        const eyeCap = () => (fx.trueHeight ? maxEyeDistTrueHeight : maxEyeDist);

        // Depth-buffer precision is set by the near/far clip ratio. Plotly's
        // gl-plot3d defaults to 0.01 .. 1000, which wastes almost all of the
        // 24-bit depth range and makes the (very flat) chunk z-fight when the
        // camera pulls back. The scene is ~1 unit across and the eye never
        // gets closer than a few tenths, so tighten the planes. Not a public
        // Plotly option: reach into the live scene, which re-reads these every
        // frame.
        const clipNear = 0.15, clipFar = 50;
        const tightenClipPlanes = () => {
            try {
                const gl = document.getElementById('plot3d')._fullLayout.scene._scene.glplot;
                gl.zNear = clipNear; gl.zFar = clipFar;
            } catch (_) {}
        };
        const waterTopColour = '#90e0ef';
        const waterBottomColour = '#004e89';
        const waterOpacity = 0.4;

        const verticalExaggeration = 100;
        // Land (bathy values above sea level) gets a much gentler exaggeration
        // than the water column; otherwise coastal hills tower over the scene.
        const landExaggeration = 5;

        const idleDelayMs = 4000;
        const orbitSpeed = 0.0015;

        // ── Style toggles ────────────────────────────────────────────────
        // Each entry is a row in the Style panel (bottom-right, same look as the
        // map's Layers panel). Flip `def` to change the default; the user's
        // choices persist in localStorage under FX_STORE_KEY.
        const EFFECTS = [
            { key: 'greenLand',  label: 'Colour land',      icon: 'park',          def: true  },
            { key: 'depthShade', label: 'Depth shading',    icon: 'gradient',      def: true  },
            { key: 'trueHeight', label: 'True height',      icon: 'straighten',    def: false },
        ];
        const FX_STORE_KEY = 'gp3d_fx_v2';   // bump when defaults change so they take effect
        const fx = {};
        for (const e of EFFECTS) fx[e.key] = e.def;
        try {
            const saved = JSON.parse(localStorage.getItem(FX_STORE_KEY) || '{}');
            for (const e of EFFECTS) if (typeof saved[e.key] === 'boolean') fx[e.key] = saved[e.key];
        } catch (_) {}
        const saveFx = () => { try { localStorage.setItem(FX_STORE_KEY, JSON.stringify(fx)); } catch (_) {} };


        // ── Colour helpers ───────────────────────────────────────────────
        const hexToRgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
        const rgbToHex = rgb => '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
        const shade = (hex, k) => rgbToHex(hexToRgb(hex).map(v => v * k));
        const lerpHex = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => v + (B[i] - v) * t)); };

        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('id') || urlParams.get('filename');

        // ── Style panel ──────────────────────────────────────────────────
        let rerender = null;   // set once data has loaded
        (function buildStylePanel() {
            const body = document.getElementById('layer-body');
            for (const e of EFFECTS) {
                const btn = document.createElement('button');
                btn.className = 'fxBtn';
                btn.dataset.key = e.key;
                btn.title = 'Toggle ' + e.label.toLowerCase();
                btn.innerHTML = `<span class="material-symbols-outlined ovSwatch" style="font-size:14px;">${e.icon}</span>${e.label}`;
                btn.classList.toggle('on', fx[e.key]);
                btn.addEventListener('click', () => {
                    fx[e.key] = !fx[e.key];
                    btn.classList.toggle('on', fx[e.key]);
                    saveFx();
                    if (rerender) rerender();
                });
                body.appendChild(btn);
            }
            document.getElementById('layer-header').addEventListener('click', () => {
                const panel = document.getElementById('layer-panel');
                const collapsed = panel.classList.toggle('collapsed');
                document.getElementById('layer-header').title = collapsed ? 'Show style options' : 'Collapse style options';
            });
        })();

        if (!fileId) {
            document.getElementById('loadingIcon').style.display = 'none';
            document.getElementById('statusText').textContent = "No dataset selected.";
        } else {
            document.getElementById('statusText').textContent = "Rendering Ocean...";
            const startTime = performance.now();

            let currentEye = { x: 1.25, y: -1.25, z: 0.6 };

            // Build the full trace list + layout for the current `fx` settings.
            function buildScene(data) {
                const traces = [];

                // True height: X, Y and Z all to the same scale (no vertical
                // exaggeration for water or land).
                const vExag = fx.trueHeight ? 1 : verticalExaggeration;
                const lExag = fx.trueHeight ? 1 : landExaggeration;
                document.getElementById('scaleNote').hidden = fx.trueHeight;

                // Horizontal extent, needed up front so the focus depth
                // stays within a sensible aspect ratio for the viewport.
                const METERS_PER_DEGREE = 111111;
                const avgLat = (data.bounds.max_lat + data.bounds.min_lat) / 2;
                const cosLat = Math.cos(avgLat * Math.PI / 180);
                const distY = (data.bounds.max_lat - data.bounds.min_lat) * METERS_PER_DEGREE;
                const distX = (data.bounds.max_lon - data.bounds.min_lon) * METERS_PER_DEGREE * cosLat;
                const maxHoriz = Math.max(distX, distY, 1);

                // Focus vertical range on the glider path, but bound the
                // focus depth so the scene doesn't clip (too tall) or look
                // flat (too shallow relative to horizontal extent).
                let gliderDeepest = 0;
                for (const z of data.elevation) if (z < gliderDeepest) gliderDeepest = z;
                const gliderFocusDepth = Math.abs(gliderDeepest) * 1.3 + 20;
                const minFocusDepth = (1.0 * maxHoriz) / vExag;
                const maxFocusDepth = (3.0 * maxHoriz) / vExag;
                const desiredFocusDepth = Math.min(
                    Math.max(gliderFocusDepth, minFocusDepth, 50),
                    maxFocusDepth
                );

                const trueMinZ = Math.min(...data.bathy_z.flat());
                const displayMinZ = Math.max(-desiredFocusDepth, trueMinZ);
                // Only render the seafloor if it actually falls within the focus range.
                // When the ocean is much deeper than the glider dives, clamping all bathy
                // values to displayMinZ would paint a flat floor at the wrong depth.
                const showSeafloor = trueMinZ >= displayMinZ;
                // The scene's aspect ratio applies vExag to every
                // z value, so scale positive (land) heights down here so they end
                // up drawn at lExag instead.
                const landScale = lExag / vExag;
                const bathyZ = showSeafloor
                    ? data.bathy_z.map(row => row.map(z => (z > 0 ? z * landScale : z)))
                    : null;

                const minZ = displayMinZ;
                // Base slab thickness. At true scale the seabed relief is a few
                // thousandths of the horizontal span, so give the slab a visible
                // thickness (decorative only) or the walls z-fight into noise.
                const baseZ = fx.trueHeight
                    ? minZ - Math.max(Math.abs(minZ) * 0.15, maxHoriz * 0.02)
                    : minZ - (Math.abs(minZ) * 0.15);
                const distZ = Math.abs(baseZ);

                const xLen = data.bathy_lon.length;
                const yLen = data.bathy_lat.length;

                const tiny = 0.00001;

                const lon0 = data.bathy_lon[0];
                const lon1 = data.bathy_lon[xLen - 1];
                const lat0 = data.bathy_lat[0];
                const lat1 = data.bathy_lat[yLen - 1];

                const noContours = { contours: { x: {show: false, highlight: false}, y: {show: false, highlight: false}, z: {show: false, highlight: false} } };


                if (showSeafloor) {
                    const flat = bathyZ.flat();
                    const bathyMax = Math.max(...flat);
                    const bathyMin = Math.min(...flat);

                    // Colour ramp as [[z, hex]] stops: earth tones below sea
                    // level (optionally darkening with depth) and green (or more
                    // earth) above.
                    // `snow` (0..1) blends the land colours towards white for
                    // polar latitudes.
                    const makeStops = (snow) => {
                        const stops = [];
                        if (bathyMin < 0) {
                            stops.push([bathyMin, fx.depthShade ? earthDeepColour : earthColour]);
                            stops.push([0, fx.depthShade ? earthColour : earthGradientEnd]);
                        }
                        if (bathyMax > 0) {
                            const lc  = fx.greenLand ? lerpHex(landColour, snowColour, snow) : earthColour;
                            const lce = fx.greenLand ? lerpHex(landGradientEnd, snowGradientEnd, snow) : earthGradientEnd;
                            stops.push([Math.max(0, bathyMin), lc]);
                            stops.push([bathyMax, lce]);
                        }
                        if (stops.length === 1) stops.push([stops[0][0] + 1, stops[0][1]]);
                        return stops;
                    };

                    // Per-row snow fraction from latitude: 0 equatorward of the
                    // cutoff, 1 poleward, smooth blend across snowBlendKm.
                    const blendDeg = snowBlendKm / 111.111;
                    const snowAt = (lat) => {
                        if (!fx.greenLand || bathyMax <= 0) return 0;
                        const t = (Math.abs(lat) - snowLatCutoff) / blendDeg + 0.5;
                        const c = Math.max(0, Math.min(1, t));
                        return c * c * (3 - 2 * c);
                    };
                    const rowSnow = data.bathy_lat.map(snowAt);
                    const snowMin = Math.min(...rowSnow), snowMax = Math.max(...rowSnow);
                    // Number of distinct snow levels: one if the grid is wholly
                    // on one side of the cutoff, else a handful of steps across
                    // the blend. Plotly interpolates a surface's colour value
                    // linearly across each cell, so a single trace can't carry a
                    // per-row colour ramp without bleeding (an ice vertex next to
                    // a sea vertex would sweep through the green land colours).
                    // Instead split the seabed into contiguous row chunks, one per
                    // level, each with a plain height-based ramp. Chunks share
                    // their boundary row so there is no gap.
                    const M = (snowMax - snowMin) < 1e-3 ? 1 : 8;
                    const span = Math.max(bathyMax - bathyMin, 1e-6);
                    const surfBase = {
                        type: 'surface', showscale: false, hoverinfo: 'skip',
                        cmin: bathyMin, cmax: bathyMax,
                        lighting: { ambient: 0.6, diffuse: 0.8, specular: 0.1, roughness: 0.6 }, ...noContours
                    };
                    const rampFor = (snow) => makeStops(snow).map(([v, c]) => [Math.max(0, Math.min(1, (v - bathyMin) / span)), c]);

                    if (M > 1) {
                        const rowLevel = rowSnow.map(f => Math.round(f * (M - 1)));
                        let r0 = 0;
                        while (r0 < yLen - 1) {
                            let r1 = r0;
                            while (r1 + 1 < yLen && rowLevel[r1 + 1] === rowLevel[r0]) r1++;
                            const rEnd = Math.min(yLen - 1, r1 + 1);   // overlap one row into the next chunk
                            traces.push({
                                ...surfBase,
                                x: data.bathy_lon,
                                y: data.bathy_lat.slice(r0, rEnd + 1),
                                z: bathyZ.slice(r0, rEnd + 1),
                                colorscale: rampFor(rowLevel[r0] / (M - 1))
                            });
                            r0 = rEnd;
                        }
                    } else {
                        traces.push({ ...surfBase, x: data.bathy_lon, y: data.bathy_lat, z: bathyZ, colorscale: rampFor(snowMin) });
                    }

                    const zSouth = bathyZ[0];
                    const zNorth = bathyZ[yLen - 1];
                    const zWest = bathyZ.map(row => row[0]);
                    const zEast = bathyZ.map(row => row[xLen - 1]);

                    const earthWallConfig = {
                        type: 'surface', colorscale: [[0, earthColour], [1, earthColour]],
                        showscale: false, hoverinfo: 'skip',
                        lighting: { ambient: 0.8, diffuse: 0.8, roughness: 0.9 },
                        ...noContours
                    };

                    traces.push({ ...earthWallConfig, x: data.bathy_lon, y: [lat0 - tiny, lat0], z: [Array(xLen).fill(baseZ), zSouth] });
                    traces.push({ ...earthWallConfig, x: data.bathy_lon, y: [lat1, lat1 + tiny], z: [zNorth, Array(xLen).fill(baseZ)] });
                    traces.push({ ...earthWallConfig, x: [lon0 - tiny, lon0], y: data.bathy_lat, z: zWest.map(z => [baseZ, z]) });
                    traces.push({ ...earthWallConfig, x: [lon1, lon1 + tiny], y: data.bathy_lat, z: zEast.map(z => [z, baseZ]) });
                    traces.push({ ...earthWallConfig, x: [lon0 - tiny, lon1 + tiny], y: [lat0 - tiny, lat1 + tiny], z: [[baseZ, baseZ], [baseZ, baseZ]] });
                }

                const waterWallConfig = {
                    type: 'surface',
                    colorscale: [[0, waterBottomColour], [1, waterTopColour]],
                    cmin: baseZ, cmax: 0,
                    opacity: waterOpacity, showscale: false, hoverinfo: 'skip',
                    lighting: { ambient: 0.8, diffuse: 0.8, roughness: 0.9 },
                    ...noContours
                };

                const wZSouth = showSeafloor ? bathyZ[0]              : Array(xLen).fill(baseZ);
                const wZNorth = showSeafloor ? bathyZ[yLen - 1]        : Array(xLen).fill(baseZ);
                const wZWest  = showSeafloor ? bathyZ.map(r => r[0])   : Array(yLen).fill(baseZ);
                const wZEast  = showSeafloor ? bathyZ.map(r => r[xLen - 1]) : Array(yLen).fill(baseZ);

                // Sea surface.
                traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon1 + tiny], y: [lat0 - tiny, lat1 + tiny], z: [[0, 0], [0, 0]] });
                traces.push({ ...waterWallConfig, x: data.bathy_lon, y: [lat0 - tiny, lat0], z: [Array(xLen).fill(0), wZSouth] });
                traces.push({ ...waterWallConfig, x: data.bathy_lon, y: [lat1, lat1 + tiny], z: [wZNorth, Array(xLen).fill(0)] });
                traces.push({ ...waterWallConfig, x: [lon0 - tiny, lon0], y: data.bathy_lat, z: wZWest.map(z => [0, z]) });
                traces.push({ ...waterWallConfig, x: [lon1, lon1 + tiny], y: data.bathy_lat, z: wZEast.map(z => [z, 0]) });



                const hasTemp = data.temp && data.temp.length > 0;

                traces.push({
                    x: data.lon, y: data.lat, z: data.elevation,
                    mode: 'lines',
                    line: {
                        color: hasTemp ? data.temp : data.elevation,
                        colorscale: hasTemp ? [
                            [0, '#313695'],
                            [0.25, '#74add1'],
                            [0.5, '#ffffbf'],
                            [0.75, '#f46d43'],
                            [1, '#a50026']
                        ] : 'Portland',
                        width: 5,
                        reversescale: hasTemp ? false : true,
                    },
                    type: 'scatter3d', name: 'Glider', hoverinfo: 'skip'
                });

                const aspectX = distX / maxHoriz;
                const aspectY = distY / maxHoriz;
                const aspectZ = (distZ / maxHoriz) * vExag;

                const noAxis = { showgrid: false, zeroline: false, showline: false, showticklabels: false, showbackground: false, title: '', visible: false };
                const layout = {
                    hovermode: false,
                    margin: { l: 0, r: 0, b: 0, t: 0 },
                    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                    scene: { xaxis: noAxis, yaxis: noAxis, zaxis: noAxis, aspectmode: 'manual', aspectratio: { x: aspectX, y: aspectY, z: aspectZ }, camera: { eye: { ...currentEye } } },
                    showlegend: false
                };
                return { traces, layout };
            }

            fetch(`/api/3d_data?id=${encodeURIComponent(fileId)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    const config = { displayModeBar: false, responsive: true };
                    const first = buildScene(data);

                    // Re-render in place on a style toggle, keeping the camera.
                    rerender = () => {
                        const r = Math.hypot(currentEye.x, currentEye.y, currentEye.z);
                        if (r > eyeCap()) {
                            const k = eyeCap() / r;
                            currentEye = { x: currentEye.x * k, y: currentEye.y * k, z: currentEye.z * k };
                        }
                        const scene = buildScene(data);
                        Plotly.react('plot3d', scene.traces, scene.layout, config).then(tightenClipPlanes);
                    };

                    Plotly.newPlot('plot3d', first.traces, first.layout, config).then(() => {
                        window.logRender('3D Map Frontend', performance.now() - startTime);
                        tightenClipPlanes();

                        // Fade out the loading overlay
                        const overlay = document.getElementById('overlay');
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.style.display = 'none', 500);
                        document.getElementById('layer-panel').classList.add('ready');

                        const plotDiv = document.getElementById('plot3d');

                        let lastInteractionTime = 0;
                        let paused = false;   // hard pause toggled by a click

                        const resetIdle = () => { lastInteractionTime = Date.now(); };

                        plotDiv.on('plotly_relayout', (e) => {
                            if (e && e['scene.camera'] && e['scene.camera'].eye) {
                                currentEye = { ...currentEye, ...e['scene.camera'].eye };
                            } else if (e && e['scene.camera.eye']) {
                                currentEye = { ...currentEye, ...e['scene.camera.eye'] };
                            }
                            // Clamp zoom-out: pull the eye back in if it drifted past the cap.
                            const r = Math.hypot(currentEye.x, currentEye.y, currentEye.z);
                            if (r > eyeCap()) {
                                const k = eyeCap() / r;
                                currentEye = { x: currentEye.x * k, y: currentEye.y * k, z: currentEye.z * k };
                                Plotly.relayout('plot3d', { 'scene.camera.eye': currentEye });
                            }
                        });
                        // Swallow zoom-out wheel events once at the cap so the
                        // view doesn't flicker out and snap back.
                        plotDiv.addEventListener('wheel', (e) => {
                            if (e.deltaY > 0 && Math.hypot(currentEye.x, currentEye.y, currentEye.z) >= eyeCap() - 1e-3) {
                                e.preventDefault(); e.stopPropagation();
                            }
                        }, { capture: true, passive: false });

                        plotDiv.addEventListener('mousedown', resetIdle, true);
                        plotDiv.addEventListener('wheel', resetIdle, true);
                        plotDiv.addEventListener('touchstart', resetIdle, true);
                        plotDiv.addEventListener('touchmove', resetIdle, true);

                        // Pause / resume on a click (not a drag-to-rotate). A click
                        // is a press+release with little movement; a drag rotates and
                        // must NOT toggle the pause.
                        const spinToggle = document.getElementById('spinToggle');
                        const updateSpinIcon = () => {
                            spinToggle.textContent = paused ? '▶' : '⏸';
                            spinToggle.classList.toggle('paused', paused);
                            spinToggle.title = paused ? 'Resume auto-rotate' : 'Pause auto-rotate';
                        };
                        const togglePause = () => { paused = !paused; updateSpinIcon(); };

                        let _downX = 0, _downY = 0, _downT = 0, _moved = false;
                        document.addEventListener('pointerdown', (e) => {
                            _downX = e.clientX; _downY = e.clientY; _downT = Date.now(); _moved = false;
                        }, true);
                        document.addEventListener('pointermove', (e) => {
                            if (Math.abs(e.clientX - _downX) > 4 || Math.abs(e.clientY - _downY) > 4) _moved = true;
                        }, true);
                        document.addEventListener('pointerup', (e) => {
                            if (e.target.closest && e.target.closest('#spinToggle, #layer-panel')) return; // controls handle themselves
                            if (!_moved && (Date.now() - _downT) < 400) togglePause();
                        }, true);
                        spinToggle.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
                        updateSpinIcon();

                        let lastFrameTime = 0;

                        function animate(time) {
                            requestAnimationFrame(animate);

                            if (paused) return;
                            if (Date.now() - lastInteractionTime < idleDelayMs) return;
                            if (time - lastFrameTime < 30) return;

                            lastFrameTime = time;

                            const cx = currentEye.x;
                            const cy = currentEye.y;
                            const cz = currentEye.z;

                            const r = Math.sqrt(cx*cx + cy*cy);
                            let theta = Math.atan2(cy, cx);
                            theta += orbitSpeed;

                            currentEye = {
                                x: r * Math.cos(theta),
                                y: r * Math.sin(theta),
                                z: cz
                            };

                            Plotly.relayout('plot3d', { 'scene.camera.eye': currentEye });
                        }

                        requestAnimationFrame(animate);
                    });
                })
                .catch(err => {
                    document.getElementById('loadingIcon').style.display = 'none';
                    document.getElementById('statusText').style.color = '#ef4444';
                    document.getElementById('statusText').textContent = err.message || "Failed to load 3D data.";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
