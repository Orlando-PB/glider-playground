[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glider-playground"
version = "0.2.57"
description = "A fast, web-based NetCDF explorer for glider data."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Orlando Prugel-Bennett", email = "orlandopbennett@gmail.com"}
]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "xarray",
    "pandas",
    "numpy",
    "httpx",
    "requests",
    "h5netcdf",
    "netcdf4",
    "gsw",
    "scipy"
]

[project.optional-dependencies]
desktop = ["pywebview"]

[project.scripts]
glider-playground = "glider_playground.cli:main"
glider-playground-app = "glider_playground.desktop:main"

[tool.setuptools.packages.find]
include = ["glider_playground*"]
[tool.setuptools.package-data]
"glider_playground" = ["static/*"]